 je_cr_minette_ores:"洛林的小矿脉"
 je_cr_minette_ores_reason:"在[SCOPE.sState('minette_ore_state').GetNameNoFormatting]柔和的丘陵之下，蕴藏着巨大的#italic 米内特矿#!矿床——一种富含铁的沉积矿，其惊人储量预示着工业繁荣。然而，这一前景尚未实现。尽管储量丰富，该矿石却含有高磷，使其在当前技术下不适合炼钢。\n\n通过投资冶金研究并试验现代精炼方法——如#bold 平炉法#!——我们或许能找到中和磷的方法，释放矿石的真正潜力。\n\n以[GetDecreeType('decree_encourage_resource_industry').GetName]支持当地工业，并提升[concept_innovation]，或许能扭转局面，将[SCOPE.sState('minette_ore_state').GetName]变为钢铁强国。\n\n脚下埋藏着一个铁的帝国。只需聪明挖掘、烈火燃烧。"
