 cr_canadian_indian_treaties.0.t:0 "岁月之岩"
 cr_canadian_indian_treaties.0.desc:0 "从上密歇根荒野中费力运至底特律的安托纳贡巨砾——一块罕见且异常巨大的天然铜——正吸引人们关注苏必利尔湖的[GetGoods('copper').GetName]采矿潜力。"
 cr_canadian_indian_treaties.0.desc_2:0 "从上密歇根荒野中费力运至底特律进行私人展览的安托纳贡巨砾——一块罕见且异常巨大的天然铜——正引发全国对苏必利尔湖[GetGoods('copper').GetName]采矿潜力的关注。\n\n虽然该地区铜矿的存在早已被首批旅行者报道，但此次展览——展示沿苏必利尔湖岸发现的罕见巨型天然铜——首次让人们窥见那里真正的潜力。"
 cr_canadian_indian_treaties.0.desc_michigan:0 "从上密歇根荒野中费力运至底特律的安托纳贡巨砾——一块罕见且异常巨大的天然铜——已开始吸引人们关注苏必利尔湖的[GetGoods('copper').GetName]采矿潜力。"
 cr_canadian_indian_treaties.0.desc_michigan_2:0 "底特律的一场私人展览正引发全国对上密歇根[GetGoods('copper').GetName]采矿潜力的关注。\n\n虽然该地区铜矿的存在早已被首批旅行者报道，但此次展览——展示沿苏必利尔湖岸发现的罕见巨型天然铜——首次让人们窥见那里真正的潜力。"
 cr_canadian_indian_treaties.0.desc_3:0 "在上密歇根发现的一块非凡铜矿石正吸引全国探矿者的目光。\n\n这块重达3吨的纯天然铜已被从当地[SCOPE.sCountry('native_state').GetName]手中购得。"
 cr_canadian_indian_treaties.0.f:0 "他们胜利地行进在底特律街头，观众好奇地注视着他们身后的马车，猜测帆布下藏着什么。\n“一件稀有标本，”他逗趣道，“你们从未见过的东西。”\n“一件我们不愿轻易分享的珍宝，”下一人补充，“但或许，给一瞥小小预览，不会伤害我们吧？”\n“仍是个风险，”第一个人回答，“但或许，以小小代价，我们可以冒险一试？”"
 cr_canadian_indian_treaties.0.f_2:0 "历经四英里半、翻越600英尺高山、穿越峡谷与深壑；穿过必须开辟道路的茂密森林与蚊虫肆虐的灌木丛，这条铁路铺设完成，铜砾被运送；最终当巨石降至主河道时，大自然以一场洪水相助，将满载的船只冲过下游急流，直达湖泊。"
 cr_canadian_indian_treaties.0.a:0 "让我们开采大地！"
 cr_canadian_indian_treaties.0.a_tt:0 "资源#variable 铜矿#! 的知识将传播至#variable 安大略#! 与#variable 密歇根#! "
 cr_canadian_indian_treaties.0.b:0 "让我们确保这仍是本地发现"
 cr_canadian_indian_treaties.0.b_tt:0 "资源#variable 铜矿#! 的知识将#variable 不#! 传播至#variable 安大略#"

 cr_canadian_indian_treaties.1.t:0 "采矿许可"
 cr_canadian_indian_treaties.1.desc:0 "一群[SCOPE.gsInterestGroup('mining_ig').GetName]已接近[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]，请求在苏必利尔湖北岸发放采矿许可。\n\n此类许可当然可发放，但土地所有权仍由[SCOPE.sCountry('native_state').GetAdjectiveNoFlag]持有，他们很可能对这种公然无视其权利的行为不满。"
 cr_canadian_indian_treaties.1.f:0 "那里几乎没有印第安人，而且他们又不像在使用这片土地……"
 cr_canadian_indian_treaties.1.a:0 "我们不能让一些讨厌的印第安人阻碍进步"
 cr_canadian_indian_treaties.1.b:0 "无论立法、最高还是下级，都无权使自己独断专行。"
 cr_canadian_indian_treaties.1.a_tt:0 "[SCOPE.gsInterestGroup('mining_ig').GetName]获得$cr_approved_mining_permits$ 2.5年，替换任何先前意见修正"
 cr_canadian_indian_treaties.1.b_tt:0 "[SCOPE.gsInterestGroup('mining_ig').GetName]获得$cr_denied_mining_permits$ 2.5年，替换任何先前意见修正"
 cr_canadian_indian_treaties.1.b_tt2:0 "安大略获得$cr_mining_permit_denied$ 2.5年，替换任何先前修正"

 cr_canadian_indian_treaties.2.t:0 "勘测员受威胁"
 cr_canadian_indian_treaties.2.desc:0 "[SCOPE.sCharacter('native_state_threatener').GetFirstName]酋长与受雇于[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]的勘测员在[SCOPE.sState('copper_mining_state').GetName]发生紧张对峙。\n\n[SCOPE.sCountry('native_state').GetAdjectiveNoFlag]酋长威胁，若不停止对其土地的勘测，将动用暴力。"
 cr_canadian_indian_treaties.2.desc_industrialists:0 "[SCOPE.sCharacter('native_state_threatener').GetFirstName]酋长与受雇于[SCOPE.sCharacter('surveyor_employer').GetFullName]的勘测员在[SCOPE.sState('copper_mining_state').GetName]发生紧张对峙。\n\n[SCOPE.sCountry('native_state').GetAdjectiveNoFlag]酋长威胁，若不停止对其土地的勘测，将动用暴力。"
 cr_canadian_indian_treaties.2.desc_industrialists_old:0 "受雇于[SCOPE.gsInterestGroup('mining_ig').GetNameNoFormatting][SCOPE.sCharacter('surveyor_employer').GetFullName]的勘测员，在绘制休伦湖北岸地图时，遭到一名[SCOPE.sCountry('native_state').GetAdjective]酋长的威胁。"
 cr_canadian_indian_treaties.2.f:0 "滚开！按权利，这是我们的土地，你们和你们的殖民者在此不受欢迎！"
 cr_canadian_indian_treaties.2.a:0 "我们不会被恐吓"
 cr_canadian_indian_treaties.2.b:0 "或许我们不该逼得太紧"
 

 ####
 #加拿大印第安条约（续）
 ####
 cr_canadian_indian_treaties.3.t:0 "[SCOPE.sCountry('native_state').GetAdjectiveNoFormatting]向[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFullNameNoFormatting]的请愿"
 cr_canadian_indian_treaties.3.desc:0 "[SCOPE.sCountry('native_state').GetAdjectiveNoFormatting]酋长[SCOPE.sCharacter('native_state_petitioner').GetFirstName]向[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]呈递请愿书，抱怨勘探者侵犯其领土，并严厉批评他及其族人未获应有支持。"
 cr_canadian_indian_treaties.3.f:0 "我在1812年战争中为英国作战，为此牺牲，我们被承诺可永远不受干扰地居住在自己的土地上。然而每天我们都看到新的勘探者扰乱我们的土地。而其他族群从[ROOT.GetCountry.GetOverlord.GetRuler.GetHerHis|U]陛下的政府获得报酬，我们却未从自己土地上发现的任何东西中分得一杯羹。"
 cr_canadian_indian_treaties.3.a:0 "我们感谢[SCOPE.sCharacter('native_state_petitioner').GetFirstName]酋长的来信"
 cr_canadian_indian_treaties.3.b:0 "或许我们可以给他一些激励？"

 cr_canadian_indian_treaties.4.t:0 "论原住民土地所有权"  # 丹尼斯-本杰明·帕皮诺报告，由路易-约瑟夫·帕皮诺之弟撰写
 cr_canadian_indian_treaties.4.desc:0 "一位[SCOPE.sCulture('ruling_culture').GetName]作者发表了一篇关于[ROOT.GetCountry.GetNameNoFlag]土地所有权的论著，对我们或有助益。"
 cr_canadian_indian_treaties.4.flavour:0 "土地所有权源于自然的占有权。因此我们必须得出结论：是[SCOPE.sCulture('ruling_culture').GetNameNoFormatting]人拥有[SCOPE.sState('copper_mining_state').GetOwner.GetNameNoFormatting]的所有权，而非[SCOPE.sCulture('anglo_culture').GetNameNoFormatting]人，也非[SCOPE.sCountry('native_state').GetAdjectiveNoFormatting]人。因为1764年时两者均未在此出现，也未充分组织起来以具备占有土地的能力。"
 cr_canadian_indian_treaties.4.desc_old:0 "一位[SCOPE.sCulture('ruling_culture').GetName]作者发表论著探讨[ROOT.GetCountry.GetNameNoFlag]的土地所有权问题。他认为，通过“自然权利”，是[SCOPE.sCulture('ruling_culture').GetNameNoFormatting]人拥有合法所有权。\n\n关于苏必利尔湖周围的勘探土地，他认为[SCOPE.sCountry('native_state').GetAdjectiveNoFormatting]在《1763年皇家宣言》时并未居住于该地区，因此未获得土地所有权。但更重要的是，这些族群组织程度不足以拥有领土主张。"
 cr_canadian_indian_treaties.4.f:0 "我请上帝作证，一开始我就说，现在再次声明：说这片土地不是我们的，是虚假的，它是我们的。\n—#italic 酋长辛瓜孔塞#! "
 cr_canadian_indian_treaties.4.a:0 "这份报告并非完全令人满意"
 cr_canadian_indian_treaties.4.b:0 "一份有助于削弱[SCOPE.sCountry('native_state').GetAdjectiveNoFormatting]的有用报告"

 cr_canadian_indian_treaties.5.t:0 "铜矿事件"
 cr_canadian_indian_treaties.5.desc:0 "[SCOPE.sState('copper_mining_area').GetName]的一位矿场经理今天遭遇粗暴惊醒：他开门时，发现自己正面对[SCOPE.sCharacter('native_state_threatener').GetFirstName]酋长率领的一群愤怒印第安人。\n\n他们前来原因简单：矿场位于未割让土地上，[SCOPE.sCharacter('native_state_threatener').GetFirstName]的族群要求分得利润份额，否则矿场将关闭。"
 cr_canadian_indian_treaties.5.f:0 "伟大的精神，我们认为，将这些丰富的矿藏置于我们的土地上，为他的红肤子民造福，以便后代在林中动物稀少、难以维生时从中获益。因此，我们将实现伟大精神父亲的美好目标。我们将卖给你们土地，若你们给出合理价格；同时，我们要求为每磅已从我们土地上取走的矿物支付报酬，以及今后取走的所有矿物。\n—#italic 酋长辛瓜孔塞#! "
 cr_canadian_indian_treaties.5.a:0 "矿场关闭"
 cr_canadian_indian_treaties.5.a_tt:0 "这将显著降低未来投资者申请采矿许可的可能性"
 cr_canadian_indian_treaties.5.b:0 "分得一份才公平"
 cr_canadian_indian_treaties.5.b_tt:0 "这将略微降低未来投资者申请采矿许可的可能性"
 cr_canadian_indian_treaties.5.c:0 "这可能只是更大起义的开端"
 cr_canadian_indian_treaties.5.c_tt:0 "一位[GetIdeology('ideology_jingoist_leader').GetName] [concept_agitator]将出现"

 cr_canadian_indian_treaties.6.t:0 "铜乡叛乱"
 cr_canadian_indian_treaties.6.desc:0 "由于[ROOT.GetCountry.GetOverlord.GetRuler.GetHerHis|U]陛下政府未采取行动控制部落土地上的采矿，[SCOPE.sCountry('native_state').GetAdjectiveNoFormatting]民族的多个族群已拿起武器，开始袭击该地区的采矿定居点。"
 cr_canadian_indian_treaties.6.f:0 "印第安人利用对地形的熟悉，精心计划并执行伏击，确保了胜利。"
 cr_canadian_indian_treaties.6.a:0 "谁还不召集民兵？！"

 cr_canadian_indian_treaties.8.t:0 "文明的长尾"
 cr_canadian_indian_treaties.8.desc:0 "随着苏必利尔湖岸采矿繁荣，城镇与商业处处兴起，曾经仅有少数印第安人居住的荒野如今已见文明的最初萌芽。\n\n然而，当地[SCOPE.sCountry('native_state').GetAdjectiveNoFlag]印第安人抱怨矿场噪音驱散猎物，废水污染河流。"
 cr_canadian_indian_treaties.8.f:0 "曾经溪流满是鱼，森林满是鹿，但为了给矿场供应木材而砍伐树木、改道溪流以驱动采矿机械，如今这里再无猎物可寻。"
 cr_canadian_indian_treaties.8.a:0 "为进步付出的小小代价"

 cr_canadian_indian_treaties.9.t:0 "行业工具"
 cr_canadian_indian_treaties.9.desc:0 "[SCOPE.gsInterestGroup('mining_ig').GetName]已接近[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]，请求支持建立本土[GetGoods('tools').GetName]产业。\n\n缺乏本地工具制造产业导致他们花费巨资进口合适工具，削弱采矿业成功，据他们声称。"
 cr_canadian_indian_treaties.9.desc_home_production:0 "[SCOPE.gsInterestGroup('mining_ig').GetName]已接近[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]，请求支持扩建[SCOPE.sState('toolmaking_state').GetCityHubName][SCOPE.sBuilding('tooling_plant').GetName]。\n\n该产业规模过小，导致难以获得合适工具以提升采矿业成功，据他们声称。"
 cr_canadian_indian_treaties.9.f:0 "你看到这把铲子上的制造商标记了吗？[SCOPE.sState('toolmaking_state').GetNameNoFormatting]优质金属制品。它得从[SCOPE.sState('toolmaking_state').GetCityHubName]运来！你知道这有多贵吗？"
 cr_canadian_indian_treaties.9.f_home_production:0 "你看到这把铲子了吗？[SCOPE.sState('toolmaking_state').GetCityHubName]制造的。注意，不是像[SCOPE.sState('foreign_toolmaking_state').GetNameNoFormatting]那种高科技车间制造的，而是几乎手工订制的。不可否认这把精美铲子的工艺，但这不是经营现代产业的方式。"
 cr_canadian_indian_treaties.9.a:0 "有时国家与产业利益一致"
 cr_canadian_indian_treaties.9.b:0 "这些大佬可以自己掏钱"

 cr_canadian_indian_treaties.10.t:0 "罗宾逊条约"
 cr_canadian_indian_treaties.10.desc:0 "随着矿工与印第安族群因土地权利而紧张关系升级，[SCOPE.sCountry('native_state').GetAdjectiveNoFlag]各酋长在[SCOPE.sState('copper_mining_state').GetMineHubName]召开会议，由专员[SCOPE.gsInterestGroup('mining_ig').GetLeader.GetLastName]召集。\n\n[SCOPE.sCountry('native_state').GetAdjectiveNoFormatting]酋长表达了签订条约的意愿，但狩猎与捕鱼权——以及最重要的是年金数额——成为争议焦点，[SCOPE.sCountry('native_state').GetAdjectiveNoFormatting]的要求超出此前年金及预算的2至3倍。"
 cr_canadian_indian_treaties.10.desc_defeat:0 "叛乱已被彻底击败，[SCOPE.sCharacter('victorious_general').GetPrimaryRoleTitle][SCOPE.sCharacter('victorious_general').GetFullName]召集[SCOPE.sCountry('native_state').GetAdjectiveNoFlag]酋长至[SCOPE.sState('copper_mining_state').GetMineHubName]议和。不仅为平叛，也为解决采矿权问题。\n\n在这种情况下，自然由我们决定条款。问题仅在于条款将有多严厉。"
 cr_canadian_indian_treaties.10.f:0 "无论为放弃权利给予他们什么，他们都是受益者，因为他们放弃的仅是名义上的所有权；他们将继续享有目前所有优势，不会因白人兄弟的优越智慧与勤劳从他们领土少数有限部分中获取财富而变穷，这些部分对他们自己既无用也无法有用。\n—#italic 威廉·本杰明·罗宾逊#! "
 cr_canadian_indian_treaties.10.a:0 "和平高于一切"
 cr_canadian_indian_treaties.10.b:0 "威逼他们接受更合理的条款"
 cr_canadian_indian_treaties.10.c:0 "我们不会同意如此过分的要求"
 cr_canadian_indian_treaties.10.d:0 "绝不留情"
 cr_canadian_indian_treaties.10.e:0 "我们将在条款上慷慨"

 cr_canadian_indian_treaties.20.t:0 "土地割让条约第[SCOPE.GetRootScope.GetCountry.GetCustom('cr_numbers_localisation')]号"
 cr_canadian_indian_treaties.20.desc:0 "在专员[SCOPE.sCharacter('treaty_negotiator').GetLastName]召集的[SCOPE.sCountry('native_state').GetRuler.GetPrimaryRoleTitle|l]会议上，[SCOPE.sCountry('native_state').GetNameNoFlag][SCOPE.sCountry('native_state').GetRuler.GetPrimaryRoleTitle][SCOPE.sCharacter('native_ruler').GetLastName]同意签署将其人民在[SCOPE.sState('cr_numbered_treaties_owned_state').GetStateRegion.GetName]的土地所有权转让，换取少量年金与一些保留地。"
 cr_canadian_indian_treaties.20.desc_3:0 "专员[SCOPE.sCharacter('treaty_negotiator').GetLastName]在[SCOPE.sState('cr_numbered_treaties_owned_state').GetCityHubName]召集[SCOPE.sCountry('native_state').GetNameNoFlag][SCOPE.sCountry('native_state').GetRuler.GetPrimaryRoleTitle|l]讨论土地割让条约。\n\n由[SCOPE.sCountry('native_state').GetRuler.GetPrimaryRoleTitle][SCOPE.sCharacter('native_ruler').GetFirstName]领导的[SCOPE.sCountry('native_state').GetNameNoFormatting][SCOPE.sCountry('native_state').GetRuler.GetPrimaryRoleTitle|l]同意签署转让土地所有权，换取年金与保留地。"
 cr_canadian_indian_treaties.20.desc_2:0 "[SCOPE.sCountry('native_state').GetRuler.GetPrimaryRoleTitle][SCOPE.sCharacter('native_ruler').GetFirstName]率领若干[SCOPE.sCountry('native_state').GetRuler.GetPrimaryRoleTitle|l]前往[SCOPE.sState('cr_numbered_treaties_owned_state').GetCityHubName]讨论土地割让可能性。\n\n与专员[SCOPE.sCharacter('treaty_negotiator').GetLastName]会面后，他们表示愿意签署转让土地所有权，换取年金与保留地。"
 cr_canadian_indian_treaties.20.f:0 ""
 cr_canadian_indian_treaties.20.a:0 "公平合理的交易"
 cr_canadian_indian_treaties.20.a_tt:0 "我们将在#variable 8#! 个月后开始谈判新条约"
 cr_canadian_indian_treaties.20.b:0 "有利的交易"
 cr_canadian_indian_treaties.20.b_tt:0 "我们将在#variable 4#! 个月后开始谈判新条约"

 cr_canadian_indian_treaties.21.t:0 "拉布拉多海岸沿线"
 cr_canadian_indian_treaties.21.desc:0 "随着[SCOPE.sStrategicRegion('canada_region').GetName]殖民加速，[SCOPE.sStrategicRegion('ruperts_land').GetName]成为新边疆，人们注意力也转向[SCOPE.sState('cr_newfoundland').GetName]，关注拉布拉多内陆的潜力。"
 cr_canadian_indian_treaties.21.f:0 "你说地图？地图？！当然，它们很好地显示了海岸与洋流，但人类定居点？不……这里变化太快，无法保持此类地图的更新。\n\n当船进入海湾时，显然关于定居的报告被严重夸大了。当然，有人住在这里，但不足以让这成为盈利事业……但无所谓，若这里不行，沿海岸再北上几英里总会有人。于是船继续向北，向北推进……"
 cr_canadian_indian_treaties.21.a:0 "这是一片无可比拟的机会之地"

 cr_canadian_indian_treaties.22.t:0 "《皇家宣言》"
 cr_canadian_indian_treaties.22.desc:0 "自颁布以来，1763年《皇家宣言》一直是对开发[SCOPE.sStrategicRegion('canada_region').GetName]与[SCOPE.sStrategicRegion('ruperts_land').GetName]肥沃土地的强大障碍，其存在鲜明提醒着帝国控制。\n\n然而，随着殖民统治日落西山，宣言曾经不可动摇的权威开始衰退，反对之声日益高涨，挑战宣言合法性，鼓舞定居者与企业家突破其限制，追求机会与繁荣。"
 cr_canadian_indian_treaties.22.desc_2:0 "1763年《皇家宣言》长期规范我们与居住在[SCOPE.sStrategicRegion('canada_region').GetName]与[SCOPE.sStrategicRegion('ruperts_land').GetName]的印第安人的关系。然而随着我们摆脱英国统治，对未开发边疆的诱惑日益不可抗拒，有人质疑为何我们仍受这片强加于我们的暴政束缚。"
 cr_canadian_indian_treaties.22.f:0 "1763年《皇家宣言》的墨迹玷污羊皮纸，也玷污我们对繁荣与成长的渴望。这道以帝国控制为幌子的法令，将我们锁链于遥远统治者的心血来潮，剥夺我们对宣言界限之外肥沃土地的正当权利。我们不是被地图线条圈禁的臣民，而是渴望开垦荒野、释放其丰饶宝藏的开拓者。让历史记住我们不是任意法令的被动接受者，而是对不公约束的大胆挑战者，注定在变革之风中开辟自己的道路。"
 cr_canadian_indian_treaties.22.a:0 "宣言依然有效！"
 cr_jingoist_agitator_appears_tt:0 "一位#variable 沙文主义#! 角色出现在[SCOPE.GetRootScope.GetCountry.GetNameNoFlag]"
 cr_canadian_indian_treaties.22.a_tt:0 "所有#variable 原住民#! 与#variable 第一民族#!  [concept_culture]获得#g 2%#! 忠诚度"
 cr_canadian_indian_treaties.22.b:0 "废除宣言！"
 cr_canadian_indian_treaties.22.b_tt:0 "#variable 未割让领土#! 修正从所有州移除"
 cr_canadian_indian_treaties.22.b_tt_2:0 "所有#variable 原住民#! 与#variable 第一民族#!  [concept_culture]获得#r 20%#! 激进主义"
 cr_canadian_indian_treaties_remove_je:0 "这结束了#variable 编号条约#!  [concept_journal_entry]"

 cr_canadian_indian_treaties.24.t:0 "专员[SCOPE.sCharacter('treaty_commissioner').GetLastName]的出使"
 cr_canadian_indian_treaties.24.desc:0 "专员[SCOPE.sCharacter('treaty_commissioner').GetLastName]已准备从[SCOPE.GetRootScope.GetCountry.GetCapital.GetCityHubName]出发，开始土地割让条约谈判，他应将努力聚焦于哪个省？"
