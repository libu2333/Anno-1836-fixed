dsk_zexu.17.t: "穿越事件"
dsk_zexu.17.d: "莫名其妙穿越到1836年维多利亚时代，还在这个世界遇到了奥斯曼帝国的皇帝，主角林泽许，重生在伊斯坦布尔因为营救奥斯曼皇帝苏丹被赐予封地，且看他如何在这工业时代崛起？？"
