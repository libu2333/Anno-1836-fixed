dsk_zexu.5.f: "1836年6月，[ROOT.GetCountry.GetRuler.GetFullName]出访英国，考察其文化与技艺，并结识了[SCOPE.sCharacter('gbr_queen_scope').GetFirstName]。一番交谈后，对方对他颇为赏识。"
