 gov_vorstenlandsur:0 "沃斯滕兰"
 gov_vorstenlandsur_desc:0 "作为古老马塔兰苏丹的直系后裔，苏拉卡尔塔的[Concept('concept_ruler','$RULER_TITLE_SUSUHUNAN$')]被授予自治的[Concept('concept_subject','$VORSTENLAND$')]地位。\n\n$TRANSFER_OF_POWER_NAME_DESC$"

 gov_vorstenlandyog:0 "沃斯滕兰"
 gov_vorstenlandyog_desc:0 "此本土国家为荷属东印度群岛内的自治藩属邦。其苏丹凭借与古老马塔兰苏丹旁支相连的血统取得合法性。\n\n$TRANSFER_OF_POWER_NAME_DESC$"

 gov_zz_DEI_princely_state_muslim:0 "藩属邦"
 gov_zz_DEI_princely_state_muslim_desc:0 "这一[Concept('concept_government_type','$NATIVE_STATE$')]是荷属东印度群岛内的一个自治[Concept('concept_subject','$PRINCELY_STATE$')]。其统治者被称为[Concept('concept_ruler','$RULER_TITLE_SULTAN$')]或[Concept('concept_ruler','$RULER_TITLE_SULTANA$')]\n\n$TRANSFER_OF_POWER_NAME_DESC$"

 gov_zz_DEI_princely_state_hindu:0 "藩属邦"
 gov_zz_DEI_princely_state_hindu_desc:0 "这一[Concept('concept_government_type','$NATIVE_STATE$')]是荷属东印度群岛内的一个自治[Concept('concept_subject','$PRINCELY_STATE$')]。其统治者被称为[Concept('concept_ruler','$RULER_TITLE_DEWA_AGUNG$')]\n\n$TRANSFER_OF_POWER_NAME_DESC$"

