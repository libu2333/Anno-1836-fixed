dsk_zexu.25.t: "征服南欧"
dsk_zexu.25.d: "征服南欧"
dsk_zexu.25.f: "对南欧的征服采取了较为温和的策略。泽许帝国先派遣文化使者和商人进入意大利、希腊等南欧国家，传播泽许帝国的文化、艺术和科技成果，同时了解当地的政治、经济和社会情况。在文化渗透取得一定成果后，逐步建立起政治和经济上的影响力。最后，通过军事威慑和外交压力，使南欧各国主动归附泽许欧亚合众国，从而实现了对南欧地区的和平征服。"
dsk_zexu.25.a: "[SCOPE.GetRootScope.GetCountry.GetName]万岁"


je_dsk_annex_Balkan: "巴尔干征服，民族融合"
je_dsk_annex_Balkan_reason: "巴尔干地区民族众多，局势复杂"

dsk_zexu.26.t: "征服巴尔干"
dsk_zexu.26.d: "征服巴尔干"
dsk_zexu.26.f: "巴尔干地区民族众多，局势复杂。泽许帝国在进入巴尔干半岛后，积极调解当地各民族之间的矛盾，倡导民族平等和共同发展。通过建立多民族共同参与的地方政府，给予各民族一定的自治权，同时加强军事管控，防止外部势力的干涉。在泽许帝国的努力下，巴尔干地区的各民族逐渐团结在泽许欧亚合众国的旗帜下，实现了民族融合与地区的稳定。"
dsk_zexu.26.a: "[SCOPE.GetRootScope.GetCountry.GetName]万岁"

