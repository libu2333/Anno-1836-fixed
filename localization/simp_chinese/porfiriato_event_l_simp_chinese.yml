l_simp_chinese:
  # ================================
  # 波菲里奥时代
  # ================================
  inicio_porfiriato.1.t: "诺里亚计划"
  inicio_porfiriato.1.d: "波菲里奥·迪亚斯将军发布了对现政府的宣言，指责其背叛了改革战争和外敌入侵期间争取的民主原则。在军队内部支持者和反对派的支持下，迪亚斯以‘诺里亚计划’为旗帜号召人民武装起义。\n\n墨西哥正处于起义边缘。"
  inicio_porfiriato.1.f: "“国家处于悲惨境地：连任威胁着权力的永久化，人民呼唤自由与合法性。如果我们的武器必须说话，那就让它们为正义而言。”\n\n— 波菲里奥·迪亚斯，1871年宣言"
  inicio_porfiriato.1.a: "迪亚斯进军首都并夺取权力"
  inicio_porfiriato_takeover_tt: "波菲里奥·迪亚斯成为墨西哥的‘总统’。"
  inicio_porfiriato.1.b: "政府镇压叛乱"
  inicio_porfiriato_failure_tt: "起义被粉碎，政府巩固了权力。"

  inicio_porfiriato.2.t: "一位前途无量的年轻军官"
  inicio_porfiriato.2.d: "墨西哥正处于其历史的关键时刻。虽然战争的伤痕仍未愈合，一位年轻的军官波菲里奥·迪亚斯开始崭露头角。他作为纪律严明的领袖、致力于自由主义理想的形象，使他在战场和政界迅速崛起。随着迪亚斯声名鹊起，他的政治忠诚将对国家未来至关重要。他将服务于武装力量的利益，还是拥抱工业进步？"
  inicio_porfiriato.2.d2: "国家在多年动荡后处于重建与重新定义的时期。在这一转型中，一位名叫波菲里奥·迪亚斯的年轻军官开始在军政圈中引起关注。他以纪律严明和对自由主义理想的承诺而闻名，正成为国家未来的希望之星。"
  inicio_porfiriato.2.f: "“除非政府进行改革，否则国家无救赎。”\n\n— 波菲里奥·迪亚斯"
  inicio_porfiriato.2.a: "任命波菲里奥·迪亚斯为纪律严明的将军"
  porfirio_general_fa_tt: "波菲里奥·迪亚斯加入军队担任将军。这可能带来军事利益，并为未来的激进化铺平道路。"
  inicio_porfiriato.2.b: "任命波菲里奥·迪亚斯为进步将军"
  porfirio_general_industrial_tt: "波菲里奥·迪亚斯成为一名将军，心中只有一个念头：工业化。这可能提升国家生产力，但未来会增加激进分子。"

  inicio_porfiriato.3.t: "图克斯特佩克计划"
  inicio_porfiriato.3.d: "由于反对政府而被军政圈边缘化的波菲里奥·迪亚斯并未闲着。在内部流放中，他起草了一份新宣言：图克斯特佩克计划。这份文件不仅谴责连任，还号召武装起义以恢复共和原则。有些人视他为权力饥渴的叛军；另一些人则视他为新时代的先驱。"
  inicio_porfiriato.3.f: "“有效选举权，不连任” 是迪亚斯追随者的战斗口号。原本的个人异议如今威胁演变为全国性运动。"
  inicio_porfiriato.3.b: "够了！这将是迪亚斯的最后一次叛乱"
  inicio_porfiriato_final_failure_tt: "波菲里奥·迪亚斯被处决。"

  inicio_porfiriato.4.t: "秩序的力量"
  inicio_porfiriato.4.d: "波菲里奥·迪亚斯在武装力量的决定性支持下崛起。他的上台源于战场，如今国家在他掌控之下，他必须定义其统治的本质。在动荡时期，加强秩序、服从和军事纪律可确保持久稳定。"
  inicio_porfiriato.4.f: "“治理就是确保铁路通达四方……但也要确保无需大炮。”\n\n— 波菲里奥·迪亚斯"
  inicio_porfiriato.4.a: "我们必须加强秩序与军事纪律"
  porfiriato_militar_tt: "迪亚斯将武装力量作为政府支柱，尽管这一战略的成果需要数年才能显现。"

  inicio_porfiriato.5.t: "国家前进"
  inicio_porfiriato.5.d: "权力在握的波菲里奥·迪亚斯设想一个现代国家，不仅通过纪律，还通过进步的铁轨团结起来。为确保稳定，他提议工业发展、外国投资以及基础设施扩张，以连接并激活国家。在他的领导下，墨西哥可能成为由劳动、技术和效率驱动的地区强国。"
  inicio_porfiriato.5.f: "“治理就是确保铁路通达四方……但也要确保无需大炮。”\n\n— 波菲里奥·迪亚斯"
  inicio_porfiriato.5.a: "进步与工业的时代来临"
  porfiriato_industrial_tt: "迪亚斯押注经济发展作为权力基础，尽管这一战略的成果需要数年才能显现。"

  inicio_porfiriato.6.t: "波菲里奥时代巩固"
  inicio_porfiriato.6.d: "波菲里奥·迪亚斯就任总统已十年。他的愿景已深植于国家机器，建立了一个新稳定时代——尽管带有威权主义——这将定义国家的进程。"
  inicio_porfiriato.6.f: "“秩序与进步一直是我的座右铭。”\n\n— 波菲里奥·迪亚斯"
  inicio_porfiriato.6.a: "波菲里奥时代真正开始"
  porfiriato_consolidado_tt: "迪亚斯政权下永久性国家加成生效。"

  inicio_porfiriato.7.t: "波菲里奥梦想消逝"
  inicio_porfiriato.7.d: "波菲里奥·迪亚斯未能确立为国家无可争议的领袖。内部派系、社会压力和缺乏支持已不可逆转地侵蚀了他的地位。"
  inicio_porfiriato.7.f: "“少些政治，多些行政。”\n\n— 波菲里奥·迪亚斯"
  inicio_porfiriato.7.a: "我们重返不确定"
  porfiriato_no_consolidado_tt: "波菲里奥政权未能巩固。"

  inicio_porfiriato.8.t: "波菲里奥·迪亚斯的逝世"
  inicio_porfiriato.8.d: "随着波菲里奥·迪亚斯的逝世，一个以秩序、进步和争议为标志的时代结束。他的遗产将世代争论。"
  inicio_porfiriato.8.f: "“在波菲里奥的和平中，国家如梦中处女般沉睡。”\n\n— 拉蒙·洛佩斯·贝拉尔德"
  inicio_porfiriato.8.a: "波菲里奥时代结束"
  porfiriato_muerto_tt: "波菲里奥·迪亚斯的逝世移除其即时加成，但他在政治和经济上的长期影响将持续。"

  inicio_porfiriato.9.t: "波菲里奥·迪亚斯的流放"
  inicio_porfiriato.9.d: "政治影响力消退后，波菲里奥·迪亚斯被迫流放。国家如今必须应对新政治格局的不确定性，而他的遗产继续塑造国家。"
  inicio_porfiriato.9.f: "“我感到受伤。一部分国家拿起武器推翻我，另一部分袖手旁观看着我倒下。两者都以各自方式欠我一份情。”\n\n— 波菲里奥·迪亚斯"
  inicio_porfiriato.9.a: "将波菲里奥·迪亚斯流放"
  porfirio_exilio_tt: "流放波菲里奥·迪亚斯移除其即时影响，但他在政治和经济上的长期影响将持续。"
  # ================================
  # 自由化
  # ================================
  liberalizcion_inicial.1.t: "贝尼托·华雷斯的号召"
  liberalizcion_inicial.1.d: "自由派开始反抗圣安娜的独裁统治，旨在建立一个更自由、更公正的共和国。最初的改革重点是授予选举权。"
  liberalizcion_inicial.1.f: "“权利与正义的事业迟早会胜利。”\n\n— 贝尼托·华雷斯"
  liberalizcion_inicial.1.a: "华雷斯将成为墨西哥的灯塔"
  benito_ig_tt: "华雷斯在政治体系中获得影响力，自由派知识分子得到提振。"

  liberalizcion_inicial.2.t: "墨西哥的自由化"
  liberalizcion_inicial.2.d: "华雷斯已成为墨西哥政府的首脑，掌控总统职位。他的崛起标志着国家历史转折点，自由派运动获得影响国家政策的机会。"
  liberalizcion_inicial.2.f: "“在个人之间，如同在国家之间，尊重他人的权利就是和平。”\n\n— 贝尼托·华雷斯"
  liberalizcion_inicial.2.a: "华雷斯接掌领导权"
  lib_ini_alc_tt: "华雷斯巩固自由派改革和政治影响力。"

  liberalizcion_inicial.3.t: "独裁持续"
  liberalizcion_inicial.3.d: "尽管自由派努力，圣安娜仍掌权。抵抗减缓改革，自由派影响力暂时受限。"
  liberalizcion_inicial.3.f: "“权威在抵抗，但改革精神依旧。”\n\n— 匿名"
  liberalizcion_inicial.3.a: "威权统治继续"
  dic_ini_per_tt: "自由派知识分子失去影响力，国家加强威权立场。"

  liberalizcion_inicial.4.t: "自由化失败"
  liberalizcion_inicial.4.d: "自由派改革未能扎根，国家仍受传统、社会和政治结构束缚。华雷斯政策的潜在益处对许多墨西哥人而言仍是梦想。"
  liberalizcion_inicial.4.f: "“思考者何时才能比杀戮者更受尊崇？“\n\n— 梅尔乔尔·奥坎波"
  liberalizcion_inicial.4.a: "自由化努力失败"
  lib_i_fall_tot_tt: "自由派影响力崩溃，国家继续受保守和威权控制。"

  liberalizcion_inicial.5.t: "部分自由化"
  liberalizcion_inicial.5.d: "一些自由派措施得以实施，但改革不完整。虽然华雷斯愿景的某些方面生效，国家全面转型从未发生。"
  liberalizcion_inicial.5.f: "“我们应通过对话而非互相杀戮来理解彼此。”\n\n— 梅尔乔尔·奥坎波"
  liberalizcion_inicial.5.a: "部分改革成功"
  lib_i_fall_par_tt: "部分自由派影响力持续，部分改革带来适度改善，但国家仍受传统势力束缚。"

  # ================================
  # 君主制
  # ================================
  monarquia_mexicana.1.t: "王位命运"
  monarquia_mexicana.1.d: "墨西哥面临决定性时刻。君主选择将定义王冠的稳定与合法性。我们应欢迎新王朝，还是恢复伊图尔维德血统？"
  monarquia_mexicana.1.f: "“只有在强大的君主政府下，墨西哥才能实现它迫切需要的统一与和平。”\n\n— 胡安·内波穆塞诺·阿尔蒙特"
  monarquia_mexicana.1.a: "宣布新王朝"
  monarquia_mexicana.1.b: "恢复伊图尔维德血统"
  emperador_lider_tt: "现任领袖在墨西哥建立新王朝。"
  emperador_Iturbide_tt: "阿古斯丁·赫罗尼莫·德·伊图尔维德被宣布为墨西哥皇帝。"

  monarquia_mexicana.2.t: "欧洲贷款"
  monarquia_mexicana.2.d: "墨西哥财政拮据，欧洲债权人遂提出“慷慨”的贷款。这些资金将暂时缓解财政困境，但偿还最终将付出沉重代价。"
  monarquia_mexicana.2.f: "“向外国势力举债就是抵押祖国的自由。”\n\n— 卢卡斯·阿拉曼"
  monarquia_mexicana.2.a: "接受贷款"
  monarquia_mexicana.2.b: "拒绝他们的提议"
  pedir_prestamos_tt: "我方将每周获得5000英镑收入；但墨西哥日后须偿付700万英镑，甚至可能不得不考虑将王位授予外国王子以摆脱债务。"
  no_pedir_prestamos_tt: "我们避免外国债务，但面临经济停滞风险。"

  monarquia_mexicana.3.t: "债务到期"
  monarquia_mexicana.3.d: "曾经支撑墨西哥的慷慨贷款已到尽头。债权人如今要求偿还巨额欠款，并建议妥协：拥立欧洲王子。"
  monarquia_mexicana.3.f: "“我们来自多洛雷斯人民，继承希达尔戈的血统，生来如父亲般为所有解放象征而战，如他一般为如此神圣的事业，我们将从地球上消失。”\n\n— 伊格纳西奥·拉米雷斯"
  monarquia_mexicana.3.a: "全额偿还债务"
  monarquia_mexicana.3.b: "接受外国君主"
  pagar_deuda_tt: "我们偿还贷款，损失国库大部分资金。"
  acuerdo_monarquia_tt: "哈布斯堡的马克西米利安抵达墨西哥争夺王位。"

  monarquia_mexicana.4.t: "继承问题"
  monarquia_mexicana.4.d: "马克西米利安登上墨西哥王位，但其年事渐高且婚姻无嗣，君主制的前途因而未明。宫廷中流传耳语：帝国将通过其兄弟与奥地利绑定，还是马克西米利安通过委托本土继承人赢得墨西哥人心？"
  monarquia_mexicana.4.f: "“我希望今后印第安人与非印第安人之间不再有区别。所有人都是墨西哥人。”\n\n— 哈布斯堡的马克西米利安"
  monarquia_mexicana.4.a: "卡尔·路德维希将成为继承人"
  monarquia_mexicana.4.b: "伊图尔维德血统将继承王位"
  heredero_austriaco_tt: "奥地利的卡尔·路德维希被宣布为墨西哥王位继承人。"
  heredero_mexicano_tt: "阿古斯丁·赫罗尼莫的血统作为墨西哥未来延续。"

  monarquia_mexicana.5.t: "墨西哥君主制的终结"
  monarquia_mexicana.5.d: "墨西哥君主制的梦想再次结束。王冠被遗弃，国家转向新政府形式。"
  monarquia_mexicana.5.f: "“墨西哥不能接受除源自人民主权的任何其他政府形式。”\n\n— 塞巴斯蒂安·莱尔多·德·特哈达"
  monarquia_mexicana.5.a: "新共和国诞生"
  fin_mon_tt: "君主制崩溃，为新政治秩序让路。"

  # ================================
  # 墨美战争
  # ================================
  guer_mex_amer.1.t: "墨西哥-美国战争"
  guer_mex_amer.1.d: "美国对我们宣战，威胁我们的主权与领土完整。墨西哥必须决定：独自面对这一挑战，还是向欧洲强大盟友求援？"
  guer_mex_amer.1.f: "“可怜的墨西哥！离上帝如此遥远，离美国如此接近。”\n\n— 内梅西奥·加西亚·纳兰霍"
  guer_mex_amer.1.a: "我们将独自抵抗！"
  guer_mex_amer.1.b: "向法国和英国求助"
  sin_ayuda_tt: "墨西哥将在无外国援助下抵抗美国，加强民族自豪感。"
  pedir_ayuda_tt: "墨西哥将向法国和英国请求支持，以经济让步为代价，与欧洲列强结盟。"
  treaty_mexico_france_defense_investment: "韦拉克鲁斯让步"
  treaty_mexico_britain_defense_investment: "韦拉克鲁斯让步"