 je_cr_fort_ross:1 "加利福尼亚毛皮热的终结"
 je_cr_fort_ross_goal: "#variable 5#!年已过去"
 je_cr_fort_ross_reason: "当加利福尼亚水獭皮在中国可获超1000%利润的消息传开后，英国人、波士顿人、墨西哥商人以及——当然——俄国猎人很快涌向美洲太平洋海岸。在几十年辉煌时期，冒险者可赚取巨额财富。但好景不长。曾经每季可收获数千张皮，如今几百张已算丰收，且大多不再是高利润的海獭皮，而是海豹皮。\n\n种群严重枯竭，加利福尼亚毛皮贸易很快将彻底终结。\n\n因此，我们在该地区的据点罗斯堡正处于十字路口：若投入巨资，或许可将其转为农业殖民地，为阿拉斯加据点提供补给；否则，随着最后的水獭与海豹被捕尽，它将慢慢凋零而亡。"

 je_cr_fort_ross_complete_tt_a: "我们通过控制#variable 旧金山湾#!确保了在[SCOPE.sState('california_scope').GetName]的殖民地"
 je_cr_fort_ross_complete_tt_b: "俄国通过向#variabl e萨克拉门托河#!内陆扩张或控制#variable 旧金山湾#!确保了在[SCOPE.sState('california_scope').GetName]的殖民地"
 je_cr_fort_ross_goal_complete_tt: "我们已将[SCOPE.sState('california_scope').GetName]殖民地向#variable 萨克拉门托河#!内陆扩张或控制#variable 旧金山湾#!"
 je_cr_fort_ross_goal_fail_tt: "我们未能将[SCOPE.sState('california_scope').GetName]殖民地向#variable 萨克拉门托河#!内陆扩张或控制#variable 旧金山湾#!"

