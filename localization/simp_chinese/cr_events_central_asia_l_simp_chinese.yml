l_simp_chinese:
 #吉尔吉斯
  cr_central_asia_events.1.t: "吉尔吉斯人的可汗"
  cr_central_asia_events.1.d_kyrgyz_exit: "在争讼不休的[SCOPE.sCountry('kyrgyzia').GetAdjectiveNoFlag]诸部之中，[SCOPE.sCharacter('tailak_baatyr_scope').GetFullName]已自立为汗。他先后与清军及我军周旋，因而声名鹊起；各氏族正投向他的旗帜，奉其为[SCOPE.sCulture('kyrgyz_culture').GetNameNoFormatting]的护卫者。\n\n此事不可坐视。"
  cr_central_asia_events.1.d_kyrgyz_not_exist: "在争讼不休的吉尔吉斯诸部之中，泰拉克·巴特尔已自立为汗。他先后与清军及我军周旋，因而声名鹊起；各氏族正投向他的旗帜，奉其为[SCOPE.sCulture('kyrgyz_culture').GetName]的护卫者。\n\n此事不可坐视。"
  cr_central_asia_events.1.f: "泰拉克·巴特尔生于草原，纵马如风，长矛所至无不披靡；他以不屈之志守卫牧地，击退来犯之敌。"
  cr_central_asia_events.1.a: "若有人能替我们除去这位不安分的可汗……"
  cr_central_asia_events.1.a_tt: "由于拥有正值的@aut![Nbsp][concept_authority]，此选项可用"
  cr_central_asia_events.1.a_tt_2: "一名刺客被派往泰拉克·巴特尔的营地对他下毒"
  cr_central_asia_events.1.b: "一个朝贡酋长，又能掀起多大波澜？"
  cr_central_asia_events.1.b_tt: "#variable 东布鲁特#!将作为浩罕的朝贡国复国，并收复阿赖、吉尔吉斯与卡拉科尔三地。"
  cr_central_asia_events.1.c: "此人倒颇值得一见。"
  cr_central_asia_events.1.c_tt: "#variable 东布鲁特#!将脱离浩罕而独立；若其已亡国，则将复国并收复阿赖、吉尔吉斯与卡拉科尔三地。"
  cr_central_asia_events.5.t: "伊塞克湖之畔"
  cr_central_asia_events.5.d: "伊塞克湖岸的毡房绵延至天际，有的简陋，有的华丽；然而没有一位玛纳普敢于缺席。无论部族大小、路途远近，天山各地的首领皆已赶来，因为今日正是库鲁尔台推举新汗之日。\n\n#lore 萨雷巴格什#!部的玛纳普[SCOPE.sCountry('kyrgyzia').GetRuler.GetFullName]野心深沉、善于权谋，又有足以约束诸部的冷酷，已隐然成为众望所归。但他的统一大计并不为所有氏族所接受；他们所畏惧的，正是萨雷巴格什一部独擅其名的统一……"
  cr_central_asia_events.5.f: "依照旧礼，一顶红顶的吉尔吉斯特贝泰伊帽被戴在奥尔蒙头上，权作王冠；随后他被置于白毡之上，由众人三度高举。为敬奉出席库鲁尔台的首领，又宰白马九匹。"
  cr_central_asia_events.5.a: "但愿不生变故。"
  cr_central_asia_events.5.a_tt: "[SCOPE.sCountry('kyrgyzia').GetRuler.GetFullName]将被推举为吉尔吉斯人的可汗，并威胁我方统治。"
  cr_central_asia_events.5.b: "或可与[SCOPE.sCountry('kyrgyzia').GetRuler.GetFirstName]议和？"
  cr_central_asia_events.5.b_tt: "我们将同[SCOPE.sCountry('kyrgyzia').GetRuler.GetFullName]建立和睦关系。"
  cr_central_asia_events.5.b_tt_2: "由于拥有正值的@inf![Nbsp][concept_influence]，此选项可用"
  cr_central_asia_events.5.c: "吉尔吉斯诸部的离心，正可为我所用。"
  cr_central_asia_events.5.c_tt: "我们将利用吉尔吉斯各氏族之间的嫌隙，阻止其完成统一。"
  cr_central_asia_events.5.c_tt_2: "此选项可用，因为我们尚未刻意挑动[SCOPE.sCulture('kyrgyz_culture').GetName]诸部的分裂。"
  cr_central_asia_events.5.e: "向[SCOPE.sCountry('kyrgyzia').GetRuler.GetFullName]致意。"

  #哈萨克内容
  je_pacify_the_steppes_sent_expedition_button: "发起惩戒远征"
  je_pacify_the_steppes_sent_expedition_button_desc: "派遣一支惩戒部队进入草原，镇压动乱并重新建立秩序。"
  je_pacify_the_steppes_no_active_expedition: "我们目前没有远征队在追捕肯尼萨里。"
  je_pacify_the_steppes_know_where_kenesary_is: "我们已经大致掌握肯尼萨里的行踪。"
  je_pacify_the_steppes_no_recent_expedition: "距离我们上次组织惩戒远征已经过去了#variable 1年#!。"
  cr_steppe_launch_first_expedition_effect: "我们将对肯尼萨里发起一次惩戒远征，有机会将其击退并#g 降低#!与#variable 诸玉兹#!之间的[concept_tension|l]，但也有可能被击败，从而#r 提高#!与#variable 诸玉兹#!之间的[concept_tension|l]。"

  cr_kazakh_events.1.t: "通往中亚之路"
  cr_kazakh_events.1.d: "在我方南境之外，矗立着中亚最负盛名的城市——[SCOPE.sCountry('khiva').GetName]、[SCOPE.sCountry('kokand').GetName]与[SCOPE.sCountry('bukhara').GetName]；它们是财富、信仰与权势的古老中心。集市间仍回荡着丝绸之路的余韵，统治者则据有强盛的汗国。若能征服这些城市，俄罗斯在亚洲腹地的雄心便告得胜。\n\n但它们仍在远方，隔着一望无际的草原——那里没有成文的秩序，只有游牧民、掠袭者与离散的氏族。欲抵诸城，须先使草原臣服；欲在布哈拉城头升旗，须先在拱卫它的草原上立旗。"
  cr_kazakh_events.1.f: "这里没有道路，没有中央权威，也没有可以在地图上清晰划定的边界。只有风、马，以及步枪。"
  cr_kazakh_events.1.a: "开始向草原推进的战役。"
  cr_kazakh_events.1.a_tt: "通过在哈萨克地区建立持久控制，将俄罗斯的影响力扩展到中亚。"
  cr_kazakh_events.1.b: "我们的注意力暂时在别处。"
  cr_kazakh_events.1.b_tt: "对中亚的殖民扩张将更加缓慢。"

  cr_kazakh_events.2.t: "叛乱的号角"
  cr_kazakh_events.2.d: "哈萨克草原上，一个危险的挑战正在成形。诸氏族素来四分五裂、争斗不休，向来易于驾驭；然而[SCOPE.sCharacter('kenesary_scope').GetFirstName]却做成了前人未能做成之事：他召集各部，举行盛大的库鲁尔台，并被拥立为[SCOPE.sCharacter('kenesary_scope').GetPrimaryRoleTitle]，重取其祖父阿布莱汗昔日所持的尊号。\n\n诸部既已会于一旗之下，我方在[SCOPE.sStrategicRegion('central_asia').GetName]的雄图便添了难以预料的阻碍。即便如此，[SCOPE.sCharacter('kenesary_scope').GetFirstNameNoFormatting]仍在挥剑之余递来橄榄枝：若承认其名号，他愿向[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]效忠。这是外交辞令、蓄意挑衅，抑或另有所图，尚待时日分晓。"
  cr_kazakh_events.2.f: "自北方牧场至锡尔河彼岸的沙漠，骑手纷纷奔赴其麾下；血缘、信仰与对往昔独立的记忆将他们联结。他的言辞比我方巡逻传得更快，所许诺的既是统一，也是对远方统治的抗拒。"
  cr_kazakh_events.2.a: "我们试图平定的地方如今反而反抗我们。"
  cr_kazakh_events.2.b: "如果一个头衔能换来和平，那就给他吧。"
  cr_kazakh_events.2.c: "草原再次拥有了可汗！"

  cr_kazakh_events.3.t: "草原的统一"
  cr_kazakh_events.3.desc: "岁月流逝，草原却没有屈服。每一支远征队高举旗帜出发，却疲惫归来，胜利如风中尘土般消散。如今随着我们的力量衰退、存在感减弱，肯尼萨里的名字在各氏族之间愈发沉重。一个接一个的阿乌勒开始转向他——并非出于反叛，而是因为再没有其他力量能回应他们。"
  cr_kazakh_events.3.flavour: "帝国在草海中迷失了方向，而草原找到了自己的声音。"
  cr_kazakh_events.3.a: "长期分裂的草原终于找到了中心。"
  cr_kazakh_events.3.b: "草原将记住这一天。"

  cr_kazakh_events.4.t: "复兴草原的可汗"
  cr_kazakh_events.4.desc: "当帝国陷入动荡时，肯尼萨里的号召在平原上回荡得更加响亮。俄罗斯的要塞半数被遗弃，驻军被内乱牵制。肯尼萨里趁势而起，将分散的氏族统一在一面旗帜之下。昔日的逃亡者，如今以君主的姿态驰骋——他的骑兵守卫着从乌拉尔到锡尔河的草原。"
  cr_kazakh_events.4.flavour: "当帝国转而内顾时，草原只能依靠自己。"
  cr_kazakh_events.4.a: "边疆暂时失去了。"
  cr_kazakh_events.4.b: "草原将记住这一天。"

  cr_kazakh_events.10.t: "草原的动荡"
  cr_kazakh_events.10.desc: "边境日益不宁。哥萨克巡逻队报称，哈萨克诸氏族的抗拒正渐成气候：商队遇袭、前哨受扰、使者被拒于门外。本欲带来秩序的改革反而激起怨愤，旧日忠诚渐次瓦解，新领袖则在暗中鼓动反抗。\n\n彼得罗巴甫洛夫斯克附近一支辎重队近日遇袭，令边防哨所大为震动。有人以为是怀恨的游骑兵所为；也有人低声提起[SCOPE.sCharacter('kenesary_scope').GetFirstName]之名，据称他正聚集心怀不满的骑手。无论缘由为何，草原又一次躁动起来。"
  cr_kazakh_events.10.flavour: "风在草原上传播的不只是尘土，还有叛乱的低语。"
  cr_kazakh_events.10.a: "加强边境驻军。"
  cr_kazakh_events.10.b: "通过贸易和宽容安抚各氏族。"

  cr_kazakh_events.11.t: "阿克莫林斯克突袭"
  cr_kazakh_events.11.desc: "草原传来的消息鲜有佳音，此番亦然。阿克莫林斯克边防哨所遭一支哈萨克掠袭队攻破洗劫，辎重尽失，数名士兵也被掳往草原。\n\n袭击与冲突本不足为奇，但此次行动之大胆，连久历边事的军官也为之不安。有人说不过是寻常盗匪；也有人再度低声提起[SCOPE.sCharacter('kenesary_scope').GetFirstName]之名，据说这位野心勃勃的贵族正聚拢不满的氏族。无论真相为何，草原上的秩序仍岌岌可危。"
  cr_kazakh_events.11.flavour: "风在草原上传播的不只是尘土，还有谣言，而谣言会滋生动荡。"
  cr_kazakh_events.11.a: "派出惩戒部队恢复控制。"
  cr_kazakh_events.11.b: "在事态扩大前向各氏族派遣使者。"

  cr_kazakh_events.12.t: "草原集结"
  cr_kazakh_events.12.desc: "草原间弥漫着不安。信使奔走于远近阿吾勒，昔日各自燃起的篝火如今连成一片。旧怨暂被搁置，人们谈论失去的权利、外来的统治与为逝者复仇；曾使诸氏族离散的争端，正逐渐让位于共同的目标。\n\n响应号召者中，有来自[SCOPE.sCountry('kenesary_ally_tag').GetNameNoFlag]的[SCOPE.sCharacter('kenesary_ally_char').GetFirstName]；他已使[SCOPE.sCharacter('kenesary_ally_char').GetLastNameNoFormatting]家族宣誓效忠[SCOPE.sCharacter('kenesary_scope').GetFirstName]的事业。"
  cr_kazakh_events.12.flavour: "袭击越来越大胆，队伍越来越庞大。边境再次升起烟火——彼此相隔遥远，却频繁出现，不可能只是巧合。"
  cr_kazakh_events.12.a: "派出惩戒部队恢复控制。"
  cr_kazakh_events.12.b: "叛乱的余烬正在发红。"

  cr_kazakh_events.13.t: "草原从手中溜走"
  cr_kazakh_events.13.desc: "追捕[SCOPE.sCharacter('kenesary_scope').GetFirstName]的远征队终于在开阔草原上与其相遇。战斗短促而激烈；我军齐射击溃其骑手，牲群四散，许多追随者倒下，旗帜亦被踏入尘土。\n\n然而此人再度逃脱。[SCOPE.sCharacter('kenesary_scope').GetFirstNameNoFormatting]没入无垠平原，只留下灰烬与尸体。营地既失，辎重尽弃，他的名字也遭追随者咒骂。其势暂受挫折，却尚未消灭。"
  cr_kazakh_events.13.flavour: "在草原上，即使失败也能消失在地平线之外。"
  cr_kazakh_events.13.a: "他会回来的，他们总会回来。"

  cr_kazakh_events.14.t: "被逐出地平线之外"
  cr_kazakh_events.14.desc: "派去惩戒[SCOPE.sCharacter('kenesary_scope').GetFirstName]的远征队并未遭遇一场决定性的战斗——只有尘土、烟雾，以及散布在草原各处的零星冲突。每当我们的纵队推进，他的骑手便消失在平原之中；而每当我们停下休整，他们又再度出击。\n\n最终，[SCOPE.sCharacter('kenesary_scope').GetFirstNameNoFormatting]与他的追随者消失在南方的地平线之外，他们的营地被遗弃，牲群被赶在前方远去。"
  cr_kazakh_events.14.flavour: "草原像往常一样将他们吞没。边境暂时恢复了平静，但那片空旷的远方却令人不安——仿佛只是在等待风再次改变方向。"
  cr_kazakh_events.14.a: "至少边境又能喘口气了——暂时如此。"
  cr_kazakh_events.14.a_tt: "在一段时间内，[SCOPE.sCharacter('kenesary_scope').GetFirstName]不会再次出现。"

  cr_kazakh_events.15.t: "草原的反击"
  cr_kazakh_events.15.desc: "讨伐[SCOPE.sCharacter('kenesary_scope').GetFirstName]的远征队，在远离道路与要塞之处遭受沉重一击。他的骑手昼夜袭扰我军纵队，截断补给、掠走马匹，继而没入滚滚尘沙。\n\n战斗终于爆发时，连风也仿佛与我军为敌。草原化作火焰与混乱；枪械为沙尘所阻，人们在烟雾中迷失方向。仅有少数人得以生还，讲述这场灾难；余者长眠草下，武器沦为战利品，败讯则在边境营地间低声流传。"
  cr_kazakh_events.15.flavour: "草原记得属于它的人——外来者很难得到宽恕。"
  cr_kazakh_events.15.a: "猎人变成了猎物。"

  cr_kazakh_events.16.t: "穿越空旷草原"
  cr_kazakh_events.16.desc: "远征队行军甚远，也多次交战，但叛军的纵队总是消失在地平线之中。每一次小规模战斗都以同样的方式结束——烟雾、尘土，以及逐渐被风抹去的马蹄印。肯尼萨里依旧逍遥在外，他的追随者虽分散却未被击溃。"
  cr_kazakh_events.16.flavour: "草原会庇护最熟悉它的人。"
  cr_kazakh_events.16.a: "草原不是一个季节就能驯服的。"

  cr_kazakh_events.17.t: "被逼出平原"
  cr_kazakh_events.17.desc: "我们的部队不断向叛军施压，将他们驱赶到更荒凉的草原深处。虽然没有爆发决定性战斗，但肯尼萨里的追随者已经疲惫不堪，他们的牲群散失，营地混乱不堪。边境暂时再次恢复平静。"
  cr_kazakh_events.17.flavour: "他们每次都逃得更远，但风总会把他们的歌声带回来。"
  cr_kazakh_events.17.a: "很好。让草原记住我们的力量。"

  cr_kazakh_events.18.t: "四散的阿乌勒"
  cr_kazakh_events.18.desc: "派往草原的远征队终于取得了一些成果。我们的纵队穿越[SCOPE.sState('kazak_event_neighbour_state').GetStateRegion.GetName]时，发现了数个为[SCOPE.sCharacter('kenesary_scope').GetFirstName]追随者提供庇护的阿乌勒。村落很快被攻占——牲群被赶走，储备被没收，大量俘虏被带走。据说其中甚至包括叛军本人的亲族。\n\n虽然[SCOPE.sCharacter('kenesary_scope').GetFirstNameNoFormatting]仍然逃脱，但他的事业显然遭受了打击，他的部下纷纷散去以保护残存的家园。"
  cr_kazakh_events.18.flavour: "草原虽广，但即便是它的子民也必须在某处安睡。"
  cr_kazakh_events.18.a: "这是个好消息。"

  cr_kazakh_events.19.t: "草原上的胜利"
  cr_kazakh_events.19.desc: "在黎明的开阔平原上，我们的远征队终于与肯尼萨里的骑兵正面交锋。经过激烈战斗，叛军溃散而逃，留下他们的尸体、旗帜与尊严。草原再次被压制——至少暂时如此。"
  cr_kazakh_events.19.flavour: "连风似乎也停下来，注视着烟雾向东飘去。"
  cr_kazakh_events.19.a: "来之不易的胜利。今晚边境能稍微安心了。"

  cr_kazakh_events.20.t: "草原上的挫败"
  cr_kazakh_events.20.desc: "远征队所遇抵抗远比预料猛烈。肯尼萨里的骑手自山脊与沟谷间出没，以迅疾而凶悍的攻势不断袭扰我军纵队。补给车焚毁，前哨没于烟雾，伤亡与日俱增；指挥官别无选择，只得撤往[SCOPE.sState('kazak_event_state').GetCityHubName]，保全部队残余。"
  cr_kazakh_events.20.flavour: "草原不会宽恕鲁莽者，也不会宽恕疲惫者。"
  cr_kazakh_events.20.a: "惨痛的教训——撤退并重整部队。"

  cr_kazakh_events.21.t: "草原伏击"
  cr_kazakh_events.21.desc: "我方远征队本欲迫使[SCOPE.sCharacter('kenesary_scope').GetFirstName]屈服，却反遭伏击。行经一片荒凉草原时，一支分队于黎明为骑兵突袭；攻势突然而周密，补给车焚毁，侦察兵溃散，部队尚未来得及列阵，袭者已再度消失于平原。\n\n伤亡既增，补给又毁，指挥官判断无法继续推进，遂将远征队撤回[SCOPE.sState('kazak_event_state').GetCityHubName]整顿。[SCOPE.sCharacter('kenesary_scope').GetFirstNameNoFormatting]仍逍遥在外，反抗亦未止息。"
  cr_kazakh_events.21.flavour: "草原吞没他们，就像吐出他们一样轻易。"
  cr_kazakh_events.21.desc_old: "我们的远征队深入草原追捕[SCOPE.sCharacter('kenesary_scope').GetFirstName]，却发现猎人与猎物的角色已经交换。叛军从山脊突然袭击我们的后卫与补给队，打散行李队并焚毁车队，然后再次消失在无尽的草海之中。\n\n虽然主力仍然完整，但人员与物资损失严重，士气也受到打击。[SCOPE.sCharacter('kenesary_scope').GetFirstName]再次证明了他的狡诈——重击之后便消失在地平线尽头。"
  cr_kazakh_events.21.flavour_old: "风会带走战斗的烟雾，却带不走失败的记忆。"
  cr_kazakh_events.21.a: "他又一次逃脱了……"

  cr_kazakh_events.30.t: "枷锁的重量"
  cr_kazakh_events.30.desc: "我们对草原的统治带来了秩序——也带来了怨恨。每一名税吏、每一支巡逻队，都在提醒各氏族：这片土地已不再只属于他们。忠诚摇摆不定，怨气在表面之下酝酿——有人主张加强控制，也有人警告武力只会助长反抗。"
  cr_kazakh_events.30.desc_old: "草原曾见过许多统治者，但氏族依然存在，他们的忠诚随风而变。我们的统治带来秩序，却也带来怨恨；每一个税吏与巡逻队都在提醒他们，这片土地已不再只属于他们。\n\n有人要求更强硬的控制来根除不服从。另一些人则警告：武力只会孕育新的叛乱。"
  cr_kazakh_events.30.flavour: "一位哈萨克长者曾对一名俄罗斯军官说：'我们承受两种枷锁——我们驱赶的牲群，以及驱赶我们的统治者。'"
  cr_kazakh_events.30.a: "加强控制，让他们记住谁才是草原的主人。"
  cr_kazakh_events.30.b: "保持克制——让时间消磨他们的怨恨。"

  cr_kazakh_events.31.t: "游牧的氏族"
  cr_kazakh_events.31.desc: "[SCOPE.sState('kazak_event_neighbour_state').GetStateRegion.GetName]的哈萨克人仍逐水草与四时迁徙，并不在意我方地图上划出的边界。他们往来于各处牧场，有时甚至越过帝国界线；唯有巡逻队索取赋税或查验他们看不懂的文书时，才会想起我方权威。在[SCOPE.sState('kazak_event_state').GetCityHubName]，总督正权衡：是限制其迁徙，还是将这份自由视作维系和平的代价。"
  cr_kazakh_events.31.desc_old: "在[SCOPE.sState('kazak_event_state').GetStateRegion.GetName]的草原上，哈萨克人仍带着牲群迁徙，追逐草场与季节。我们在地图上划出的边界，对他们几乎毫无意义。他们从一个牧场漂泊到另一个牧场，有时甚至跨越帝国的边界，只有当巡逻队要求贡税或证件时才想起我们的法律。\n\n在[SCOPE.sState('kazak_event_state').GetCityHubName]，总督正在权衡是否要限制他们的迁徙，还是容忍这种生活方式以换取和平。"
  cr_kazakh_events.31.flavour: "草原不承认边界——只承认地平线。"
  cr_kazakh_events.31.a: "实施固定牧区与边境管制。"
  cr_kazakh_events.31.b: "暂时允许他们保持自由。"

  cr_kazakh_events.32.t: "送给阿乌勒的礼物"
  cr_kazakh_events.32.desc: "草原上唯一不变者，便是变化。一个阿吾勒今日尚在，明日或已远去；忠诚亦随四时而易。\n\n为博得[SCOPE.sState('kazak_event_neighbour_state').GetStateRegion.GetName]哈萨克长者的好感，使其阿吾勒归附于[ROOT.GetCountry.GetNameNoFormatting]，有人建议赐下茶叶、盐与布匹——这是礼物，而非贿赂。"
  cr_kazakh_events.32.flavour: "哈萨克人反复无常，他们的阿乌勒各自为政。忠诚像草原上的风一样迅速改变；今天的朋友，明天可能就会投向他人。所谓忠诚，首先属于亲族，其次属于氏族，很少再超出此范围。"
  cr_kazakh_events.32.a: "批准礼物；花钱买来的和平总比流血换来的便宜。"
  cr_kazakh_events.32.b: "我们靠权威统治，而不是施舍。"

  cr_kazakh_events.33.t: "游牧者的不满"
  cr_kazakh_events.33.desc: "一群来自[SCOPE.sState('kazak_event_neighbour_state').GetStateRegion.GetName]的牧民来到[SCOPE.sState('kazak_event_state').GetFarmHubName]地区办事处，声称俄罗斯移民已经把古老的牧场和水源围了起来。他们的发言人语气礼貌却带着苦涩：'当你们的祖父还在莫斯科公国时，我们的父辈就在这里放牧了。'\n\n哥萨克人则表示他们已经足够克制——而这种克制很快就会耗尽。"
  cr_kazakh_events.33.flavour: "每一片牧场都有两个主人——一个是筑起围栏的人，另一个是记得围栏出现之前这片土地的人。"
  cr_kazakh_events.33.a: "站在移民一边并执行新的边界。"
  cr_kazakh_events.33.b: "命令哥萨克人与牧民协商补偿。"
  cr_kazakh_events.33.c: "无视此事——这不值得我们操心。"


  cr_kazakh_events.34.t: "季节的迁徙"
  cr_kazakh_events.34.desc: "[SCOPE.sState('kazak_event_neighbour_state').GetStateRegion.GetName]的哈萨克氏族再次迁徙。严酷的冬季、牧场歉收或新起的争端驱使家族们寻找新的放牧地。每一次迁徙都模糊了我们地图上的界线，并可能打破边疆脆弱的平衡。"
  cr_kazakh_events.34.desc_old: "哈萨克人永不安宁。即使定居下来，他也梦想着开阔的平原。严冬、歉收的牧季，或两个氏族的争吵，都能在一夜之间让整个家族动身。他们说，没有畜群的人就像没有影子的人，于是他们四处游荡，寻找青草、水源与自由。\n\n每一次迁徙都扰乱我们划定的边界，每一支被劫掠的商队都带来新的干预请求。草原在我们脚下移动，我们对它的掌控也随之动摇。"
  cr_kazakh_events.34.flavour: "哈萨克人永不安宁。即使定居下来，他也梦想着开阔的平原。严冬、歉收的季节，或两个氏族的争吵，都能在一夜之间让整个家族动身。他们说，没有畜群的人就像没有影子的人，于是他们四处游荡，寻找青草、水源与自由。"
  cr_kazakh_events.34.a: "派遣更多巡逻队强制秩序。"
  cr_kazakh_events.34.b: "让他们游荡吧——这是他们的天性。"

  cr_kazakh_events.35.t: "不安的草原"
  cr_kazakh_events.35.desc: "今日地平线上升起烟尘：一处阿吾勒已遭焚毁，畜群四散。凶手不明，或为盗匪，或为敌对氏族，或为心怀不轨的骑手。生活仍在继续，但空气中多了一层紧张，草原上的和平也仿佛愈发单薄。"
  cr_kazakh_events.35.flavour: "连风这些日子都仿佛带着怒气。"
  cr_kazakh_events.35.a: "增加巡逻队，恢复平静。"
  cr_kazakh_events.35.b: "忽略它；这些恩怨会自己烧尽。"

  cr_kazakh_events.40.t: "哈萨克争端"
  cr_kazakh_events.40.desc: "[SCOPE.sState('kazak_event_neighbour_state').GetStateRegion.GetName]敌对氏族间的世仇，已使数处阿吾勒焚毁、数个家族流散。长老们如今向我方求助；他们说，与其任由堂兄弟之间无休止地流血，不如接受哥萨克的法律。"
  cr_kazakh_events.40.flavour: "是抢婚，还是私奔？是夺地，还是牧人寻找新牧场？是偷牛，还是正当索取报酬？是新仇，还是旧恨的报复？无人能说清，每一方都声称自己有理。但这样的争吵正是草原的生命之血，当荣誉要求复仇时，理智很少被邀请。"
  cr_kazakh_events.40.a: "派遣哥萨克强制和平。"
  cr_kazakh_events.40.b: "让氏族自己解决。"

  cr_kazakh_events.41.t: "被劫的妻子"
  cr_kazakh_events.41.desc: "[SCOPE.sState('kazak_event_neighbour_state').GetStateRegion.GetName]氏族间最新的争端如许多一样，起因于一个女人。一位年轻的新娘从她在[SCOPE.sState('kazak_event_neighbour_state').GetFarmHubName]丈夫的毡房中被带走，由敌对氏族的骑手掳去。不管她是否自愿，如今已无关紧要——丈夫的亲族已武装起来，道路不安全，商队避开此地。\n\n长老们恳求我们干预，以免复仇再夺更多鲜血。但有人说，这些事最好留给草原自己的习俗。"
  cr_kazakh_events.41.flavour: "在爱情与荣誉之间，草原总是选择荣誉。"
  cr_kazakh_events.41.a: "派遣调解人恢复和平。"
  cr_kazakh_events.41.b: "忽略此事——它会自己烧尽。"

  cr_kazakh_events.42.t: "牲畜与报复"
  cr_kazakh_events.42.desc: "草原上的氏族擅长迅速清算旧账，旧怨常引发新仇。在[SCOPE.sState('kazak_event_neighbour_state').GetStateRegion.GetName]，牲畜纠纷重新点燃，如今劫掠与反劫掠的循环威胁着脆弱的和平。干预或能恢复秩序——也可能让我们更深地卷入他们的争端。"
  cr_kazakh_events.42.flavour: "在草原上，每一次偷窃都是对另一次的记忆。"
  cr_kazakh_events.42.a: "派遣一支哥萨克分队分开畜群。"
  cr_kazakh_events.42.b: "让他们打个痛快；最强者自会维持秩序。"

  cr_kazakh_events.43.t: "游荡的法官"
  cr_kazakh_events.43.desc: "放牧地纠纷如同草原上的风一样永恒。氏族随季节移动边界，每一方都坚称记忆而非地图定义归属。我们调解此类争端的努力很少持久——判决消逝，协议被遗忘，每一片新牧场又带来新的主张。\n\n在[SCOPE.sState('kazak_event_neighbour_state').GetName]，当地人如今称我们的使节为#italic 游荡的法官#!——一个远行千里、解决寥寥、让尘土带走他话语的人。"
  cr_kazakh_events.43.flavour: "写在纸上的法律，比商队的足迹消逝得更快。"
  cr_kazakh_events.43.a: "建立永久哨所监督纠纷。"
  cr_kazakh_events.43.b: "轮换哥萨克巡逻队。"
  cr_kazakh_events.43.c: "撤回法官；我们做得够多了。"

  cr_kazakh_events.44.t: "忠诚的问题"
  cr_kazakh_events.44.desc: "哈萨克人轻易宣誓忠诚，但忠诚的对象随季节而变。今天一个氏族称[SCOPE.sCountry('russia_scope').GetRuler.GetPrimaryRoleTitle]为他们的保护者；明天他们又庇护来自锡尔河彼岸的劫掠者。[SCOPE.sState('kazak_event_neighbour_state').GetStateRegion.GetName]的长者谈论荣誉与血亲，但年轻人们追随许诺牧场权与战利品的人。\n\n我们的行政官们争论是奖赏忠诚者还是惩罚叛逆者——尽管这两者间的界线如同沙丘般变动。"
  cr_kazakh_events.44.flavour: "草原上的承诺只持续到风向改变。"
  cr_kazakh_events.44.a: "奖赏那些站在我们这边的人。"
  cr_kazakh_events.44.b: "惩罚那些违抗我们的人。"
  cr_kazakh_events.44.c: "什么都不做——忠诚买不来。"

  notification_cr_kazakh_harsh_rule_on_the_steppes_name: "[SCOPE.sCountry('russia_scope').GetName]对草原实施严苛统治。"
  notification_cr_kazakh_harsh_rule_on_the_steppes_desc: "为镇压[SCOPE.sState('kazak_event_neighbour_state').GetName]草原上哈萨克人的不忠，[SCOPE.sCountry('russia_scope').GetAdjectiveNoFlag]采取了严苛统治政策，导致[concept_devastation|l]。"

  #中国反应
  cr_kazakh_events.60.t: "西部草原的动荡"
  cr_kazakh_events.60.desc: "越过我方西境的沙漠与河谷，草原正变得不安。长期为习俗与争端所分裂的游牧氏族，如今聚集在[SCOPE.sCharacter('kenesary_scope').GetFirstName]麾下；他自号[SCOPE.sCharacter('kenesary_scope').GetPrimaryRoleTitle]，公然反抗[SCOPE.sCountry('russia_scope').GetAdjectiveNoFlag]的扩张。\n\n我方势力范围内的哈萨克部落仍在纳贡，并受我方庇护而放牧；但草原本无疆界。若其号召传得更远，边疆的界线也将随之动摇。"
  cr_kazakh_events.60.flavour: "西部边疆从未平静——畜群漂移，劫掠者越界，忠诚转瞬即逝——但氏族的统一带来了新的不确定，那些在我们宗主权下的部落开始权衡义务与昔日自由的承诺。"
  cr_kazakh_events.60.desc_recognised: "在西方，草原如今听命于一人。曾四处游牧的氏族向[SCOPE.sCharacter('kenesary_scope').GetFirstName]宣誓效忠，而他已获[SCOPE.sCountry('russia_scope').GetAdjectiveNoFlag]朝廷承认为[SCOPE.sCharacter('kenesary_scope').GetPrimaryRoleTitle]。其名越过河流与沙漠远播，我方对最西部诸部的掌控也在无声中流失。\n\n昔日标记其阿吾勒的旗帜已经降下；骑手如今效忠他人。这一损失不闻喧响，边疆的沉默却足以诉说时代之变。"
  cr_kazakh_events.60.flavour_recognised: "草原不向任何墙垣或帝国低头；它的忠诚追随最强的骑手。"
  cr_kazakh_events.60.a: "令人担忧的发展。"
  cr_kazakh_events.60.a_tt: "我们已失去对所有未殖民#variable 哈萨克#!国家的控制。"
  cr_kazakh_events.60.b: "我们也承认他为[SCOPE.sCharacter('kenesary_scope').GetPrimaryRoleTitle]。"
  cr_kazakh_events.60.b_tt: "我们已失去对所有未殖民#variable 哈萨克#!国家的控制。"

  #浩罕反应
  cr_kazakh_events.61.a: "我们拭目以待未来。"
  cr_kazakh_events.61.b: "尝试与他找到共同点。"
  cr_kazakh_events.61.t: "北方草原的回响"
  cr_kazakh_events.61.desc: "从北方沙漠之外传来消息，一个新势力在哈萨克氏族中崛起。曾经分散好斗的他们，如今聚集在一位名叫[SCOPE.sCharacter('kenesary_scope').GetFirstName]的旗帜下，他宣布自己为[SCOPE.sCharacter('kenesary_scope').GetPrimaryRoleTitle]，反抗[SCOPE.sCountry('russia_scope').GetAdjectiveNoFlag]对其土地的侵占。\n\n从草原吹下的风带来的不只是尘土与谣言——还有动荡。在我们北部边境游牧的牧人仔细聆听，通往塔什干与突厥斯坦的道路变得不安。"
  cr_kazakh_events.61.flavour: "草原一向是无岸之海——当它激荡，波浪甚至能抵达我们的城门。"
  cr_kazakh_events.61.t_recognised: "可汗在我们门口"
  cr_kazakh_events.61.desc_recognised: "我们北部边疆的平衡正在改变。曾经不统一的哈萨克氏族，如今追随[SCOPE.sCharacter('kenesary_scope').GetFirstName]，他已被[SCOPE.sCountry('russia_scope').GetAdjectiveNoFlag]承认为[SCOPE.sCharacter('kenesary_scope').GetPrimaryRoleTitle]。随着这一承认，他的力量膨胀——他的骑兵如今自由驰骋草原，我们保护下的部落开始向他的营地漂移。\n\n一些边境阿吾勒已开始向北而非向东寻求指引。曾经守护我们的边疆，如今对另一人的野心敞开。"
  cr_kazakh_events.61.flavour_recognised: "草原的风既不带来朋友也不带来敌人——只带来旧秩序无法持久的承诺。"

  #希瓦
  cr_kazakh_events.62.t: "草原氏族的躁动"
  cr_kazakh_events.62.desc: "锡尔河北方，哈萨克氏族在某位[SCOPE.sCharacter('kenesary_scope').GetFirstName]之下找到了新目标，他如今自称[SCOPE.sCharacter('kenesary_scope').GetPrimaryRoleTitle]。他的骑手骚扰[SCOPE.sCountry('russia_scope').GetAdjectiveNoFlag]边疆，劫掠哨所，每一次袭击都宣扬反抗。\n\n对我们而言，这次起义既是麻烦也是机会。若他的怒火继续指向北方，草原或可充当缓冲——它的烟尘与混乱能让[SCOPE.sCountry('russia_scope').GetAdjectiveNoFormatting]的目光远离我们的边界。"
  cr_kazakh_events.62.flavour: "不安的邻居很麻烦——但一个面向北方的不安邻居确实很有用。"
  cr_kazakh_events.62.t_recognised: "草原转向南方"
  cr_kazakh_events.62.desc_recognised: "曾经看似遥远的争端如今变得严峻。曾经分裂的哈萨克氏族统一在[SCOPE.sCharacter('kenesary_scope').GetFirstName]之下，他已被[SCOPE.sCountry('russia_scope').GetAdjectiveNoFlag]承认为[SCOPE.sCharacter('kenesary_scope').GetPrimaryRoleTitle]。随着合法性得到确认，北方的骑手变得大胆，越过锡尔河更远，将游牧部落拉入他的阵营。\n\n曾经只烧灼俄罗斯边疆的火焰，可能很快南下，本可作为有用干扰的事，如今遮暗了地平线。"
  cr_kazakh_events.62.flavour_recognised: "我们曾经欢迎的风，如今带着烟味。"

  #布哈拉
  cr_kazakh_events.63.t: "草原之外的动荡"
  cr_kazakh_events.63.desc: "从锡尔河彼岸传来动荡的消息。向来桀骜的哈萨克氏族，如今聚集在自称[SCOPE.sCharacter('kenesary_scope').GetPrimaryRoleTitle]的人身边，袭击[SCOPE.sCountry('russia_scope').GetAdjectiveNoFlag]沿边疆的堡垒与定居点。\n\n对我们而言，这北方动荡不过是草原无尽争端的又一涟漪。但这样的涟漪若任其壮大，常会变成风暴——而风暴在开阔土地上传播极快。"
  cr_kazakh_events.63.flavour: "北方的麻烦如同风中尘土——易于忽略，直到它迷了你的眼。"
  cr_kazakh_events.63.t_recognised: "北方的新势力"
  cr_kazakh_events.63.desc_recognised: "草原不再低语——它以单一声音说话。哈萨克氏族向[SCOPE.sCharacter('kenesary_scope').GetFirstName]宣誓效忠，他已被[SCOPE.sCountry('russia_scope').GetAdjectiveNoFlag]承认为[SCOPE.sCharacter('kenesary_scope').GetPrimaryRoleTitle]。锡尔河与北部平原间的土地，曾经是争斗部落的拼凑，如今服从他的意志。\n\n他的崛起是带来新秩序还是新毁灭尚待观察——但承载他名字的风，正越来越靠近布哈拉。"
  cr_kazakh_events.63.flavour_recognised: "草原与城市之间，和平的空间越来越窄。"

  cr_kazakh_events.64.t: "草原上可汗崛起"
  cr_kazakh_events.64.desc: "来自亚洲边疆的急报称哈萨克部落再度动荡。一位名叫[SCOPE.sCharacter('kenesary_scope').GetFirstName]的领袖宣布自己为[SCOPE.sCharacter('kenesary_scope').GetPrimaryRoleTitle]，统一分散的氏族反抗[SCOPE.sCountry('russia_scope').GetAdjectiveNoFlag]的扩张。\n\n此事目前仍是遥远关切——但它搅动了中亚的权力平衡。在帝国与草原间的流沙中，即使地方起义也能重绘地图。"
  cr_kazakh_events.64.flavour: "从突厥斯坦的沙漠到西伯利亚的雪原，小火常能传得很远。"
  cr_kazakh_events.64.t_recognised: "草原加冕"
  cr_kazakh_events.64.desc_recognised: "边疆报告确认，长期困扰[SCOPE.sCountry('russia_scope').GetNameNoFlag]的[SCOPE.sCharacter('kenesary_scope').GetFirstName]，已被他们正式承认为[SCOPE.sCharacter('kenesary_scope').GetPrimaryRoleTitle]。他的统治如今覆盖大部分哈萨克草原，为长期分裂的地区带来稳定与力量。\n\n我们 chancery 的观察者注意到，[SCOPE.sCountry('russia_scope').GetAdjectiveNoFormatting]似乎满足于为他们的叛军加冕而非粉碎他——一个奇特的抉择，或许意味深长。"
  cr_kazakh_events.64.flavour_recognised: "帝国常与他们难以轻易摧毁的人媾和。"

  #通用
  cr_kazakh_events.65.t: "草原可汗的低语"
  cr_kazakh_events.65.desc: "北方草原的报告称，一位哈萨克领袖将曾经分裂的氏族绑在自己的旗帜下。自称[SCOPE.sCharacter('kenesary_scope').GetPrimaryRoleTitle]的[SCOPE.sCharacter('kenesary_scope').GetFirstName]宣称反抗[SCOPE.sCountry('russia_scope').GetAdjectiveNoFlag]统治，并誓言恢复草原旧秩序。\n\n虽然他的势力遥远，但他的名字传播迅捷——由商人、牧人以及风本身携带。这是否只是另一场短暂叛乱，或更大事物的开端，仍不确定。"
  cr_kazakh_events.65.flavour: "草原总能孕育让帝国颤抖的人，即使只是一季。"
  cr_kazakh_events.65.t_recognised: "草原统一"
  cr_kazakh_events.65.desc_recognised: "长期分裂的哈萨克氏族，如今在[SCOPE.sCharacter('kenesary_scope').GetFirstName]之下团结，他已被[SCOPE.sCountry('russia_scope').GetAdjectiveNoFlag]承认为[SCOPE.sCharacter('kenesary_scope').GetPrimaryRoleTitle]。他的权威横跨北部平原，中亚不安的部落以希望与恐惧混杂的心情谈论他的名字。\n\n从远处看，他的崛起似乎只是遥远的震颤——但这样的震颤常能撼动最坚固的基础。"
  cr_kazakh_events.65.flavour_recognised: "当草原聚集在一面旗帜下，整个地平线似乎都在移动。"

  ##布基汗国事件
  cr_bukey_events.1.t: "诗人的斥责"
  cr_bukey_events.1.desc: "草原不安。起初只是牧人间零星的低语，如今已成长为危险的合唱——对牧场被夺、税收上涨、朝廷偏袒的抱怨。我们旨在加强汗国的现代化努力，反而加深了不平等，疏远了许多游牧人口。\n\n如今，反抗围绕[SCOPE.sCharacter('isatai_taymanuly').GetFullName]与[SCOPE.sCharacter('mahambet_utemisov').GetFullName]凝聚——前者是被剥夺的氏族领袖，后者是从诗人转为煽动者。他们的正义呼声引起共鸣，本是改革恳求的事物，正迅速转为威胁可汗统治的叛乱。"
  cr_bukey_events.1.flavour: "对那些用异邦靴子践踏我们牧场的人，\n对那些以恩宠换自由的人——\n你们可坐在豪宅中，但我们拥有草原。"
  cr_bukey_events.1.a: "向沙皇求援"
  cr_bukey_events.1.b: "无需麻烦我们的宗主"
  cr_bukey_events.1.b_tt: "我们将自行处理[SCOPE.sCharacter('isatai_taymanuly').GetFullName]与[SCOPE.sCharacter('mahambet_utemisov').GetFullName]。"

  cr_bukey_events.2.t: "诗人的斥责"
  cr_bukey_events.2.desc: "来自[SCOPE.sCountry('bukey_scope').GetName]的[SCOPE.sCharacter('bukey_khan_scope').GetPrimaryRoleTitle][SCOPE.sCharacter('bukey_khan_scope').GetFullName]传来消息，他的权威正受到两位煽动者挑战——著名贵族[SCOPE.sCharacter('isatai_taymanuly').GetFullName]与转为诗人的[SCOPE.sCharacter('mahambet_utemisov').GetFullName]——他们因土地没收与税收激起动荡。面对叛乱，他请求我们的支持以维持[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]的统治。\n\n可汗对我们的忠诚从未动摇，但他的改革激怒了许多人。如今他的敌人威胁要彻底推翻他。干预提供强化我们对草原影响的机会——但若处理不当，也可能激起更大怨恨。"
  cr_bukey_events.2.flavour: "我举剑并非要取代可汗，我举剑是为了让哈萨克人不再跪下。"
  cr_bukey_events.2.a: "派遣哥萨克恢复秩序。"
  cr_bukey_events.2.b: "若[SCOPE.sCharacter('bukey_khan_scope').GetPrimaryRoleTitle][SCOPE.sCharacter('bukey_khan_scope').GetFirstNameNoFormatting]想统治，他就得学会如何统治。"
  cr_bukey_events.2.b2: "提供顾问与武器，但让可汗自己打自己的仗。"
  cr_bukey_events.2.c: "让可汗倒下——然后介入恢复稳定。"

  cr_bukey_events.4.t: "草原的逝去"
  cr_bukey_events.4.desc: "来自伏尔加与乌拉尔间草原的消息：统治[SCOPE.sCharacter('last_bukey_sultan').GetCountry.GetName]的可汗[SCOPE.sCharacter('last_bukey_sultan').GetFirstName]已故。受过教育、优雅且忠于帝国的詹吉尔试图为人民带来秩序与学问。他建学校、自由贸易、遏制旧部落习俗。但如此做几乎让他失去王位——当叛乱旗帜因他的改革而升起，提醒我们变革在草原上并非总受欢迎。\n\n如今汗国群龙无首，前途未卜。有人认为无理由保留其旧自治；其他人主张谨慎，担心帝国之手压得太重会引发动荡。"
  cr_bukey_events.4.flavour: "可汗的宫殿在乌拉尔沙地上寂静无声；大门向风与历史敞开。"
  cr_bukey_events.4.t_old: "最后的布基苏丹"
  cr_bukey_events.4.desc_old: "曾经，伏尔加与乌拉尔间的草原回荡着无数游牧汗国的迁徙。这些迁徙在上世纪结束，因为它们对我们的巴什基尔臣民造成负担而被禁止。但边境多孔，‘非法’越界持续多年，让大片土地空旷未驯。\n\n直到1801年，苏丹布基获准携约7500户家庭定居，才为这片荒原带来生机。如今，随着布基苏丹的去世，这一章结束。根据他们当初定居时的效忠誓言，布基土地可合法回归帝国直接管辖。"
  cr_bukey_events.4.flavour_old: "又一位边疆领主步入历史，随着他，旧草原秩序的最后痕迹消逝。"
  cr_bukey_events.4.a: "为帝国收回布基土地。"
  cr_bukey_events.4.b: "允许汗国自行选择继任者。"

  notification_cr_kazakh_harsh_rule_on_the_steppes_tooltip: "#header $notification_cr_kazakh_harsh_rule_on_the_steppes_name$#!\n$TOOLTIP_DELIMITER$\n$notification_cr_kazakh_harsh_rule_on_the_steppes_desc$"
  cr_kazakh_events.5.t: "重生草原的汗王"
  cr_kazakh_events.5.desc: "随着俄国实力衰退、影响力消退，其对草原的控制也随之松动。要塞逐渐坍圮，哥萨克巡逻队愈发稀少，哈萨克氏族重新夺回昔日牧场。在帝国留下的真空中，肯尼萨里的名字再次激荡人心，成为帝国衰落之际重获新生的反抗象征。"
  cr_kazakh_events.5.flavour: "雄鹰不再翱翔之处，狼群归来。"
  cr_kazakh_events.5.a: "我们的势力已无法延伸至如此遥远之地。"
  cr_kazakh_events.5.b: "草原记得它曾属于谁。"
  cr_kazakh_events.12.a_tt: "此选项可用，因为我们近期未进行远征，并掌握了[SCOPE.sCharacter('kenesary_scope').GetFirstNameNoFormatting]大致行踪的情报。"
