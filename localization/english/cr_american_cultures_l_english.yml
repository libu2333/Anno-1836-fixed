 concept_tribal_confederation:0 "Tribal Confederation"
 concept_tribal_confederation_desc:0 "A decentralized political alliance in which allied tribes recognize a leading tribe while retaining their own governments."
 subject_type_tribal_confederation:0 "@tribal_confederation! $subject_type_tribal_confederation_no_icon$"
 subject_type_tribal_confederation_no_icon:0 "$concept_tribal_confederation$"
 subject_type_tribal_confederation_desc:0 "$concept_tribal_confederation_desc$"
 tribal_confederation:0 "Tribal Confederation"
 tribal_confederation_action_name:0 "[concept_tribal_confederation]"
 tribal_confederation_action_propose_name:0 "Invite into [concept_tribal_confederation]"
 tribal_confederation_action_break_name:0 "Dissolve Confederation"
 tribal_confederation_action_ask_to_break_name:0 "Leave Confederation"
 tribal_confederation_desc:0 "Establishes a [concept_tribal_confederation] [concept_subject_type] relationship between two decentralized [Concept('concept_country', '$concept_countries$')]."
 tribal_confederation_pact_desc:0 "[SCOPE.GetRootScope.GetDiplomaticPact.GetSecondCountry.GetName] is a member of the [concept_tribal_confederation] led by [SCOPE.GetRootScope.GetDiplomaticPact.GetFirstCountry.GetName]."
 tribal_confederation_action_notification_name:0 "$tribal_confederation_proposal_notification_name$"
 tribal_confederation_action_notification_desc:0 "$tribal_confederation_proposal_notification_desc$"
 tribal_confederation_proposal_notification_name:0 "Confederation Invitation"
 tribal_confederation_proposal_notification_desc:0 "[INITIATOR_COUNTRY.GetName] invites us to join their [concept_tribal_confederation]."
 tribal_confederation_proposal_notification_effects_desc:0 "If we accept, we will join their confederation."
 tribal_confederation_proposal_accepted_name:0 "Confederation Invitation Accepted"
 tribal_confederation_proposal_accepted_desc:0 "[TARGET_COUNTRY.GetName] accepted our invitation to join the [concept_tribal_confederation]."
 tribal_confederation_proposal_declined_name:0 "Confederation Invitation Declined"
 tribal_confederation_proposal_declined_desc:0 "[TARGET_COUNTRY.GetName] declined our invitation to join the [concept_tribal_confederation]."
 tribal_confederation_action_notification_break_name:0 "Confederation Dissolved"
 tribal_confederation_action_notification_break_desc:0 "[INITIATOR_COUNTRY.GetName] dissolved our [concept_tribal_confederation] membership. We are independent once again."
 tribal_confederation_proposal_notification_break_name:0 "Request to Leave Confederation"
 tribal_confederation_proposal_notification_break_desc:0 "[INITIATOR_COUNTRY.GetName] demands that we end their [concept_tribal_confederation] membership."
 tribal_confederation_proposal_notification_break_effects_desc:0 "If we accept, they will become fully independent."
 tribal_confederation_proposal_break_accepted_name:0 "Confederation Membership Ended"
 tribal_confederation_proposal_break_accepted_desc:0 "[TARGET_COUNTRY.GetName] accepted the request to end our [concept_tribal_confederation] membership. We are independent once again."
 tribal_confederation_proposal_break_declined_name:0 "Request to Leave Confederation Refused"
 tribal_confederation_proposal_break_declined_desc:0 "[TARGET_COUNTRY.GetName] refused to end our [concept_tribal_confederation] membership."
 tribal_confederation_proposal_third_party_accepted_name:0 "Country Joined Confederation"
 tribal_confederation_proposal_third_party_accepted_desc:0 "[TARGET_COUNTRY.GetName] agreed to join the [concept_tribal_confederation] led by [INITIATOR_COUNTRY.GetName]."
 tribal_confederation_proposal_third_party_declined_name:0 "Confederation Invitation Declined"
 tribal_confederation_proposal_third_party_declined_desc:0 "[TARGET_COUNTRY.GetName] refused to join the [concept_tribal_confederation] led by [INITIATOR_COUNTRY.GetName]."
 tribal_confederation_action_third_party_notification_break_name:0 "Confederation Membership Ended"
 tribal_confederation_action_third_party_notification_break_desc:0 "[INITIATOR_COUNTRY.GetName] ended the [concept_tribal_confederation] membership of [TARGET_COUNTRY.GetName]."
 tribal_confederation_proposal_third_party_break_accepted_name:0 "Confederation Membership Ended"
 tribal_confederation_proposal_third_party_break_accepted_desc:0 "[TARGET_COUNTRY.GetName] ended the [concept_tribal_confederation] membership of [INITIATOR_COUNTRY.GetName]."
 tribal_confederation_proposal_third_party_break_declined_name:0 "Request to Leave Confederation Refused"
 tribal_confederation_proposal_third_party_break_declined_desc:0 "[TARGET_COUNTRY.GetName] refused to end the [concept_tribal_confederation] membership of [INITIATOR_COUNTRY.GetName]."
 tribal_confederation_effect_desc_global:0 "Joins a [concept_tribal_confederation]"
 tribal_confederation_effect_desc_first:0 "[TARGET_COUNTRY.GetName] joins the [COUNTRY.GetAdjectiveNoFlag] [concept_tribal_confederation]"
 tribal_confederation_effect_desc_third:0 "[AddTextIf(ObjectsEqual(GetMetaPlayer.GetPlayedOrObservedCountry.Self, TARGET_COUNTRY.Self),TARGET_COUNTRY.GetNameNoFlag)][AddTextIf(Not(ObjectsEqual(GetMetaPlayer.GetPlayedOrObservedCountry.Self, TARGET_COUNTRY.Self)),TARGET_COUNTRY.GetName)] joins the [concept_tribal_confederation] led by [COUNTRY.GetName]"
 tribal_confederation_trigger_desc_global:0 "Is part of a [concept_tribal_confederation]"
 tribal_confederation_trigger_false_desc_global:0 "Is #b not#! part of a [concept_tribal_confederation]"
 tribal_confederation_trigger_desc_first:0 "[TARGET_COUNTRY.GetName] is part of the [COUNTRY.GetAdjectiveNoFlag] [concept_tribal_confederation]"
 tribal_confederation_trigger_false_desc_first:0 "[TARGET_COUNTRY.GetName] is #b not#! part of the [COUNTRY.GetAdjectiveNoFlag] [concept_tribal_confederation]"
 tribal_confederation_trigger_desc_third:0 "[AddTextIf(ObjectsEqual(GetMetaPlayer.GetPlayedOrObservedCountry.Self, TARGET_COUNTRY.Self),TARGET_COUNTRY.GetNameNoFlag)][AddTextIf(Not(ObjectsEqual(GetMetaPlayer.GetPlayedOrObservedCountry.Self, TARGET_COUNTRY.Self)),TARGET_COUNTRY.GetName)] is part of the [concept_tribal_confederation] led by [COUNTRY.GetName]"
 tribal_confederation_trigger_false_desc_third:0 "[AddTextIf(ObjectsEqual(GetMetaPlayer.GetPlayedOrObservedCountry.Self, TARGET_COUNTRY.Self),TARGET_COUNTRY.GetNameNoFlag)][AddTextIf(Not(ObjectsEqual(GetMetaPlayer.GetPlayedOrObservedCountry.Self, TARGET_COUNTRY.Self)),TARGET_COUNTRY.GetName)] is #b not#! part of the [concept_tribal_confederation] led by [COUNTRY.GetName]"

