 # 国家修正值 #
 cr_sound_of_science_prestige_modifier:0 "科学之声"
 cr_sound_of_science_tech_spread_modifier:0 "科学之声"

 #洛林的小矿脉
 cr_minette_ores_events.1.t:0 "洛林的小矿脉"
 cr_minette_ores_events.1.desc:0 "在[SCOPE.sState('minette_ore_state').GetName]的丘陵之下，蕴藏着巨大的富铁#italic 米内特#!矿石储量。几十年来，其丰度一直令法国实业家与地质学家垂涎。然而，这片地区的潜力始终被锁在地下。\n\n矿石中高含量的磷使其无法用于现行炼钢方法。没有提纯手段，洛林的巨量矿藏更像地质奇观，而非经济引擎。"
 cr_minette_ores_events.1.flavour:0 "目前，法国的熔炉仍需从别处获取燃料。但若未来的冶金突破能提纯米内特矿，它或可将该地区转变为法国钢铁生产的支柱。"
 cr_minette_ores_events.1.a:0 "它的时代终将到来。"
 cr_minette_ores_events.1.a_tt:0 "当#variable 贝塞麦法#!被研究出来后，将解锁日志条目，用于开发提纯#italic 米内特#!矿石的方法，并移除[SCOPE.sState('minette_ore_state').GetNameNoFormatting]的#variable 米内特矿石#!特性。"

 cr_minette_ores_events.2.t:0 "埋藏的财富，涌动的潜力"
 cr_minette_ores_events.2.desc:0 "多年来，[SCOPE.sState('minette_ore_state').GetName]地底巨大的#italic 米内特#!矿层始终是未开发的资产——储量惊人，却因高磷含量而受限。\n\n如今，随着#BOLD 贝塞麦法#!的最新发展，实业与科学界都看到了前进的道路。虽然该工艺本身无法完全解决磷的问题，但它为冶金精炼打开了大门，或许终于能让这种矿石适用于钢铁生产。"
 cr_minette_ores_events.2.flavour:0 "曾经被视为不可用的东西，或许很快将成为国家工业的战略支柱。只需创新、投资，以及将理论化为烈火的意志。"

 cr_minette_ores_events.2.a:0 "这可能改变一切。"
 cr_minette_ores_events.2.a_tt:0 "解锁#variable 洛林的小矿脉#!日志条目。\n完成该日志条目将移除[SCOPE.sState('minette_ore_state').GetNameNoFormatting]的#variable 米内特矿石#!州特性，释放其铁矿开采潜力。"

 cr_minette_ores_events.3.t:0 "铁矿重归法国"
 cr_minette_ores_events.3.desc:0 "随着[SCOPE.sState('minette_ore_state').GetName]重归法国之手，我们夺回的不仅是领土，更是长久被剥夺的机会。丘陵之下是著名的#italic 米内特#!矿层：富饶、广阔、曾因磷含量而被弃之不用。\n\n但时代变了。我们的工业已进步。曾经不可用的资源如今成为等待唤醒的国家资产。工程师与冶金学家提议全力开发这些长眠的矿藏。"
 cr_minette_ores_events.3.flavour:0 "我们拥有时无法开采。他们夺走时也无法开采。现在我们将向双方展示锻造未来的真正含义。"
 cr_minette_ores_events.3.a:0 "我们将完成从未完成的事。"
 cr_minette_ores_events.3.a_tt:0 "解锁#variable 洛林的小矿脉#!日志条目。\n完成该日志条目将允许法国移除[SCOPE.sState('minette_ore_state').GetNameNoFormatting]的#variable 米内特矿石#!州特性，释放其全部铁矿潜力。"

 cr_minette_ores_events.4.t:0 "洛林的小矿脉"
 cr_minette_ores_events.4.desc:0 "我们最近获得的[SCOPE.sState('minette_ore_state').GetName]带来了欧洲已知最大的铁矿储量之一。该地区富含#italic 米内特#!——一种以储量著称、却因杂质而长期被忽视的沉积矿石。\n\n问题在于磷：矿石虽丰富，现行技术无法将其提炼成炼钢级原料。工程师认为，若冶金技术进步能中和其化学缺陷，该矿或具未来价值。"
 cr_minette_ores_events.4.flavour:0 "一件太重而无法举起的宝藏；一个帝国的承诺，等待科学赶上。"
 cr_minette_ores_events.4.a:0 "我们将密切关注科学进展。"
 cr_minette_ores_events.4.a_tt:0 "一旦#variable 贝塞麦法#!被研究出来，将解锁日志条目，用于在[SCOPE.sState('minette_ore_state').GetNameNoFormatting]开发提纯#italic 米内特#!矿石的方法。"

 cr_minette_ores_events.5.t:0 "破解米内特"
 cr_minette_ores_events.5.desc:0 "冶金学的进步重新点燃了对[SCOPE.sState('minette_ore_state').GetName]地下巨量铁矿床的兴趣。尽管因高磷含量长期被视为不可用，新的精炼技术如今或可突破这一化学障碍。\n\n实业家与科学家共同提议集中力量开发可靠的提纯方法——这或许能最终释放该地区的巨大经济潜力。"
 cr_minette_ores_events.5.flavour:0 "有时改变的不是矿石，而是我们用来塑造它的工具。"
 cr_minette_ores_events.5.a:0 "让工作开始吧。"
 cr_minette_ores_events.5.a_tt:0 "解锁#variable 洛林的小矿脉#!日志条目，允许你追求提纯米内特矿石的方法。"

 cr_minette_ores_events.6.t:0 "沉睡钢铁之地"
 cr_minette_ores_events.6.desc:0 "随着[SCOPE.sState('minette_ore_state').GetName]新近落入我们掌控，该地区广阔的铁矿田向我们敞开。几十年来，这种矿石的高磷含量阻碍了其在炼钢中的使用，但工业技术的最新突破或许终于让我们能克服这一限制。\n\n工程师们敦促政府行动——免得又一代铁矿白白埋藏。"
 cr_minette_ores_events.6.flavour:0 "有些征服带来土地，有些带来未来。"
 cr_minette_ores_events.6.a:0 "开始这项努力。"
 cr_minette_ores_events.6.a_tt:0 "解锁#variable 洛林的小矿脉#!日志条目，使你能够开发提纯米内特矿石的方法，并移除#variable 米内特矿石#!州特性。"

 cr_minette_ores_events.7.t:0 "遥不可及的财富"
 cr_minette_ores_events.7.desc:0 "我们最近征服[SCOPE.sState('minette_ore_state').GetName]带来的不仅是政治控制——还有其丘陵下广阔的米内特矿床。\n\n纸面上，这一发现非同寻常：铁矿储量惊人，足以供应几代钢厂。但矿石有瑕。高磷含量使其无法用现行技术加工，需等待技术进步方可利用。"
 cr_minette_ores_events.7.flavour:0 "当地官员谈论其巨大前景，但工程师们摇头叹息。目前，这笔巨额财富实际上毫无用处——帝国的奖赏被一道顽固的化学壁垒锁住，等待我们尚未实现的冶金突破。"
 cr_minette_ores_events.7.a:0 "等待中的奖赏。"
 cr_minette_ores_events.7.a_tt:0 "当#variable 贝塞麦法#!被研究出来后，将解锁日志条目，用于开发提纯#italic 米内特#!矿石的方法，并移除[SCOPE.sState('minette_ore_state').GetNameNoFormatting]的#variable 米内特矿石#!特性。"

 cr_minette_ores_events.10.t:0 "烈火铸就"
 cr_minette_ores_events.10.desc:0 "多年的实验、投资与创新终于开花结果。在[SCOPE.sState('minette_ore_state').GetCityHubName]工作的冶金学家成功开发出一种去除米内特矿石中磷的方法——彻底释放其在现代炼钢中的全部价值。"
 cr_minette_ores_events.10.flavour:0 "曾经被视为不适合工业的地质奇观，如今可被送入全地区的熔炉。鼓风炉轰鸣，烟囱升起，钢铁流淌，而这里曾经只有原始的潜力。"
 cr_minette_ores_events.10.a:0 "让洛林的小矿脉为日益壮大的工业强国的血脉供血。"
 cr_minette_ores_events.10.a_tt:0 "让火焰永不熄灭。"

 cr_minette_ores_events.11.t:0 "并非我们点燃的火焰"
 cr_minette_ores_events.11.desc:0 "来自[SCOPE.sState('minette_ore_state').GetCityHubName]的消息称，[SCOPE.sCountry('occupier_of_lorraine').GetNameNoFlag]当局已开发出提纯米内特矿石的方法——去除其高磷含量，释放其全部炼钢潜力。\n\n几十年来，法国科学家与工程师一直在努力攻克这一难题，却因战争与洛林的丧失而中断。如今，熔炉轰鸣——却在另一面旗帜之下。"
 cr_minette_ores_events.11.flavour:0 "丘陵记得谁最先梦想地底之物。但它们不选择谁来挖掘。"
 cr_minette_ores_events.11.a:0 "我们不会忘记。"


 cr_minette_ores_events.20.t:0 "矿床延伸"
 cr_minette_ores_events.20.desc_no_tech:0 "隆维地区最近的地质勘测揭示了米内特矿带令人震惊的延伸范围。此前人们认为该矿带仅限于蒂永维尔盆地，如今看来其向西延伸得远超预期。\n\n新发现的矿藏规模巨大——可能与东部已知矿藏不相上下。但热情被一个熟悉的障碍所抑制：矿石仍含有高磷，因此在当前技术下仍不适合炼钢生产。"
 cr_minette_ores_events.20.desc_tech_discovered:0 "隆维附近的新地质勘测颠覆了长期以来关于米内特铁矿范围的假设。曾经以为矿床在蒂永维尔附近逐渐变薄，如今已被追踪到显著更远的西部。\n\n这一次，消息带来的不止是学术兴趣。随着现代冶炼方法能够处理富磷矿石，这些新测绘的矿藏已成为一项立即可用的宝贵工业资产。"
 cr_minette_ores_events.20.flavour_no_tech:0 "在科学赶上地质之前，这些西部矿床仍只是未兑现的承诺。"
 cr_minette_ores_events.20.flavour_tech_discovered:0 "实业家们已在行动。新矿井、新铁路、新财富似乎只差一个签名。"
 cr_minette_ores_events.20.a:0 "标记这些地点。未来或许会在这里挖掘。"
 cr_minette_ores_events.20.b:0 "开始准备开发新矿藏。"
 cr_minette_ores_events.20.b_tt:0 "此选项可用，因为已发现利用#italic 米内特矿石#!的方法。"

 cr_minette_ores_events.26.t:0 "脚下的铁矿"
 cr_minette_ores_events.26.desc_no_known_deposits:0 "战后[SCOPE.sState('minette_ore_state').GetName]的边界被重新划定时，[SCOPE.sCharacter('border_treaty_drawer').GetPrimaryRoleTitle][SCOPE.sCharacter('border_treaty_drawer').GetLastName]极为小心，确保蒂永维尔附近的巨量米内特矿床完全落入[SCOPE.sCountry('minette_ore_state_owner').GetAdjectiveNoFlag]控制之下。这条线并非偶然——它是地质决定的。\n\n但地质学家们最近的低语表明，富铁地层在新边界处可能并未如此整齐地终止。初步勘测暗示，相同的矿层可能向西延伸，潜入[ROOT.GetCountry.GetAdjectiveNoFormatting]的土壤之下。这一可能性值得更深入的调查。"
 cr_minette_ores_events.26.desc_known_deposits:0 "战后，[SCOPE.sCharacter('border_treaty_drawer').GetPrimaryRoleTitle][SCOPE.sCharacter('border_treaty_drawer').GetName]在重新划定边界时毫不掩饰[SCOPE.sCharacter('border_treaty_drawer').GetHerHis]的意图：这条线并非基于文化或历史，而是地质考量。通过将边界西移至蒂永维尔以西，[SCOPE.sCharacter('border_treaty_drawer').GetHerHis]为[SCOPE.sCountry('minette_ore_state_owner').GetNameNoFlag]夺取了已知最丰富的米内特矿藏。\n\n然而[SCOPE.sCharacter('border_treaty_drawer').GetHerHis]无法夺走一切。新边界我们一侧已知存在矿层——虽勘探较少，但前景可期。其深度、品质与范围仍不确定，但潜力真实存在。彻底的地质勘测或能揭示与失去矿藏相当的储量。"
 cr_minette_ores_events.26.flavour:0 "[SCOPE.sCharacter('border_treaty_drawer').GetHerHis|U]拿走了[SCOPE.sCharacter('border_treaty_drawer').GetHerHis]认为能拿的一切。让我们证明[SCOPE.sCharacter('border_treaty_drawer').GetHerHis]留下的远比[SCOPE.sCharacter('border_treaty_drawer').GetHerHis]想象的多。"
 cr_minette_ores_events.26.a:0 "立即启动勘探勘测。"
 cr_minette_ores_events.26.b:0 "失去的就是失去了，不必纠结。"
