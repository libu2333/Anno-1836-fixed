 #层级：巴厘种姓制度
 balinese_caste_system:0 "巴厘种姓制度"
 balinese_caste_system_desc:0 "英国人对古老印度教阶级层级的一种简化编纂。最初是为了服务并指导拉杰的中央行政管理。一个人在层级中的地位——以及相应的权利与特权——是世袭且固定的。"
 balinese_caste_system_trigger_desc:0 "拥有#b $hindu$#! [concept_religion] 并属于#b $balinese$#! [concept_culture]"

 #阶级：英属印度种姓制度
 brahmins_bali:0 "婆罗门"
 brahmins_bali_desc:0 "传统上担任教师与祭司，婆罗门是唯一有权解释印度教宗教文本的人。因此，他们决定赋予其他种姓的神圣权利与特权。拉杰内的婆罗门常担任政治代表与中介。"
 kshatriyas_bali:0 "刹帝利"
 kshatriyas_bali_desc:0 "传统上为战士，刹帝利负责军事与领导职位。他们享有除决定神意之外的大多数权利与特权。"
 vaishyas_bali:0 "吠舍"
 vaishyas_bali_desc:0 "吠舍种姓包括商人、贸易者和地主。因此，他们被允许在上层种姓的服务中积累财富与知识。"
 shudras_bali:0 "首陀罗"
 shudras_bali_desc:0 "首陀罗是四个公认种姓中最低的阶层。他们被限制在仆役与劳工职位，受更高种姓摆布。他们无法积累财富或知识。"
 dalit_bali:0 "达利特"
 dalit_bali_desc:0 "用于描述出生于四个种姓之外者的术语。达利特无法加入层级体系。因此，他们世代被排斥与边缘化，被迫从事卑微劳作，无任何权利或特权。"

 #沙漠
 KZK_FLAVOR_TEXT:0 "无尽的红色沙海，仅偶尔被绿洲打断。它毫无价值，唯独供穿越的商队使用。"
 KRK_FLAVOR_TEXT:0 "大卡拉库姆沙漠。完全不适宜居住，也完全毫无价值。其唯一用途是供商队穿越。然而这些商队价值巨大，谁控制贸易城市，谁就控制商队……"
 NFD_FLAVOR_TEXT:0 "安-纳富德与叙利亚沙漠构成阿拉伯北部的天然边界。几乎无人居住，也几乎不适宜居住，至今无人费心将其据为己有。"
 RUB_FLAVOR_TEXT:0 "大鲁卜哈利沙漠将阿拉伯与印度洋及其沿岸国家隔开。几乎无人居住，也几乎不适宜居住，至今无人费心声称拥有它。"

 #其他
 JLN_FLAVOR_TEXT:0 "曾经，梅克·尼姆尔作为舍迪之王统治苏丹广大地区，但一切在那命运的一天改变了——他遇到了穆罕默德·阿里之子伊斯梅尔：伊斯梅尔对他施以严重侮辱，梅克·尼姆尔以复仇回应：在当晚伊斯梅尔愚蠢地决定扎营的房屋放火焚烧。作为回应，穆罕默德·阿里对儿子被杀的反应毁灭性：命令德夫特达尔对梅克·尼姆尔的首都舍迪施加非人暴行，然后将其焚毁。\n\n失去权力中心，梅克·尼姆尔及其残部被迫流亡至埃塞俄比亚边境，如今靠劫掠埃及哨所苟活。梅克·尼姆尔会接受这一命运，还是能策划凯旋重返舍迪，将埃及人逐出苏丹？"

 ADA_FLAVOR_TEXT:0 "氏族长老决定派阿达马·bli·阿尔多·哈萨纳西行至索科托探查谢胡·乌斯曼意图，这一决定被证明是命运攸关的。他作为使者出发，却以乌斯曼选定之人归来。被赋予将伊斯兰带给福姆比纳不信者并等待据说从东方而来的马赫迪的神圣使命。\n\n那已是近三十年前，马赫迪仍未现身。阿达马会活着见到他的崛起，还是他的使命终将徒劳？"

 SSS_FLAVOR_TEXT:0 "几个世纪以来，摩洛哥苏丹宣称从大西洋到撒哈拉的权威——但他们的命令从未远达城市城墙之外。马赫赞无法触及的比拉德·西巴（“叛乱之地”），部落虽在祈祷中承认苏丹，实际上自行统治。他们仅由信仰与习俗联合，激烈捍卫自由，抵制税收、法律与王权的扩张。苏丹的命令最终会延伸至这片野性腹地——还是山脉与沙漠仍将属于自由之人？"

 FZN_FLAVOR_TEXT:0 "利比亚沙漠深处是费赞，一片绿洲与流沙之地，由跨撒哈拉贸易命脉维系。从穆尔祖克出发，满载盐、奴隶与黄金的商队北至的黎波里，南至博尔努，致富控制路线之人。然而费赞的力量建立在脆弱基础之上——其财富依赖遥远市场，其统治者同时受奥斯曼与地方势力制约。随着旧贸易路线衰退与沿海新帝国崛起，费赞会作为沙漠心脏延续——还是被其沙海埋葬？"

