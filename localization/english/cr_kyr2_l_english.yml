 cr_kyr2_events.1.t:0 "The Baatyr's Banner"
 cr_kyr2_events.1.d:0 "No rider in Eastern Burut is better known than [SCOPE.sCharacter('tailak_baatyr_scope').GetFullName]. His following grows with every raid repelled and every feud settled at the edge of the pasture. To some elders he is the shield of the people; to others, a warrior whose name may one day outweigh the khan's own.\n\nThe Baatyr asks that the court decide how closely his banner is to stand beside the throne."
 cr_kyr2_events.1.f:0 "A khan may inherit a title, but a Baatyr earns his following one ride at a time."
 cr_kyr2_events.1.a:0 "Let his banner stand beside ours."
 cr_kyr2_events.1.b:0 "The elders must remain the first voice of the clans."
 cr_kyr2_events.1.c:0 "Let him speak with the Qing frontier officials."

 cr_kyr2_events.2.t:0 "The Baatyr Challenged"
 cr_kyr2_events.2.d:0 "A quarrel over winter pasture has become a test of authority. Armed riders have gathered around the disputing clans, and each side now claims to speak for the old custom. [SCOPE.sCharacter('tailak_baatyr_scope').GetFullName] offers to settle the matter himself, but his intervention would make him indispensable to the very clans whose obedience the khan seeks."
 cr_kyr2_events.2.f:0 "In the high country, every judgment is remembered longer than the snow."
 cr_kyr2_events.2.a:0 "Let the Baatyr impose peace."
 cr_kyr2_events.2.b:0 "Summon the elders before blood is spilled."
 cr_kyr2_events.2.c:0 "Ask Kokand to arbitrate."

 cr_kyr2_events.3.t:0 "The Price of Blood"
 cr_kyr2_events.3.d:0 "An old killing has been answered by a new one. The families involved demand compensation, but their allies demand honor, and the dispute has begun to divide camps that once wintered together. The court must decide whether to buy peace, let the feud run its course, or invite outside judgment."
 cr_kyr2_events.3.f:0 "A debt of blood is seldom paid in a single season."
 cr_kyr2_events.3.a:0 "Pay the blood price and bind the settlement with an oath."
 cr_kyr2_events.3.b:0 "Let each clan answer for itself."
 cr_kyr2_events.3.c:0 "Place the matter before Kokand's judge."

 cr_kyr2_events.4.t:0 "Envoys from Kokand"
 cr_kyr2_events.4.d:0 "Kokandi envoys have arrived with robes, coin, and a reminder that Eastern Burut remains under the Khanate's protection. Their gifts are generous, but their words are measured: tribute must be timely, the mountain roads must remain open, and no other court should be allowed to claim the clans' allegiance."
 cr_kyr2_events.4.f:0 "A gift from a powerful neighbor is never without a ledger."
 cr_kyr2_events.4.a:0 "Receive the gifts and renew our assurances."
 cr_kyr2_events.4.b:0 "Accept the courtesy, but keep our promises narrow."
 cr_kyr2_events.4.c:0 "Send word of this embassy to Ili."

 cr_kyr2_events.5.t:0 "Envoys from Ili"
 cr_kyr2_events.5.d:0 "An embassy from the Qing frontier has crossed the passes bearing silk, tea, and letters invoking the older relationship between the imperial court and the Kyrgyz clans. The envoys promise recognition and protection, but their records also speak of tribute, registers, and the authority of distant officials."
 cr_kyr2_events.5.f:0 "Beyond the mountains lies another court, and another ledger."
 cr_kyr2_events.5.a:0 "Renew the old frontier allegiance."
 cr_kyr2_events.5.b:0 "Receive them as guests, not masters."
 cr_kyr2_events.5.c:0 "Let Kokand know where we stand."

 cr_kyr2_events.6.t:0 "A Kurultai of One Mind"
 cr_kyr2_events.6.d:0 "The leading clans have accepted a common settlement. Pastures are apportioned, blood prices are paid, and the khan's envoys may now travel without every valley demanding a separate bargain. Eastern Burut remains poor in roads and rich in rival memories, but its people have found a measure of common purpose."
 cr_kyr2_events.6.f:0 "The white felt has been raised, and the clans have not turned away."
 cr_kyr2_events.6.a:0 "May this concord endure."

 cr_kyr2_events.7.t:0 "The Tents Draw Apart"
 cr_kyr2_events.7.d:0 "The old settlements have failed. Camps move without notice, riders travel armed, and every clan now weighs its own safety above the commands of the court. Foreign envoys find willing listeners in every valley, while the khan's word carries no farther than the men who ride beneath his banner."
 cr_kyr2_events.7.f:0 "A people divided has many spokesmen and no common road."
 cr_kyr2_events.7.a:0 "We must endure the season of division."

 cr_kyr2_events.8.t:0 "Under Kokand's Protection"
 cr_kyr2_events.8.d:0 "The balance has settled toward Kokand. Tribute, envoys, and shared interests now bind Eastern Burut more closely to the Khanate. The mountain clans retain their customs, but the roads south and west lead increasingly through Kokandi hands."
 cr_kyr2_events.8.f:0 "Protection has its price, but the passes remain open."
 cr_kyr2_events.8.a:0 "Honor the bond."

 cr_kyr2_events.9.t:0 "The Road to the Qing Court"
 cr_kyr2_events.9.d:0 "The balance has settled toward the Qing. Eastern Burut has accepted a renewed place in the imperial tributary order, exchanging its uncertain place between greater powers for the recognition and protection of the court beyond the mountains."
 cr_kyr2_events.9.f:0 "The road to Ili is long, yet its seal reaches even the high pasture."
 cr_kyr2_events.9.a:0 "Renew the submission."

 cr_kyr2_events.10.t:0 "The Northwest Recovered"
 cr_kyr2_events.10.d:0 "The disorder beyond the Tien Shan has been answered. Whether by renewed tributary allegiance or direct administration, Eastern Burut now stands once more within the Qing frontier order. The court may record this as a restoration of the old boundary; the people of the valleys will remember the riders and envoys who made it so."
 cr_kyr2_events.10.f:0 "A frontier is held by more than maps: it is held by roads, oaths, and the memory of power."
 cr_kyr2_events.10.a:0 "Let the frontier registers be amended."

 cr_kyr2_events.11.t:0 "Markers in the Winter Pasture"
 cr_kyr2_events.11.d:0 "With the first snow, two clans dispute the boundary of a winter pasture. The old cairns lie buried beneath drifted snow, and each side invokes the word of its forefathers. If the matter is delayed, herds and armed riders alike will cross the line."
 cr_kyr2_events.11.f:0 "Pasture boundaries are drawn by memory, and memory is never quiet."
 cr_kyr2_events.11.a:0 "Gather the elders and raise new markers."
 cr_kyr2_events.11.b:0 "Let each clan hold its own ground."

 cr_kyr2_events.12.t:0 "A Caravan at the Pass"
 cr_kyr2_events.12.d:0 "A caravan laden with tea, cloth, and salt waits at the pass for safe-conduct. Kokandi merchants press the clans to honor the old arrangement, while Qing attendants offer seals and gifts. The caravan has no allegiance of its own, but mountain roads are never without masters."
 cr_kyr2_events.12.f:0 "Goods must cross the mountains, and authority always wishes to travel with them."
 cr_kyr2_events.12.a:0 "Let it pass by the old Kokandi road."
 cr_kyr2_events.12.b:0 "Clear the way under Qing seal."
 cr_kyr2_events.12.c:0 "Let local guides lead it and keep outsiders at bay."

 cr_kyr2_events.13.t:0 "A Memorial from Ili"
 cr_kyr2_events.13.d:0 "The General of Ili reports that the clans of Eastern Burut still weigh Kokand against the Qing. Some urge a generous distribution of silk and tea to renew old ties; others demand that the court restate its authority and force the clans to choose their allegiance."
 cr_kyr2_events.13.f:0 "Frontier policy is made not only beyond the walls, but in the choices of every felt tent."
 cr_kyr2_events.13.a:0 "Win them over with patient favor."
 cr_kyr2_events.13.b:0 "Restate the old order and demand a decision."