 dm_alaska_and_zdaming_reason:0 "[SCOPE.GetRootScope.GetCountry.GetName]必须推行改革，为民生与国家建设而努力。"
 dm_flavor.11.t:0 "国庆日"
 dm_flavor.11.d:0 "统一奥地利后，[SCOPE.sCountry('gbr_scope').GetName]迎来了首个国庆日。"
 dm_flavor.11.f:0 "今日，[SCOPE.sCountry('gbr_scope').GetName]诞生，举国欢庆。升旗礼、议政会与夜间庆典相继举行；人们相信，只要同心协力，新国家终将走向繁荣。"
 dm_flavor.11.a:0 "共庆立国之日。"
 dm_flavor.12.t:0 "国民教育的提高"
 dm_flavor.13.t:0 "国民健康的提高"
 dm_flavor.14.t:0 "移民潮"
 dm_flavor.12.d:0 "教育使国民获得知识与技艺，提升其谋生能力与社会竞争力。"
 dm_flavor.12.f:0 "教育培养技术人才，支撑经济发展，并助长创新与产业升级。"
 dm_flavor.12.a:0 "教育增进对不同文化、宗教与价值观的理解，巩固社会信任与秩序。"
 dm_flavor.12.g:0 "高素质国民使国家更具国际竞争力，也有助于引进资本、技术与人才。"
 dm_flavor.13.d:0 "改善国民健康可减少疾病与困苦，提升生活质量。"
 dm_flavor.13.f:0 "更好的医疗条件与健康生活方式，可使人民安享更长久的人生。"
 dm_flavor.13.a:0 "健全的公共卫生有助于减轻家庭负担，维护社会安定。"
 dm_flavor.13.e:0 "倡导合理膳食、适量运动与节制烟酒，有助于养成良好生活习惯，并推动社会的长远发展。"
 dm_flavor.14.d:0 "[SCOPE.sCountry('gbr_scope').GetName]推出吸引技术人才的政策，预计将有许多专业人士与熟练工人迁入，并为经济发展出力。"
 dm_flavor.14.f:0 "为促进经济与就业，[SCOPE.sCountry('gbr_scope').GetName]正吸引外国投资者与移民前来经营、定居，并带来资本与技艺。"
 dm_flavor.14.a:0 "随着教育体系日渐完备，[SCOPE.sCountry('gbr_scope').GetName]吸引了越来越多的国际学生前来求学；他们毕业后可能留在当地工作或继续深造。"
