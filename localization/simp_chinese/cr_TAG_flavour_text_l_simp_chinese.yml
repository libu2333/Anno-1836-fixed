l_simp_chinese:
 #沙漠
 KZK_FLAVOR_TEXT:0 "一望无际的红色沙海，只有零星绿洲打破单调。除了供商队穿行，这片土地几乎没有别的价值。"
 KRK_FLAVOR_TEXT:0 "大卡拉库姆，一片几乎无法居住、也几乎毫无产出的荒漠。它唯一的用途，是让商队从中穿过；而商队本身价值连城。谁控制了贸易城市，谁就控制了商路。"
 NFD_FLAVOR_TEXT:0 "安-内夫得沙漠与叙利亚沙漠构成阿拉伯北部的天然屏障。这里人烟稀少，甚至难以称得上适宜居住，迄今无人愿意将其据为己有。"
 RUB_FLAVOR_TEXT:0 "鲁卜哈利沙漠将阿拉伯半岛与印度洋及沿岸诸邦分隔开来。这里几乎无人居住，也几乎无法居住，至今仍没有人费心宣称拥有这片土地。"
 #其他
 JLN_FLAVOR_TEXT:0 "曾几何时，迈克·尼姆尔以舍迪国王之名统治着苏丹的大片土地。直到那一天，他遇到了穆罕默德·阿里之子伊斯梅尔。伊斯梅尔对他施以奇耻大辱，迈克·尼姆尔随即报复，放火烧毁了伊斯梅尔自作聪明选来过夜的营地。穆罕默德·阿里得知儿子被杀后，报复更为惨烈：他命令财政大臣对舍恩迪施加非人的暴行，随后将这座城市夷为平地。\n\n失去权力中心后，迈克·尼姆尔及其残部被迫退往埃塞俄比亚边境，如今只能靠袭击埃及人的前哨维生。他会甘心接受这样的命运，还是能策划一次凯旋归来，重返舍迪并将埃及人赶出苏丹？"
 ADA_FLAVOR_TEXT:0 "部族长老派阿达马·ɓii·阿尔多·哈萨纳向西前往索科托，探查舍胡·奥斯曼的意图；这个决定后来证明改变了他的命运。他出发时只是使者，归来时却成了奥斯曼选定的人。奥斯曼把一项神圣使命交给他：将伊斯兰教带给丰巴纳的异教徒，并等待据说会从东方降临的马赫迪。\n\n那已经是将近三十年前的事了，马赫迪仍未现身。阿达马会活着等到他的崛起吗？还是说，这场使命终究会被证明徒劳无功？"
 SSS_FLAVOR_TEXT:0 "几个世纪以来，摩洛哥苏丹宣称自己的权威从大西洋延伸到撒哈拉；然而，城墙之外很少有人真正听从他的命令。在马赫赞的控制范围之外，是比拉德·阿斯-西巴，即“异议之地”：各部族在祈祷时承认苏丹，实际生活中却自行治理。这些部族只因信仰与习俗相连，并且顽强捍卫自己的自由，拒绝税收、法律以及王权不断逼近的力量。苏丹的政令最终能否越过荒野，深入山地与沙漠？还是说，这些地方仍将属于自由之民？"
 FZN_FLAVOR_TEXT:0 "利比亚沙漠深处坐落着费赞，一片由绿洲与流沙组成、靠跨撒哈拉贸易维系生机的土地。满载盐、奴隶与黄金的商队从穆尔祖克出发，向北前往的黎波里，向南抵达博尔努；掌控商路的人，也因此积累财富。然而，费赞的繁荣根基并不牢固：它依赖遥远的市场，统治者还必须同时应付奥斯曼帝国与地方势力。随着旧商路日渐衰落、沿海新帝国接连崛起，费赞会继续作为沙漠的心脏存在，还是最终被黄沙埋没？"
