 dlc_anno1836_desc:"When the bell of history tolls in 1836, the world has not yet been defined by straight and rigid national borders. Mountains, rivers, ethnic groups, and actual control are the true forces that delineate boundaries. Anno 1836 seeks to return to this historical starting point by redrawing the map and adjusting regional structures, bringing the game world closer to the real and complex political and cultural landscape of the early 19th century. Many regions have been redivided and decentralized, freeing ethnic groups and powers from the constraints of colonial borders. As nations expand, new orders and borders will gradually emerge, and imperial territories will be constantly reshaped by your decisions. The world remains in flux, and the course of history awaits its new authors."
