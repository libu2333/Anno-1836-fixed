l_simp_chinese:

 ### 事件描述 ###
 cr_europe_events.1.t:0 "科学之声"
 cr_europe_events.1.d2:0 "#bold #variable [SCOPE.sState('sound_of_science_state').GetFarmHubName]-[SCOPE.sState('sound_of_science_state').GetCityHubName]#!#! 铁路见证了一场富有想象力的实验，用以验证关于恒星运动的理论。"
 cr_europe_events.1.d:0 "[SCOPE.sState('sound_of_science_state').GetCityHubName]大学的教授们证明了#variable Christian Doppler#!的理论：当声源或光源、或观察者处于运动状态时，所观察到的声音或光的频率会发生变化。"
 cr_europe_events.1.f:0 "一列疾驰的火车、一支高声吹奏的铜号以及十几位拥有完美音高的耳朵，在#bold #variable [SCOPE.sState('sound_of_science_state').GetFarmHubName]-[SCOPE.sState('sound_of_science_state').GetCityHubName]#!#! 铁路上共同完成了一场富有想象力的实验。赌注是什么？多普勒关于恒星运动的理论。因为如果波的频率随物体速度变化的理论正确，那么当火车疾驰而过时，铜号发出的刺耳高音应该会出现明显的音调下降。\n\n这些观众因能分辨出八分之一音高的差异而被选中，他们仔细记录火车呼啸而过的观察结果。经过三天的数据整理，结果出来了……一致显示：音调下降！"
 cr_europe_events.1.a:0 "观察与实验是知识的基础。"
 cr_europe_events.1.b:0 "人们无法预知一个新真理会以多么意想不到的方式找到用武之地。"

 cr_europe_events.5.t:0 "英国夫人"
 cr_europe_events.5.desc:0 "在黎巴嫩的群山中住着一位隐居的英国夫人——冒险家、考古学家，同时也是难民、弃儿与罪犯们的女主人——她如今深陷债务。当地放债人要求我们出面干预，迫使她偿还欠款。"
 cr_europe_events.5.desc_2:0 "在黎巴嫩的群山中住着一位隐居的英国夫人，她以英国旗帜提供的保护吸引了大量难民、弃儿与罪犯，将自己确立为他们的女主人。\n\n然而，她众多的冒险行为开始反噬自身：从对阿拉维派的惩罚远征，到在阿什凯隆失败的考古发掘，她欠下的债务远远超出她的偿还能力。\n\n如今，当地放债人与权势人物要求我们出面干预，以某种方式迫使她清偿债务。"
 cr_europe_events.5.f:0 "至于我的债务，并非如你所想的那样每年只需支付25%，而是50%乃至95%；有一次我遭受的损失更大。他们在这里以28皮阿斯特的金币计给我45皮阿斯特的价值，我花掉时是28皮阿斯特，却要在贝鲁特以45皮阿斯特的汇率偿还……你自己算算吧！——#italic 赫丝特夫人致其私人医生的信#!"
 cr_europe_events.5.a:0 "提醒放债人们，#italic 高利贷（riba）#! 是 #italic 哈拉姆（禁忌）#! 的……"
 cr_europe_events.5.a_tt:0 "#italic 穆斯林（1598）记载贾比尔说：真主的使者（愿真主赐他祝福与平安）诅咒吃高利贷者、付高利贷者、记录高利贷者以及见证高利贷的两人，并说：他们都是一样的。#!"
 cr_europe_events.5.b:0 "或许我们可以请英国人替我们出面干预"
 cr_europe_events.5.b_tt:0 "#italic 根据投降条约，所有居住在黎凡特的英国臣民完全受其本国政府管辖，所有诉讼均提交其领事法庭，由领事裁决。严格来说，根据英国法律，我们无权裁决此类事务，正如我们无权强迫本国臣民出庭英国领事一样。#!"
 cr_europe_events.5.c:0 "就没有人能帮我们除掉这个不安分的女人吗？"
 cr_europe_events.5.c_tt:0 "#italic 她极具讽刺天赋，她的讽刺往往令人胆寒。她的许多信件都‘点缀’着尖酸刻薄的批评。她的怪癖无穷无尽。她对人和动物都有许多古怪的品性考验，当然也常常被两者欺骗，令她付出代价。#!"
 cr_europe_events.5.d:0 "为了友谊，我们应当替她清偿债务"
 cr_europe_events.5.d_tt:0 "在大多数话题上，她不仅神智清醒，而且见多识广、极其精明。她拥有非凡的谈话天赋，对她愿意示好的人极具魅力。"

 cr_europe_events.6.t:0 "沙漠女王"
 cr_europe_events.6.desc:0 "赫丝特·斯坦霍普夫人乃尊贵的#variable 小威廉·皮特#!之侄；她在黎凡特的种种行止，已使[ROOT.GetCountry.GetRuler.GetHerHis|U]陛下政府颇为难堪。\n\n赫丝特夫人长期拮据，她的[SCOPE.sCountry('LadyHestersLiege').GetAdjectiveNoFlag]债主遂向[SCOPE.sCountry('LadyHestersLiege').GetRuler.GetPrimaryRoleTitle]陈请，要求清偿其数额可观的债务。依照投降条约，[SCOPE.sCountry('LadyHestersLiege').GetRuler.GetSheHe]已将此案交由我方驻[SCOPE.sState('LadyHestersHome').GetCityHubName]领事裁断。"
 cr_europe_events.6.desc_2:0 "多年以前，#bold #variable 赫丝特·斯坦霍普夫人#!#!——#bold #variable 小威廉·皮特#!#!的侄女——离开英国，赴黎凡特追寻命运，抑或只是躲避上流社会的闲言碎语。\n\n她长期拮据，其种种行止已使[ROOT.GetCountry.GetRuler.GetHerHis|U]陛下政府颇为难堪；赫丝特夫人的[SCOPE.sCountry('LadyHestersLiege').GetAdjectiveNoFlag]债主遂向[SCOPE.sCountry('LadyHestersLiege').GetRuler.GetPrimaryRoleTitle]陈请，要求清偿其数额可观的债务。依照投降条约，[SCOPE.sCountry('LadyHestersLiege').GetRuler.GetSheHe]已将此案交由我方驻[SCOPE.sState('LadyHestersHome').GetCityHubName]领事裁断。"
 cr_europe_events.6.f:0 "在马耳他，有人称她将成为犹太人的救世主；在君士坦丁堡，她直视苏丹；在开罗，她与阿里帕夏平起平坐；她不戴面纱，策马进入大马士革。帕尔米拉人称她为#italic 梅莱基#!，意为女王；在黎巴嫩，她又与神秘的德鲁兹人结交。因一名法国上校被杀，阿拉维派曾在她手中付出惨重代价；及至战事来临，她却又庇护所有向她求援之人。如今她在朱恩以半疯的女先知自居，深居不出，不越城堡高墙一步，只在夜间与人交谈。"
 cr_europe_events.6.a:0 "为了她已故舅舅的情分，我们来支付"
 cr_europe_events.6.a_tt:0 "#italic 她在阿拉伯部落以及所有遭受易卜拉欣军队蹂躏、或为奥斯曼帝国摇摇欲坠而叹息的人中影响巨大。她比任何人都更有能力确保英国获得那些国家的好感，而当——这一天必将很快到来——我们必须为奥斯曼的独立与俄国对抗时，这些善意对我们的利益至关重要。#! ——威廉·内皮尔爵士"
 cr_europe_events.6.b:0 "不幸的是，夫人得自己面对"
 cr_europe_events.6.b_tt:0 "#italic 这些债务中有许多是因为愚蠢的原因欠下的——例如她给了希伯伦的拉比利维7000皮阿斯特，只因他陪她彻夜长谈弥赛亚等等。#! ——沃尔夫医生致帕默斯顿勋爵的报告"

 cr_europe_events.7.t:0 "英国夫人"
 cr_europe_events.7.desc:0 "[SCOPE.sState('LadyHestersHome').GetCityHubName]的英国领事已明确表示，[SCOPE.sCountry('LadyHesterMotherland').GetRuler.GetHerHis|U]陛下政府拒绝代#variable 赫丝特·斯坦霍普夫人#!清偿债务。\n\n事实上，他已否认一切[SCOPE.sCountry('LadyHesterMotherland').GetAdjectiveNoFlag]方面的介入，将此事完全交由我方处置。"
 cr_europe_events.7.f:0 "当她终于拿到那封信时，赫丝特夫人相信自己所有的麻烦都结束了。她从未一刻怀疑过答案会是什么。不再等待与守望；不再有希望落空的低沉痛苦；不再有债务与催债人；她胜利与解脱的时刻已经到来，她终于继承了属于她的东西。她激动得几乎要爆血管，医生真担心她会脑溢血。唉！当她打开信时，发现并非来自弗朗西斯爵士的预期答复，而是一封截然不同的信件。那是她无意中收到的致命一击。"

 cr_europe_events.8.t:0 "英国夫人"
 cr_europe_events.8.desc:0 "[SCOPE.sState('LadyHestersHome').GetCityHubName]的英国领事已明确表示，[SCOPE.sCountry('LadyHesterMotherland').GetRuler.GetHerHis|U]陛下政府将代#variable 赫丝特·斯坦霍普夫人#!清偿债务。"
 cr_europe_events.8.f:0 "如果X的故事属实，我的债务总额近1万皮阿斯特即将被清偿，那么我将继续进行崇高而哲学的发现，沉浸于深奥的抽象研究；尽管我的体力已衰，不能像过去那样日夜工作。在那种情况下，我需要一名泥瓦匠、木匠、犁田人、园丁、马夫、医生等等，因此我必须获得协助。年收入定为4000，外加1000给像你这样的人；另需5000现金用于食物、建筑、牲畜、手头资金等，以便我能从头开始。——#italic 赫丝特夫人致其私人医生的信#!"
 cr_europe_events.8.a:0 "我们可以认为此事已了结"

