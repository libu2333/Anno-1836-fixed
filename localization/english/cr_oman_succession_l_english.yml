l_english:
 dyn_c_oman_and_zanzibar_sultanate:0 "Sultanate of Oman and Zanzibar"
 dyn_c_oman_and_zanzibar_sultanate_adj:0 "Omani-Zanzibari"

 je_splitting_oman:0 "The Busaidi Succession"
 je_splitting_oman_reason:0 "Since Sultan Said bin Sultan moved his court to Zanzibar in 1834, his dominions have been governed from opposite shores of the Indian Ocean. His sons, [ROOT.GetCountry.GetHeir.GetFullName] and Majid bin Said, now gather clients in Muscat and Zanzibar alike. Before the Sultan dies, one court may yet secure the whole realm. Otherwise, the sea will divide the Busaidi inheritance."
 cr_oman_succession_bar_name:0 "The Busaidi Succession"
 cr_oman_succession_bar_desc:0 "Thuwaini Faction: #v [GetPlayer.MakeScope.ScriptValue('cr_oman_suwaini_faction_display')|0]#!"
 cr_oman_succession_bar_second_desc:0 "Majid Faction: #v [GetPlayer.MakeScope.ScriptValue('cr_oman_majid_faction_display')|0]#!"
 cr_oman_succession_drift_tt:0 "The balance of the two courts"
 cr_oman_succession_settled_header:0 "The succession will be settled if:"
 cr_oman_suwaini_victory_tt:0 "The #bold Thuwaini Faction#! reaches #bold 100#!"
 cr_oman_majid_victory_tt:0 "The #bold Majid Faction#! reaches #bold 100#!"
 cr_oman_succession_outcome_header:0 "The Busaidi succession is settled"
 cr_oman_sultan_death_header:0 "The realm will divide if:"
 cr_oman_said_death_tt:0 "Sultan Said bin Sultan dies"
 cr_oman_realm_divides_header:0 "The Omani realm divides"

 cr_oman.1.t:0 "Two Courts, One Sultan"
 cr_oman.1.d:0 "The Sultan's court now looks across the Indian Ocean from Zanzibar, while Muscat remains the seat of the Arabian dominions. Prince Thuwaini has gathered the confidence of the Omani notables; Prince Majid, still young, is surrounded by the merchants and officials of Zanzibar. Sultan Said must keep the peace between courts that increasingly govern as rivals."
 cr_oman.1.f:0 "The sea joins lands as readily as it separates them, but it is a long journey from Zanzibar to Muscat."
 cr_oman.1.a:0 "The House of Busaid must remain whole."

 cr_oman.2.t:0 "Thuwaini's Settlement"
 cr_oman.2.d:0 "The Omani notables have prevailed over the ambitions of the Zanzibar court. Thuwaini's adherents have made Muscat the undisputed center of government, and the Sultanate's capital returns to Oman. The Busaidi realm remains united, but it will no longer be ruled as an island court with an Arabian appendage."
 cr_oman.2.f:0 "From Muscat, the Sultan may look seaward without losing sight of Oman."
 cr_oman.2.a:0 "The Arabian heartland endures."

 cr_oman.3.t:0 "Majid's Settlement"
 cr_oman.3.d:0 "The merchants, officials, and seafaring interests of Zanzibar have carried the day. Majid's court now commands the confidence of the Sultanate, and the Busaidi realm remains united under a government whose gaze is fixed upon the western Indian Ocean."
 cr_oman.3.f:0 "Zanzibar is no distant possession; it is the court from which the realm is governed."
 cr_oman.3.a:0 "The monsoon carries our fortunes."

 cr_oman.4.t:0 "Petitions from Muscat"
 cr_oman.4.d:0 "Notables from Muscat petition Sultan Said to restore the old balance of the realm. They praise Thuwaini's familiarity with Omani tribes and warn that an island court cannot command the interior. Zanzibar's envoys answer that the Sultanate's wealth now flows through the African coast."
 cr_oman.4.f:0 "A ruler who governs two shores must hear petitions carried by two winds."
 cr_oman.4.a:0 "Let Thuwaini speak for Oman."
 cr_oman.4.b:0 "Zanzibar's interests cannot be neglected."
 cr_oman.4.c:0 "Purchase a temporary compromise."

 cr_oman.5.t:0 "The Zanzibar Customs"
 cr_oman.5.d:0 "Customs revenue from Zanzibar has grown into a principal support of the Sultan's treasury. Majid's adherents demand that the island's merchants retain a greater voice in its management. Thuwaini's supporters insist that the revenue belongs to the whole realm, not to a single harbor."
 cr_oman.5.f:0 "Every clove and ivory tusk that passes the customs house carries a political argument with it."
 cr_oman.5.a:0 "Entrust the customs to Majid's men."
 cr_oman.5.b:0 "Remit a greater share to Muscat."
 cr_oman.5.c:0 "Reserve the proceeds for the Sultan's treasury."

 cr_oman.6.t:0 "Where Shall the Fleet Winter?"
 cr_oman.6.d:0 "The naval commanders request instructions for the Sultanate's vessels. Zanzibar offers deep anchorage and proximity to the African trade; Muscat offers a secure base close to the Arabian heartland. Each court presents its case as a matter of strategy, though neither disguises the question of influence."
 cr_oman.6.f:0 "A fleet is more than ships: it is the reach of the court that provisions it."
 cr_oman.6.a:0 "Station the fleet at Zanzibar."
 cr_oman.6.b:0 "Recall the fleet to Muscat."
 cr_oman.6.c:0 "Divide the fleet between both shores."

 cr_oman.7.t:0 "The Council of Wazirs"
 cr_oman.7.d:0 "The Sultan's ministers have divided into competing circles. Some urge greater deference to the Omani notables behind Thuwaini; others argue that Zanzibar's merchants and administrators are indispensable to the realm. A third course would preserve the Sultan's personal authority, at the price of alienating both camps."
 cr_oman.7.f:0 "At court, silence is often taken for consent, and consent for weakness."
 cr_oman.7.a:0 "Elevate the Omani councillors."
 cr_oman.7.b:0 "Strengthen Zanzibar's ministers."
 cr_oman.7.c:0 "Dismiss both delegations."

 cr_oman.8.t:0 "The Clove Caravan"
 cr_oman.8.d:0 "A convoy laden with cloves, ivory, and imported textiles has arrived from Zanzibar. Majid's adherents ask that its profits be invested in the African ports; Thuwaini's men demand that the caravan's wealth be sent to Oman, where the tribes and fortresses still require maintenance."
 cr_oman.8.f:0 "The wealth of the sea reaches Oman only after it has already chosen a shore."
 cr_oman.8.a:0 "Invest in Zanzibar's entrepot."
 cr_oman.8.b:0 "Send the profits to Oman."
 cr_oman.8.c:0 "Claim the revenue for the crown."

cr_oman.9.t:0 "The Mombasa Appointment"
 cr_oman.9.d:0 "The office governing Mombasa has fallen vacant. Muscat's notables urge that its holder be answerable to the Arabian court; Zanzibar's merchants reply that the coast can only be governed by men acquainted with its commerce and its people. The Sultan may entrust the post to either circle, or keep it under a costly royal supervision."
 cr_oman.9.f:0 "On the Swahili coast, an appointment is never merely an appointment."
 cr_oman.9.a:0 "Make the governor answerable to Muscat."
 cr_oman.9.b:0 "Let Zanzibar name the governor."
 cr_oman.9.c:0 "Maintain a royal inspector at our expense."

 cr_oman.10.t:0 "Letters from the Interior"
 cr_oman.10.d:0 "Letters from the interior carry grievances over customs, tribal obligations, and the conduct of local officials. Thuwaini's adherents argue that only a prince familiar with Oman can answer them. Majid's circle counsels that the coastal court must not yield every question to the interior. A third path would send the Sultan's own envoys, though it would burden the treasury."
 cr_oman.10.f:0 "A letter that crosses the desert carries more than its seal."
 cr_oman.10.a:0 "Let Thuwaini's men answer the petitions."
 cr_oman.10.b:0 "Answer from the Zanzibar court."
 cr_oman.10.c:0 "Dispatch the Sultan's own envoys."

 cr_oman.11.t:0 "The Monsoon Dispatches"
 cr_oman.11.d:0 "The monsoon has delayed ships between Muscat and Zanzibar. Orders arrive late, accounts arrive incomplete, and each court insists that the other has withheld what it needs. Majid's followers call for wider discretion in Zanzibar; Thuwaini's men demand that the Arabian provinces be governed without waiting upon the sea. The Sultan may instead pay for a separate courier network."
 cr_oman.11.f:0 "When the wind turns, authority must wait upon the water."
 cr_oman.11.a:0 "Grant Zanzibar wider discretion."
 cr_oman.11.b:0 "Let Muscat act without delay."
 cr_oman.11.c:0 "Fund a royal courier service."
