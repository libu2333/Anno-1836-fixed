 concept_tribal_confederation:0 "部落联盟"
 concept_tribal_confederation_desc:0 "由多个松散政权部落组成的政治联盟；成员承认一个主导部落，同时保留各自的政权。"
 subject_type_tribal_confederation:0 "@tribal_confederation!$subject_type_tribal_confederation_no_icon$"
 subject_type_tribal_confederation_no_icon:0 "$concept_tribal_confederation$"
 subject_type_tribal_confederation_desc:0 "$concept_tribal_confederation_desc$"
 tribal_confederation:0 "部落联盟"
 tribal_confederation_action_name:0 "[concept_tribal_confederation]"
 tribal_confederation_action_propose_name:0 "邀请加入[concept_tribal_confederation]"
 tribal_confederation_action_break_name:0 "解散联盟"
 tribal_confederation_action_ask_to_break_name:0 "要求退出联盟"
 tribal_confederation_desc:0 "在两个松散政权[Concept('concept_country', '$concept_countries$')]之间建立[concept_tribal_confederation][concept_subject_type]关系。"
 tribal_confederation_pact_desc:0 "[SCOPE.GetRootScope.GetDiplomaticPact.GetSecondCountry.GetName]是由[SCOPE.GetRootScope.GetDiplomaticPact.GetFirstCountry.GetName]主导的[concept_tribal_confederation]成员。"
 tribal_confederation_action_notification_name:0 "$tribal_confederation_proposal_notification_name$"
 tribal_confederation_action_notification_desc:0 "$tribal_confederation_proposal_notification_desc$"
 tribal_confederation_proposal_notification_name:0 "部落联盟邀请"
 tribal_confederation_proposal_notification_desc:0 "[INITIATOR_COUNTRY.GetName]邀请我们加入其[concept_tribal_confederation]。"
 tribal_confederation_proposal_notification_effects_desc:0 "若接受，我们将加入他们的联盟。"
 tribal_confederation_proposal_accepted_name:0 "部落联盟邀请被接受"
 tribal_confederation_proposal_accepted_desc:0 "[TARGET_COUNTRY.GetName]接受了加入[concept_tribal_confederation]的邀请。"
 tribal_confederation_proposal_declined_name:0 "部落联盟邀请被拒绝"
 tribal_confederation_proposal_declined_desc:0 "[TARGET_COUNTRY.GetName]拒绝了加入[concept_tribal_confederation]的邀请。"
 tribal_confederation_action_notification_break_name:0 "部落联盟已解散"
 tribal_confederation_action_notification_break_desc:0 "[INITIATOR_COUNTRY.GetName]终止了我们的[concept_tribal_confederation]成员资格。我们再次独立。"
 tribal_confederation_proposal_notification_break_name:0 "退出部落联盟请求"
 tribal_confederation_proposal_notification_break_desc:0 "[INITIATOR_COUNTRY.GetName]要求我们终止其[concept_tribal_confederation]成员资格。"
 tribal_confederation_proposal_notification_break_effects_desc:0 "若接受，他们将完全独立。"
 tribal_confederation_proposal_break_accepted_name:0 "部落联盟成员资格已终止"
 tribal_confederation_proposal_break_accepted_desc:0 "[TARGET_COUNTRY.GetName]接受了终止我们[concept_tribal_confederation]成员资格的请求。我们再次独立。"
 tribal_confederation_proposal_break_declined_name:0 "退出部落联盟请求被拒绝"
 tribal_confederation_proposal_break_declined_desc:0 "[TARGET_COUNTRY.GetName]拒绝终止我们的[concept_tribal_confederation]成员资格。"
 tribal_confederation_proposal_third_party_accepted_name:0 "国家加入部落联盟"
 tribal_confederation_proposal_third_party_accepted_desc:0 "[TARGET_COUNTRY.GetName]同意加入由[INITIATOR_COUNTRY.GetName]主导的[concept_tribal_confederation]。"
 tribal_confederation_proposal_third_party_declined_name:0 "部落联盟邀请被拒绝"
 tribal_confederation_proposal_third_party_declined_desc:0 "[TARGET_COUNTRY.GetName]拒绝加入由[INITIATOR_COUNTRY.GetName]主导的[concept_tribal_confederation]。"
 tribal_confederation_action_third_party_notification_break_name:0 "部落联盟成员资格已终止"
