je_earn_recognition_reason:0 "#bold 进度条#!会依条件推进或倒退；当其达到#bold 250#!时，[SCOPE.GetRootScope.GetCountry.GetName]将成为[concept_recognized_power]。\n\n长期以来，[SCOPE.GetRootScope.GetCountry.GetNameNoFormatting]一直遭所谓文明国家拒绝给予应有的外交承认，使我们易受其攻击，也难以充分行使本国主权。\n\n我们应尽力扭转此局面，争取作为受尊重的平等一员入席。"
je_earn_recognition_advance:0 "? 对[concept_major_power]成功执行[concept_war_goal]\n? [Concept('concept_gdp_per_capita','$concept_gdp_per_capita_short$')]排名前50（进入前25可显著推进）\n? [concept_sol]生活水平排名前50（进入前25可显著推进）\n? [concept_literacy]达到60%（达到80%可显著推进）\n? 拥有[Concept('concept_votes','$concept_voting_rights$')]\n? 成功执行#bold 建立大使馆#![concept_diplomatic_action]\n? 1900年前完成#green 第一次工业革命#!\n? 1900年后完成#green 第二次工业革命#!\n? 掌握#bold 世界力量均势#![concept_technology]\n? 掌握#bold 全球化#![concept_technology]"
je_earn_recognition_deplete:0 "? 有[concept_war_goal]对我方成功执行\n? [Concept('concept_gdp_per_capita','$concept_gdp_per_capita_short$')]排名低于前75\n? [concept_sol]生活水平排名低于前75\n? [concept_literacy]低于40%\n? 未废除[concept_slavery]\n? 保有[GetLawType('law_serfdom').GetName]\n? 保有[GetLawType('law_traditionalism').GetName]\n? 保有[GetLawType('law_outlawed_dissent').GetName]"
