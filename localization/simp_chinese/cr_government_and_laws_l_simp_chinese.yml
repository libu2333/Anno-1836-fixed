 #利益集团
 ig_mesafint:0 "梅萨芬特"
 ig_mekwanint:0 "梅克瓦宁特"
 ig_balabat:0 "巴拉巴特"
 ig_negadras:0 "内加德拉斯"
 ig_gebbars:0 "格巴尔"

 ig_ulama:0 "乌里玛"
 ig_ulema_desc:0 "逊尼派是伊斯兰教最大的宗派。信徒认为穆罕默德之后由其叔父阿布·伯克尔继任伊斯兰哈里发，而非什叶派所认为的其女婿阿里才是合法继承人。"
 ig_knil:0 "皇家荷属印度军"
 ig_knil_desc:0 "皇家荷属印度军（KNIL）是荷兰在东印度的武装力量。"
 ig_regents:0 "摄政"
 ig_regents_desc:0 "博帕蒂（摄政）是本土统治阶级，因其职位与血统的威望而对本土人口拥有巨大影响力。"
 ig_planters:0 "种植园主"
 ig_planters_desc:0 "种植园主是勤劳的本土人民，他们最乐于耕种自己的小块特加尔田或霍马田，但如今却在殖民种植园劳作。"
 ig_local_middlemen:0 "本地中间人"
 ig_local_middlemen_desc:0 "主要是华人的本土人士，他们构成了殖民统治与当地民众之间的中介。"

 #利益集团特性
 ig_trait_lax_enforcers:0 "松懈的执行者"
 ig_trait_lax_enforcers_desc:0 "作为殖民统治的关键执行力量，KNIL的士兵与军官近来对职责显得颇为懈怠。"
 ig_trait_foward_presence:0 "前沿存在"
 ig_trait_foward_presence_desc:0 "KNIL在本土社会中无所不在的存在，本身便是殖民统治的有力宣示。"
 ig_trait_marechaussee_te_voet:0 "步兵宪兵"
 ig_trait_marechaussee_te_voet_desc:0 "哪里生乱，步兵宪兵一到，乱子便难以久持。\n\n这支训练有素、高度机动的反叛乱部队深入丛林，进行密集巡逻，已证明极为有效。"
 ig_trait_friendly_faces:0 "友善面孔"
 ig_trait_friendly_faces_desc:0 "还有什么比借由本土民众熟悉的贵族面孔巩固统治更妥当的办法？"
 ig_trait_corvee:0 "徭役劳动"
 ig_trait_corvee_desc:0 "我辖区的道路确实需要彻底清理，你说是不是？还是你更希望我们帮你美化一下你的官邸？哦，别担心；这对我那些农奴……我是说对我自己来说不过是小事一桩。"
 ig_trait_helpful_natives:0 "乐于助人的本土人"
 ig_trait_helpful_natives_desc:0 "当然，大人，我已经传话出去，希望摄政区成为稳定与安宁的灯塔。"
 ig_trait_village_recordkeepers:0 "村庄记录员"
 ig_trait_village_recordkeepers_desc:0 "出生、死亡、婚姻、迁徙，一切都在本地神职人员的记录中。"
 ig_trait_keepers_of_the_calendar:0 "历法守护者"
 ig_trait_keepers_of_the_calendar_desc:0 "耕种、播种、收获，一切遵循自然的季节节奏，还有谁比神职人员更了解季节呢？"
 ig_trait_power_of_islam:0 "伊斯兰的力量"
 ig_trait_power_of_islam_desc:0 "谁敢违抗伊斯兰的力量？"
 ig_trait_benefits_of_civilisation:0 "文明的益处"
 ig_trait_benefits_of_civilisation_desc:0 "由于我们仁慈而有益的统治，教会出席人数稳步增加。"
 ig_trait_kampongs:0 "甘榜"
 ig_trait_kampongs_desc:0 "为了村庄的健康，所有人都必须做出贡献。"
 ig_trait_oostindisch_doof:0 "东印度聋病"
 ig_trait_oostindisch_doof_desc:0 "最卑微的歉意，高贵的阁下，我疏忽了采摘正确的田地。我恳请您今后在指示上更明确一些，以避免再次发生此类误解。"
 ig_trait_widely_traveled:0 "见多识广"
 ig_trait_widely_traveled_desc:0 "走访村庄的中间人是知识传播的独特渠道。"
 ig_trait_porters:0 "搬运工"
 ig_trait_porters_desc:0 "从种植园到港口的货物自由流通，没有比每天沿路行走的本地搬运工更重要的人了。"
 ig_trait_moneylenders:0 "放债人"
 ig_trait_moneylenders_desc:0 "在本地货币市场由他们掌控的情况下，中间人对货币市场的正常运作至关重要。"