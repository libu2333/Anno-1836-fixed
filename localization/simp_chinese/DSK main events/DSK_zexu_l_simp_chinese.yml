dsk_zexu.24.t: "征服低地"
dsk_zexu.24.d: "征服低地"
dsk_zexu.24.f: "泽许帝国的军队挥师南下，目标是荷兰、比利时和卢森堡这几个低地国家。这些国家地势平坦，交通便利，控制着重要的海峡通道。泽许帝国的海军封锁了海峡，陆军则从陆地发起进攻。利用先进的火炮技术和灵活的战术，迅速突破低地国家的防线，将其征服。通过占领低地国家，泽许欧亚合众国成功控制了欧洲重要的海峡通道，掌握了海上贸易和军事运输的关键枢纽。"
dsk_zexu.24.a: "[SCOPE.GetRootScope.GetCountry.GetName]万岁"


