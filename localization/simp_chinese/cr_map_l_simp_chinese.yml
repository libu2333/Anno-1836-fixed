 je_reformista_rebellion:"改革派起义"
 je_reformista_rebellion_reason:0 "自独立战争以来，国家虽已名义上建立共和国，但现实却远未稳固。文人政府推行的制度并未带来秩序，反而削弱了国家的统一力量。地方势力割据，中央权威动摇，而曾为国家赢得独立的军队却被排除在决策之外。\n\n我们这些经历过战争的人深知，国家的生存依赖纪律与执行力，而非纸面上的理想与无力的法令。当前政权的优柔与分裂，正使国家逐渐走向混乱与衰败。\n\n因此，我们别无选择。必须重新整合国家权力，恢复秩序，使真正有能力、有经验之人承担领导责任。只有如此，国家才能避免崩溃，并走向真正的稳定与强盛。"
 reformista.1.t:0 "改革派的胜利"
 reformista.1.d:0 "旧有的文人政权已然崩解，其权威在各地迅速瓦解。从北方的米兰达到沿海的委内瑞拉湾，国家的秩序正重新落入掌握纪律与经验的军人之手。曾经被忽视与边缘化的力量，如今成为支撑国家的新核心。\n\n街头巷尾仍弥漫着不安与猜测，但军队已确立对局势的控制。我们所主张的秩序与权威，终于得以在整个国家范围内推行。"
 reformista.1.f:0 "加拉加斯的清晨被整齐的军靴声唤醒。街道两侧聚集着人群，既有欢呼，也有沉默的注视。军人们高声交谈，庆祝这场“恢复秩序”的胜利，而报童们则在街头奔走，挥舞着新创刊的《委内瑞拉军人报》。\n\n空气中混杂着胜利的喜悦与尚未散去的紧张气息——一切似乎刚刚开始，而不是已经结束。"
 reformista.1.a:"委内瑞拉万岁！"
 je_reformista_win:"改革派取得胜利"
 je_consolidated_peru:"秘鲁地区的三个省全部归于我们的统治之中。"
 not_consolidated_peru:"战争状态结束，但玻利维亚的势力仍然存在。"
 je_salaverry_peru:"萨拉韦里的末路"
 je_salaverry_peru_reason:"1835 年，为了从玻利维亚的控制下拯救秘鲁，[ROOT.GetCountry.GetRuler.GetLastName] 发动政变，试图终结外来统治。然而事与愿违——尽管我们一度成功收复利马，但在玻利维亚的军事反扑下，我们被迫退守南方。如今，昔日广阔的占领区只剩下阿雷基帕一隅之地。我们是否还能挽回局势，让秘鲁重获独立？"
 salaverry.1.t:"秘鲁重归一统"
 salaverry.1.d:"历经漫长而艰苦的斗争，我们完成了看似不可能的任务。秘鲁再次在一面旗帜下团结起来——这是自由、独立与统一的象征。尽管仍有反对的声音存在，但我们的统治已逐渐稳固。"
 salaverry.1.f:"《圣克鲁斯发表通告 玻利维亚震怒谴责》\n\n《[ROOT.GetCountry.GetRuler.GetFullName] 宣誓就任秘鲁总统》\n\n《北秘鲁前省长公开支持统一》\n\n……"
 salaverry.1.a:"统一的秘鲁万岁！"
 salaverry.1.b:"[ROOT.GetCountry.GetRuler.GetFullName] 的名字将铭刻于我们的历史之中。
 salaverry.2.t:"未竟的统一"
 salaverry.2.d:"我们赢得了战争，却未能实现真正的统一。玻利维亚仍掌控着部分秘鲁领土，短暂的和平掩盖不了分裂的现实。"
 salaverry.2.a:"我们仍是秘鲁——尽管尚未完全统一。"
 salaverry.2.b:"静待时机。"
