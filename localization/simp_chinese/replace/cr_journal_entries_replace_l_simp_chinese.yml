 #王子时代（埃塞俄比亚）
 je_age_of_princes: "王侯纷争时代"
 je_age_of_princes_reason: "自耶库诺·阿姆拉克以来，所罗门与示巴之后裔一直坐在大卫的宝座上，至今依然如此。皇帝如今仍从贡德尔王座上进行“统治”，却无法真正掌权。自从约阿斯被刺杀后，皇位一直被软弱的皇帝占据，他们完全受制于梅萨芬特（诸侯）的操弄，后者可随意废立皇帝。与此同时，帝国各省出现了野心勃勃的贵族，他们对贡德尔的傀儡皇帝几乎毫不理会。于是，在皇帝威望跌至谷底之际，帝国进入了泽梅内·梅萨芬特——即“王侯纷争时代”。\n\n其中最显赫的梅萨芬特是瓦拉·谢赫（Sheik之子），他们掌控着贝格姆德尔省及帝国首都贡德尔。这些出自沃洛北部的瓦拉·谢赫——正如其名所示——是皈依基督教的穆斯林奥罗莫后裔。然而，他们对新信仰的虔诚度受到一些人质疑，为本已紧张的局势增添了宗教冲突的火药味。在北方，野心勃勃的武贝从混乱中为自己开辟出一片堪比瓦拉·谢赫势力的“帝国”，并似乎准备向皇位发起挑战。然而他的残暴手段令臣民与附庸深恶痛绝，只需一点火星就能终结他的野心。在南方，绍阿之主萨赫勒·塞拉西走了一条不同道路。他基本不插手帝国政治，而是专注于建设自己的王国，甚至自封为“内古斯”（国王）。但饥荒与疾病严重削弱了他的财力，而教义争端也正在酝酿，威胁着教会的统一。\n\n现在帝国站在十字路口：梅萨芬特各自不同的野心会导致帝国的永久分裂吗？还是会有人崛起，重振皇帝的威望，将诸侯重新纳入掌控？"

 amazonas.2.t_2: "伊基托斯条约"

 native_resettlement.5.d: "将#variable 文明五部落#!迁移至[SCOPE.sCountry('cherokee_nation').GetCapital.GetStateRegion.GetName]的艰巨任务已成功完成。\n\n通过坚持不懈的努力与集中资源，这件充满争议的事情终于尘埃落定。不论将其视为政策的胜利还是通向进步的必要一步，事情已成定局，历史自会评判。土地现已向定居与开发开放，标志着我们扩张的新篇章。"
 native_resettlement.5.desc_2: "#variable 文明五部落#!向[SCOPE.sCountry('cherokee_nation').GetCapital.GetStateRegion.GetName]的迁移已完成。不管结果是好是坏，此事已了结。"

 je_pacify_the_steppes: "驯服草原"
 je_pacify_the_steppes_reason: "在欧洲俄罗斯的有序省份之外，是一片广袤、风吹草低的边疆——无边无际的草原一直延伸到中亚烈日炙烤的群山。这就是哈萨克草原：一片由运动与寂静构成的海洋，没有边界，也不屈从于法律。\n\n一个多世纪以来，帝国一直在向这片边疆推进。堡垒拔地而起，条约陆续签订，讨伐远征不断展开。哥萨克军团名义上效忠帝国，却常常行事狂野，他们驰骋草原、守卫前哨——半是定居者，半是战士。然而，真正的控制依然遥不可及。草原不是行省，不是王室领地——它是一片活着的广袤空间，由游牧民的迁徙、可汗之间的争斗以及人群与牲畜在旷野中的不断流动所塑造。\n\n要驯服这片边疆绝非简单的征服。道路会在草丛中消失。无法征税的地方只能靠进贡维系。劫掠者的速度永远快过正规军的行军。每一座前哨的建立都需要补给，每一项协议都需要用实际存在而非空洞承诺来强制执行。\n\n但若帝国想要抵达中亚那些传说中的城市——希瓦、布哈拉、浩罕——这片荒野必须首先被征服。没有一条铁路能通往撒马尔罕，除非先在草原上开辟出一条路。问题不在于是否应该平定草原，而在于我们愿意为此付出多少——人力、卢布与决心。"