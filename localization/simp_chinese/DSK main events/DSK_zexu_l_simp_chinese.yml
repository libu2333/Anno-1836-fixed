je_dsk_zexu_main_reason: "[ROOT.GetCountry.GetRuler.GetFullName]穿越到这个时代，附身于[SCOPE.sCountry('tur_scope').GetName]的一位17岁年轻贵族身上。此时的[SCOPE.GetRootScope.GetCountry.GetName]，不过是[SCOPE.sCountry('tur_scope').GetName]的傀儡国，因为拯救奥斯曼帝国的皇帝被安置在抵御俄罗斯帝国进攻的前线。[SCOPE.sCountry('tur_scope').GetName]承诺，只要[SCOPE.GetRootScope.GetCountry.GetName]在战争中全力协助并取得胜利，便会逐步给予更多自治权，甚至公国可以获得独立。[ROOT.GetCountry.GetRuler.GetFullName]深知[SCOPE.GetRootScope.GetCountry.GetName]处境艰难，但他并未气馁。他积极整顿[SCOPE.GetRootScope.GetCountry.GetName]的军事力量，训练士兵，储备物资，同时密切关注着沙俄的动向。尽管资源有限，且时常受到奥斯曼帝国的掣肘，但[ROOT.GetCountry.GetRuler.GetFullName]凭借着卓越的领导才能和坚定的信念，努力在夹缝中求生存，为公国的未来谋划着出路。"
