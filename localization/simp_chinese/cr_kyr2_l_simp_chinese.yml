 cr_kyr2_events.1.t:0 "巴特尔的旗帜"
 cr_kyr2_events.1.d:0 "在东布鲁特，没有哪一位骑手比[SCOPE.sCharacter('tailak_baatyr_scope').GetFullName]更为人熟知。每一次击退劫掠、每一次在牧场边缘平息仇怨，他的追随者便更多一分。在一些长老眼中，他是族人的屏障；在另一些人眼中，他则是一个终有一日会让自身名望盖过可汗的武人。\n\n这位巴特尔请求朝廷决定：他的旗帜究竟应当离汗帐多近。"
 cr_kyr2_events.1.f:0 "可汗或可承继头衔，巴特尔的追随者却须以一次次纵马冲锋赢得。"
 cr_kyr2_events.1.a:0 "让他的旗帜与汗帐并立。"
 cr_kyr2_events.1.b:0 "诸部首先应当听取长老之言。"
 cr_kyr2_events.1.c:0 "让他同清廷边官接洽。"

 cr_kyr2_events.2.t:0 "受挑战的巴特尔"
 cr_kyr2_events.2.d:0 "一场围绕冬牧场的争执，已演成对汗权的考验。争执双方的骑手各自聚集，并都宣称旧俗站在自己一边。[SCOPE.sCharacter('tailak_baatyr_scope').GetFullName]愿亲自裁决此事，但他的介入会使他成为诸部不可或缺的人物，而这些氏族的服从本应归于可汗。"
 cr_kyr2_events.2.f:0 "高山之中，每一次裁断都比积雪留得更久。"
 cr_kyr2_events.2.a:0 "让巴特尔强行平息争端。"
 cr_kyr2_events.2.b:0 "趁血未流尽前召来长老。"
 cr_kyr2_events.2.c:0 "请浩罕仲裁。"

 cr_kyr2_events.3.t:0 "血价"
 cr_kyr2_events.3.d:0 "一桩旧日杀戮已招来新的报复。涉事家族索取赔偿，其盟友却要求雪耻；这场纠纷已开始撕裂原本同在一处越冬的营地。朝廷须决定是以财物购得和平、任由仇杀延续，还是引入外部裁断。"
 cr_kyr2_events.3.f:0 "血债往往不能在一个季节里偿清。"
 cr_kyr2_events.3.a:0 "付清血价，以誓言约束和解。"
 cr_kyr2_events.3.b:0 "任各部自行承担后果。"
 cr_kyr2_events.3.c:0 "将此事交给浩罕的法官。"

 cr_kyr2_events.4.t:0 "浩罕使节"
 cr_kyr2_events.4.d:0 "浩罕使节携袍服、钱币而来，并提醒东布鲁特仍受汗国庇护。礼物颇为丰厚，言辞却也分寸分明：贡赋不可迟误，山道须保持通行，诸部的归属更不得由另一座宫廷染指。"
 cr_kyr2_events.4.f:0 "强邻的馈赠，从来都附着账册。"
 cr_kyr2_events.4.a:0 "受其礼物，重申我方承诺。"
 cr_kyr2_events.4.b:0 "领受礼遇，但将承诺限定在最小范围。"
 cr_kyr2_events.4.c:0 "将此番来使告知伊犁。"

 cr_kyr2_events.5.t:0 "伊犁使节"
 cr_kyr2_events.5.d:0 "一支清廷边务使团越过山口，带来绸缎、茶叶，以及援引皇朝与吉尔吉斯诸部旧日关系的文书。使节许诺承认与庇护，但其文牍中同样写着贡赋、册籍与远方官员的权威。"
 cr_kyr2_events.5.f:0 "群山之外还有另一座朝廷，另一册账簿。"
 cr_kyr2_events.5.a:0 "重申旧日的边疆臣属关系。"
 cr_kyr2_events.5.b:0 "以宾客之礼相待，勿以主人相奉。"
 cr_kyr2_events.5.c:0 "让浩罕知晓我方立场。"

 cr_kyr2_events.6.t:0 "同心的库鲁尔台"
 cr_kyr2_events.6.d:0 "各部首领终于接受了共同的裁断。牧场得以分配，血价得以偿清，可汗的使者也不必再在每一处山谷同人另作交易。东布鲁特仍少道路、多旧怨，但其人民已寻得一份共同的意志。"
 cr_kyr2_events.6.f:0 "白毡既举，诸部未曾背转而去。"
 cr_kyr2_events.6.a:0 "愿此和睦长存。"

 cr_kyr2_events.7.t:0 "毡帐离散"
 cr_kyr2_events.7.d:0 "旧有的和解已告失败。营地不告而徙，骑手皆携兵刃，每一部都将自身安危置于汗帐命令之上。外来使节在各山谷均可觅得愿听其言之人，可汗的命令却只能传到自己旗帜所及之处。"
 cr_kyr2_events.7.f:0 "一个分裂的民族有许多代言人，却没有共同的道路。"
 cr_kyr2_events.7.a:0 "我们必须熬过这段离散的岁月。"

 cr_kyr2_events.8.t:0 "浩罕的庇护"
 cr_kyr2_events.8.d:0 "归属的天平已倾向浩罕。贡赋、使节与共同利益，使东布鲁特同汗国的联系更为紧密。山中诸部仍保有习俗，但通往南方与西方的道路，已日益经由浩罕之手。"
 cr_kyr2_events.8.f:0 "庇护自有代价，但山口仍然通行。"
 cr_kyr2_events.8.a:0 "恪守这份盟约。"

 cr_kyr2_events.9.t:0 "通往清廷的道路"
 cr_kyr2_events.9.d:0 "归属的天平已倾向大清。东布鲁特重新进入帝国的朝贡体系，以承认与庇护换取在强邻之间不再漂泊的地位。"
 cr_kyr2_events.9.f:0 "通往伊犁的道路虽远，其印信仍可抵达高山牧场。"
 cr_kyr2_events.9.a:0 "重修臣属之礼。"

 cr_kyr2_events.10.t:0 "西北收复"
 cr_kyr2_events.10.d:0 "天山以外的失序已获整饬。无论是经由重修朝贡，还是直接设治，东布鲁特如今再次纳入大清西陲的秩序。朝廷可将此载为旧疆的恢复；山谷中的人民则会记住，是哪些骑手与使节促成了这一切。"
 cr_kyr2_events.10.f:0 "边疆不只凭地图维系，也凭道路、誓言与权力的记忆维系。"
 cr_kyr2_events.10.a:0 "修订边疆册籍。"

 cr_kyr2_events.11.t:0 "冬牧场的界标"
 cr_kyr2_events.11.d:0 "积雪初临，两个氏族为一处冬牧场的界线争执不下。旧日的石堆已被风雪掩埋，双方都援引父祖之言；再拖延下去，牧群与骑手便会一同越过界线。"
 cr_kyr2_events.11.f:0 "牧场的边界常由记忆划定，而记忆从不安静。"
 cr_kyr2_events.11.a:0 "召集长老，重立界标。"
 cr_kyr2_events.11.b:0 "让各部自行守住自己的草场。"

 cr_kyr2_events.12.t:0 "山口上的商队"
 cr_kyr2_events.12.d:0 "一支满载茶叶、布匹与盐货的商队在山口等候通行凭证。浩罕商人催促诸部履行旧约，清廷随员则递来印信与赏赐。商队本无立场，山道却从来不是无主之地。"
 cr_kyr2_events.12.f:0 "货物总要过山，而权威也总想随之同行。"
 cr_kyr2_events.12.a:0 "准其循浩罕旧路通行。"
 cr_kyr2_events.12.b:0 "以清廷的印信放行。"
 cr_kyr2_events.12.c:0 "只许本地向导领路，不许外人插手。"

 cr_kyr2_events.13.t:0 "伊犁边务呈报"
 cr_kyr2_events.13.d:0 "伊犁将军呈报，东布鲁特诸部仍在浩罕与大清之间审度形势。有人主张多赐缎匹与茶叶，以修旧好；亦有人认为应重申朝廷威权，使其知所向背。"
 cr_kyr2_events.13.f:0 "边务不止在城垣之外，也在每一顶毡帐的取舍之间。"
 cr_kyr2_events.13.a:0 "厚加抚绥，徐图归附。"
 cr_kyr2_events.13.b:0 "严申旧制，令其早定去就。"