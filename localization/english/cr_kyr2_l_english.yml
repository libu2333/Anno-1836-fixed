 je_cr_eastern_burut_clans:0 "The Clans of Eastern Burut"
 je_cr_eastern_burut_clans_reason:0 "From Alay to Issyk-Kul, the people of Eastern Burut owe first allegiance to their own clans, pastures, and elders. A khan may summon a Kurultai, but he cannot command the mountains by decree. The fragile compact holding the clans together must be renewed through prestige, prudence, and, when necessary, the sword.\n\n#bold Clan Cohesion#!\nWhen cohesion reaches #bold 90#!, the authority of the khan will be secure. If it falls to #bold 10#!, the clans will again turn upon one another."
 cr_kyr2_clans_complete_header:0 "#title The clans will be consolidated if:#!\n"
 cr_kyr2_clans_complete_tt:0 "Eastern Burut clan cohesion reaches #variable 90#!"
 cr_kyr2_clans_fail_header:0 "#title The clans will fracture if:#!\n"
 cr_kyr2_clans_fail_tt:0 "Eastern Burut clan cohesion falls to #variable 10#!"
 cr_kyr2_clans_on_complete_header:0 "#title If the clans are consolidated:#!\n$EFFECT$"
 cr_kyr2_clans_on_fail_header:0 "#title If the clans fracture:#!\n$EFFECT$"

 je_cr_eastern_burut_crossroads:0 "Between Kokand and the Qing"
 je_cr_eastern_burut_crossroads_reason:0 "Eastern Burut lies between the claims of the Khanate of Kokand and the Qing frontier administration. Kokand demands tribute and obedience; Qing officials invoke older ties of allegiance and the authority of Ili. Neither court can rule the high valleys without local intermediaries, and every embassy gives the clans another chance to bargain for room to breathe.\n\n#bold The Balance of Allegiance#!\nIf Kokand's influence reaches #bold 100#!, Eastern Burut will be bound firmly to Kokand. If Qing influence reaches #bold 100#!, it will enter the Qing tributary order."
 cr_kyr2_kokand_outcome_header:0 "#title Kokand will prevail if:#!\n"
 cr_kyr2_kokand_outcome_tt:0 "Kokand influence reaches #variable 100#!"
 cr_kyr2_qing_outcome_header:0 "#title The Qing will prevail if:#!\n"
 cr_kyr2_qing_outcome_tt:0 "Qing influence reaches #variable 100#!"
 cr_kyr2_kokand_on_outcome_header:0 "#title If Kokand prevails:#!\n$EFFECT$"
 cr_kyr2_qing_on_outcome_header:0 "#title If the Qing prevail:#!\n$EFFECT$"

 je_cr_qing_recover_eastern_burut:0 "Recover the Northwest"
 je_cr_qing_recover_eastern_burut_reason:0 "From the Pamirs to the northern foot of the Tian Shan, the northwestern frontier binds together Ili, Altai, and the lands beyond the Congling. Kokand's advance has loosened the older tributary order. Within fifteen years, the court must secure Ili and Altai, hold one historical Badakhshan province, and restore Eastern Burut to subject status or direct rule before it can claim that the northwest is secure."
 cr_qing_eastern_burut_complete_header:0 "#title The northwest will be recovered if:#!\n"
 cr_qing_eastern_burut_on_complete_header:0 "#title If the northwest is recovered:#!\n$EFFECT$"
 cr_qing_recover_northwest_badakhshan_tt:0 "Directly control one historical Badakhshan province, or have its Badakhshan owner as a subject"
 cr_qing_recover_northwest_ili_altai_tt:0 "Fully control Altai and Ili"
 cr_qing_recover_northwest_eastern_burut_tt:0 "Make Eastern Burut a vassal or puppet, or directly control Alay, Kyrgyz, and Karakol after its dissolution"

 cr_kyr2_call_kurultai_button:0 "Call a Kurultai"
 cr_kyr2_call_kurultai_button_desc:0 "Gather the leading clans and renew the compact that binds Eastern Burut together."
 cr_kyr2_call_kurultai_button_tt:0 "Costs @money!#variable 2,500#! and @aut!#variable 75#!; clan cohesion will #bold increase by 2#! each month for #variable 3#! years."
 cr_kyr2_kokand_envoys_button:0 "Send Envoys to Eastern Burut"
 cr_kyr2_kokand_envoys_button_desc:0 "Offer favors, gifts, and recognition to deepen Eastern Burut's connection to Kokand."
 cr_kyr2_kokand_envoys_button_tt:0 "Kokand influence in Eastern Burut will #bold increase#! for #variable 3#! years."
 cr_kyr2_qing_envoys_button:0 "Dispatch Qing Envoys"
 cr_kyr2_qing_envoys_button_desc:0 "Invoke the old frontier relationship and invite Eastern Burut back into the Qing tributary order."
 cr_kyr2_qing_envoys_button_tt:0 "Qing influence in Eastern Burut will #bold increase#! for #variable 3#! years."
 cr_qing_recover_eastern_burut_button:0 "Demand Tributary Submission"
 cr_qing_recover_eastern_burut_button_desc:0 "Demand that Eastern Burut renew its submission to the Qing court."

