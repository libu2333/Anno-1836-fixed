dsk_zexu.28.d: "全球帝国"
dsk_zexu.28.f: "经过这一系列的步骤，泽许欧亚合众国成功地将整个欧洲统一在一个政权之下。欧洲实现了政治、经济、文化、军事等各方面的高度统一，开启了一个全新的纪元。泽许欧亚合众国在世界舞台上的影响力达到了前所未有的高度，成为一个真正的超级大国。"
