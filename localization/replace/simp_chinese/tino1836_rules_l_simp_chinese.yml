l_simp_chinese:
 rule_tino_start_rules: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],rule_tino_start_rules_claim #high 大清开局状况#!#!#!"
 rule_tino_start_rules_claim: "@warning!#v 声明：#!#v 作者坚定维护国家统一，反对任何分裂国家的行为。#!游戏内所有的将军府、地方、总督、土司、无主地、部落，#v 凡是在大清范围内的，皆为大清领土、大清政权、大一统国家的有机组成部分。#!\n\n由于游戏自身机制的限定，即以且仅以国家为游戏内的基本单位的限定，使得模拟统一政治体内的中央与地方的互动，即[concept_inner_soverignty]互动难以实现，为了实现本模组内容，只能以此方式设计内容。"
 setting_great_unification: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],setting_great_unification_mini_desc #high 海内一统#!#!#!"
 setting_great_unification_desc: "开局时，大清将会作为统一的政治体存在。"
 setting_great_unification_mini_desc: "启用这个选项，将无法体验舆清的众多内容。\n将会提供决议以统一西藏、库页岛等地方"
 setting_cogovernance_of_five_region: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],setting_cogovernance_of_five_region_mini_desc #high 五域共治#!#!#!"
 setting_cogovernance_of_five_region_desc: "开局时，除了中央政府外，其余四域将会由效忠于中央的将军所统治，接受清廷的领导"
 setting_cogovernance_of_five_region_mini_desc: "启用这个选项，将无法体验舆清的部分内容。\n将会放出三大将军府：伊犁、乌里雅苏台、黑龙江，以及保留西藏地方政府。"
 setting_direct_administration_of_the_kingtsi: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],setting_direct_administration_of_the_kingtsi_mini_desc #high 京畿领辖#!#!#!"
 setting_direct_administration_of_the_kingtsi_desc: "开局时，中央政府领有中原地方，其余地方将会由效忠于中央政府的将军、僧俗官员、总督所统治。"
 setting_direct_administration_of_the_kingtsi_mini_desc: "这个选项是舆清的标准选项，启用时可以体验舆清的大部分内容。\n除了边区将军外，南方粤、川、苏、湘、浙、滇督，北方陕督将会被放出。"
 setting_empire_of_the_dawn: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],setting_empire_of_the_dawn_mini_desc #high 前夜帝国#!#!#!"
 setting_empire_of_the_dawn_desc: "@warning!这个选项暂时不可用，敬请期待。\n开局时，除了京畿领辖之地外，所有的前现代地方，将会由地方头人，包括土司、诸部族所治理，接受中央册封，等待改土归流。"
 setting_empire_of_the_dawn_mini_desc: "完全体！启用这个规则将会开启舆清的所有内容，诸如川边拉锯、改土归流。\n除了中央、各将军、总督外，所有的土司、部落、无主地将会被放出。"