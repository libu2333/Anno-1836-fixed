je_depend_jibei:0 "阿拉斯加的开发"
 je_depend_jibei_reason:0 "三年前，熟知历史的异世来客[ROOT.GetCountry.GetRuler.GetFullName]远渡北太平洋，在天智建立了海外华人的新国。"
#dyn_c_jibei_adj:0 "阿拉斯加"
je_depend_jibei_goal:0 "完成阿拉斯加的开发"
usfp_manifest_destiny.10.t: "金山传奇"
 usfp_manifest_destiny.10.d: "[SCOPE.sState('california_scope').GetName]发现黄金的消息已传至[SCOPE.sCountry('china_scope').GetName]。受“金山”财富传说吸引，成千上万的[SCOPE.sCulture('han_scope').GetName]移民正准备远渡重洋。"
 usfp_manifest_destiny.10.f: "金山之名一传，海潮便载着无数人的希望而来。"
 usfp_manifest_destiny.10.a: "淘金之潮不可阻挡。"
 usfp_manifest_destiny.10.b: "我们不需要更多的淘金者。"
 usfp_manifest_destiny.10.a.t: "无论[SCOPE.sCountry('china_scope').GetAdjective]政府采取何种政策，未来数年仍将有逾三万名[SCOPE.sCulture('han_scope').GetName]劳工抵达[SCOPE.sState('california_scope').GetName]。"
tz_flavor.2.t: "阿拉斯加的开发"
 tz_flavor.2.d2: "阿拉斯加的开垦工程已获成功；该州可供耕作的土地有所增加。"
 tz_flavor.2.d: "随着最后一片荒地得到开垦，阿拉斯加的拓殖事业终于完成。"
 tz_flavor.2.f: "人当怀抱远志。"
 tz_flavor.2.a: "阿拉斯加大有可为。"
 tz_flavor.1.b: "积蓄国力，以待日后重振中华。"
jibei_development_complete: "大力发展工业"
 tz_flavor.1.c: "保留君主制，以维持权威。"
 tz_flavor.1.t: "天智的异世来客"
 tz_flavor.1.d: "数年前，我们举家远渡太平洋，来到这片苦寒边地，只为改变自己的命运。"
 tz_flavor.1.f: "登陆阿拉斯加后，[ROOT.GetCountry.GetRuler.GetFullName]同俄罗斯帝国达成协议，以六十万两白银购得此地；一个独立国家由此宣告成立。"
 tz_flavor.1.a: "开垦阿拉斯加，奠定国基。"
 tz_flavor.1.z: "在英美之间谋求立足之地。"

tz_flavor.4.t:0 "我们的盟友"
 tz_flavor.4.d:0 "我们的民主事业已获成功，远在大洋彼岸的国家也对之侧目。我们可与理念相近者结盟，共同捍卫这份成果。"
 tz_flavor.4.f:0 "这是历史性的尝试；[SCOPE.GetRootScope.GetCountry.GetName]将由此开启新篇。"
 tz_flavor.4.a:0 "与大不列颠结盟。"
 tz_flavor.4.b:0 "与美利坚合众国结盟。"
 tz_flavor.4.c:0 "共和国应先整饬内政。"
 tz_flavor.5.t:0 "天智共和国成立"
 tz_flavor.5.d:0 "我们已摆脱旧宗主国的影响，并将同美利坚一起成为北美的重要力量。"
 tz_flavor.5.f:0 "变革既成，一个新纪元由此展开。"
tz_flavor.5.a:0 "[SCOPE.GetRootScope.GetCountry.GetName]万岁"
tz_flavor.6.t:0 "天智帝国"
 tz_flavor.6.a:0 "[SCOPE.GetRootScope.GetCountry.GetName]当兴修道路、桥梁与港口，以展开大规模基础建设。"
 tz_flavor.6.b:0 "经过一番经营，天智的经济开始复苏；就业与收入增加，民生也随之改善。我们仍须兼顾环境与生态，以求长久之计。"
 tz_flavor.6.c:0 "在重建国家的过程中，[ROOT.GetCountry.GetRuler.GetFullName]采取措施，克服地理与资源上的限制。"
 tz_flavor.6.d:0 "[ROOT.GetCountry.GetRuler.GetFullName]依托近北极圈的区位，发展渔业、矿业与贸易，以发挥天智的边地优势。"
tz_flavor.6.e:0 "[ROOT.GetCountry.GetRuler.GetFullName]施行严格的资源管理政策，确保矿产开采合理、渔业得以永续，并引入更先进的采矿与渔业管理技术，以减轻对环境的损害。"
 tz_flavor.6.f:0 "[ROOT.GetCountry.GetRuler.GetFullName]投资修筑道路、铁路与港口，便利人员与物资流通；又扩充能源供给，以巩固天智的发展基础。"
 tz_flavor.6.g:0 "[ROOT.GetCountry.GetRuler.GetFullName]争取外国的技术与资本，并与美利坚和大英修好，共同开发跨境资源。"
 tz_flavor.6.h:0 "[ROOT.GetCountry.GetRuler.GetFullName]设立教育基金，延揽专才，并建立研究机构，以推动技术创新与产业升级。"
je_be_alaska:0 "新的国名；新的国旗"
 je_be_alaska_reason:0 "我们位于北美西北端，东接加拿大，濒临北冰洋、白令海与北太平洋。既与美利坚相近，何不考虑同其共建合众国？"
je_usa_union:0 "天智-美利坚联合提案"
 je_usa_union_reason:0 "天智—美利坚联合将开创先例；[SCOPE.sCountry('usa_scope').GetName]也可与[SCOPE.GetRootScope.GetCountry.GetName]一同走上联邦之路。"
tz_flavor.8.t:0 "天智-美利坚联邦"
 tz_flavor.8.d:0 "同美利坚的联合具有划时代的意义；北美大陆自此纳入共和国新的政治视野。"
 tz_flavor.8.f:0 "一个新纪元由此展开。我们可将首都由边陲迁往更适宜统治与发展的纽约。"
 tz_flavor.8.a:0 "[SCOPE.GetRootScope.GetCountry.GetName]与美利坚合众国的友谊长存！"
tz_flavor.9.t:0 "[SCOPE.sCountry('usa_scope').GetName]购买西海岸"
 tz_flavor.9.d:0 "如今，[SCOPE.sCountry('usa_scope').GetName]已成为与我接壤的邻国，并提议以一笔可观的款项购买西海岸。"
 tz_flavor.9.f:0 "同[SCOPE.sCountry('usa_scope').GetName]修好，是既定国策之一。"
 tz_flavor.9.a:0 "北美幅员辽阔，割让西海岸。"
tz_flavor.9.b:0 "我另有打算"
je_canada_union:0 "天智-美利坚-加拿大"
je_canada_union_reason:0 "在联合完美利坚之后，当今世界最强大的霸主[SCOPE.sCountry('gbr_scope').GetName]仍然占据着加拿大的东北角，我们应该说服他们把纽芬兰地区交给我们，以完成北美大陆实质上的统一。"
tz_flavor.10.t:0 "[SCOPE.sCountry('gbr_scope').GetName]赠与纽芬兰"
tz_flavor.10.d:0 "如今我们已经与[SCOPE.sCountry('gbr_scope').GetName]是我们接壤的邻国，由于多年来我们不断的提升国际地位和他们交好，他们提议把纽芬兰地区赠与我们"
tz_flavor.10.f:0 "[SCOPE.sCountry('gbr_scope').GetName]交好是我们的既定国策之一，我们将会把目光看向更远处。"
tz_flavor.10.a:0 "统一北美，就在此刻"

