dsk_zexu.1.t: "公国自治权"
dsk_zexu.1.f: "[SCOPE.GetRootScope.GetCountry.GetName]仍受[SCOPE.sCountry('tur_scope').GetName]节制。若要争取更大权力，须在克里米亚战争中击败俄罗斯。"
dsk_zexu.1.d: "又一场胜利使我们赢得了[SCOPE.sCountry('tur_scope').GetName]更多信任。"
dsk_zexu.1.a: "这是[SCOPE.GetRootScope.GetCountry.GetName]的胜利。"

dsk_zexu.2.t: "公国成为保护国"
dsk_zexu.2.f: "又一场鏖战证明了公国的韧性；[ROOT.GetCountry.GetRuler.GetFullName]相信，命运正向[SCOPE.GetRootScope.GetCountry.GetName]倾斜。"
dsk_zexu.2.d: "在新近的战斗中，[SCOPE.GetRootScope.GetCountry.GetName]再度证明了自己的实力。"
dsk_zexu.2.a: "[ROOT.GetCountry.GetRuler.GetFullName]伯爵万岁"

dsk_zexu.3.t: "伟大的战争胜利"
dsk_zexu.3.f: "连番战斗使我们积累了经验，也锻炼了国民的意志。"
dsk_zexu.3.d: "战争与军队整训进一步增强了[SCOPE.GetRootScope.GetCountry.GetName]的凝聚力。"
dsk_zexu.3.a: "独立的愿望愈发强烈。"

dsk_zexu.4.t: "多布罗加之狮"
dsk_zexu.4.f: "战功与国力提升使我们获得邻国的认可；然而新的难题已迫在眉睫：罗马尼亚人的问题。"
dsk_zexu.4.d: "战斗的胜利为我们赢得了周边国家的承认。"
dsk_zexu.4.a: "声望由此大增。"
lion_of_east_europe_modifier: "多布罗加之狮"
lion_of_east_europe_modifier_desc: "在东欧战场建立的威望。"

