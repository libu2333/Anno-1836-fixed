 #加拿大叛乱
 je_cr_chateau_clique: "下加拿大的税收起义"
 je_cr_chateau_clique_reason: "多年来，[ROOT.GetCountry.GetNameNoFlag]内部少数[SCOPE.sCulture('anglo_canadian_culture').GetName]商人——围绕[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]形成寡头并事实上统治殖民地——与多数被实际剥夺政治权利的[SCOPE.sCulture('franco_canadian_culture').GetName]人之间冲突不断酝酿，两者代表了殖民地截然不同的未来。\n\n统称为[SCOPE.gsInterestGroup('cr_canadian_industrialists').GetNameNoIcon]的[SCOPE.sCulture('anglo_canadian_culture').GetNameNoFormatting]商人集团寻求与[SCOPE.sCountry('cr_upper_canada').GetName]合并，将其置于[SCOPE.sCulture('english_culture').GetNameNoFormatting]霸权之下，边缘化[SCOPE.sCulture('franco_canadian_culture').GetNameNoFormatting]文化。他们计划废除民法体系，代之以[SCOPE.sCulture('english_culture').GetNameNoFormatting]普通法体系，废除[SCOPE.gsInterestGroup('cr_canadian_landowners').GetNameNoIcon]领主制，并推广[SCOPE.gsInterestGroup('cr_anglican_church').GetNameNoIcon]为国教。\n\n反对他们的是[SCOPE.gsInterestGroup('cr_canadian_liberals').GetNameNoIcon]，他们希望利用人口优势保卫[SCOPE.sCountry('cr_original_coloniser_quebec').GetAdjective]遗产，并最终争取——即便不是完全独立——也在大英帝国内部获得单独自治领地位。\n\n随着[SCOPE.gsInterestGroup('cr_canadian_liberals').GetNameNoFormatting]在1834年选举中大获全胜，紧张局势达到顶点。由[SCOPE.gsInterestGroup('cr_canadian_liberals').GetLeader.GetFullName]起草的#variable 92项决议#!——一份大胆陈述[SCOPE.sCulture('franco_canadian_culture').GetNameNoFormatting]不满的请愿书——已送往[SCOPE.sCountry('cr_lower_canada_overlord').GetCapital.GetCityHubName]。首要诉求是#variable 责任政府#!——要求完全内部自治与普选，实质上将权力交给[SCOPE.sCulture('franco_canadian_culture').GetNameNoFormatting]。请愿书伴随的隐晦威胁是：若诉求未获满足，殖民地可能走上美国殖民地的老路。由[SCOPE.gsInterestGroup('cr_canadian_liberals').GetNameNoFormatting]发起的立法拒税行动，只是强化诉求的第一步。"

 je_cr_chateau_clique_UNUSED: "城堡集团"
 je_cr_chateau_clique_reason_UNUSED: "虽然1791年《宪法法案》名义上通过民选议会提供代表，但[ROOT.GetCountry.GetNameNoFlag]的真正权力不在议会，而在由总督任命的立法与行政委员会。这些委员会可否决议会提出的法案，更重要的是，他们可直接接触总督并建议[ROOT.GetCountry.GetRuler.GetHerHim]行使否决权。\n\n这一安排本身已极不受欢迎，而该[SCOPE.gsInterestGroup('cr_canadian_landowners').GetNameNoIcon]几乎全部由[SCOPE.sCulture('english_culture').GetName]商人组成，更是为火上浇油。这一集团不仅代表商人及工业家利益——以及随之而来的经济变革——还积极推动将[ROOT.GetCountry.GetNameNoFormatting]同化为[SCOPE.sCulture('anglo_canadian_culture').GetName]省份，试图以普通法取代民法、以圣公会取代天主教会、废除领主制，深深切割[SCOPE.sCulture('franco_canadian_culture').GetName]身份。\n\n围绕这一问题的紧张局势已达沸点。1834年，在[SCOPE.gsInterestGroup('cr_canadian_liberals').GetLeader.GetFullName]领导下，[SCOPE.gsInterestGroup('cr_canadian_liberals').GetNameNoIcon]在选举中大获全胜。"

 je_cr_92_resolutions_ENG: "92项决议"
 je_cr_92_resolutions_ENG_reason: "我们的[SCOPE.sCountry('cr_lower_canada').GetName]殖民地并非一切安好。自1763年接管法国领土以来，我们一直在平衡自身意图与本地法裔居民的诉求，最终形成1791年《宪法法案》，保障两加拿大的政治权利与特权，并通过民选议会实现参与式治理。然而，这些议会如今已成为煽动性与革命活动的温床。\n\n在[SCOPE.gsInterestGroup('cr_canadian_liberals').GetLeader.GetFullName]领导下，并得到广泛民众支持，[SCOPE.gsInterestGroup('cr_canadian_liberals').GetNameNoIcon]已掌控民选议会，推动政治改革。他们的纲领体现在1834年送交议会的#variable 92项决议#!中，我们尚未作出回应。\n\n他们的怒火主要针对所谓城堡集团——主导未选举产生的立法与行政委员会、掌握大部分政治权力的[SCOPE.sCulture('anglo_canadian_culture').GetName]忠诚商人。他们要求权力归于——由[SCOPE.sCulture('franco_canadian_culture').GetName]主导的——议会。但在表面之下，还潜伏着对被[SCOPE.sCulture('anglo_canadian_culture').GetNameNoFormatting]主导的恐惧，后者已在魁北克与蒙特利尔接近多数，并通过移民与经济力量可能淹没法裔文化。\n\n在诉求——转向#variable 责任政府#!（自治）、更好代表性、法语官方保护与使用、公平税收——得到满足之前，[SCOPE.gsInterestGroup('cr_canadian_liberals').GetNameNoFormatting]正利用议会权力阻挠进一步征税，并隐晦威胁殖民地可能重蹈美国殖民地的覆辙。"

 cr_offered_response_to_92_resolutions_text: "我们对#variable 92项决议#!作出了正式答复"
