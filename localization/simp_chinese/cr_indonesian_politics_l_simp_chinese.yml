 #下加拿大/法裔加拿大
 ig_seigneurs:0 "领主"
 ig_seigneurs_desc:0 "领主是土地的管理者，拥有许多源自法国殖民时期的授封土地。这些授封带来特权，也让他们对居住在土地上的居民（Habitants）拥有很大影响力。"
 ig_habitants:0 "居民"
 ig_habitants_desc:0 "居民是生活在乡村和边疆的农民。他们重视自给自足，也珍惜与土地的联系，希望保住自己的生活方式。"
 ig_patriotes:0 "爱国者"
 ig_patriotes_desc:0 "爱国者受启蒙思想影响，认为自己在英国政治体系中长期被边缘化。这一政治运动要求民主改革，并争取法裔加拿大人更大的自治权。"
 ig_chateau_clique:0 "城堡集团"
 ig_chateau_clique_desc:0 "城堡集团由有影响力的英裔商人组成。他们支持现代工业，也希望把下加拿大更彻底地纳入英语加拿大。"

