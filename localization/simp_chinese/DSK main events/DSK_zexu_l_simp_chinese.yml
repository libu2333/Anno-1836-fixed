je_dsk_zexu_railway: "交通联网，地域联通"
je_dsk_zexu_railway_reason: "大力发展欧洲的交通网络。修建铁路、公路和运河，将欧洲各地紧密地连接在一起。从北欧到南欧，从东欧到西欧，便捷的交通网络促进了人员、物资和文化的交流。泽许欧亚合众国通过交通联网，打破了地域之间的限制，进一步加强了对整个欧洲的控制。"
lion_of_railway_modifier: "交通联网，地域联通"
je_dsk_zexu_army_2: "军事整合，力量凝聚"
je_dsk_zexu_army_2_reason: "对欧洲各地的军事力量进行整合。建立统一的军事指挥体系，统一军事训练标准和装备配置。将各地的军队改编为泽许欧亚合众国的国防军，根据各地的地理特点和战略需求，部署军事力量。通过军事整合，凝聚了欧洲的军事力量，提高了泽许欧亚合众国的整体军事防御和进攻能力。"
lion_of_army_modifier: "军事整合，力量凝聚"

je_dsk_zexu_port: "边境巩固，安全保障"
je_dsk_zexu_port_reason: "沿着泽许欧亚合众国的欧洲边境建立坚固的防御工事。在陆地上修建城墙、堡垒和边境哨所，在海上建立强大的海军基地和海防设施。加强边境的巡逻和监控，防止外部势力的入侵和内部的分裂势力活动，为欧洲的统一提供安全保障。"

lion_of_port_modifier: "边境巩固，安全保障"


je_dsk_zexu_art: "文化复兴，欧洲荣耀"
je_dsk_zexu_art_reason: "泽许欧亚合众国在欧洲范围内发起文化复兴运动。鼓励艺术家、文学家和历史学家挖掘欧洲各地的优秀文化遗产，融合泽许帝国的文化特色"
lion_of_art_modifier: "文化复兴，欧洲荣耀"
je_dsk_zexu_agriculture: "农业革新，粮食保障"
je_dsk_zexu_agriculture_reason: "在欧洲推行农业革新政策。引进新的农作物品种，推广先进的农业种植技术和灌溉技术。在东欧和南欧的广袤土地上建立大型的农业生产基地，提高粮食产量。通过农业革新，泽许欧亚合众国实现了欧洲的粮食自给自足，为欧洲的稳定发展提供了粮食保障。"
lion_of_agriculture_modifier: "农业革新，粮食保障"
je_dsk_zexu_industry: "工业规划，经济繁荣"
je_dsk_zexu_industry_reason: "制定统一的欧洲工业发展规划。根据各地的资源优势和工业基础，建立不同类型的工业基地。在北欧发展渔业加工和造船业，在东欧发展重工业，在西欧发展轻工业和高科技产业等。通过合理的工业规划，促进欧洲的工业发展，实现了欧洲经济的繁荣。"
lion_of_industry_modifier: "工业规划，经济繁荣"
je_dsk_zexu_welfare: "社会福利，人民团结"
je_dsk_zexu_welfare_reason: "泽许欧亚合众国在欧洲建立统一的社会福利制度。为欧洲公民提供医疗、养老、失业等社会保障，提高人民的生活质量。通过社会福利制度的实施，增强了人民对泽许欧亚合众国的归属感和忠诚度，促进了欧洲人民的团结。"
lion_of_welfare_modifier: "社会福利，人民团结"

je_dsk_zexu_environment: "外交霸权，欧洲一体"
je_dsk_zexu_environment_reason: "在国际事务中，泽许欧亚合众国代表整个欧洲发声。通过外交手段，与世界其他国家建立起以泽许欧亚合众国为核心的国际关系。在外交谈判、国际条约签订等方面，泽许欧亚合众国展现出强大的外交霸权，确保欧洲在国际舞台上以一个整体的形象出现，实现了欧洲的外交统一。"

lion_of_environment_modifier: "外交霸权，欧洲一体"

je_dsk_zexu_pops: "人口管理，均衡发展"
je_dsk_zexu_pops_reason: "对欧洲的人口进行合理管理。鼓励人口从人口密集地区向人口稀疏地区迁移，促进地区间的人口均衡。通过提供就业机会、住房补贴等优惠政策，吸引人们到发展中的地区定居。同时，加强人口的教育和培训，提高人口素质，为欧洲的发展提供人力资源保障。"

lion_of_pops_modifier: "人口管理，均衡发展"

