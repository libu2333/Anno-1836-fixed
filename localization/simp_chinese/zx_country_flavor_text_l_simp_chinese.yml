l_simp_chinese:
ZEXU_FLAVOR_TEXT:0 "泽许公国重生于奥斯曼帝国：它曾救下奥斯曼苏丹，也因此获赐多布罗加大公的头衔。列强争雄的风暴正席卷欧洲，这个新生的公国会在夹缝中赢得独立，还是走向另一条道路？"
JIBEI_FLAVOR_TEXT:0 "天智共和国的未来会是什么样？来自异世的林天智带来一段奇诡而动人的故事：一个全新的生命，一场令人振奋的冒险——买下阿拉斯加，在北太平洋建立新的国家！"
DAMING_FLAVOR_TEXT:0 "1836年，大明没有覆亡；朱世根在缅甸站稳脚跟，而清廷已经进入中原。这个重获新生的王朝将走向何方？它会驱逐鞑虏、恢复中华，还是会留在遥远边地，成为与世隔绝的国家？"
