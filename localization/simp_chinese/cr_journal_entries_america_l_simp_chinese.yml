 je_cr_robinson_treaties: "苏必利尔湖铜矿热潮"
 je_cr_robinson_treaties_reason: "传统上，苏必利尔湖沿岸经济围绕与奥吉布韦猎人的毛皮贸易展开，猎人向法国航海者、如今向哈德逊湾公司提供海狸皮。尽管铜矿藏已知数世纪，但勘探迄今收效甚微。然而，随着密歇根湖对岸发现大量铜矿，这一局面即将改变。人们对北岸发现类似矿藏抱有很高期望，财富前景诱人。\n\n尽管希望高涨，仍有一个小问题需解决：土地所有权。当地奥吉布韦人仍持有土地原住民权利，根据1763年《皇家宣言》规定，未经他们同意不得开发。\n\n因此，$ig_industrialists$正向[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]施压，要求与奥吉布韦人签订条约，开放该地区进行经济开发。"
