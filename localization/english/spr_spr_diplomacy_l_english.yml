 je_depend_daming_reason:0 "[ROOT.GetCountry.GetRuler.GetFullName], a descendant of the Great Ming well versed in history, has arrived in the world of 1836. Can this newcomer reverse the fortunes of the new Great Ming, confined to Pegu?"
 je_depend_daming_goal:0 "Complete the development of Pegu"
 dm_flavor.2.t:0 "Developing Pegu"
 dm_flavor.2.d2:0 "Pegu's land development project has succeeded. The state now has more arable land."
 dm_flavor.2.d:0 "Pegu's land development project has succeeded. With the last stretch of wilderness reclaimed, the settlement endeavor is complete."
 dm_flavor.2.f:0 "One should cherish great ambitions."
 dm_flavor.2.a:0 "Pegu still holds great promise."
 dm_flavor.1.b:0 "Temporarily submit to the British Empire to secure British acceptance."
 zexu_development_complete:0 "Vigorous Industrial Development"
 dm_flavor.1.c:0 "Retain the monarchy to preserve authority."
 dm_flavor.1.d:0 "In October 1835, Zhu Shigen, a descendant of the Ming dynasty, arrived in this world and sought refuge with Great Britain. Britain permitted him to restore the Great Ming on the condition that the new dynasty accept British protection."
 dm_flavor.1.t:0 "An Otherworldly Arrival in Pegu"
 dm_flavor.1.f:0 "The British consul nods in acknowledgment. In his eyes, a new Great Ming, subject to London's influence, is slowly taking shape in the East."
 dm_flavor.1.a:0 "Southeast Asia is vast and awaits our development."
 dm_flavor.1.z:0 "Build our strength and restore the Great Ming realm."
 dm_flavor.4.t:0 "Our Allies"
 dm_flavor.4.d:0 "Our endeavor has achieved notable success and attracted attention even across the ocean. We can ally with like-minded countries to defend what we have achieved."
 dm_flavor.4.f:0 "This is a historic undertaking. [SCOPE.GetRootScope.GetCountry.GetName] will begin a new chapter."
 dm_flavor.4.a:0 "Ally with Great Britain."
 dm_flavor.4.b:0 "Ally with Austria."
 dm_flavor.4.c:0 "The republic should first put its own house in order."
 dm_flavor.5.t:0 "Founding of the Great Ming Republic"
 dm_flavor.5.d:0 "We have completed the transition to a republic. Our next priority must be building the country."
 dm_flavor.5.f:0 "Change has come, and a new era begins."
 dm_flavor.5.a:0 "Long live [SCOPE.GetRootScope.GetCountry.GetName]!"
 dm_flavor.6.t:0 "The Great Ming Empire"
 dm_flavor.6.a:0 "Long live [SCOPE.GetRootScope.GetCountry.GetName]! We shall build roads, bridges, and ports, and introduce agricultural technology and new industries to lay the foundations of development."
 dm_flavor.6.b:0 "After sustained efforts, the local economy is beginning to recover. Employment and incomes are rising, and livelihoods are improving. We must still protect the environment and its ecosystems to secure lasting prosperity."
 dm_flavor.6.c:0 "In rebuilding the country, [ROOT.GetCountry.GetRuler.GetFullName] has taken measures to overcome geographical and resource constraints."
 dm_flavor.6.d:0 "[ROOT.GetCountry.GetRuler.GetFullName] adapts to local conditions, developing mining, agriculture, and trade to make the most of Pegu's geographical advantages."
 dm_flavor.6.e:0 "[ROOT.GetCountry.GetRuler.GetFullName] enforces strict resource management to ensure responsible mining and sustainable fisheries, introducing advanced mining and fisheries practices to reduce environmental damage."
 dm_flavor.6.f:0 "[ROOT.GetCountry.GetRuler.GetFullName] invests in roads, railways, and ports to ease the movement of people and goods, while expanding energy supplies to strengthen the foundations of Pegu's development."
 dm_flavor.6.g:0 "[ROOT.GetCountry.GetRuler.GetFullName] seeks foreign technology and capital, cultivating good relations with neighboring countries to develop cross-border resources together."
 dm_flavor.6.h:0 "[ROOT.GetCountry.GetRuler.GetFullName] establishes education funds, recruits specialists, and founds research institutions to promote technological innovation and industrial advancement."
 dm_be_zexu:0 "A New Name; a New Flag"
 dm_be_zexu_reason:0 "We lie on the Eastern European plain along the Danube, close to Wallachia and Moldavia. Why not invite them into our union and pursue the Zexu dream together?"
 dm_aus_union:0 "A Great Ming-Indian Union"
 dm_aus_union_reason:0 "A Great Ming-Indian union would set a precedent. [SCOPE.sCountry('usa_scope').GetName] and [SCOPE.GetRootScope.GetCountry.GetName] could embark together on the path to federation."
 dm_flavor.8.t:0 "The Great Ming-East Indies Federation"
 dm_flavor.8.d:0 "Union with the East Indies is an epoch-making achievement. The South Asian continent now enters the republic's new political horizon."
 dm_flavor.8.f:0 "A new era begins. We may move the capital to Vienna, a more suitable center for government and development."
 dm_flavor.8.a:0 "May the friendship between [SCOPE.GetRootScope.GetCountry.GetName] and the United States of Austria endure!"
 dm_flavor.9.a:0 "Ming-East Indies Union"
 dm_flavor.9.t:0 "An Epoch-Making Achievement"
 dm_flavor.9.d:0 "Union with the East Indies is an epoch-making achievement. The South Asian continent now enters the republic's new political horizon."
 dm_flavor.9.f:0 "A new era begins. We may move the capital to Vienna, a more suitable center for government and development."
 dm_flavor.10.t:0 "[SCOPE.sCountry('gbr_scope').GetName] Offers Newfoundland"
 dm_flavor.10.d:0 "[SCOPE.sCountry('gbr_scope').GetName] is now our neighbor. Years of friendship and our rising status have prompted them to offer us Newfoundland."
 dm_flavor.10.f:0 "Good relations with [SCOPE.sCountry('gbr_scope').GetName] are established national policy. We shall now look farther afield."
 dm_flavor.10.a:0 "Accept Newfoundland."
 dm_alaska_and_daming:0 "The Great Ming in Pegu"
 dm_alaska_and_zdaming_reason:0 "[SCOPE.GetRootScope.GetCountry.GetName] must carry out reforms to improve livelihoods and build the country."
 dm_flavor.11.t:0 "National Day"
 dm_flavor.11.d:0 "Following the unification of Austria, [SCOPE.sCountry('gbr_scope').GetName] celebrates its first National Day."
 dm_flavor.11.f:0 "Today marks the birth of [SCOPE.sCountry('gbr_scope').GetName], and the whole country celebrates. Flag-raising ceremonies, political assemblies, and evening festivities follow one another. The people believe that united effort will eventually bring prosperity to their new country."
 dm_flavor.11.a:0 "Celebrate the founding of our country."
 dm_flavor.12.t:0 "Improving Public Education"
 dm_flavor.13.t:0 "Improving Public Health"
 dm_flavor.14.t:0 "A Wave of Immigration"
 dm_flavor.12.d:0 "Education gives citizens knowledge and skills, improving their ability to earn a living and compete in society."
 dm_flavor.12.f:0 "Education trains skilled workers, supports economic development, and encourages innovation and industrial advancement."
 dm_flavor.12.a:0 "Education fosters understanding of different cultures, religions, and values, strengthening social trust and order."
 dm_flavor.12.g:0 "A well-educated population makes the country more competitive internationally and helps attract capital, technology, and talent."
 dm_flavor.13.d:0 "Improving public health reduces illness and hardship and raises the quality of life."
 dm_flavor.13.f:0 "Better medical care and healthier lifestyles allow the people to enjoy longer lives."
 dm_flavor.13.a:0 "Sound public health eases the burden on families and preserves social stability."
 dm_flavor.13.e:0 "Promoting balanced diets, moderate exercise, and restraint in smoking and drinking helps establish healthy habits and supports society's long-term development."
 dm_flavor.14.d:0 "[SCOPE.sCountry('gbr_scope').GetName] has introduced policies to attract skilled workers. Many professionals and skilled laborers are expected to settle here and contribute to economic development."
 dm_flavor.14.f:0 "To promote economic growth and employment, [SCOPE.sCountry('gbr_scope').GetName] is attracting foreign investors and immigrants to establish businesses and settle, bringing capital and expertise."
 dm_flavor.14.a:0 "As its education system develops, [SCOPE.sCountry('gbr_scope').GetName] attracts increasing numbers of international students, who may remain after graduation to work or pursue further studies."
