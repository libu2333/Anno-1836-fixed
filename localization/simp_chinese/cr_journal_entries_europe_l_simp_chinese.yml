 #本土移除
 je_cr_kyrgyz_tribes:"北方吉尔吉斯人"
 je_cr_kyrgyz_tribes_reason:"吉尔吉斯人是我国[ROOT.GetCountry.GetGovernment.GetName]的重要支柱，在官署内外担任各级职司；然而在我方眼中，他们的地位并不相同。阿赖与费尔干纳的南部吉尔吉斯人大多已接受统治，天山北麓的诸部却仍遵本族旧俗，不肯轻受约束。这尤为棘手，因为穿越天山、沿伊塞克湖通往乌鲁木齐与中国内地的商路，获利甚厚。\n\n维持商路已日益艰难：一部方才归顺，另一部便又蠢蠢欲动。我们只能借各氏族旧怨相互牵制，勉强维持控制；而这份控制须时时警醒，防备有人将诸部合为一旗，与我方抗衡。"
