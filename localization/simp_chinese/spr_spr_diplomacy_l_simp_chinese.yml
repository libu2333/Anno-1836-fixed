je_depend_daming:0 "开发勃固"
 je_depend_daming_reason:0 "一名熟知历史的大明遗裔[ROOT.GetCountry.GetRuler.GetFullName]来到了1836年的世界。面对偏安勃固的新大明，他能否力挽狂澜？"
je_depend_daming_goal:0 "完成勃固的开发"

dm_flavor.2.t: "勃固的开发"
dm_flavor.2.d2: "勃固的土地开发项目取得成功；该州如今拥有更多可耕地。"
 dm_flavor.2.d: "勃固的土地开发项目已告成功；随着最后一片荒地得到开垦，拓殖事业终告完成。"
 dm_flavor.2.f: "人当怀抱远志。"
 dm_flavor.2.a: "勃固仍大有可为。"
 dm_flavor.1.b: "暂向大英帝国称臣，以换取英国人的接纳。"
zexu_development_complete: "大力发展工业"
 dm_flavor.1.c: "保留君主制，以维持权威。"
 dm_flavor.1.d: "1835年10月，明朝遗裔朱世根来到此世，并向大不列颠寻求庇护。英国允其重建大明，条件是新朝须受英国保护。"
dm_flavor.1.t: "勃固之地穿越事件"
 dm_flavor.1.f: "英国领事颔首致意；在他眼中，一个受伦敦节制的“新大明”正于东方缓缓成形。"
 dm_flavor.1.a: "东南亚幅员辽阔，正待我们开拓。"
 dm_flavor.1.z: "积蓄国力，光复大明江山。"

dm_flavor.4.t:0 "我们的盟友"
 dm_flavor.4.d:0 "我们的事业已获显著成功，远在大洋彼岸的国家也对之侧目。我们可与理念相近者结盟，共同捍卫这份成果。"
 dm_flavor.4.f:0 "这是历史性的尝试；[SCOPE.GetRootScope.GetCountry.GetName]将由此开启新篇。"
 dm_flavor.4.a:0 "与大不列颠结盟。"
 dm_flavor.4.b:0 "与奥地利结盟。"
 dm_flavor.4.c:0 "共和国应先整饬内政。"
 dm_flavor.5.t:0 "大明共和国成立"
 dm_flavor.5.d:0 "我们已完成向共和国的过渡；下一步当以国家建设为先。"
 dm_flavor.5.f:0 "变革既成，一个新纪元由此展开。"
dm_flavor.5.a:0 "[SCOPE.GetRootScope.GetCountry.GetName]万岁"
dm_flavor.6.t:0 "大明帝国"
 dm_flavor.6.a:0 "[SCOPE.GetRootScope.GetCountry.GetName]万岁！我们将兴修道路、桥梁与港口，并引进农业技术和新兴产业，以奠定发展根基。"
 dm_flavor.6.b:0 "经过一番经营，地方经济开始复苏；就业与收入增加，民生也随之改善。我们仍须兼顾环境与生态，以求长久之计。"
 dm_flavor.6.c:0 "在重建国家的过程中，[ROOT.GetCountry.GetRuler.GetFullName]采取措施，克服地理与资源上的限制。"
 dm_flavor.6.d:0 "[ROOT.GetCountry.GetRuler.GetFullName]因地制宜，发展矿业、农业与贸易，以发挥勃固的区位优势。"
dm_flavor.6.e:0 "[ROOT.GetCountry.GetRuler.GetFullName]施行严格的资源管理政策，确保矿产开采合理、渔业得以永续，并引入更先进的采矿与渔业管理技术，以减轻对环境的损害。"
 dm_flavor.6.f:0 "[ROOT.GetCountry.GetRuler.GetFullName]投资修筑道路、铁路与港口，便利人员与物资流通；又扩充能源供给，以巩固勃固的发展基础。"
 dm_flavor.6.g:0 "[ROOT.GetCountry.GetRuler.GetFullName]争取外国的技术与资本，并与邻国修好，共同开发跨境资源。"
 dm_flavor.6.h:0 "[ROOT.GetCountry.GetRuler.GetFullName]设立教育基金，延揽专才，并建立研究机构，以推动技术创新与产业升级。"
 dm_be_zexu:0 "新的国名；新的国旗"
 dm_be_zexu_reason:0 "我们位于东欧平原，多瑙河沿岸，与瓦拉几亚和摩尔达维亚很近，为何不让他们加入合众国？一起追寻泽许梦？"
 dm_aus_union:0 "大明-印度联合提案"
 dm_aus_union_reason:0 "大明—印度联合将开创先例；[SCOPE.sCountry('usa_scope').GetName]也可与[SCOPE.GetRootScope.GetCountry.GetName]一同走上联邦之路。"
 dm_flavor.8.t:0 "大明-东印度联邦"
 dm_flavor.8.d:0 "同东印度的联合具有划时代的意义；南亚大陆自此纳入共和国新的政治视野。"
 dm_flavor.8.f:0 "一个新纪元由此展开。我们可将首都迁往更适宜统治与发展的维也纳。"
 dm_flavor.8.a:0 "[SCOPE.GetRootScope.GetCountry.GetName]与奥地利合众国的友谊长存！"
 dm_flavor.9.a:0 "明东合并"
 dm_flavor.9.t:0 "划时代的历史意义"
 dm_flavor.9.d:0 "同东印度的联合具有划时代的意义；南亚大陆自此纳入共和国新的政治视野。"
 dm_flavor.9.f:0 "一个新纪元由此展开。我们可将首都迁往更适宜统治与发展的维也纳。"
 dm_flavor.10.t:0 "[SCOPE.sCountry('gbr_scope').GetName]赠与纽芬兰"
 dm_flavor.10.d:0 "如今，[SCOPE.sCountry('gbr_scope').GetName]已成为与我接壤的邻国。多年来的交好与我方地位的提升，促使其提议将纽芬兰赠与我们。"
 dm_flavor.10.f:0 "同[SCOPE.sCountry('gbr_scope').GetName]修好是既定国策；我们的目光将投向更远之处。"
 dm_flavor.10.a:0 "收下纽芬兰。"

 dm_alaska_and_daming:0 "勃固的大明"
 dm_alaska_and_zdaming_reason:0 "[SCOPE.GetRootScope.GetCountry.GetName]必须推行改革，为民生与国家建设而努力。"
 dm_flavor.11.t:0 "国庆日"
 dm_flavor.11.d:0 "统一奥地利后，[SCOPE.sCountry('gbr_scope').GetName]迎来了首个国庆日。"
 dm_flavor.11.f:0 "今日，[SCOPE.sCountry('gbr_scope').GetName]诞生，举国欢庆。升旗礼、议政会与夜间庆典相继举行；人们相信，只要同心协力，新国家终将走向繁荣。"
 dm_flavor.11.a:0 "共庆立国之日。"
 dm_flavor.12.t:0 "国民教育的提高"
