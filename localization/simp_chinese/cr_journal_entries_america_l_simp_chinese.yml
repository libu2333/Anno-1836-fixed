 je_cr_russian_america_resolve_the_chain: "待定"
 je_cr_russian_america_colonise_alaska_button: "鼓励阿拉斯加殖民"
 je_cr_russian_america_colonise_alaska_button_desc: "由于偏远与人口稀少，我们对阿拉斯加的控制十分脆弱。若欲巩固对阿拉斯加的控制，应鼓励更多定居。\n\n撤销此项或与俄属加利福尼亚相关行动有#variable 6个月#!冷却。"
 je_cr_russian_america_colonise_alaska_stop_button: "停止鼓励阿拉斯加殖民"
 je_cr_russian_america_colonise_alaska_stop_button_desc: "我们目前正在鼓励阿拉斯加殖民。但随着优先级变化，我们可暂时中止该项目。\n\n撤销此项或与俄属加利福尼亚相关行动有#variable 6个月#!冷却。"
 je_cr_russian_america_colonise_california_button: "鼓励加利福尼亚殖民"
 je_cr_russian_america_colonise_california_button_desc: "阿拉斯加领土富含毛皮与其他资源，但耕地贫瘠，且偏远使其补给几乎不可能。若欲发展殖民地，应向南看向加利福尼亚丰富的农业土地，以保障阿拉斯加的粮食供应与未来繁荣。\n\n撤销此项或与俄属加利福尼亚相关行动有#variable 6个月#!冷却。"
