 # 天定命运
 manifest_destiny.1.b: "1850年妥协案"
 manifest_destiny.1.c: "人民主权原则"
 manifest_destiny_after_civil_war_tt: "美国内战爆发后，此选项将不可用。"
 manifest_destiny.4.t: "流血的[SCOPE.sState('state_popular_soveriengty').GetName]"
 manifest_destiny.4.d: "[SCOPE.sState('state_popular_soveriengty').GetName]的归属，已成为奴隶制之争的新战场。它加入联邦后，或将壮大自由事业，或将为蓄奴势力再添一处立足之地。"
 manifest_destiny.4.f: "地图上的一条界线，仍足以将一个国家分裂。"
 manifest_destiny.4.a: "将其接纳为自由州。"
 manifest_destiny_free_state_tt: "[SCOPE.sState('state_popular_soveriengty').GetName]将废除奴隶制。"
 manifest_destiny.4.b: "将其接纳为蓄奴州。"
 manifest_destiny_slave_state_tt: "[SCOPE.sState('state_popular_soveriengty').GetName]将新增被奴役的[concept_pop]。"
 manifest_destiny.5.t: "墨西哥问题"
 manifest_destiny.5.d: "得克萨斯已成为同墨西哥争端的焦点。外交上的腾挪已无济于事，共和国如今只能以武力裁决此事。"
 manifest_destiny.5.f: "格兰德河不只是一条河流；它既是主张，亦是边界，更是挑战。"
 manifest_destiny.5.a: "那便开战。"
 manifest_destiny_mexican_war_tt: "美利坚合众国将对墨西哥发起外交博弈。"
 manifest_destiny.6.t: "北方边界"
 manifest_destiny.6.d: "与英属北美的边界仍悬而未决。接受和解可使缅因与明尼苏达归入美国治下，但也有人主张以更强硬的手段推进我方主张。"
 manifest_destiny.6.flavor: "内阁中划定的边界，仍足以塑造数代人的命运。"
 manifest_destiny.6.a: "接受英国的撤让。"
 manifest_destiny.6.b: "坚持我们对缅因的主张。"
 manifest_destiny.7.t: "西南割让地"
 manifest_destiny.7.d: "墨西哥对西南地区的控制已然瓦解，亚利桑那与新墨西哥如今可纳入美国的管辖。"
 manifest_destiny.7.flavor: "地图一步步向西延展，每一步皆由条约写成。"
 manifest_destiny.7.a: "巩固新的边疆。"

 # 美墨战争及相关事件
 mexican_american.1.t: "西部购地提议"
 mexican_american.1.d: "[SCOPE.sCountry('cr_buying_country').GetName]希望购买墨西哥的北部领土。一笔优厚的付款或可使两国免于承担未来战争的代价。"
 mexican_american.1.f: "西部疆土广袤无垠，但每一处边疆皆有其价码。"
 mexican_american.1.a: "提出购买。"
 mexican_american.1.tt1: "墨西哥将在未来一年获得300万美元。"
 mexican_american.1.c: "暂且作罢。"
 mexican_american.2.t: "美国的提议"
 mexican_american.2.d: "美国使节提议购买我国北部领土。对方的金银固然可观，但所涉土地毕竟属于共和国的一部分。"
 mexican_american.2.f: "边疆纵然遥远，主权却不可轻弃。"
 mexican_american.2.a: "接受提议。"
 mexican_american.2.b: "拒绝其要求。"
 mexican_american.3.t: "西部购地案"
 mexican_american.3.d: "墨西哥接受了我方提议。西部领土将转归美国，国家的疆域由此延伸至太平洋，并向更远处铺展。"
 mexican_american.3.f: "边疆既已西移，随之而来的后果也终将显现。"
 mexican_american.3.a: "西部归我所有。"
 mexican_american.4.t: "提议遭拒"
 mexican_american.4.d: "墨西哥拒绝出售西部领土。外交途径日益狭窄，边疆问题仍未得到解决。"
 mexican_american.4.f: "被拒绝的交易，终会化作积怨。"
 mexican_american.4.a: "也罢。"
 mexican_american.5.t: "加兹登购地"
 mexican_american.5.d: "即便在大体和解之后，边界仍显得不合时宜。再行购地可取得更便于通行的南方路线，并了结余下的争端。"
 mexican_american.5.f: "地图上的寥寥数笔，足以决定铁路与帝国的走向。"
 mexican_american.5.a: "完成购地。"
 mexican_american.6.t: "瓜达卢佩-伊达尔戈条约"
 mexican_american.6.d: "墨西哥已被迫回到谈判桌前。我们必须决定胜利应止于何处：有限割让、扩张边疆，抑或以毫不克制的条件强加和平。"
 mexican_american.6.f: "胜利并不能自行解决一切，唯有经得起考验的和平才能如此。"
 mexican_american.6.a: "索取墨西哥割让地。"
 mexican_american.6.b: "索取整个北部边疆。"
 mexican_american.6.c: "强加惩罚性和约。"
 mexican_american.7.t: "对墨西哥的和解安排"
 mexican_american.7.d: "领土归属已定，但和平的代价仍待决定。向墨西哥支付赔款或能稍解怨怼；若一毛不拔，留下的将是长久的苦涩。"
 mexican_american.7.f: "和平自有代价，所争者唯在由谁承担。"
 mexican_american.7.a: "不作任何补偿。"
 mexican_american.7.b: "给予有限补偿。"
 mexican_american.7.c: "给予优厚补偿。"
 mexican_american.9.t: "德雷德·斯科特诉桑福德案"
 mexican_american.9.d: "最高法院须裁定：曾居于自由领地的被奴役者德雷德·斯科特，能否主张公民身份所赋予的保护。判决的余波必将远远越出法庭。"
 mexican_american.9.f: "法院或可代法律发言，国家却必须承受判决的后果。"
 mexican_american.9.a: "判决斯科特胜诉。"
 mexican_american.9.b: "判决桑福德胜诉。"

 # 熊旗起义
 mexican_nfm.1.t: "熊旗起义"
 mexican_nfm.1.d: "墨西哥正与美国交战，加利福尼亚的美国移民已举起自己的旗帜，并宣布成立独立共和国。"
 mexican_nfm.1.f: "一面粗陋的旗帜，亦足以宣告新秩序的降临。"
 mexican_nfm.1.a: "熊旗已经升起。"
