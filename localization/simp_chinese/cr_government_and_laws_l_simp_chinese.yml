 gov_zz_DEI_princely_state_hindu_desc2:0 "这一[Concept('concept_government_type','$NATIVE_STATE$')]是荷属东印度群岛内的一个自治[Concept('concept_subject','$PRINCELY_STATE$')]。其统治者被称为[Concept('concept_ruler','$RULER_TITLE_RAJA$')]或[Concept('concept_ruler','$RULER_TITLE_RANI$')]\n\n$TRANSFER_OF_POWER_NAME_DESC$"

