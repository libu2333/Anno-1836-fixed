 #北美毛皮贸易
 je_cr_russian_america: "俄美公司"
 je_cr_russian_america_reason: "是水獭与海狸将我们带到阿拉斯加海岸。它们珍贵的毛皮推动了向东扩张：先穿越西伯利亚，再到远东，最终跨越白令海峡进入美洲，始终追逐新的狩猎场与财富。俄美公司如今是我们帝国最遥远的前哨，从新阿尔汉格尔斯克总部控制海上毛皮贸易。\n\n然而公司未来充满不确定性：公司高度依赖向中国毛皮市场供应海獭皮，但海獭种群已显衰退迹象，尽管美洲内陆可能存在新的狩猎富集区。更麻烦的是领土的偏远性：补给与防御困难，若墨西哥人、美国人或——更糟的——英国人将目光投向此处，他们可轻易将其压倒。"

