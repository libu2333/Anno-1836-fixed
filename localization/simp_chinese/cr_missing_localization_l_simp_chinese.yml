cr_test_events.2.e:0 "乔克托"
cr_indian_removal.31.f_5_a:0 "若对原住民殖民地行使家长式权威，并确立、执行与他们沟通以及彼此沟通的公正原则，我们或许能看到他们状况的改善，这是我们长久以来徒劳期盼的。\n—#italic 密歇根州长刘易斯·卡斯#! "
cr_kazakh_events.1.t_2:0 "未驯服的草原"
cr_kazakh_events.1.d_2:0 "在欧洲俄罗斯井然有序的行省之外，是一片广袤、受风吹拂的边疆——开阔草原向远方延伸，直抵中亚烈日炙烤的群山。\n\n这些哈萨克草原目前仍只受到松散控制；游牧民与彼此分裂的部族生活于此，距离沙皇带来的“文明之手”十分遥远。然而在政府厅堂和军队队列中，要求把俄罗斯的秩序、法律与影响力深入亚洲腹地的声音正越来越响亮。"
cr_kazakh_events.1.f_2:0 "我们必须让边疆归于十字架、王冠与户籍册之下。"
cr_kazakh_events.1.a_2:0 "草原必须俯首听命。"
cr_kazakh_events.1.a_tt_2:0 "将俄罗斯的影响力扩展至中亚，并在哈萨克领土上建立持久控制。"
cr_kazakh_events.2.t_old:0 "草原上的可汗"
cr_kazakh_events.11.desc_old:0 "鄂木斯克传来令人不安的消息：据说一支数千人的哈萨克战团袭击了阿克莫林斯克边防哨所。夜色掩护下，他们包围堡垒，点燃附属建筑，压倒了规模不大的守军。援军赶到时，掠袭者早已消失在草原，只留下被夺走的补给、牲畜和数名俘虏。\n\n草原上从未见过如此大胆的行动。有人说这是普通盗匪所为；也有人再次低声提起[SCOPE.sCharacter('kenesary_scope').GetFirstName]之名——这位野心勃勃的贵族据说正在召集心怀不满的氏族。无论这次袭击是偶然还是征兆，有一点已经确定：边疆不再平静。"
cr_kazakh_events.12.desc_old:0 "袭击变得更加大胆，队伍也越来越大。边境地带再次升起烟柱，出现得太频繁、相隔得又太远，不可能只是巧合。整个平原上，旧日的对立似乎正在消退，氏族们围绕共同的篝火立下新的誓言。\n\n曾经只是低声传闻的名字，如今已颇有分量：[SCOPE.sCharacter('kenesary_scope').GetFirstName]。他原本只是一个心怀不满的小贵族，如今却把躁动不安、无家可归的人聚集到麾下，向他们许诺正义，也许是复仇。"
cr_minette_ores_events.2.desc_old:0 "[SCOPE.sState('minette_ore_state').GetName]的地质学家与实业家早已知道，地区丘陵下埋藏着规模惊人的铁矿床；但矿石含磷量过高，迄今几乎无法炼制优质钢材。\n\n然而，最近的冶金进展——最终促成#BOLD 贝塞麦法#!的问世——再次引发科学界与工业界的讨论。如果能在炉中去除或中和磷，这些曾被视为次等货的#italic 米内特矿石#!，或许能成为国家工业的支柱。"
cr_minette_ores_events.2.flavour_old:0 "只要有巧思、投资，以及科学与工业之间的协作，洛林地下的铁矿就可能孕育钢铁生产的新时代。"
