tz_flavor.11.t:0 "国庆日"
 tz_flavor.11.d:0 "统一北美后，[SCOPE.sCountry('gbr_scope').GetName]迎来了首个国庆日。"
 tz_flavor.11.f:0 "今日，[SCOPE.sCountry('gbr_scope').GetName]诞生，举国欢庆。升旗礼、议政会与夜间庆典相继举行；人们相信，只要同心协力，新国家终将走向繁荣。"
 tz_flavor.11.a:0 "共庆立国之日。"
je_national_day:0 "国庆日"
 je_national_day_reason:0 "举行首个国庆日可为[SCOPE.sCountry('gbr_scope').GetName]带来大量效忠派，并增强陆军。"
all_alaska:0 "所有国土将会增加[SCOPE.GetRootScope.GetCountry.GetName]主流文化"
national_day:0 "国庆日"
je_healthy_up:0 "国民医疗"
je_healthy_up_reason:0 "最后一项决议涉及医疗保健，要求政府增加投入，提高医保覆盖率，提升医疗服务质量，并推出新医疗保健政策，让更多人享受优质医疗服务"
je_yi_min:0 "渴望之国"
 je_yi_min_reason:0 "天智美利坚合众国虽初创不久，经济振兴与社会改革已略见成效。为充实国力、推进建设，政府应扩大移民来源，吸引更多人口前来定居。"
je_education_up:0 "国民教育"
je_education_up_reason:0 "第二项决议聚焦教育，要求政府加大投入，提升教师待遇，改善学校设施，推行新教育政策，让更多人享有优质教育。"
