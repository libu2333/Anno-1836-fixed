l_simp_chinese:
 kazakhstan_events.1.t:0 "哈萨克起义"
 kazakhstan_events.1.d:0 "哈萨克诸玉兹的反叛代表宣布在汗王 [SCOPE.sCharacter('kenesary_scope').GetFullName] 的领导下，恢复统一的 [SCOPE.sCountry('kazakh_scope').GetName]。这场起义威胁到我们在整个中亚草原的利益。"
 kazakhstan_events.1.f:0 "来自三百个部族的两万名战士跨坐在战马上，列阵于东方，准备向入侵者发起冲锋。\n\n在他们的前方，肯尼萨里汗被忠诚者在三玉兹的白毡上高高托举，宣誓只要沙皇仍敢称其土地为己有，他便绝不返回故乡。"
 kazakhstan_events.1.a:0 "召集忠诚的苏丹，镇压这场叛乱！"
 kazakhstan_events.1.b:0 "哈萨克人民绝不向侵略者屈服！"

 kazakhstan_events.2.t:0 "[SCOPE.sCharacter('kenesary_scope').GetFirstName] 的突袭"
 kazakhstan_events.2.d:0 "一支由哥萨克护送、穿越 [SCOPE.sState('akmolinsk_state').GetStateRegion.GetName] 草原的商队遭到一支训练有素的哈萨克叛军袭击，其首领为贵族 [SCOPE.sCharacter('kenesary_scope').GetFullName]。"
 kazakhstan_events.2.f:0 "他们在夜色中来袭，从四面八方扑向营地，数百骑兵骤然现身，仿佛自环绕帐篷的草海中诞生。岗哨顷刻被屠，刀剑交击，枪声四起——既有图拉兵工厂出产的制式火枪，也有来自半个大陆各处的杂式火器。\n\n喧嚣转瞬即逝，骑手消失无踪，只留下尚在冒烟的布匹，以及二十余名伤痕累累的幸存者。"
 kazakhstan_events.2.a:0 "命边境进入戒备。"
 notification_kazakhstan_ride_of_kenesary_notification_name:0 "[SCOPE.sCharacter('kenesary_scope').GetFullName] 发起起义行动"
 notification_kazakhstan_ride_of_kenesary_notification_desc:0 "叛军领袖 [SCOPE.sCharacter('kenesary_scope').GetFullName] 已对 [SCOPE.sCountry('russia_scope').GetAdjective] 及其在三玉兹的保护国展开长期军事行动。"

 kazakhstan_events.3.t:0 "寂静的草原"
 kazakhstan_events.3.d:0 "随着叛乱汗国被平定、肯尼萨里汗被处决，[ROOT.GetCountry.GetAdjective] 国家如今得以毫无争议地将力量投射至整个哈萨克土地。"
 kazakhstan_events.3.f:0 "岩石啊，哭泣！寂静啊，黎明！\n崩塌吧，傲立的峭壁！\n静止吧，欢快的溪流之歌！\n天之使者肯尼萨里已不复存在——\n他已长眠。"
 kazakhstan_events.3.a:0 "我们必须继续向突厥斯坦深入。"
 kazakhstan_events.3.b:0 "先巩固此地，再作打算。"

 kazakhstan_events.4.t:0 "哥萨克巡逻队遇袭"
 kazakhstan_events.4.d:0 "在 [SCOPE.sState('kazak_event_neighbour_state').GetStateRegion.GetName] 的一支西伯利亚哥萨克分队遭到悬挂 [SCOPE.sCharacter('kenesary_scope').GetFullName] 旗帜的哈萨克叛军骑兵伏击并屠杀。"
 kazakhstan_events.4.f:0 "到处都是混乱。这既源于不可原谅的疏忽，也源于哥萨克的怯懦——他们夸大战况，不过是为自己的失职开脱。"
 kazakhstan_events.4.a:0 "为商队向 [SCOPE.sState('kazak_event_neighbour_state').GetCountry.GetNameNoFormatting] 提供赔偿。"
 kazakhstan_events.4.b:0 "保障本土安全是哈萨克人的责任。"
 notification_kazakhstan_cossack_patrol_attacked_notification_name:0 "[SCOPE.sCountry('russia_scope').GetAdjective] 哥萨克在 [SCOPE.sState('raid_state').GetName] 遭伏击"
 notification_kazakhstan_cossack_patrol_attacked_notification_desc:0 "忠于 [SCOPE.sCharacter('kenesary_scope').GetFullName] 的叛军在 [SCOPE.sState('raid_state').GetName] 袭击了一支西伯利亚哥萨克巡逻队。"

 kazakhstan_events.5.t:0 "边境要塞遭劫"
 kazakhstan_events.5.d:0 "我们位于 [SCOPE.sState('kazak_event_neighbour_state').GetName] 草原的一座要塞遭到 [SCOPE.sCharacter('kenesary_scope').GetFullName] 率领的哈萨克叛军袭击。攻占要塞、驱散守军后，叛军无情焚毁了附近的俄国定居点。"
 kazakhstan_events.5.f:0 "侦察兵的战马缓步至昔日城门前，他所见只余废墟。灰烬覆盖着焦黑的木梁与土垒，自焚毁之日起未曾落雨，灰烬仿佛为遗迹作了封存。\n\n昔日的要塞，如今成了坟墓；昔日的驻军，只剩挥之不去的烟焦气息。"
 kazakhstan_events.5.a:0 "此难完全由当地人负责。"
 kazakhstan_events.5.b:0 "我们必须投入更多资源以保护自身利益。"
 notification_kazakhstan_fortress_raid_notification_name:0 "[SCOPE.sCountry('russia_scope').GetAdjective] 边境要塞被叛军摧毁"
 notification_kazakhstan_fortress_raid_notification_desc:0 "[SCOPE.sCharacter('kenesary_scope').GetFullName] 的部队在 [SCOPE.sState('raid_state').GetName] 袭击并焚毁了一座 [SCOPE.sCountry('russia_scope').GetAdjective] 边境要塞。"

 victoria.1.d:"国王威廉四世驾崩，其侄女 [SCOPE.sCharacter('queen_victoria').GetFirstName] 即位登基。她的加冕既开启了新的统治时代，也终结了与 [SCOPE.sCountry('hannover_victoria_scope').GetNameNoFlag] 的共主邦联——在那里，她的叔父 [SCOPE.sCharacter('king_of_hanover_scope').GetFirstName] 依照继承法加冕为王。\n\n不列颠各地教堂钟声齐鸣，人群汇聚，庆祝新时代的曙光——许多人希望这将为王国带来复兴与稳定。"

 texan_war_of_independence.3.t:"圣安娜被俘！"
 texan_war_of_independence.3.d:"出人意料的是，[SCOPE.sCountry('mexico_scope').GetNameNoFlag] 的领袖——将军 [SCOPE.sCharacter('santa_anna_scope').GetFullName]——已被俘虏。他被发现躲藏在沼泽中，身着列兵制服，因部下向德州卫兵暴露其身份而被捕。\n\n如今在押的 [SCOPE.sCharacter('santa_anna_scope').GetLastNameNoFormatting] 几乎别无选择，只能谈判。有人认为我们可迫使他承认我们的独立——但也有人怀疑 [SCOPE.sCountry('mexico_scope').GetNameNoFormatting] 是否会承认在胁迫下签署的条约。无论如何，他的被俘对敌军士气是沉重打击。"
 texan_war_of_independence.3.a:"利用圣安娜促成协议。"
 texan_war_of_independence.3.b:"放他回墨西哥，我们继续战斗！"

 texan_war_of_independence.5.t:"阿拉莫的陷落"
 texan_war_of_independence.5.d:"阿拉莫陷落。在残破的教堂围墙内，[SCOPE.sCharacter('travis_scope').GetFullName] 与部下以寡敌众，苦战至弹尽枪哑，直至硝烟仿佛也为之哀悼。\n\n终局来临之时，毫无宽恕。守军尽数被屠——士兵、伤员，甚至试图投降者。使命虽失，其名将化作反抗暴政的号角。"
 texan_war_of_independence.5.a:"铭记阿拉莫！"

 kazakhstan_events.6.t:0 "忠诚阿乌勒遭屠"
 kazakhstan_events.6.d:0 "[SCOPE.sCharacter('kenesary_scope').GetFullName] 的叛军在 [SCOPE.sState('kazak_event_neighbour_state').GetName] 袭击了一批忠诚的阿乌勒，在仍效忠于 [SCOPE.sState('kazak_event_neighbour_state').GetCountry.GetNameNoFlag] 苏丹政权的哈萨克人中散播恐惧。"
 kazakhstan_events.6.f:0 "你躲在俄国卫兵身后，收着俄国人的钱，在俄国人建起的城镇中发号施令——我们又为何要向你宣誓效忠？为何要替你承受那份本属于你的恐惧？"
 kazakhstan_events.6.a:0 "他给自己的人民带来了毁灭。"
 kazakhstan_events.6.b:0 "我们必须援助忠诚的氏族。"
 notification_kazakhstan_auls_slaughtered_notification_name:0 "[SCOPE.sState('raid_state').GetName] 的哈萨克阿乌勒遭屠"
 notification_kazakhstan_auls_slaughtered_notification_desc:0 "[SCOPE.sCharacter('kenesary_scope').GetFullName] 的部队在 [SCOPE.sState('raid_state').GetName] 屠杀了忠于 [ROOT.GetCountry.GetAdjective] 所扶植高级苏丹的哈萨克阿乌勒。"

 kazakhstan_events.7.t:0 "汗王的来信"
 kazakhstan_events.7.d:0 "自称哈萨克汗王的 [SCOPE.sCharacter('kenesary_scope').GetFullName] 致信 [SCOPE.sCharacter('ruler_scope').GetFullName]，请求与 [ROOT.GetCountry.GetName] 结盟，共同对抗其在俄国与哈萨克境内的对手。"
 kazakhstan_events.7.f:0 "我一次又一次向俄国沙皇及其臣民请求和平与友谊，然而他们从未展现真诚之意。他们对我们家园的觊觎逐年加深——今年是额尔齐斯河上的俄国要塞，明年便会是萨雷苏。"
 kazakhstan_events.7.a:0 "俄国人与其附庸对我们皆是威胁。"
 kazakhstan_events.7.b:0 "我们不会卷入他的斗争。"

 kazakhstan_events.8.t:0 "哈萨克突袭被击退"
 kazakhstan_events.8.d:0 "一支忠于 [SCOPE.sCharacter('kenesary_scope').GetFullName] 的哈萨克起义军试图袭击 [SCOPE.sState('raid_state').GetName] 的一座 [ROOT.GetCountry.GetAdjective] 要塞，但被当地守军击退。"
 kazakhstan_events.8.f:0 "当骑兵出现在地平线上时，守军已严阵以待。城墙之上队列整齐，火枪齐射迎击最初的冲锋，哥萨克骑兵随即加入这场致命的舞蹈。\n\n恐怖散去后，人与战马哀嚎遍野，草原之草浸染着其子民的鲜血。"
 kazakhstan_events.8.a:0 "嘉奖士兵的英勇防御。"
 kazakhstan_events.8.b:0 "[SCOPE.sCharacter('casia_general').GetFullName] 将军应得此功。"
 notification_kazakhstan_raid_repelled_notification_name:0 "[SCOPE.sCountry('russia_scope').GetAdjective] 要塞守军击退突袭"
 notification_kazakhstan_raid_repelled_notification_desc:0 "[SCOPE.sState('raid_state').GetName] 的 [SCOPE.sCountry('russia_scope').GetAdjective] 要塞守军击退了忠于 [SCOPE.sCharacter('kenesary_scope').GetFullName] 的部队发起的突袭。"

 texan_war_of_independence.4.t:"圣安娜被俘！"
 texan_war_of_independence.4.d:"在对国家声望的沉重打击中，将军 [SCOPE.sCharacter('santa_anna_scope').GetFullName] 在 [SCOPE.sCountry('texas_scope').GetAdjectiveNoFlag] 领土内被俘——他与主力部队失散，试图返回墨西哥时在乡间被发现。\n\n在狱中，他签署了一系列条约，以获释为条件承认德州独立。尽管这些协议本质上毫无约束力，但若完全否认，或将给美国干预的借口。\n\n可以确定的是：德州的失败已终结圣安娜的权威，墨西哥必须为其野心付出代价。"
 texan_war_of_independence.4.f:"圣哈辛托之耻，将在人们心中久留。"
 texan_war_of_independence.4.a:"让这成为圣安娜的耻辱。"
 texan_war_of_independence.4.b:"谴责这份在胁迫下签署的条约。"
 texan_war_of_independence.4.c:"谴责这份在胁迫下签署的条约。"
 notification_texan_war_of_independence_mexico_accepts_treaties_of_velasco_name:"[SCOPE.sCountry('mexico_scope').GetName] 接受和平！"
 notification_texan_war_of_independence_mexico_accepts_treaties_of_velasco_desc:"[SCOPE.sCountry('mexico_scope').GetNameNoFlag] 勉强确认了 [SCOPE.sCharacter('santa_anna_scope').GetFullName] 在被俘期间签署的协议。与 [SCOPE.sCountry('mexico_scope').GetNameNoFormatting] 的冲突仍在继续。"
 notification_texan_war_of_independence_mexico_accepts_treaties_of_velasco_tooltip: "#header $notification_texan_war_of_independence_mexico_accepts_treaties_of_velasco_name$#!\n$TOOLTIP_DELIMITER$\n$notification_texan_war_of_independence_mexico_accepts_treaties_of_velasco_desc$"
 notification_texan_war_of_independence_mexico_rejects_treaties_of_velasco_name:"[SCOPE.sCountry('mexico_scope').GetName] 拒绝和平！"
 notification_texan_war_of_independence_mexico_rejects_treaties_of_velasco_desc:"[SCOPE.sCountry('mexico_scope').GetNameNoFlag] 宣布 [SCOPE.sCharacter('santa_anna_scope').GetFullName] 在被俘期间签署的协议无效。与 [SCOPE.sCountry('mexico_scope').GetNameNoFormatting] 的冲突仍在继续。"
 notification_texan_war_of_independence_mexico_rejects_treaties_of_velasco_tooltip: "#header $notification_texan_war_of_independence_mexico_rejects_treaties_of_velasco_name$#!\n$TOOLTIP_DELIMITER$\n$notification_texan_war_of_independence_mexico_rejects_treaties_of_velasco_desc$"

 texan_war_of_independence.6.t:"德州叛乱被镇压"
 texan_war_of_independence.6.d:"[SCOPE.sCountry('texas_scope').GetNameNoFlag] 的战事已告结束。叛军被击溃，其领袖四散而逃，[SCOPE.sCountry('mexico_scope').GetNameNoFlag] 的三色旗再次飘扬于北方边疆。此役代价高昂，但墨西哥重归统一，其权威重临北方辽阔平原。\n\n如今的问题在于：德州回归后应如何治理——由中央严密掌控，抑或给予一定地方自治？"
 texan_war_of_independence.6.f:"他们怀揣独立之梦而来，只留下沉寂离去。"
 texan_war_of_independence.6.a:"收紧控制——德州属于墨西哥。"
 texan_war_of_independence.6.b:"给予自治，但流放其首领。"
 texan_war_of_independence.6.c:"给予自治与和解。"
 notification_texan_war_of_independence_autonomy_and_exiles_name:"[SCOPE.sCountry('mexico_scope').GetName] 授予自治！"
 notification_texan_war_of_independence_autonomy_and_exiles_desc:"在 [SCOPE.sCountry('mexico_scope').GetName] 战胜我们之后，他们同意给予内部自治，但命令流放叛乱领袖。"
 notification_texan_war_of_independence_autonomy_and_exiles_tooltip: "#header $notification_texan_war_of_independence_autonomy_and_exiles_name$#!\n$TOOLTIP_DELIMITER$\n$notification_texan_war_of_independence_autonomy_and_exiles_desc$"
 notification_texan_war_of_independence_autonomy_no_exiles_name:"[SCOPE.sCountry('mexico_scope').GetName] 授予自治！"
 notification_texan_war_of_independence_autonomy_no_exiles_desc:"在 [SCOPE.sCountry('mexico_scope').GetName] 战胜我们之后，他们同意给予内部自治，并允许叛乱领袖留在本省。"
 texan_war_of_independence.5.f:"我绝不投降，绝不撤退……胜利或死亡。——#italic 威廉·B·特拉维斯#!"
 notification_texan_war_of_independence_remember_the_alamao_name:"铭记阿拉莫！"
 notification_texan_war_of_independence_remember_the_alamao_desc:"我们近期对 [SCOPE.sCountry('texas_scope').GetName] 的胜利不仅没有击垮他们，反而激起了更强烈的战斗意志，他们如今高喊“铭记阿拉莫！”走上战场。"
 notification_texan_war_of_independence_remember_the_alamao_tooltip: "#header $notification_texan_war_of_independence_remember_the_alamao_name$#!\n$TOOLTIP_DELIMITER$\n$notification_texan_war_of_independence_remember_the_alamao_desc$"
 russo_chinese.2.f:"我们的当务之急是将哈萨克、吉尔吉斯和塔吉克，这三个俄罗斯的忠诚附属，统合在一个国家之下，使这个区域获得安全，匪帮和盗贼不再肆虐。"
 russo_chinese.2.bb:"我的，都是我的！"
