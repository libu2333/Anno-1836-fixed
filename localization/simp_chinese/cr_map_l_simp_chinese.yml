 dlc_anno1836:"Anno 1836"
 dlc_anno1836_desc:"当历史的钟声敲响在1836年，世界尚未被笔直而僵硬的国界线所定义。山脉、河流、族群与实际统治才是真正划定疆界的力量。Anno 1836 试图回到这一历史起点，通过重绘地图与调整地区结构，让游戏世界更加贴近19世纪初真实而复杂的政治与文化格局。许多地区被重新划分与去中心化，族群与势力的分布不再受殖民边界的束缚。随着国家的扩张，新的秩序与疆界将逐渐浮现，帝国的版图也将在你的决策中不断重塑。世界依旧处于变动之中，而历史的走向，正等待着新的书写者。"
