dsk_zexu.25.t: "征服南欧"
dsk_zexu.25.d: "征服南欧"
dsk_zexu.25.f: "对南欧的征服采取了较为温和的策略。泽许帝国先派遣文化使者和商人进入意大利、希腊等南欧国家，传播泽许帝国的文化、艺术和科技成果，同时了解当地的政治、经济和社会情况。在文化渗透取得一定成果后，逐步建立起政治和经济上的影响力。最后，通过军事威慑和外交压力，使南欧各国主动归附泽许欧亚合众国，从而实现了对南欧地区的和平征服。"
dsk_zexu.25.a: "[SCOPE.GetRootScope.GetCountry.GetName]万岁"


