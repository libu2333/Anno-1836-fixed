 je_cr_don_carlos_stop_supporting_portugese_liberals_button:"停止支持[SCOPE.sCountry('don_carlos_exile_country').GetAdjectiveNoFormatting]自由派。"
 je_cr_don_carlos_stop_supporting_portugese_liberals_button_desc:"当[SCOPE.sCountry('don_carlos_exile_country').GetName]开始支持唐·卡洛斯争夺我国王位时，我们反过来支持该国的[SCOPE.sPoliticalMovement('supported_movement').GetName]。但时局可变，我们总能决定结束对[SCOPE.sPoliticalMovement('supported_movement').GetNameNoFormatting]的支持，希望[SCOPE.sCountry('don_carlos_exile_country').GetNameNoFormatting]也同样收手。"

 je_cr_ferdinando_po:"费尔南多·波的回归"
 je_cr_ferdinando_po_reason:"根据1778年与[SCOPE.sCountry('cr_fernado_po_prev_owner').GetName]签订的条约，我们获得非洲海岸[SCOPE.sState('cr_fernando_po_state').GetName]岛的所有权，然而——拿破仑战争的灾难以及随后美洲帝国的丧失——使我们对该岛的权利有所松懈。\n\n目前该岛被[SCOPE.sCountry('cr_fernado_po_owner').GetName]占领，用作打击非法奴隶贸易的基地。命运真是讽刺，当初我们正是为集中奴隶贸易活动而获得该岛。\n\n若欲扩大我们在[SCOPE.sStrategicRegion('cr_biafra').GetName]的利益，可利用与葡萄牙的条约重新夺回该岛，或寻找其他途径。无论如何，该岛都是扩展影响力的绝佳跳板。"
 je_cr_ferdinando_po_reason_old:"目前——且非法地——被[SCOPE.sCountry('cr_fernado_po_owner').GetNameNoFormatting]占领的[SCOPE.sState('cr_fernando_po_state').GetNameNoFormatting]，原于1778年由[SCOPE.sCountry('cr_fernado_po_prev_owner').GetAdjectiveNoFormatting]割让给我们，原本计划作为集中奴隶贸易活动的基地。然而拿破仑战争的灾难——当然还有随后美洲帝国的丧失——使计划落空。若欲扩大我们在[SCOPE.sStrategicRegion('cr_biafra').GetName]的利益，可利用该条约重新夺回该岛，将其作为扩展地区影响力的跳板。\n\n[SCOPE.sCountry('cr_fernado_po_owner').GetAdjectiveNoFormatting]或许不愿放弃该岛，因为它已成为其西非舰队基地，而该舰队——命运的又一讽刺——正负责镇压该地区奴隶贸易。"
 je_cr_ferdinando_po_reason_old_2:"1778年，我们以放弃对[SCOPE.sState('cr_uruguay_state').GetName]中[SCOPE.sState('cr_uruguay_state').GetPortHubName]的权利为交换，从[SCOPE.sCountry('cr_fernado_po_prev_owner').GetAdjectiveNoFormatting]手中获得[SCOPE.sState('cr_fernando_po_state').GetName]岛。原本希望将其变为美洲帝国[GetLawType('law_slave_trade').GetName]的堡垒，但美国独立战争、拿破仑战争以及随后美洲帝国的丧失，使计划化为泡影。\n\n失去目的的[SCOPE.sState('cr_fernando_po_state').GetNameNoFormatting]长期荒废，直到[SCOPE.sCountry('cr_fernado_po_owner').GetAdjectiveNoFlag]将其占有，用作西非舰队基地。于是——命运的又一讽刺——该岛如今成为镇压而非支持奴隶贸易的堡垒。\n\n这当然是最崇高的追求，但——随着我们在[SCOPE.sStrategicRegion('cr_fernando_po_region').GetName]的利益重新活跃——或许我们应强制执行对该岛的权利。"

 je_cr_ferdinando_po_complete_tooltip:"我们已重新控制#variable 费尔南多·波#!"
 je_cr_ferdinando_po_a:"诉诸原始权利"
 je_cr_ferdinando_po_a_desc:"我们将依据原始#variable 埃尔帕尔多条约#!提出法律诉求，要求将该岛割让给我们。"
 je_cr_ferdinando_po_a_desc_old:"我们将依据原始#variable 埃尔帕尔多条约#!提出法律诉求，要求将该岛割让给我们。\n成功取决于我们的[concept_relations]、他们的当前[concept_infamy]以及他们在[SCOPE.sStrategicRegion('cr_biafra').GetName]的殖民地数量。"
