 cr_canadian_indian_treaties.25.t:0 "专员[SCOPE.sCharacter('treaty_commissioner').GetLastName]空手而归"
 cr_canadian_indian_treaties.25.desc:0 "专员[SCOPE.sCharacter('treaty_commissioner').GetLastName]空手返回，因为持续战争改变了优先级，使其工作无法完成。"
 cr_canadian_indian_treaties.25.a:0 "战争，何用之有？"
 cr_canadian_indian_treaties.25.a_tt:0 "一旦和平恢复，他可重新开展工作"

 cr_canadian_indian_treaties.50.t:0 "河上之人"
 cr_canadian_indian_treaties.50.summary:0 "毛皮长期被[ROOT.GetCountry.GetCapital.GetCityHubName]上流社会视为地位与阶级的象征，然而随着中国丝绸从[SCOPE.sState('hongkong_scope').GetPortHubName]进入市场，沉重笨拙的毛皮帽迅速被轻盈飘逸的精致丝绸取代，成为这个乐观新时代的象征。\n\n但随着毛皮从社会中淡出，极度依赖[SCOPE.sCountry('cr_fur_trading_country').GetAdjectiveNoFlag]毛皮贸易的[SCOPE.sStrategicRegion('ruperts_land').GetName]也面临随之消逝的风险。"
 cr_canadian_indian_treaties.51.summary:0 "在遥远的伦敦，新时尚与变革的时代已然开启——由工业驱动的进步与繁荣时代。旧日的确定性正在消逝。上流社会不再渴望温暖奢华的精美毛皮；随着[SCOPE.sState('hongkong_scope').GetPortHubName]开放，时尚转向柔软廉价的中国丝绸——更真实地反映这个时代。\n\n世界在变，我们也必须变，因为[SCOPE.sCountry('cr_fur_trading_country').GetAdjectiveNoFlag]毛皮贸易的盈利已无法再支撑我们。"
 cr_canadian_indian_treaties.51.summary_can:0 "在遥远的伦敦，新时尚与变革的时代已然开启——由工业驱动的进步与繁荣时代。旧日的确定性正在消逝。上流社会不再渴望温暖奢华的精美毛皮；随着[SCOPE.sState('hongkong_scope').GetPortHubName]开放，时尚转向柔软廉价的中国丝绸——更真实地反映这个时代。\n\n世界在变，我们也必须变，因为[SCOPE.sStrategicRegion('canada_scope').GetName]毛皮贸易的盈利已无法再支撑我们。"
 cr_canadian_indian_treaties.50.flavour_1:0 "他是一个孤独的身影，仍勇敢穿越[SCOPE.sStrategicRegion('ruperts_land').GetNameNoFormatting]的荒野，寻找那难以捉摸的完美毛皮。或许他这样做是出于对自由的渴望？抑或仅仅是习惯？因为这已无法让他致富。曾经或许可以。但边疆几乎不变，而远在伦敦的世界却迎来新时代：进步、变革与难以想象的财富的时代。一个庆祝的时代，不再需要他毕生依托的潮湿麝香毛皮。对他而言，也不再有位置。"
 cr_canadian_indian_treaties.50.flavour_2:0 "他是逝去时代的遗物——那在[SCOPE.sStrategicRegion('ruperts_land').GetNameNoFormatting]河流上滑行的 voyageurs。贸易、讨价还价、运输——一季又一季，一年又一年，直到大雪封路。春天归来，他又重新开始。边疆不变，但外面的世界在变。他捕获的毛皮，曾经在伦敦备受追捧，如今也成了遗物。今天，他们渴望的是丝绸与棉布。狂热会过去，如同一切——他也将随之消逝。"
 cr_canadian_indian_treaties.50.flavour_3:0 "在帝国遥远的角落，粗犷的人们仍在河流与荒野中穿梭——狩猎、贸易、忍耐。只要天气允许、身体能支撑，一天又一天，甚至更多。这是一种与边疆同样古老的生活方式，基于比他处更优质、更温暖的毛皮，曾经是我们殖民地的支柱。然而贸易正在枯竭。海狸、海獭、狐狸仍如以往丰富，毛皮质量从未更好——但如今伦敦已无买家。"
 cr_canadian_indian_treaties.50.a:0 "Tempora mutantur, nos et mutamur in illis"
 cr_canadian_indian_treaties.50.a_tt:0 "#italic 时代在变，我们也随之改变。#! "
 cr_canadian_indian_treaties.50.a_tt_2:0 "[SCOPE.sStrategicRegion('canada_scope').GetName]、[SCOPE.sCountry('columbia_district').GetNameNoFlag]与[SCOPE.sStrategicRegion('ruperts_land').GetName]各处的[SCOPE.sBuilding('fur_trading_post').GetName]已耗尽并从地图移除。"
 cr_canadian_indian_treaties.51.a_tt:0 "[SCOPE.sStrategicRegion('ruperts_land').GetName]各处的[SCOPE.sBuilding('fur_trading_post').GetName]已耗尽并从地图移除。"

 cr_canadian_indian_treaties.52.a_tt:0 "[SCOPE.sCountry('fur_declining_country').GetNameNoFlag]各处的[SCOPE.sBuilding('fur_trading_post').GetName]已耗尽并从地图移除。"

 ################################
 #
 #   墨西哥叛乱
 #
 ################################
 cr_mexico_events.1.t:0 "共和国的崩溃"
 cr_mexico_events.1.desc:0 "联邦派与中央派之间旷日持久的斗争最终导致共和国实质解体。墨西哥城权威瘫痪，各省领袖接管领土，事实上已独立。\n\n在缺乏有效全国政府的情况下，墨西哥的统一仅剩形式——各省如今主权在握，制度一片混乱。"
 cr_mexico_events.1.desc_old:0 "中央派与联邦派愿景之争已将共和国撕裂。多年来，墨西哥城的法令无人理会，州长违抗命令，士兵只效忠自家指挥官。如今，维系国家的最后纽带已断裂。\n\n各省军政府纷纷宣布自治——有的打着联邦主义旗号，有的追逐自身野心。三色旗仍在飘扬，却不再统一。从宪法之争到生存之争，墨西哥已四分五裂。"
 cr_mexico_events.1.flavour:0 "曾经只有一个墨西哥，如今却有许多墨西哥。"
 cr_mexico_events.1.a:0 "共和国不复存在。"
 cr_mexico_events.1.a_tt:0 "共和国已瓦解为多个争夺权力的小国。"

 cr_mexico_events.10.t:0 "《七法》"
 cr_mexico_events.10.desc:0 "随着《七法》的颁布，联邦共和国宣告终结。墨西哥各主权州被解散，改为由首都任命总督的省。新宪法将权力集中于中央政府，废除联邦国会，并重新定义公民身份。\n\n对起草者而言，此改革在多年分裂与软弱后恢复秩序。对反对者而言，它扼杀了1824年的精神。从太平洋到海湾，反抗的回声表明，并非所有人都将平静接受这一新秩序。"
 cr_mexico_events.10.flavour:0 "共和国统一且不可分割——不再是各州联盟，而是一个统一法律之下的国家。"
 cr_mexico_events.10.a:0 "共和国不复存在。"
 cr_mexico_events.10.b:0 "共和国不复存在。"

 cr_mexico_events.15.t:0 "拉雷多会议"
 cr_mexico_events.15.desc:0 "在拉雷多镇，数个北部省的代表召开会议，讨论共和国现状。辩论聚焦《七法》及以中央统治取代联邦制的宪法秩序。许多人公开支持恢复1824年宪法，认为唯有联邦框架才能维系墨西哥遥远各省的统一。\n\n虽然此次集会并无法定权力，但其决议反映了北部各州对权力集中于墨西哥城的日益不安。"
 cr_mexico_events.15.flavour:0 "1824年宪法仍是墨西哥与其各省之间的真正契约。"
 cr_mexico_events.15.a:0 "继续关注北部动向。"
 cr_mexico_events.15.b:0 "不要管他们。"
 

 cr_mexico_events.30.t:0 "加利福尼亚起义"
 cr_mexico_events.30.desc:0 "在[SCOPE.sCountry('rebellious_tag_scope').GetNameNoFlag]，长期积压的不满终于爆发为公开叛乱。由[SCOPE.sCharacter('rebel_leader_scope').GetFullName]领导，当地议会推翻中央派总督，宣布回归联邦主义原则。叛军坚称仍忠于墨西哥，却拒绝承认来自首都的权威。\n\n目前，他们的旗帜飘扬在蒙特雷上空，由那些声称并非寻求独立、而是恢复1824年旧宪法的人们高举。"
 cr_mexico_events.30.flavour:0 "从蒙特雷到洛杉矶，呼声一致：回归旧秩序，回归各州权利。"
 cr_mexico_events.30.a:0 "妥协并承认[SCOPE.sCharacter('rebel_leader_scope').GetLastNameNoFormatting]为总督。"
 cr_mexico_events.30.a_tt:0 "若[SCOPE.sCharacter('rebel_leader_scope').GetFullName]不再担任[SCOPE.sCharacter('rebel_leader_scope').GetPrimaryRoleTitle]或动荡加剧，我们将能和平整合[SCOPE.sCountry('rebellious_tag_scope').GetName]。"
 cr_mexico_events.30.b:0 "我们不能容忍联邦主义叛乱。"
 cr_mexico_events.30.c:0 "为了加利福尼亚事业！"

 cr_mexico_events.31.t:0 "里奥阿里巴起义"
 cr_mexico_events.31.desc:0 "在[SCOPE.sState('rebellious_state_scope').GetStateRegion.GetName]偏远山谷中，不满已转为公开叛乱。不受欢迎的南方外来总督被杀，叛军现由[SCOPE.sCountry('rebellious_tag_scope').GetRuler.GetFullName]领导，控制[SCOPE.sState('rebellious_state_scope').GetCityHubName]。新税与遥远统治激怒了定居者与普韦布洛盟友，他们共同反抗墨西哥城。"
 cr_mexico_events.31.desc_old:0 "[SCOPE.sState('rebellious_state_scope').GetStateRegion.GetName]对中央政府的不满已爆发为公开叛乱。不受欢迎的南方外来总督在试图逃离[SCOPE.sState('rebellious_state_scope').GetCityHubName]时被杀。随后混乱中，西班牙裔定居者与普韦布洛印第安人混合武装在[SCOPE.sCountry('rebellious_tag_scope').GetRuler.GetFullName]领导下宣布独立。"
 cr_mexico_events.31.flavour:0 "为了上帝、国家与耶稣基督的信仰！我们捍卫的主要原则如下：1. 与上帝、国家及耶稣基督的信仰同在。2. 为获得我们所追求的胜利，流尽最后一滴血保卫祖国。3. 不接受省制计划。4. 不接受任何税收。5. 不接受那些企图制造混乱之人所欲的任何混乱。上帝与国家！圣克鲁斯德拉卡尼亚达营地，1837年8月3日。"
 cr_mexico_events.31.t_2:0 "新墨西哥起义"
 cr_mexico_events.31.desc_2:0 "[SCOPE.sState('rebellious_capital_scope').GetStateRegion.GetName]北部边疆的不满已爆发为公开叛乱。在里奥阿里巴沿线村庄，受不满民兵军官领导的当地武装已起兵反抗中央政府统治。新税、征兵与对遥远权威的怨恨激起民众武装。\n\n叛军已占领奇马约，呼吁回归联邦主义与地方自治。尽管人数不多，若不迅速镇压，他们的抗争可能激励其他省份。"
 cr_mexico_events.31.flavour_2:0 "为了上帝、国家与耶稣基督的信仰！我们捍卫的主要原则如下：1. 与上帝、国家及耶稣基督的信仰同在。2. 为获得我们所追求的胜利，流尽最后一滴血保卫祖国。3. 不接受省制计划。4. 不接受任何税收。5. 不接受那些企图制造混乱之人所欲的任何混乱。上帝与国家！圣克鲁斯德拉卡尼亚达营地，1837年8月3日。"
 cr_mexico_events.31.a:0 "镇压叛乱，恢复秩序。"
 cr_mexico_events.31.b:0 "寻求和解——承诺改革以安抚边疆。"

 cr_mexico_events.32.t:0 "格兰德河共和国"
 cr_mexico_events.32.desc:0 "在[SCOPE.sState('rebellious_state_scope').GetStateRegion.GetName]北部边疆省，联邦主义呼声已转为公开对抗。由[SCOPE.sCharacter('rebel_leader_scope').GetFullName]领导的地方领袖宣布成立新共和国——他们声称这并非反对墨西哥，而是反对首都的暴政。\n\n他们的旗帜吸引了民兵、牧场主与前军官：恢复1824年联邦宪法。无论这个“[SCOPE.sCountry('rebellious_tag_scope').GetNameNoFlag]共和国”能否持久，或在沙漠风中消逝，都取决于我们行动的速度。"
 cr_mexico_events.32.desc_2:0 "在塔毛利帕斯、科阿韦拉与新莱昂北部省份，联邦派武装宣布成立新州——格兰德河共和国。由地方军官与公民领袖领导，该运动谴责中央集权，誓言恢复1824年宪法秩序。\n\n从拉雷多平原到布拉沃河岸，反叛旗帜现已升起。尽管新共和国资源有限，其事业在边疆引起强烈共鸣。"
 cr_mexico_events.32.flavour:0 "三个省份在联邦主义旗帜下团结一致。"
 cr_mexico_events.32.a:0 "在叛乱扩散前镇压它。"
 cr_mexico_events.32.b:0 "寻求与北部各省和解。"
 cr_mexico_events.32.c:0 "格兰德河共和国万岁！"

 cr_mexico_events.33.t:0 "索诺拉起义"
 cr_mexico_events.33.desc:0 "在遥远的西北，再次爆发动乱。[SCOPE.sCharacter('rebel_leader_scope').GetFullName]——一位曾效忠墨西哥的前将军——在[SCOPE.sState('rebellious_state_scope').GetStateRegion.GetName]以联邦主义名义起兵。他谴责中央派政权，呼吁恢复1824年宪法与各州权利。\n\n在同情政客与士兵支持下，他的运动已蔓延索诺拉，并向锡那罗亚推进，希望号召更多人加入。旧日革命旗帜再次在北部沙漠飘扬。"
 cr_mexico_events.33.flavour:0 "他曾为保卫共和国而战——如今为重塑它而战。"
 cr_mexico_events.33.a:0 "向北方增派援军。"
 cr_mexico_events.33.b:0 "以赦免换取和平。"
 cr_mexico_events.33.c:0 "联邦万岁！"

 cr_mexico_events.34.t:0 "塔巴斯科起义"
 cr_mexico_events.34.desc:0 "[SCOPE.sCountry('rebellious_tag_scope').GetNameNoFlag]州已武装起义。不满中央派统治，并受各地动乱鼓舞，当地武装驱逐联邦驻军，宣布效忠1824年宪法。\n\n虽然规模较其他叛乱小，但塔巴斯科的抗争体现了熟悉的斗争——地方自治与中央集权共和国需求之间的冲突。此次叛乱是扩散还是平息，或许取决于政府回应。"
 cr_mexico_events.34.flavour:0 "格里哈尔瓦河上的一点火星，或将点燃全国。"
 cr_mexico_events.34.a:0 "立即镇压此叛乱。"
 cr_mexico_events.34.b:0 "与地方领袖谈判。"

 cr_mexico_events.35.t:0 "尤卡坦分离"
 cr_mexico_events.35.desc:0 "在遥远的[SCOPE.sState('rebellious_state_scope').GetStateRegion.GetName]半岛，[SCOPE.sState('rebellious_state_scope').GetCityHubName]与[SCOPE.sCountry('mexico_scope').GetCapital.GetCityHubName]之间长期紧张已到临界点。当地议会援引最初联合条款，宣布尤卡坦对共和国的效忠仅限于联邦制。\n\n鉴于中央派政权已解散该契约，[SCOPE.sCountry('rebellious_tag_scope').GetNameNoFlag]现宣布分离，直至恢复1824年宪法。民兵已控制半岛，回归联邦主义的呼声响彻大地。"
 cr_mexico_events.35.flavour:0 "尤卡坦人民在充分行使主权下，成为脱离墨西哥国家的自由独立共和国……"
 cr_mexico_events.35.a:0 "以武力重申权威。"
 cr_mexico_events.35.b:0 "谈判恢复联邦制。"
 cr_mexico_events.35.c:0 "尤卡坦联邦共和国万岁！"

 cr_mexico_events.40.t:0 "[SCOPE.sState('rebellious_state_scope').GetNameNoFormatting]起义"
 cr_mexico_events.40.desc:0 "对中央派政权的不满已爆发为公开叛乱。在[SCOPE.sCountry('rebellious_tag_scope').GetNameNoFlag]，地方领袖摆脱[SCOPE.sCountry('mexico_scope').GetCapital.GetCityHubName]权威，宣布效忠1824年宪法。\n\n他们的旗帜并非分离主义，而是他们认为被背叛的共和国——受联邦原则与各省权利约束的共和国。"
 cr_mexico_events.40.desc2:0 "对中央派政权的不满已爆发为公开叛乱。在[SCOPE.sCountry('rebellious_tag_scope').GetNameNoFlag]，地方领袖拒绝[SCOPE.sCountry('mexico_scope').GetCapital.GetCityHubName]权威，宣布效忠1824年宪法。\n\n他们的反抗源于信念而非野心，反映共和国更深层的分裂——要求自治的各省与坚持统一的中央之间。"
 cr_mexico_events.40.desc3:0 "对中央派政权的不满引发叛乱。在[SCOPE.sCountry('rebellious_tag_scope').GetNameNoFlag]，地方领袖反抗[SCOPE.sCountry('mexico_scope').GetCapital.GetCityHubName]权威，集结于1824年宪法旗帜下。\n\n他们的立场虽源于信念或需要，却反映墨西哥共和国核心持久的分裂。"
 cr_mexico_events.40.desc4:0 "对中央派政权的不满已爆发为公开叛乱。在[SCOPE.sCountry('rebellious_tag_scope').GetNameNoFlag]，地方领袖摆脱[SCOPE.sCountry('mexico_scope').GetCapital.GetCityHubName]权威，宣布效忠1824年宪法。\n\n他们的旗帜并非分离主义，而是他们认为被背叛的共和国——受联邦原则与各省权利约束的共和国。"
 cr_mexico_events.40.desc5:0 "在[SCOPE.sCountry('rebellious_tag_scope').GetNameNoFlag]，中央权威与地方自治之争再次诉诸武力。当地领袖拒绝[SCOPE.sCountry('mexico_scope').GetCapital.GetCityHubName]法令，集结于1824年宪法旗帜下起兵。\n\n无论源于信念或需要，他们的立场唤起国家初年未竟的辩论。"
 cr_mexico_events.40.desc6:0 "[SCOPE.sCountry('rebellious_tag_scope').GetNameNoFlag]中央权威与地方自治之争再度爆发。当地领袖谴责[SCOPE.sCountry('mexico_scope').GetCapital.GetCityHubName]法令，武装捍卫1824年宪法。\n\n无论源于信念或需要，他们的立场反映墨西哥共和国核心持久的分裂。"
 cr_mexico_events.40.flavour:0 "从一省到下一省，1824年的回声拒绝消逝。"

 cr_mexico_events.50.t:0 "来自北方的涌入"
 cr_mexico_events.50.desc:0 "加利福尼亚小径的开通带来持续不断的外国定居者涌入北部各省。马车队从内华达山脉而下，满载寻求土地与财富的美国人。他们的到来表明，曾经遥远的边疆如今与[SCOPE.sCountry('usa_scope').GetNameNoFlag]不安分的野心相连。\n\n在这股潮流中，一位瑞士移民[SCOPE.sCharacter('john_sutter_scope').GetFullName]提出解决方案：在萨克拉门托建立私人殖民地，受墨西哥权威管辖。他承诺开垦土地、维持秩序、防范占地者、部落与敌对势力——在政府影响力薄弱的边疆建立稳定前哨。"
 cr_mexico_events.50.flavour:0 "要守住北方，首先必须人口充实并加以保护。"
 cr_mexico_events.50.a:0 "授予萨特土地特许与法律支持。"
 cr_mexico_events.50.b:0 "拒绝——外国私人殖民地威胁主权。"
 cr_mexico_events.50.c:0 "相反，推动墨西哥定居。"
 notification_mex_john_sutters_colony_name:0 "加利福尼亚土地特许"
 notification_mex_john_sutters_colony_desc:0 "面对大量[SCOPE.sCountry('usa_scope').GetAdjective]定居者涌入，加利福尼亚总督[SCOPE.sCharacter('california_governor_scope').GetName]已授权向[SCOPE.sCharacter('john_sutter_scope').GetName]授予大片土地。此举旨在遏制外国移民潮，并通过私人企业为边疆带来秩序。"
 notification_mex_john_sutters_colony_USA_name:0 "加利福尼亚外国特许"
 notification_mex_john_sutters_colony_USA_desc:0 "来自西部的报告称墨西哥加利福尼亚实施新限制。为应对越来越多[ROOT.GetAdjective]定居者越过内华达山，当地当局已向外国人[SCOPE.sCharacter('john_sutter_scope').GetName]授予大片土地，授权其管辖该地区并阻止进一步移民。"

 cr_mexico_events.65.t:0 "熊旗起义"
 cr_mexico_events.65.desc:0 "北加利福尼亚[SCOPE.sCountry('usa_scope').GetAdjectiveNoFlag]定居者的不满已爆发为公开反抗。他们夺取索诺玛小要塞，一群武装殖民者宣布成立独立共和国——一面粗糙的熊与星旗帜取代了墨西哥国旗。\n\n尽管人数不多，叛军装备精良，并受边疆各地动乱鼓舞。当地当局请求增援，警告若不迅速恢复秩序，外国冒险者可能直接夺取该省。"
 cr_mexico_events.65.flavour:0 "熊旗飘扬在索诺玛。有些人称之为自由——其他人称之为无法无天。"
 cr_mexico_events.65.a:0 "立即镇压此叛乱。"
 cr_mexico_events.65.b:0 "我们现在无法处理此事。"

 ####
 #下加拿大叛乱
 ####
 cr_lower_canada_rebellion.01.t:0 "爱国者威胁"
 cr_lower_canada_rebellion.01.desc:0 "随着[SCOPE.gsInterestGroup('cr_canadian_liberals').GetNameNoIcon]在议会选举中获胜、发布#variable 92项决议#! 并实施税抗，[SCOPE.sCulture('franco_canadian_culture').GetName]人的日益激进令部分[SCOPE.sCulture('anglo_canadian_culture').GetName]人担忧，害怕该殖民地在[SCOPE.sCountry('cr_lower_canada_overlord').GetAdjective]统治下的未来。\n\n为保护[SCOPE.sCountry('cr_lower_canada_overlord').GetAdjectiveNoFormatting]统治的未来，各路[SCOPE.sCulture('anglo_canadian_culture').GetNameNoFormatting]人开始组织志愿民兵，自称#variable 不列颠步枪团#! 。他们准备在必要时镇压[SCOPE.gsInterestGroup('cr_canadian_liberals').GetNameNoFormatting]威胁。"
 cr_lower_canada_rebellion.01.flavour:0 "我们的目标是捍卫大不列颠与下加拿大之间的联系，维护宪法赋予我们的权利与特权不受损害。"
 cr_lower_canada_rebellion.01.a:0 "[SCOPE.gsInterestGroup('cr_canadian_liberals').GetNameNoFormatting]并非真正威胁"
 cr_lower_canada_rebellion.01.b:0 "拥有一些激进分子总是很有用"

 cr_lower_canada_rebellion.02.t:0 "号召所有忠诚的不列颠人"
 cr_lower_canada_rebellion.02.desc:0 "从[ROOT.GetCountry.GetCapital.GetCityHubName]的茶肆传出传闻：被禁的不列颠步枪俱乐部前成员已重新集结，组成新“政治协会”。这个所谓$variable 多里克俱乐部#! 公开宣称保护殖民地[SCOPE.sCulture('anglo_canadian_culture').GetName]利益，对抗[SCOPE.gsInterestGroup('cr_canadian_liberals').GetNameNoFormatting]的破坏。\n\n与被禁的不列颠步枪俱乐部惊人相似，这个新组织——实质上是民兵——似乎得到[SCOPE.gsInterestGroup('cr_canadian_armed_forces').GetLeader.GetFullName]的强力庇护，且拥有大量[SCOPE.gsInterestGroup('cr_canadian_armed_forces').GetNameNoIcon]成员。"
 cr_lower_canada_rebellion.02.flavour:0 "若英国政府与英国人民抛弃我们，我们宁愿以自己的右臂争取解放，也不愿屈从于法裔加拿大共和国的屈辱。"
 cr_lower_canada_rebellion.02.a:0 "换个名字的柠檬味道一样酸"
 cr_lower_canada_rebellion.02.b:0 "我们欣赏这些人的忠诚"

 cr_lower_canada_rebellion.03.t:0 "入伍！"
 cr_lower_canada_rebellion.03.desc:0 "“入伍拯救帝国！”“入伍拯救教会！”“入伍拯救不列颠文明！”\n\n#variable 不列颠步枪团#! 已在[SCOPE.sCulture('anglo_canadian_culture').GetName]青年中展开激进招募，利用对[SCOPE.gsInterestGroup('cr_canadian_liberals').GetNameNoIcon]可能夺权、推翻君主制、教会与不列颠生活方式旧秩序的恐惧。"
 cr_lower_canada_rebellion.03.flavour:0 "flavour"
 cr_lower_canada_rebellion.03.a:0 "opt a"
 cr_lower_canada_rebellion.03.b:0 "opt b"

 cr_lower_canada_rebellion.04.t:0 "旗帜游行"
 cr_lower_canada_rebellion.04.desc:0 "一群与#variable 不列颠步枪团#! 有关的年轻人，高举[SCOPE.sCountry('cr_lower_canada_overlord').GetAdjectiveNoFlag]旗帜，在笛鼓声中骄傲行进，自发组织了一场穿越[ROOT.GetCountry.GetCapital.GetCityHubName]街道的旗帜游行。\n\n这座城市在[SCOPE.sCulture('anglo_canadian_culture').GetName]人与[SCOPE.sCulture('franco_canadian_culture').GetName]人之间深刻分裂，是保皇派与[SCOPE.gsInterestGroup('cr_canadian_liberals').GetNameNoFormatting]的政治温床。如今，在当局注视下，这些人宣布打算进入一个深受[SCOPE.sCulture('franco_canadian_culture').GetName]影响的街区。"
 cr_lower_canada_rebellion.04.flavour:0 "flavour"
 cr_lower_canada_rebellion.04.a:0 "但愿我们能做些什么……"
 cr_lower_canada_rebellion.04.a_tt:0 "此选项因你未投资[concept_institution_police]机构而可用。"
 cr_lower_canada_rebellion.04.b:0 "或许他们该在别处继续游行……"
 cr_lower_canada_rebellion.04.b_tt:0 "此选项因你已启用[GetLawType('law_right_of_assembly').GetName]或[GetLawType('law_protected_speech').GetName] $concept_laws$，且至少一级投资[concept_institution_police]机构而可用。"
 cr_lower_canada_rebellion.04.c:0 "他们的游行权受保护，必要时以武力维护"
 cr_lower_canada_rebellion.04.c_tt:0 "此选项因你已启用[GetLawType('law_right_of_assembly').GetName]或[GetLawType('law_protected_speech').GetName] $concept_laws$ 而可用。"
 cr_lower_canada_rebellion.04.d:0 "我竟不知他们一开始就有游行许可……"
 cr_lower_canada_rebellion.04.d_tt:0 "此选项因你已启用[GetLawType('law_outlawed_dissent').GetName]或[GetLawType('law_censorship').GetName] $concept_laws$ 而可用。"

 cr_lower_canada_rebellion.05.t:0 "[TimeKeeper.GetDate.GetString]蒙特利尔骚乱"
 cr_lower_canada_rebellion.05.desc:0 "当#variable 不列颠步枪团#! 行进至[ROOT.GetCountry.GetCapital.GetCityHubName]的[SCOPE.sCulture('franco_canadian_culture').GetName]街区时，不久便遭遇人群初起的嘲笑。第一阵嘲笑被他们以骄傲的冷脸相对，但随着越来越多的人聚集，紧张局势很快爆发。第一块石头不知从何而来，却成为双方开战的信号。\n\n拳脚相加，殴打不断，窗户碎裂处处。"
 cr_lower_canada_rebellion.05.flavour:0 "flavour"
 cr_lower_canada_rebellion.05.a:0 "未来的预兆"

 cr_lower_canada_rebellion.05.desc_b:0 "当#variable 不列颠步枪团#! 行进至[ROOT.GetCountry.GetCapital.GetCityHubName]的[SCOPE.sCulture('franco_canadian_culture').GetName]街区时，不久便遭遇人群初起的嘲笑。第一阵嘲笑被他们以骄傲的冷脸相对，但随着越来越多的人聚集，紧张局势很快爆发。第一块石头不知从何而来，却成为双方开战的信号。\n\n拳脚相加，殴打不断，窗户碎裂处处。\n\n聚集的治安队旁观无措，人数太少，无法对抗人群、改变局面。"
 cr_lower_canada_rebellion.05.flavour_b:0 "flavour"
 cr_lower_canada_rebellion.05.b:0 "未来的预兆"

 cr_lower_canada_rebellion.06.t:0 "[TimeKeeper.GetDate.GetString]蒙特利尔游行"
 cr_lower_canada_rebellion.06.desc:0 "进入[SCOPE.sCulture('franco_canadian_culture').GetName]街区的道路被阻后，#variable 不列颠步枪团#! 转而在[ROOT.GetCountry.GetCapital.GetCityHubName]主干道行进。在那里，他们受到[SCOPE.sCulture('anglo_canadian_culture').GetName]同胞的欢呼与桂冠，围观人群不断壮大，似乎很欣赏该团带来的保护与秩序感。"
 cr_lower_canada_rebellion.06.flavour:0 "flavour"
 cr_lower_canada_rebellion.06.a:0 "未来的预兆"

 cr_lower_canada_rebellion.06.desc_b:0 "当#variable 不列颠步枪团#! 行进至[SCOPE.sCulture('franco_canadian_culture').GetName]街区时，空气中弥漫着沿街列队的治安队压迫感，偶尔的嘲笑被笛鼓声淹没，扔石者迅速被捕，对聚集人群而言，谁主宰了旋律已无可逃避。"
 cr_lower_canada_rebellion.06.flavour_b:0 "flavour"
 cr_lower_canada_rebellion.06.b:0 "未来的预兆"

 cr_lower_canada_rebellion.10.t:0 "[ROOT.GetCountry.GetCapital.GetCityHubNameNoFormatting]最后一位[SCOPE.sCulture('franco_canadian_culture').GetNameNoFormatting]"
 cr_lower_canada_rebellion.10.desc:0 "每天他都身着精心打扮——红色毛帽与腰带、白色棉衫、宽边帽上饰红白绿三色徽章——站在[ROOT.GetCountry.GetCapital.GetCityHubName]的演讲角。每天他宣讲久远时代的信息。每天相同的人经过，信息无人倾听。他的法语几乎成失传之语。他自称是[ROOT.GetCountry.GetCapital.GetCityHubName]最后一位[SCOPE.sCulture('franco_canadian_culture').GetNameNoFormatting]。\n\n虽然尚未到此地步，但[ROOT.GetCountry.GetCapital.GetCityHubNameNoFormatting]正站在十字路口，[SCOPE.sCulture('anglo_canadian_culture').GetName]人的涌入正将[SCOPE.sCulture('franco_canadian_culture').GetNameNoFormatting]文化不断推向边缘。"
 cr_lower_canada_rebellion.10.flavour:0 "Flavour"
 cr_lower_canada_rebellion.10.a:0 "时代在变，我们也随之改变"
 cr_lower_canada_rebellion.10.b:0 "对法裔加拿大人来说是积极的一面"

 cr_lower_canada_rebellion.11.t:0 "通往美洲的门户"
 cr_lower_canada_rebellion.11.desc:0 "繁忙且快速成长的[ROOT.GetCountry.GetCapital.GetCityHubName]正发展为[SCOPE.sCountry('cr_lower_canada_overlord').GetAdjective]北美枢纽。它控制通往五大湖的所有贸易，因此有望成为通往美洲的门户，与纽约竞争。"
 cr_lower_canada_rebellion.11.flavour:0 "Flavour"
 cr_lower_canada_rebellion.11.a:0 "时代在变，我们也随之改变"
 cr_lower_canada_rebellion.11.b:0 "对法裔加拿大人来说是积极的一面"

 cr_lower_canada_rebellion.12.t:0 "革命的幽灵"
 cr_lower_canada_rebellion.12.desc:0 ""
 cr_lower_canada_rebellion.12.flavour:0 ""
 cr_lower_canada_rebellion.12.a:0 "换个名字的柠檬味道一样酸"
 cr_lower_canada_rebellion.12.b:0 "我们欣赏这些人的忠诚"

