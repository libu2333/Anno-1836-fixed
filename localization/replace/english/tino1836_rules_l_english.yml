l_english:

 rule_tino_start_rules:0 "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],rule_tino_start_rules_claim #high Qing Starting Situation#!#!#!"
 rule_tino_start_rules_claim:0 "@warning!#v Statement:#!#v The author firmly supports national unity and opposes all acts of national division.#! All generalships, regions, governorates, native chieftaincies, unclaimed lands, and tribes in the game #v that fall within the Qing realm are integral parts of Qing territory, Qing governance, and the unified state.#!\n\nThe game's mechanics use countries, and only countries, as their basic units. This makes it difficult to simulate interactions between central and local authorities within a unified polity, namely [concept_inner_soverignty]. This design is therefore necessary to implement the mod's content."
 setting_great_unification:0 "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],setting_great_unification_mini_desc #high A Unified Realm#!#!#!"
 setting_great_unification_desc:0 "The Great Qing begins as a unified polity."
 setting_great_unification_mini_desc:0 "This option makes much of Yuqing's content unavailable.\nDecisions will be provided to integrate Tibet, Sakhalin, and other regions."
 setting_cogovernance_of_five_region:0 "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],setting_cogovernance_of_five_region_mini_desc #high Five-Region Governance#!#!#!"
 setting_cogovernance_of_five_region_desc:0 "At the start, the four regions outside the central government are governed by generals loyal to the center, under the leadership of the Qing court."
 setting_cogovernance_of_five_region_mini_desc:0 "This option makes some of Yuqing's content unavailable.\nThe three generalships of Ili, Uliastai, and Heilongjiang will be released, while the Tibetan local government is retained."
 setting_direct_administration_of_the_kingtsi:0 "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],setting_direct_administration_of_the_kingtsi_mini_desc #high Metropolitan Administration#!#!#!"
 setting_direct_administration_of_the_kingtsi_desc:0 "At the start, the central government holds the Central Plains. Other regions are governed by generals, religious and secular officials, and governors-general loyal to the central government."
 setting_direct_administration_of_the_kingtsi_mini_desc:0 "This is Yuqing's standard option and provides access to most of its content.\nAlongside the frontier generals, the southern governorates of Guangdong, Sichuan, Jiangsu, Hunan, Zhejiang, and Yunnan, and the northern Shaanxi governorate, will be released."
 setting_empire_of_the_dawn:0 "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],setting_empire_of_the_dawn_mini_desc #high Empire on the Eve#!#!#!"
 setting_empire_of_the_dawn_desc:0 "@warning!This option is not yet available. Please stay tuned.\nAt the start, all premodern regions outside metropolitan administration are governed by local leaders, including native chieftains and tribes. They accept imperial investiture and await replacement by regular administration."
 setting_empire_of_the_dawn_mini_desc:0 "The complete experience! This rule enables all of Yuqing's content, including the struggle over the Sichuan frontier and the replacement of native chieftains with regular officials.\nAlongside the central government, generals, and governors-general, all native chieftaincies, tribes, and unclaimed territories will be released."
