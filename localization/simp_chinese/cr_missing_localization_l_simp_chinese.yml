cr_test_events.2.e:0 "乔克托"
cr_indian_removal.31.f_5_a:0 "若能在原住民殖民地施行父亲般的权威，并确立且切实执行同他们交往、以及他们彼此交往的公正规则，我们或可望见其境况改善；而这正是我们久望而不得的结果。——#italic 密歇根总督刘易斯·卡斯#!"
cr_kazakh_events.1.t_2:0 "未驯的草原"
cr_kazakh_events.1.d_2:0 "在欧洲俄国井然有序的行省之外，横亘着一片辽阔而朔风凛冽的边地；无尽草原一路延向中亚炽热山峦。\n\n这些哈萨克草原至今仍由游牧民和分裂部族松散掌控，远离沙皇所谓文明之手。然而在官署与军营中，要求将俄国秩序、俄国法律与俄国影响力深入亚洲腹地的呼声正日益高涨。"
cr_kazakh_events.1.f_2:0 "必须让十字架、王冠与户籍册一同越过边疆。"
cr_kazakh_events.1.a_2:0 "草原必须俯首。"
cr_kazakh_events.1.a_tt_2:0 "将俄国影响力深入中亚，并在哈萨克地区建立持久统治。"
cr_kazakh_events.2.t_old:0 "草原之汗"
cr_kazakh_events.11.desc_old:0 "鄂木斯克传来令人不安的消息：一支据称数千人的哈萨克武装袭击了阿克莫林斯克边防哨所。他们趁夜围困堡垒，纵火焚烧附属营房，并压倒了寡少守军。援军抵达时，袭者早已遁去，只带走补给、牲畜和数名俘虏。\n\n草原上从未有过如此胆大的举动。有人说这不过是寻常匪徒所为；也有人再度低声提起[SCOPE.sCharacter('kenesary_scope').GetFirstName]之名。无论此袭是偶然还是预兆，边地都已不再安宁。"
cr_kazakh_events.12.desc_old:0 "袭掠愈发大胆，队伍也愈发庞大。边地再次升起浓烟，次数之多、地点之远，已不可能只是巧合。平原上旧日仇怨仿佛淡去，新的誓言则在共燃的篝火旁缔结。\n\n从前只是低语的名字如今已有分量：[SCOPE.sCharacter('kenesary_scope').GetFirstName]。他曾是满怀不平的小贵族，如今却吸引了躁动者与失意者，向他们许诺正义，或许还有复仇。"
cr_minette_ores_events.2.desc_old:0 "[SCOPE.sState('minette_ore_state').GetName]的地质学家与实业家早已知晓，群山之下埋藏着规模惊人的铁矿层；但其磷含量过高，长期以来几乎无法用来炼制优质钢材。\n\n近来的冶金进展，尤其是#BOLD 贝塞麦炼钢法#!的问世，引起了科学界与工业界的新争论。若能在炉中除去或中和磷质，这些曾被视为劣矿的#italic 米内特铁矿#!，或将成为国家工业的支柱。"
cr_minette_ores_events.2.flavour_old:0 "若才智、资本与科学同工业能够协力，洛林地下的铁便可开启炼钢的新纪元。"
