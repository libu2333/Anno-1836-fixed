 ####
 cr_russian_alaska_events.1.t:0 "《桅杆前的两年》"
 cr_russian_alaska_events.1.d_russia:0 "波士顿的出版社推出了一部新小说，详细描绘了加利福尼亚皮革贸易，通过一艘从马萨诸塞经合恩角前往加利福尼亚的双桅帆船上的日常生活展现。\n\n但在华丽的文字背后隐藏着一个不幸的事实：该船的货物几乎全部是#! #italic 牛皮#!  #bold ，而非我们罗斯堡贸易站如此依赖的 #! #italic 海獭皮#!  #bold 。"
 cr_russian_alaska_events.1.d:0 "一部来自波士顿的新小说生动讲述了加利福尼亚海岸及其支撑的皮革贸易。然而在字里行间，却为我们的命运敲响警钟：美国双桅船的货舱里装的不是海獭皮，而是牛皮。\n\n真相如今公之于世：海獭已几乎从[SCOPE.sState('our_california').GetStateRegion.GetName]海岸绝迹。曾经支撑罗斯堡殖民地的贸易正在消亡。有人主张在它彻底耗尽我们的财库前放弃该据点；有人建议转向农业，为我们在[SCOPE.sState('alaska').GetStateRegion.GetName]的定居点提供补给。"
 cr_russian_alaska_events.1.d5:0 "[SCOPE.sState('our_california').GetStateRegion.GetName]海岸的过度捕猎导致海獭种群崩溃。\n\n由于海獭皮贸易曾是殖民地的命脉，有人主张放弃该地，有人建议建立农业殖民地为[SCOPE.sState('alaska').GetName]提供补给。"
 cr_russian_alaska_events.1.d2:0 "[SCOPE.sState('our_california').GetStateRegion.GetName]海岸的过度捕猎导致海獭种群崩溃，我们在那里的存在前景变得渺茫。\n\n有人提议尝试建立农业殖民地为我们在[SCOPE.sState('alaska').GetName]的据点提供补给，但也有人主张直接放弃该据点。"
 cr_russian_alaska_events.1.d3:0 "我们在[SCOPE.sState('our_california').GetStateRegion.GetName]的前景目前存疑。正如一部新出版的小说所公开披露，过度捕猎导致曾经盈利的海獭种群崩溃，罗斯堡的存在正是依赖于此。\n\n有人提议尝试建立农业殖民地为我们在[SCOPE.sState('alaska').GetName]的据点提供补给，但也有人主张放弃该据点。"
 cr_russian_alaska_events.1.d4:0 "波士顿出版的一部小说为我们的罗斯堡贸易站带来令人沮丧的消息：小说描述了一艘从马萨诸塞经合恩角前往加利福尼亚的双桅船往返从事利润丰厚的加州皮革贸易。但在华丽的文字中隐藏着一个不幸真相：该船运载的是#bold 牛皮#! ，而非罗斯堡贸易站如此依赖的#bold 海獭皮#! ……"
 cr_russian_alaska_events.1.f:0 "当我们封好舱口，从旧金山大湾起航时，所有人都为收获的丰厚货物而兴奋；底舱塞满了超过四万张牛皮与三万只牛角。回到波士顿，我们知道丰厚的回报在等待。然而我们仅获得几桶珍贵的海獭与海狸皮，不免感到一丝悲哀。我们被告知，能拿到这些已是幸运。几年前每季轻松就能捕获数千张皮，如今过度捕猎只剩几百张。"
 cr_russian_alaska_events.1.f2:0 "我们的四万张牛皮与三万只牛角，加上几桶海獭与海狸皮，全都装载完毕，舱口封好。"
 cr_russian_alaska_events.1.a:0 "空气中已能感受到变革之风……"
 cr_russian_alaska_events.1.a_tt:0 "要维持我们在[SCOPE.sState('our_california').GetName]的殖民地，必须建造一座#variable 小麦农场#! ，并将其[Concept('concept_employment', '$concept_employment$')]提升至#variable 33%#! 。此任务需在#variable 5#! 年内完成。"
 cr_russian_alaska_events.1.b:0 "或许是时候与罗斯堡告别了"
 cr_russian_alaska_events.1.b_tt:0 "我们将接洽[SCOPE.sCountry('buying_country').GetName]，询问他们是否愿意购买罗斯堡。我们预计将在约#variable 30#! 天内收到答复。"

 cr_russian_alaska_events.2.t:0 "确保加利福尼亚海岸"
 cr_russian_alaska_events.2.desc:0 "[SCOPE.sCountry('selling_country').GetNameNoFlag]的罗斯堡定居点，曾是北部海岸海獭贸易的核心，如今已沉寂。过度捕猎使海湾空空如也，[SCOPE.sCountry('selling_country').GetAdjectiveNoFormatting][SCOPE.sState('alaska').GetOwner.GetRuler.GetPrimaryRoleTitle][SCOPE.sState('alaska').GetOwner.GetRuler.GetFullName]现寻求出售而非任其荒废。\n\n报价已送达我们在[SCOPE.sState('california').GetName]的官员，承诺带来新土地、肥沃田地与已建好的坚固建筑。然而罗斯堡位置偏北——孤立、维护昂贵，且毛皮贸易衰落后价值存疑。"
 cr_russian_alaska_events.2.desc_old:0 "随着海獭贸易崩溃，[SCOPE.sCountry('selling_country').GetNameNoFlag]提出出售他们在[SCOPE.sState('our_california').GetStateRegion.GetName]的罗斯堡据点。\n\n这座曾象征[SCOPE.sCountry('selling_country').GetAdjectiveNoFormatting]太平洋野心的殖民地，如今成为过度捕猎与衰落命运的遗迹。但在他们眼中看到的衰败，我们的一些官员却看到了机会——向北扩展，确保[ROOT.GetCountry.GetNameNoFormatting]对海岸的控制。"
 cr_russian_alaska_events.2.f:0 "曾经每季我们能轻松捕获数千只海獭，足以维持全年生计。但现在呢？仅剩几百张皮，一个男人如何谋生？"
 cr_russian_alaska_events.2.a:0 "接受报价——罗斯堡将为墨西哥的未来服务"
 cr_russian_alaska_events.2.b:0 "我们无需再接手一个失败的企业"
 cr_russian_alaska_events.2.t_cal:0 "来自北方的报价"
 cr_russian_alaska_events.2.desc_cal:0 "[SCOPE.sCountry('selling_country').GetAdjectiveNoFormatting]的罗斯堡定居点，曾是北部海獭贸易中心，如今陷入困境。海獭皮耗尽、利润不再，[SCOPE.sState('alaska').GetOwner.GetRuler.GetPrimaryRoleTitle][SCOPE.sState('alaska').GetOwner.GetRuler.GetFullName]现寻求以适中价格出售该据点——包括木制围栏、农田与牲畜。\n\n购买将带来声望与海岸通道，但也意味着接手一个孤立且无利可图的殖民地。不过，边疆的机会往往稍纵即逝。"
 cr_russian_alaska_events.2.f_cal:0 "曾经每季我们能轻松捕获数千只海獭，足以维持全年生计。但现在呢？仅剩几百张皮，一个男人如何谋生？"
 cr_russian_alaska_events.2.a_cal:0 "购买罗斯堡——[ROOT.GetCountry.GetNameNoFormatting]将继承海岸"
 cr_russian_alaska_events.2.b_cal:0 "拒绝报价——大海已夺走它的馈赠"

 cr_russian_alaska_events.3.t:0 "[SCOPE.sCountry('buying_country').GetNameNoFormatting]同意！"
 cr_russian_alaska_events.3.desc:0 "[SCOPE.sCountry('buying_country').GetName]已同意从我们手中收购罗斯堡。"
 cr_russian_alaska_events.3.f:0 "曾经每季我们能捕获数千只海獭，轻松维持全年生计。但现在呢？仅剩几百张海獭皮，一个男人如何谋生？"
 cr_russian_alaska_events.3.a:0 "太好了"

 cr_russian_alaska_events.4.t:0 "[SCOPE.sCountry('buying_country').GetNameNoFormatting]拒绝"
 cr_russian_alaska_events.4.desc:0 "[SCOPE.sCountry('buying_country').GetName]已拒绝从我们手中收购罗斯堡。"
 cr_russian_alaska_events.4.f:0 "曾经每季我们能捕获数千只海獭，轻松维持全年生计。但现在呢？仅剩几百张海獭皮，一个男人如何谋生？"
 cr_russian_alaska_events.4.a:0 "好吧"

 cr_russian_alaska_events.5.t:0 "罗斯堡的清算"
 cr_russian_alaska_events.5.desc:0 "随着加利福尼亚海岸海獭种群耗尽，且我们无法为该据点找到生产性用途，罗斯堡已奉[SCOPE.sCountry('selling_country_overlord').GetCapital.GetCityHubName]之命处置。"
 cr_russian_alaska_events.5.f:0 "正是海獭将俄罗斯人带到加利福尼亚。它极大支撑了他们对南部海岸的持续兴趣，而随着海獭消失，俄罗斯人也随之消失。"
 cr_russian_alaska_events.5.a:0 "唉"

 cr_russian_alaska_events.6.t:0 "俄罗斯加利福尼亚的终结"
 cr_russian_alaska_events.6.desc:0 "[SCOPE.sCountry('selling_country').GetName]在[SCOPE.sState('california').GetName]海岸最南端的据点罗斯堡，已被该公司处置。\n\n自海岸海獭种群近乎灭绝后长期衰落，该公司未能找到其他生产性用途。"
 cr_russian_alaska_events.6.f:0 "正是海獭将俄罗斯人带到加利福尼亚。它极大支撑了他们对南部海岸的持续兴趣，而随着海獭消失，俄罗斯人也随之消失。"
 cr_russian_alaska_events.6.a:0 "如此结束了[SCOPE.sCountry('selling_country_overlord').GetAdjectiveNoFormatting]在我们海岸的影响"
 cr_russian_alaska_events.6.b:0 "如此结束了我们在[SCOPE.sCountry('buying_country').GetNameNoFormatting]海岸的影响"

 cr_russian_alaska_events.9.t:0 "金门"
 cr_russian_alaska_events.9.desc:0 "随着占领旧金山，我们获得了金门及其背后大湾的控制权。由此，我们确保了殖民地在"
 cr_russian_alaska_events.9.f:0 "金门是希望与机遇的象征，一座横跨海洋的灯塔，召唤那些在美国寻求更好生活的人。"
 cr_russian_alaska_events.9.a:0 "山谷在等待"

 cr_russian_alaska_events.10.t:0 "内陆帝国"
 cr_russian_alaska_events.10.desc:0 "成功从皮毛贸易转向农业后，我们的罗斯堡据点显示出早期复兴迹象。人口少、位置受限的海岸据点虽难称繁荣，但提供了稳定的成长基础。或许假以时日与努力，它将开始绽放。"
 cr_russian_alaska_events.10.desc2:0 "成功从皮毛贸易转向农业后，我们的罗斯堡据点显示出早期复兴迹象。但它仍难称繁荣。人口少、位置受限的海岸据点限制了其全部潜力。\n\n若真想扭转罗斯堡，我们需进一步向内陆扩展，进入山脉之外的肥沃山谷。"
 cr_russian_alaska_events.10.d_farming:0 "成功从皮毛贸易转向小麦农业后，我们的罗斯堡据点显示出早期复兴迹象。但它仍难称繁荣。人口少、位置受限的海岸据点限制了其全部潜力。\n\n若真想扭转罗斯堡，我们需进一步向内陆扩展，进入山脉之外的肥沃山谷。"
 cr_russian_alaska_events.10.f:0 "站在加利福尼亚果园中，周围是桃、杏与杏仁树的芬芳花朵，仿佛被带入一个纯粹美丽与喜悦的世界。\n—#italic 华金·米勒#! "
 cr_russian_alaska_events.10.d_ranching:0 "成功从皮毛贸易转向畜牧皮革贸易后，我们的罗斯堡据点显示出早期复兴迹象。但它仍难称繁荣。人口少、位置受限的海岸据点限制了其全部潜力。\n\n若真想扭转罗斯堡，我们需进一步向内陆扩展，进入山脉之外的广阔山谷。"
 cr_russian_alaska_events.10.a:0 "我们必须翻越山脉"
 cr_russian_alaska_events.10.a_6years:0 "#variable 加利福尼亚毛皮热#! 日志条目减弱，将扭转定居点的时间延长#variable 6#! 年。"
 cr_russian_alaska_events.10.a_5years:0 "#variable 加利福尼亚毛皮热#! 日志条目减弱，将扭转定居点的时间延长#variable 5#! 年。"
 cr_russian_alaska_events.10.a_4years:0 "#variable 加利福尼亚毛皮热#! 日志条目减弱，将扭转定居点的时间延长#variable 4#! 年。"
 cr_russian_alaska_events.10.a_3years:0 "#variable 加利福尼亚毛皮热#! 日志条目减弱，将扭转定居点的时间延长#variable 3#! 年。"
 cr_russian_alaska_events.10.a_2years:0 "#variable 加利福尼亚毛皮热#! 日志条目减弱，将扭转定居点的时间延长#variable 2#! 年。"
 cr_russian_alaska_events.10.a_1years:0 "#variable 加利福尼亚毛皮热#! 日志条目减弱，将扭转定居点的时间延长#variable 1#! 年。"

 cr_russian_alaska_events.11.t:0 "丰饶山谷"
 cr_russian_alaska_events.11.desc:0 "中央山谷正迎来更多定居，如今可正当地称为[SCOPE.sCountry('selling_country_overlord').GetAdjectiveNoFormatting]加利福尼亚。\n\n定居者被萨克拉门托河吸引，这条如绿蛇蜿蜒穿过金色田野的河流，暗示着当地土地的丰饶与慷慨。"
 cr_russian_alaska_events.11.d:0 "定居者被萨克拉门托河吸引，这条如绿蛇蜿蜒穿过金色田野的河流，诉说着大地的丰饶与慷慨，他们开始在这片如今可正当地称为[SCOPE.sCountry('selling_country_overlord').GetAdjectiveNoFormatting]加利福尼亚的富饶肥沃山谷中开垦土地。"
 cr_russian_alaska_events.11.f:0 "站在加利福尼亚果园中，周围是桃、杏与杏仁树的芬芳花朵，仿佛被带入一个纯粹美丽与喜悦的世界。\n—#italic 查尔斯·卢米斯#! "
 cr_russian_alaska_events.11.a:0 "山谷在等待"

 cr_russian_alaska_events.closing_je:0 "这结束了#variable 加利福尼亚毛皮热#! 日志条目"

