 expedition_events.303.t:0 "通往加利福尼亚的路线"
 expedition_events.303.d:0 "经过漫长而艰苦的旅程，探险队终于结束。探险队成功找到并测绘了一条全年通往加利福尼亚黄金海岸的路线。"
 expedition_events.303.f:0 "加利福尼亚小径，以马车、马蹄与脚步，在美国西部的画布上刻下人类奋斗的故事。这是一幅由勇气、希望与牺牲之线编织的挂毯。家庭告别熟悉的风景，挥别家园的舒适，踏上改变命运的远航。他们面对荒野无情的挑战——崎岖山脉、险恶河流、广袤沙漠——考验他们的极限耐力。小径成为人类精神力量的活见证，梦想与现实在此交汇，平凡男女开辟通往自身天命的道路。加利福尼亚小径超越物理路径；它代表人类意志的胜利、对更美好未来的追求，以及对美国梦的不懈追寻。\n—#italic 匿名#! "
 expedition_events.303.a:0 "让雄鹰展翅"
 expedition_events.303.a_tt:0 "#variable 加利福尼亚小径#! 已被测绘。"

