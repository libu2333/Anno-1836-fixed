 je_cr_eastern_burut_clans:0 "东布鲁特诸部"
 je_cr_eastern_burut_clans_reason:0 "自阿赖至伊塞克湖，东布鲁特诸部首先效忠的，是本氏族、牧场与长老。一位可汗固然可以召集库鲁尔台，却不能仅凭一道命令便驭使群山。维系诸部的脆弱约束，须以声望、审慎，必要时也须以刀剑反复加以维系。\n\n#bold 诸部向心力#!\n向心力达到#bold 90#!时，可汗的权威将得以巩固；若跌至#bold 10#!，诸部便会再度彼此相攻。"
 cr_kyr2_clans_complete_header:0 "#title 若满足下列条件，诸部将得以整合：#!\n"
 cr_kyr2_clans_complete_tt:0 "东布鲁特诸部向心力达到#variable 90#!"
 cr_kyr2_clans_fail_header:0 "#title 若满足下列条件，诸部将趋于离散：#!\n"
 cr_kyr2_clans_fail_tt:0 "东布鲁特诸部向心力降至#variable 10#!"
 cr_kyr2_clans_on_complete_header:0 "#title 若诸部得以整合：#!\n$EFFECT$"
 cr_kyr2_clans_on_fail_header:0 "#title 若诸部趋于离散：#!\n$EFFECT$"

 je_cr_eastern_burut_crossroads:0 "边疆的十字路口"
 je_cr_eastern_burut_crossroads_reason:0 "东布鲁特正处在浩罕汗国与大清边务体系的主张之间。浩罕索取贡赋与服从；清廷官员则援引旧日朝贡关系与伊犁的权威。两座宫廷都不能绕过本地中间人而统御高山深谷，每一次使团到来，都让诸部多了一分为自身周旋的余地。\n\n#bold 归属的天平#!\n浩罕影响达到#bold 100#!时，东布鲁特将牢系于浩罕；大清影响达到#bold 100#!时，东布鲁特将进入大清朝贡体系。"
 cr_kyr2_kokand_outcome_header:0 "#title 若满足下列条件，浩罕将占得上风：#!\n"
 cr_kyr2_kokand_outcome_tt:0 "浩罕影响达到#variable 100#!"
 cr_kyr2_qing_outcome_header:0 "#title 若满足下列条件，大清将占得上风：#!\n"
 cr_kyr2_qing_outcome_tt:0 "大清影响达到#variable 100#!"
 cr_kyr2_kokand_on_outcome_header:0 "#title 若浩罕占得上风：#!\n$EFFECT$"
 cr_kyr2_qing_on_outcome_header:0 "#title 若大清占得上风：#!\n$EFFECT$"

 je_cr_qing_recover_eastern_burut:0 "收复西北"
 je_cr_qing_recover_eastern_burut_reason:0 "自帕米尔高原至天山北麓，西北边务牵动着伊犁、阿尔泰与葱岭以西诸部。浩罕势力东渐，旧有的朝贡关系亦告松弛。朝廷须在十五年内稳住伊犁与阿尔泰，取得巴达克山的一处旧有属地，并使东布鲁特重归臣属或直接纳入版图，方可称西北大局已定。"
