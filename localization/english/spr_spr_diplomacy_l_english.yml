 tz_flavor.11.t:0 "National Day"
 tz_flavor.11.d:0 "Following the unification of North America, [SCOPE.sCountry('gbr_scope').GetName] celebrates its first National Day."
 tz_flavor.11.f:0 "Today marks the birth of [SCOPE.sCountry('gbr_scope').GetName], and the whole country celebrates. Flag-raising ceremonies, political assemblies, and evening festivities follow one another. The people believe that united effort will eventually bring prosperity to their new country."
 tz_flavor.11.a:0 "Celebrate the founding of our country."
 je_national_day:0 "National Day"
 je_national_day_reason:0 "Holding the first National Day can bring many loyalists to [SCOPE.sCountry('gbr_scope').GetName] and strengthen the army."
 all_alaska:0 "The primary culture of [SCOPE.GetRootScope.GetCountry.GetName] will be added throughout our territory"
 national_day:0 "National Day"
 je_healthy_up:0 "Public Healthcare"
 je_healthy_up_reason:0 "The final decision concerns healthcare. The government must increase investment, expand health insurance coverage, improve the quality of medical services, and introduce new healthcare policies so that more people can receive quality care."
 je_yi_min:0 "A Land of Promise"
 je_yi_min_reason:0 "Although the United States of Tianzhi-America was only recently founded, economic revival and social reform have already begun to bear fruit. To strengthen the country and advance its development, the government should broaden immigration and attract more settlers."
 je_education_up:0 "Public Education"
 je_education_up_reason:0 "The second decision focuses on education. The government must increase investment, improve teachers' pay and school facilities, and introduce new policies to make quality education available to more people."
