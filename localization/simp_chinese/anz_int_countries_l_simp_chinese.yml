ig_England: "圣公会"
ig_England_desc: "由维多利亚女王创立的圣公会，是基督教的一种形式。"
ig_daojiao: "道教协会"
ig_daojiao_desc: "道教是唯一起源于中国并由中国人创立的宗教，因此也被称为本土宗教。道教对中国古代的政治、经济与文化产生了深远影响，是统治阶级三大精神支柱之一。"
ideology_norse_clergy: "改革祭司"
ideology_norse_clergy_desc: "几个世纪以来，祭司们一直传承着我们的宗教传统，并因此获得了巨大的政治影响力。"
ig_baltic_priests: "克里维"
ig_baltic_priests_desc: "改革后的波罗的海祭司们正竭尽全力维护人民与国家之间的团结。"
ig_slavic_priests: "兹雷茨"
ig_slavic_priests_desc: "改革后的斯拉夫祭司们正竭尽全力维护人民与国家之间的团结。"
ideology_baltic_clergy: "克雷维"
ideology_baltic_clergy_desc: "改革后的波罗的海祭司们正竭尽全力维护人民与国家之间的团结。"
ideology_slavic_clergy: "日列茨"
ideology_slavic_clergy_desc: "改革后的斯拉夫祭司们正竭尽全力维护人民与国家之间的团结。"
ideology_tengri_clergy: "腾格里祭司"
ideology_tengri_clergy_desc: "改革后的腾格里祭司们正竭尽全力维护人民与国家之间的团结。"
hellenic_decision: "希腊教复兴"
hellenic_decision_desc: "@warning! 此决议将改易国教，极可能激起国内多数民众的不满。"
orthodox_decision: "恢复东正教国教"
orthodox_decision_desc: "@warning! 此决议将恢复东正教为国教，并极大激起国内多数民众的不满。"
revive_khazer_khanate_decision: "重建可萨汗国"
revive_khazer_khanate_decision_desc: "根据历史记载，为逃避希拉克略、查士丁尼二世、利奥三世及罗曼努斯一世等皇帝的宗教迫害，来自伊斯兰世界与罗马帝国的犹太人纷纷迁往可萨。西蒙·沙马认为，在这些迫害之后，巴尔干与克里米亚的犹太社群（尤其是五旬节派希腊地区）迁往宗教宽容的可萨，与当地的亚美尼亚犹太社群汇合。他指出，开罗·戈尼萨文献清楚显示，犹太化改革已在可萨全境民众中扎根。改宗模式通常是精英阶层率先接受新宗教，随后大众跟进，而大众往往抵制强制改宗。大规模改宗的重要条件是定居、城市化的国家形态，城市中建有教堂、会堂与清真寺作为宗教中心，而非草原上游牧的自由生活方式。"
sunni_decision: "拥抱逊尼派"
sunni_decision_desc: "伊斯兰信仰已遍布我们的土地，大多数民众已皈依。"
zoroastrianism_decision: "重燃阿胡拉·马兹达之火"
zoroastrianism_decision_desc: "几个世纪以来，我们的故土以琐罗亚斯德古老教义而闻名。如今利剑不再钳制我们的舌头，或许是时候摆脱阿拉伯人与贾汉苏兹，重新连接我们的根源了。"
norse_decision: "回归北欧信仰"
norse_decision_desc: "或许是时候回归我们古老的根源，拥抱北欧信仰了。"
baltic_decision: "回归波罗的海信仰"
baltic_decision_desc: "或许是时候回归我们古老的根源，拥抱波罗的海信仰了。"
slavic_decision: "回归斯拉夫信仰"
slavic_decision_desc: "或许是时候回归我们古老的根源，拥抱斯拉夫信仰了。"
tengri_decision: "回归腾格里信仰"
tengri_decision_desc: "或许是时候回归我们古老的根源，拥抱腾格里信仰了。"
acknowledge_roman_orthodox_supremacy: "承认君士坦丁堡普世牧首的至高地位"
acknowledge_roman_orthodox_supremacy_desc: "若我们承认君士坦丁堡普世牧首对我们信众的至高权威，将极大提升我们在罗马帝国中的影响力，但这也需付出代价。"
declare_patriarch_independence: "宣告牧首独立"
declare_patriarch_independence_desc: "宣告我们的牧首与教会独立于君士坦丁堡牧首区。"
pentarchy.1.t: "五牧首区重建"
pentarchy.1.d: "君士坦丁堡的巴西利乌斯既已统一东方基督教的五大圣座，此举堪称划时代的盛事。罗马帝国的权威重新伸及久已疏离中央的地区，其影响不止于政事，也将深刻改变文化与宗教生活。君士坦丁堡重获东方基督教中心的地位，亦将带动其学术与文化的复兴，令罗马的艺术、文学与哲学再现生机。这一里程碑重申了帝国的久远遗产。"
pentarchy.1.f: "东方基督教的核心地域既已尽在我方掌握，宗教与社会领袖遂呼吁使帝国制度与诸牧首区重新合一。这一时刻既关乎政权，也关乎信仰；它昭示着罗马帝国精神与世俗权威的再度调和。"
pentarchy.1.a: "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] 奉神之名统治。"
pentarchy.1.b: "牧首将引领信众。"
