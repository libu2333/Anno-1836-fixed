l_simp_chinese:

  #费尔南多波
  cr_europe_events.20.t:0 "所有权之争"
  cr_europe_events.20.desc_1_GBR:0 "[SCOPE.sCountry('cr_fernado_po_claimant').GetAdjective]要求我们将[SCOPE.sState('cr_fernado_po_province').GetName]的控制权移交给他们。他们声称根据1778年与葡萄牙签订的条约，该岛合法属于他们。\n\n然而在我们接管时，该岛早已被西班牙长期废弃，而且它在我们抑制[SCOPE.sStrategicRegion('cr_biafra').GetName]湾奴隶贸易的努力中证明了相当大的价值。"
  cr_europe_events.20.desc_GBR:0 "\n\n然而在我们接管时，该岛早已被西班牙长期废弃，而且它在我们抑制[SCOPE.sStrategicRegion('cr_biafra').GetName]湾奴隶贸易的努力中证明了相当大的价值。"
  cr_europe_events.20.desc_1_GBR_obl:0 "[SCOPE.sCountry('cr_fernado_po_claimant').GetAdjective]已向我们提出请求，要求将[SCOPE.sState('cr_fernado_po_province').GetName]的控制权移交给他们，他们以1778年与葡萄牙签订的条约挑战我们在岛上的存在，该条约将岛屿交给他们，并提醒我们我们欠他们一项[concept_obligation|l]。\n\n该岛在我们接管时已被西班牙废弃，但已发展成为西非舰队的重要基地。失去它将严重妨碍我们在比夫拉湾抑制奴隶贸易的努力。"
  cr_europe_events.20.desc_1:0 "[SCOPE.sCountry('cr_fernado_po_claimant').GetAdjective]要求我们将[SCOPE.sState('cr_fernado_po_province').GetName]的控制权移交给他们。他们声称根据1778年与葡萄牙签订的条约，该岛合法属于他们。"
  cr_europe_events.20.desc_1_obl:0 "[SCOPE.sCountry('cr_fernado_po_claimant').GetAdjective]要求我们将[SCOPE.sState('cr_fernado_po_province').GetName]的控制权移交给他们。他们声称根据1778年与葡萄牙签订的条约，该岛合法属于他们，并迅速提醒我们我们欠他们一项[concept_obligation|l]。"
  cr_europe_events.20.desc_1_obl_offered:0 "[SCOPE.sCountry('cr_fernado_po_claimant').GetAdjective]要求我们将[SCOPE.sState('cr_fernado_po_province').GetName]的控制权移交给他们。他们出示了1778年与葡萄牙签订的条约，该条约授予他们所有权，但在这法律主义的表象背后，隐含着他们将成为我们债务人的默契。"

  cr_europe_events.20.desc_2:0 "[SCOPE.sCountry('cr_fernado_po_claimant').GetAdjective]再次提出对[SCOPE.sState('cr_fernado_po_province').GetName]岛的所有权问题，重申根据他们1778年与葡萄牙签订的条约，我们在岛上的存在是非法的。"
  cr_europe_events.20.desc_2_obl:0 "[SCOPE.sCountry('cr_fernado_po_claimant').GetAdjective]再次提出对[SCOPE.sState('cr_fernado_po_province').GetName]岛的所有权问题，他们用1778年与葡萄牙签订的条约作为掩饰，但强烈暗示我们欠他们一项[concept_obligation|l]。"
  cr_europe_events.20.desc_2_obl_offered:0 "[SCOPE.sCountry('cr_fernado_po_claimant').GetAdjective]再次提出对[SCOPE.sState('cr_fernado_po_province').GetName]岛的所有权问题，他们用1778年与葡萄牙签订的条约作为掩饰，但强烈暗示如果移交该岛，他们将在未来欠我们一项[concept_obligation|l]。"

  cr_europe_events.20.desc_3:0 "[SCOPE.sCountry('cr_fernado_po_claimant').GetAdjective]大使出现在外交部已开始成为常见景象，他们再次提出对[SCOPE.sState('cr_fernado_po_province').GetName]的所有权问题，坚持根据国际法，该岛应由他们控制。"
  cr_europe_events.20.desc_3_obl:0 "[SCOPE.sCountry('cr_fernado_po_claimant').GetAdjective]再次提出对[SCOPE.sState('cr_fernado_po_province').GetName]的所有权问题，这次相当直白地指出我们欠他们一项[concept_obligation|l]，以此作为我们应将岛屿让给他们理由。"
  cr_europe_events.20.desc_3_obl_offered:0 "[SCOPE.sCountry('cr_fernado_po_claimant').GetAdjective]再次提出对[SCOPE.sState('cr_fernado_po_province').GetName]的所有权问题，指出如果我们将岛屿让给他们，他们将在未来欠我们一项[concept_obligation|l]，我们可以利用这一点。"

  cr_europe_events.20.desc_4:0 "[SCOPE.sCountry('cr_fernado_po_claimant').GetAdjective]大使再次抗议我们在[SCOPE.sState('cr_fernado_po_province').GetName]的存在，再次指出他们1778年与葡萄牙签订的条约作为我们应撤离该岛的理由。"
  cr_europe_events.20.desc_4_obl:0 "[SCOPE.sCountry('cr_fernado_po_claimant').GetAdjective]再次抗议我们在[SCOPE.sState('cr_fernado_po_province').GetName]的存在，但这次他们不再强调1778年与葡萄牙签订的条约，而是突出我们欠他们的一项[concept_obligation|l]。"
  cr_europe_events.20.desc_4_obl_offered:0 "[SCOPE.sCountry('cr_fernado_po_claimant').GetAdjective]再次抗议我们在[SCOPE.sState('cr_fernado_po_province').GetName]的存在，但这次他们不再强调1778年与葡萄牙签订的条约，而是提出他们将在未来欠我们一项[concept_obligation|l]。"

  cr_europe_events.20.desc_5:0 "如四时更替般可预料，[SCOPE.sCountry('cr_fernado_po_claimant').GetAdjective]再度质疑我们对[SCOPE.sState('cr_fernado_po_province').GetName]的主权。他们的论据亦无新意，仍援引1778年与葡萄牙缔结的条约，声称我方驻留于该岛并无合法根据。"
  cr_europe_events.20.desc_5_obl:0 "正如季节一样可预测，[SCOPE.sCountry('cr_fernado_po_claimant').GetAdjective]再次提出我们对[SCOPE.sState('cr_fernado_po_province').GetName]的所有权问题。虽然他们提出问题本身可预测，但他们似乎改变了策略；不再强调1778年条约，而是突出我们欠他们的一项[concept_obligation|l]。"
  cr_europe_events.20.desc_5_obl_offered:0 "正如季节一样可预测，[SCOPE.sCountry('cr_fernado_po_claimant').GetAdjective]再次提出我们对[SCOPE.sState('cr_fernado_po_province').GetName]的所有权问题。虽然他们提出问题本身可预测，但他们似乎改变了策略；不再强调1778年条约，而是突出移交该岛将使他们欠我们一项未来可利用的[concept_obligation|l]。"

  cr_europe_events.20.desc_6:0 "[SCOPE.sCountry('cr_fernado_po_claimant').GetAdjective]大使再次来到外交部，再次提出我们对[SCOPE.sState('cr_fernado_po_province').GetName]的所有权问题，再次指出葡萄牙在1778年条约中将该岛割让给他们。"
  cr_europe_events.20.desc_6_obl:0 "[SCOPE.sCountry('cr_fernado_po_claimant').GetAdjective]大使再次来到外交部，再次提出我们对[SCOPE.sState('cr_fernado_po_province').GetName]的所有权问题，再次指出葡萄牙在1778年条约中将该岛割让给他们。\n\n但这次他们通过额外指出我们欠他们的一项[concept_obligation|l]来施加压力。"
  cr_europe_events.20.desc_6_obl_offered:0 "[SCOPE.sCountry('cr_fernado_po_claimant').GetAdjective]大使再次来到外交部，再次提出我们对[SCOPE.sState('cr_fernado_po_province').GetName]的所有权问题，再次指出葡萄牙在1778年条约中将该岛割让给他们。\n\n但这次他们通过额外提出他们将欠我们一项[concept_obligation|l]来美化交易。"

  cr_europe_events.20.a_WAS:0 "我想西非舰队可以另寻新家了"
  cr_europe_events.20.a_nWAS:0 "我想那就归他们吧"
  cr_europe_events.20.b:0 "谁会在乎这样一张废纸"
  cr_europe_events.20_opt_tt:0 "我们将把[SCOPE.sState('cr_fernado_po_province').GetName]割让给[SCOPE.sCountry('cr_fernado_po_claimant').GetName]。"
  cr_europe_events.20_opt_obl_tt:0 "我们将把[SCOPE.sState('cr_fernado_po_province').GetName]割让给[SCOPE.sCountry('cr_fernado_po_claimant').GetName]，以换取对他们的一项[concept_obligation]"

  cr_europe_events.20.desc_2_GBR:0 "该岛战略位置位于[SCOPE.sStrategicRegion('cr_biafra').GetName]湾，处于[SCOPE.sStrategicRegion('cr_guinea').GetName]与[SCOPE.sStrategicRegion('cr_congo').GetName]之间的贸易路线上，并拥有优良港口，我们接管了被废弃的[SCOPE.sState('cr_fernado_po_province').GetNameNoFormatting]作为#variable 西非舰队#!的基地，用以抑制奴隶贸易。\n\n随着[SCOPE.sCountry('cr_fernado_po_claimant').GetAdjectiveNoFormatting]对该地区兴趣日益增长，他们要求我们将所有权移交给他们，援引他们与[SCOPE.sCountry('cr_fernado_po_prev_owner').GetAdjective]签订的旧条约，该条约将岛屿割让给他们。"
  cr_europe_events.20.flavour:0 "费尔南多波的归属，既关乎旧约，也关乎西非海上的权势。"
  cr_europe_events.20.a:0 "我们将尊重原条约"
  cr_europe_events.20.a_tt:0 "我们将把[SCOPE.sState('cr_fernado_po_province').GetName]的所有权归还给[SCOPE.sCountry('cr_fernado_po_claimant').GetName]"
  cr_europe_events.20.b_GBR:0 "或许如果他们提供一些回报"
  cr_europe_events.20.b_tt:0 "我们将向[SCOPE.sCountry('cr_fernado_po_claimant').GetName]索要一项[concept_obligation]。若他们接受，我们将把[SCOPE.sState('cr_fernado_po_province').GetName]的所有权归还给他们。"
  cr_europe_events.20.c:0 "难道要让可恶的奴隶贸易再次兴盛？"
  cr_europe_events.20.c_tt:0 "我们将永久占有[SCOPE.sState('cr_fernado_po_province').GetName]，无视[SCOPE.sCountry('cr_fernado_po_claimant').GetAdjective]的主张"
  cr_europe_events.20.b_tt_consequence:0 "[SCOPE.sCountry('cr_fernado_po_claimant').GetNameNoFlag]未来可能再次向我们施压主张权利。"

  cr_europe_events.29.t:0 "克拉伦斯港的丧失"
  cr_europe_events.29.desc:0 "[SCOPE.sCountry('cr_fernado_po_claimant').GetAdjective]已重新接管我们位于费尔南多波的克拉伦斯港前哨。\n\n该港战略位置位于[SCOPE.sStrategicRegion('cr_biafra').GetName]湾，处于[SCOPE.sStrategicRegion('cr_guinea').GetName]与[SCOPE.sStrategicRegion('cr_congo').GetName]之间的贸易路线上，拥有优良港口，且曾被[SCOPE.sCountry('cr_fernado_po_claimant').GetAdjectiveNoFormatting]废弃，数十年来克拉伦斯港为西非舰队提供了极佳的基地，用以抑制奴隶贸易。\n\n他们长期通过1778年与葡萄牙签订的条约主张对该岛的所有权，如今通过我们先前授予他们的一项义务，成功迫使我们让步。"

  #西班牙
  cr_carlist_events.1.t:0 "修道院的没收（Desamortización）"
  cr_carlist_events.1.desc:0 "首相[SCOPE.gsInterestGroup('cr_spanish_liberals').GetLeader.GetLastName]一笔落下，启动了西班牙历史上最激进的改革之一——没收并出售巨量教会土地，以充实国库并打破教士权力。修道院被关闭，地产被没收，教会的财富落入有能力购买者手中。\n\n对[SCOPE.gsInterestGroup('cr_spanish_liberals').GetNameNoIcon]而言，这是正义之举，终于将西班牙从一个囤积土地、让人民挨饿的机构窒息性控制中解放出来。对保守派与虔诚信徒而言，这是亵渎神明，是以贪婪之名对上帝之家的全面掠夺。\n\n土地现在必须出售——但卖给谁？代价几何？"
  cr_carlist_events.1.desc_1:0 "几个世纪以来，通过赠予、遗嘱与无遗嘱继承，[SCOPE.gsInterestGroup('cr_spanish_catholic_church').GetNameNoIcon]积累了巨额财富，并借此牢牢控制政治，扼杀任何改革尝试。与此同时，国库几近空虚，而[SCOPE.sCountry('cr_carlists').GetAdjectiveNoFlag]叛乱仍在肆虐。\n\n[SCOPE.gsInterestGroup('cr_spanish_liberals').GetLeader.GetFullName]同时解决了两个问题：没收并公开出售教会土地与财产。去年已通过相关法案。现在唯一的问题是如何最好地处置这些土地？"
  cr_carlist_events.1.flavour_2:0 "没收教会财产是迈向更光明未来的步骤，我们的国家不再被过去的枷锁束缚。我们必须拥抱现代性，这一改革为更繁荣、更进步的西班牙铺平道路。"
  cr_carlist_events.1.flavour:0 "没收教会财产是国家财政的救赎，是弥补赤字并实施重要公共工程的必要资源。若政府没有来自公共财产与教会什一税的收入，将别无选择只能直接征税，那将是真正的灾难。"
  cr_carlist_events.1.a:0 "我们将设立公开拍卖"
  cr_carlist_events.1.a_tt:0 "没收土地将卖给出价最高者，有利于[concept_upper_strata]。"
  cr_carlist_events.1.a_tt2:0 "[concept_upper_strata|U]对[SCOPE.sPoliticalMovement('carlist_movement').GetName]的吸引力将减弱。"
  cr_carlist_events.1.b:0 "我们将把土地授予现租户"
  cr_carlist_events.1.b_tt:0 "没收土地将授予现租户，有利于[GetPopType('peasants').GetName]与[GetPopType('farmers').GetName]"
  cr_carlist_events.1.b_tt2:0 "[GetPopType('peasants').GetName]与[GetPopType('farmers').GetName]对[SCOPE.sPoliticalMovement('carlist_movement').GetName]的吸引力将减弱。"
  cr_carlist_events.1.c:0 "我们真的能承受与[SCOPE.gsInterestGroup('cr_spanish_catholic_church').GetNameNoIcon]为敌吗？"
  cr_carlist_events.1.c_tt:0 "土地没收进程将被中止，不会出售任何教会土地。"
  cr_carlist_events.1.c_tt2:0 "[GetPopType('clergymen').GetName]对[SCOPE.sPoliticalMovement('carlist_movement').GetName]的吸引力将减弱。"

  cr_carlist_events.10.t:0 "贝尔加拉的拥抱"
  cr_carlist_events.10.desc:0 "随着[SCOPE.sCountry('cr_christinos').GetAdjectiveNoFormatting]旗帜如今飘扬在潘普洛纳上空，唐·[SCOPE.sCharacter('don_carlos_char').GetFirstName]如无国之王般逃亡，这场撕裂西班牙的战争接近尾声。他的事业——封建特权、教权暴政与叛乱——已成废墟，被他本人所抛弃。西班牙获胜了。\n\n然而胜利带来了新问题：我们将如何治理这个新恢复的国家？[SCOPE.sCulture('cr_basque_culture').GetName]虽被卡洛斯派僭称者误导，但长期忠于西班牙。我们是否应伸出和平之手，允许他们保留古老的#variable Fueros#!（特权法）？抑或最终完成国家统一大业，扫除旧制度最后残余？"
  cr_carlist_events.10.desc_2:0 "在其军队被击败、[SCOPE.sCountry('cr_christinos').GetAdjectiveNoFormatting]旗帜飘扬在[SCOPE.sState('cr_state_navarra').GetCityHubName]后，唐·[SCOPE.sCharacter('don_carlos_char').GetFirstName]以携卡洛斯事业逃亡国外，显示了他的个人价值。\n\n现在的问题是：如何继续？我们是安抚[SCOPE.sCulture('cr_basque_culture').GetName]，允许他们保留独立法律？还是废除这一旧制度遗迹？"
  cr_carlist_events.10.flavour:0 "贝尔加拉条约结束了悲惨而漫长的冲突。我希望和平能让西班牙重建战争摧毁的一切。仍有深重伤口需要愈合，但这一协议是走向和解的一步。"
  cr_carlist_events.10.a:0 "西班牙终将统一"
  cr_carlist_events.10.a_tt:0 "[SCOPE.sCountry('cr_kingdom_of_navarra').GetName]将被并入[SCOPE.sCountry('cr_christinos').GetName]，[SCOPE.sCulture('cr_basque_culture').GetName]的#variable Fueros#!将被废除"
  cr_carlist_events.10.a_tt2:0 "[SCOPE.sCountry('cr_kingdom_of_aragon').GetName]将被并入[SCOPE.sCountry('cr_christinos').GetName]，[SCOPE.sCulture('cr_catalan_culture').GetName]的#variable Fueros#!不会恢复"
  cr_carlist_events.10.a_tt3:0 "[SCOPE.sCulture('cr_catalan_culture').GetName]的#variable Fueros#!不会恢复"

  cr_carlist_events.10.b:0 "稳定需要妥协"
  cr_carlist_events.10.b_tt:0 "[SCOPE.sCountry('cr_kingdom_of_navarra').GetName]将与[SCOPE.sCountry('cr_christinos').GetName]保持[concept_personal_union]，同时保留其独立法律"
  cr_carlist_events.10.b_tt2:0 "[SCOPE.sCulture('cr_basque_culture').GetName]对[SCOPE.sPoliticalMovement('carlist_movement').GetName]的吸引力将#variable 减弱#!"
  cr_carlist_events.10.c:0 "和平需要改变方向"
  cr_carlist_events.10.c_tt:0 "[SCOPE.sCountry('cr_kingdom_of_aragon').GetName]将与[SCOPE.sCountry('cr_christinos').GetName]保持[concept_personal_union]，同时保留其独立法律"
  cr_carlist_events.10.c_tt2:0 "[SCOPE.sCulture('cr_basque_culture').GetName]与[SCOPE.sCulture('cr_catalan_culture').GetName]对[SCOPE.sPoliticalMovement('carlist_movement').GetName]的吸引力将#variable 减弱#!"

  #法国事件
  cr_carlist_events.15.t:0 "西班牙僭称者"
  cr_carlist_events.15.desc_orleanist:0 "被击败、被剥夺一切的[SCOPE.sCountry('spain').GetAdjectiveNoFlag]僭称者唐·[SCOPE.sCharacter('don_carlos_char').GetFirstName]已越境进入[ROOT.GetCountry.GetNameNoFormatting]，他的[SCOPE.sPoliticalMovement('carlist_movement').GetNameNoIcon]——绝对主义与反动的旗帜——已粉碎，军队四散。他抵达波尔多，寻求庇护——一个无王位的继承人，其事业化为废墟。\n\n他的存在构成外交挑战。给予庇护可能损害与[SCOPE.sCountry('spain').GetCapital.GetCityHubName]的关系，拒绝则可能激怒[SCOPE.sPoliticalMovement('legitimist_movement').GetNameNoIcon]。虽然他的战争已结束，其后果仍在回荡，他的命运问题或将在[SCOPE.sCountry('spain').GetNameNoFormatting]之外继续回响。"
  cr_carlist_events.15.desc_orleanist_flavour:0 "虽然他是[SCOPE.sCountry('don_carlos_exile_country').GetRuler.GetHerHis|U]陛下国王[SCOPE.sCountry('don_carlos_exile_country').GetRuler.GetFirstNameNoFormatting]的表亲，但他代表的是早已被抛弃的君主制愿景：绝对主义、神权、不妥协。他的存在本身就是对七月王朝所体现妥协的悄然斥责。有些人低语王室团结，另一些人只看到反动幽灵，在努力前进的法国徘徊。"

  cr_carlist_events.exile_of_bourgos:0 "唐·[SCOPE.sCharacter('don_carlos_char').GetFirstNameNoFormatting]将被软禁在#variable 布尔日#!"
  cr_carlist_events.exile_place:0 "唐·[SCOPE.sCharacter('don_carlos_char').GetFirstNameNoFormatting]将被软禁在#variable [SCOPE.sState('don_carlos_exile_state').GetFarmHubName]#!"
  cr_carlist_events.reject_refuge:0 "唐·[SCOPE.sCharacter('don_carlos_char').GetFirstNameNoFormatting]将被驱逐，迫使其另寻庇护。"

  cr_carlist_events.15.a.orleanist:0 "给予庇护——协助恢复宪政波旁君主制。"
  cr_carlist_events.15.a.orleanist_tt:0 "虽然我们无法支持唐·[SCOPE.sCharacter('don_carlos_char').GetFirstNameNoFormatting]的绝对主义野心，但我们不能让波旁家族从历史中消逝。我们将给予他庇护，但坚持西班牙必须实行宪政君主制。唐·[SCOPE.sCharacter('don_carlos_char').GetFirstNameNoFormatting]必须明白旧秩序已逝，我们无法支持他的绝对主义事业。我们将助他在现代西班牙找到位置——一个拥抱平衡君主制的西班牙，而非回归封建。"
  cr_carlist_events.15.b.orleanist:0 "给予庇护，让他悄然淡出。"
  cr_carlist_events.15.b.orleanist_tt:0 "我们将给予唐·[SCOPE.sCharacter('don_carlos_char').GetFirstNameNoFormatting]庇护的尊严，但仅作为流亡中的次要人物。他的事业已败，他的绝对主义野心在现代世界无立足之地。我们将允许他在我国和平生活，但不提供任何援助让他继续恢复西班牙王位。让他悄然淡出比继续煽动不稳更好。"
  cr_carlist_events.15.c.orleanist:0 "拒绝庇护——唐·[SCOPE.sCharacter('don_carlos_char').GetFirstNameNoFormatting]的叛乱已失败。"
  cr_carlist_events.15.c.orleanist_tt:0 "僭称者与绝对主义者的时代已过。唐·[SCOPE.sCharacter('don_carlos_char').GetFirstNameNoFormatting]对西班牙合法政府的叛乱已失败，显然他的王位主张无法成功。我们不会冒险以庇护失败僭称者来损害自身稳定。让他另寻庇护，或返回西班牙承担行动后果。"
  cr_carlist_events.15.d.orleanist:0 "支持他争取合法波旁王位。"
  cr_carlist_events.15.d.orleanist_tt:0 "虽然唐·[SCOPE.sCharacter('don_carlos_char').GetFirstNameNoFormatting]的主张带有绝对主义性质，但波旁血统的合法性不容忽视。"
  cr_carlist_events.15.d.orleanist_tt_2:0 "虽然唐·[SCOPE.sCharacter('don_carlos_char').GetFirstNameNoFormatting]的主张带有绝对主义性质，但波旁血统的合法性不容忽视。我们将支持他的事业，但明确表示我们无法也不愿支持回归绝对君主制。他的叛乱已失败，但波旁家族在西班牙未来仍有位置——只是不能以旧的暴政形式。我们将鼓励西班牙建立温和宪政君主制，同时协助唐·[SCOPE.sCharacter('don_carlos_char').GetFirstNameNoFormatting]找到和平解决方案。"

  cr_carlist_events.15.desc_legitimist:0 "一位有名无实的国王，唐·波旁的[SCOPE.sCharacter('don_carlos_char').GetFirstName]抵达波尔多，在其王位被篡夺后寻求在[ROOT.GetCountry.GetAdjectiveNoFormatting]土地上的庇护。虽然他的事业遭受失败，但他的主张完整无损，他的流亡仅是背叛与武力的结果，而非合法性使然。\n\n他的存在提出难题。作为波旁王子，他应受尊重，但他的斗争已扰乱[SCOPE.sCountry('spain').GetNameNoFlag]并困扰欧洲。我们应以与其出身相称的尊严接待他，还是视其为不便而抛弃？无论何种选择，他的主张仍在延续——未被不幸折腰，未被流亡击碎。"
  cr_carlist_events.15.desc_legitimist_flavour:0 "唐·卡洛斯抵达法国，激起王朝忠诚与共同血脉的回响。在[SCOPE.sCountry('don_carlos_exile_country').GetRuler.GetPrimaryRoleTitle][SCOPE.sCountry('don_carlos_exile_country').GetRuler.GetFirstNameNoFormatting]的宫廷，他不止是失败的僭称者——他是家人，是神权时代另一位捍卫者。然而即便在此复辟合法性的中心，他梦想重夺的西班牙仍遥不可及。他对绝对主义的愿景未被法国重建的温和秩序触及。他带着尊严走在流亡走廊，却也作为提醒：旧秩序或可存续，但已不再前进。"

  cr_carlist_events.15.a.legitimist:0 "提供庇护并支持其主张。"
  cr_carlist_events.15.a.legitimist_tt:0 "唐·[SCOPE.sCharacter('don_carlos_char').GetFirstNameNoFormatting]与我们同属波旁血脉，是西班牙王位的真正继承人。我们将提供庇护并支持他的事业，因为波旁家族必须始终团结一致。如此，我们加强了合法君主的权利，恢复了波旁姓氏的荣誉。"
  cr_carlist_events.15.b.legitimist:0 "给予庇护，但保持中立。"
  cr_carlist_events.15.b.legitimist_tt:0 "虽然唐·[SCOPE.sCharacter('don_carlos_char').GetFirstNameNoFormatting]携有波旁血统，我们必须谨慎行事。我们将给予他庇护，但不会公开支持他对王位的主张。这样做将冒险激化与西班牙现政府的紧张关系。让我们避免卷入西班牙的王朝斗争。"
  cr_carlist_events.15.c.legitimist:0 "利用其存在羞辱西班牙政府。"
  cr_carlist_events.15.c.legitimist_tt:0 "西班牙现政府不过是篡位者，唐·[SCOPE.sCharacter('don_carlos_char').GetFirstNameNoFormatting]才是王位真正继承人。虽然我们无法公开挑战西班牙政府，但我们可以利用他在波尔多的存在，凸显他们的非法性。我们将明确表示法国站在合法波旁继承人一边，即使目前被迫保持沉默。"
  cr_carlist_events.15.d.legitimist:0 "拒绝庇护——他是个失败的王子。"
  cr_carlist_events.15.d.legitimist_tt:0 "我们无法负担支持一个叛乱失败的王子。唐·[SCOPE.sCharacter('don_carlos_char').GetFirstNameNoFormatting]虽有波旁血统，但他的事业已败，我们不能冒险激怒西班牙现政府。我们必须拒绝他的庇护，并明确表示他的叛乱是对波旁姓氏的耻辱。"

  cr_carlist_events.15.desc_legitimist_absolutist:0 "一位无王位的国王，唐·波旁的[SCOPE.sCharacter('don_carlos_char').GetFirstName]抵达波尔多，在[SCOPE.sCountry('spain').GetNameNoFormatting]自由主义暂时胜利后寻求在[ROOT.GetCountry.GetAdjectiveNoFormatting]土地上的庇护。他的军队或已四散，但他的主张完整无损，未因流亡而减损。他仍是西班牙合法君主，王座与祭坛传统的继承人，被武力而非权利废黜。\n\n他的存在既是风险也是机会。庇护他可能损害与马德里的关系，但也提供了维护神圣秩序、守护西班牙合法君主制的机会。若风向转变，唐·[SCOPE.sCharacter('don_carlos_char').GetFirstNameNoFormatting]或可重夺生而有之、依法属于他的东西。问题不在于他是否仍是国王——而在于[ROOT.GetCountry.GetNameNoFormatting]是否准备好在时机到来时助他复辟。"

  cr_carlist_events.15.desc_bonapartist:0 "衣衫褴褛、惨遭失败的[SCOPE.sCountry('spain').GetAdjectiveNoFlag]僭称者唐·[SCOPE.sCharacter('don_carlos_char').GetFirstName]抵达波尔多，在其注定失败的叛乱于[SCOPE.sCountry('spain').GetRuler.GetPrimaryRoleTitle][SCOPE.sCountry('spain').GetRuler.GetFirstName]的军队面前崩溃后寻求庇护。他曾自称[SCOPE.sCountry('spain').GetNameNoFlag]的救世主，如今进入[ROOT.GetCountry.GetNameNoFormatting]却不是作为统治者，而是作为逃亡者，背负着自己过时事业的重担。\n\n他的到来提出疑问：一个进步的国家对一个试图倒退时钟的人有何容身之地？在[ROOT.GetCountry.GetNameNoFormatting]，我们早已摆脱封建与教权枷锁，铸就秩序与力量主导的国家。我们应给予他庇护，还是让他留给历史，成为一个不再存在的世界的残余？"
  cr_carlist_events.15.desc_bonapartist_flavour:0 "曾经是伊比利亚绝对主义的火炬手，唐·卡洛斯如今抵达法国却不是作为君主，而是作为退却之人。在波尔多，他是欧洲旧秩序的遗物——波旁在波拿巴土地上的身影，一个无事业的僭称者。他的名字在某些圈子仍有分量，但他的战争已结束。留下的问题是微妙的：他是客人、负担，还是等待复苏的象征？"

  cr_carlist_events.15.a.bonapartist:0 "给予庇护，但不支持其事业。"
  cr_carlist_events.15.a.bonapartist_tt:0 "唐·[SCOPE.sCharacter('don_carlos_char').GetFirstNameNoFormatting]寻求庇护以逃避其行动后果。我们将给予他庇护，但不会允许他在法国推进王位主张。他作为客人受欢迎，但他的事业已死。"
  cr_carlist_events.15.b.bonapartist:0 "利用其存在羞辱旧君主制。"
  cr_carlist_events.15.b.bonapartist_tt:0 "唐·[SCOPE.sCharacter('don_carlos_char').GetFirstNameNoFormatting]是欧洲君主制一切错误的象征。让我们利用他的存在羞辱旧秩序，提醒欧洲反动统治的危险。法国作为进步堡垒，不应成为想要倒退时钟的君主的避风港。"
  cr_carlist_events.15.c.bonapartist:0 "不干涉——让西班牙决定其命运。"
  cr_carlist_events.15.c.bonapartist_tt:0 "我们应避开西班牙内政。唐·[SCOPE.sCharacter('don_carlos_char').GetFirstNameNoFormatting]是西班牙问题，由西班牙决定其命运。我们暂时给予他庇护，但既不支持也不反对其主张。这是他们的选择，而非我们的。"
  cr_carlist_events.15.d.bonapartist:0 "拒绝他——无容身之地给保皇派阴谋。"
  cr_carlist_events.15.d.bonapartist_tt:0 "法国无容身之地给寻求恢复封建制度的失败君主。唐·[SCOPE.sCharacter('don_carlos_char').GetFirstNameNoFormatting]代表我们努力推翻的失败秩序。我们不会给予他庇护——他是过去的遗物，在我们现代共和法国无其位置。"

  cr_carlist_events.15.desc_bonapartist_absolutist:0 "失败但不屈，[SCOPE.sCountry('spain').GetAdjectiveNoFlag]僭称者唐·[SCOPE.sCharacter('don_carlos_char').GetFirstName]抵达波尔多，在其对[SCOPE.sCountry('spain').GetRuler.GetPrimaryRoleTitle][SCOPE.sCountry('spain').GetRuler.GetName]的不幸战争失败后寻求庇护。一位无王位的王子，他携带着破碎的事业以及旧世界的重量——国王以神权统治、议会不敢言说的世界。\n\n然而在[ROOT.GetCountry.GetNameNoFormatting]，我们知道君主制并不意味着停滞。统治意志必须有实力支撑。虽然唐·[SCOPE.sCharacter('don_carlos_char').GetFirstNameNoFormatting]为恢复过去而战，我们铸就了一个权威稳固、不受封建领主或自私议会挑战的帝国。他的存在将作为工具塑造[SCOPE.sCountry('spain').GetNameNoFormatting]成我们的形象——还是他仅是历史遗弃的遗物？"

  cr_carlist_events.15.desc_republic:0 "一位无冠、无军、无国的准国王——[SCOPE.sCountry('spain').GetAdjectiveNoFlag]僭称者唐·[SCOPE.sCharacter('don_carlos_char').GetFirstName]抵达波尔多，在其对合法[SCOPE.sCountry('spain').GetAdjectiveNoFormatting]政府的失败叛乱后寻求庇护。\n\n战场上失败、被命运抛弃，他如今乞求庇护于他如此鄙视的革命理想之地。我们应给予他吗？"
  cr_carlist_events.15.desc_republic_flavour:0 "多年来，他以绝对主义、教权暴政与封建特权之名发动战争，试图将[SCOPE.sCountry('spain').GetNameNoFormatting]拖回过去。但[SCOPE.sCountry('spain').GetNameNoFormatting]人民以武力发言，拒绝了他的统治。如今他站在[SCOPE.sCountry('don_carlos_exile_country').GetAdjectiveNoFormatting]共和国面前，失败而屈辱。"

  cr_carlist_events.15.desc_fallback:0 "衣衫褴褛但不屈，唐·[SCOPE.sCharacter('don_carlos_char').GetFirstName]——[SCOPE.sCountry('spain').GetAdjectiveNoFlag]王位的僭称者——抵达波尔多，在其事业崩溃后寻求[SCOPE.sCountry('don_carlos_exile_country').GetAdjectiveNoFormatting]土地上的庇护。他的军队四散、忠诚者解除武装，他如今不是国王，而是失败的流亡者，传统主义[SCOPE.sCountry('spain').GetNameNoFlag]的梦想从其手中溜走。\n\n对[SCOPE.sCountry('don_carlos_exile_country').GetNameNoFormatting]而言，他的到来是个微妙问题。有些人视其为过去的遗物，其野心只带来战争与苦难；其他人视其为合法性与信仰的象征，应受款待。然而，随着[SCOPE.sCountry('spain').GetNameNoFlag]牢牢掌握在[SCOPE.sCountry('spain').GetRuler.GetPrimaryRoleTitle][SCOPE.sCountry('spain').GetRuler.GetName]及其政府手中，[SCOPE.sCountry('don_carlos_exile_country').GetCapital.GetCityHubName]必须谨慎行事——庇护波旁僭称者在王位动荡的时代并非小事。"

  cr_carlist_events.15.flavour_fallback:0 "曾经是伊比利亚绝对主义的火炬手，唐·卡洛斯如今抵达法国却不是作为君主，而是作为退却之人。在波尔多，他是欧洲旧秩序的遗物——波旁在波拿巴土地上的身影，一个无事业的僭称者。他的名字在某些圈子仍有分量，但他的战争已结束。留下的问题是微妙的：他是客人、负担，还是等待复苏的象征？"

  cr_carlist_events.15.a.legitimist_absolutist:0 "全力支持唐·[SCOPE.sCharacter('don_carlos_char').GetFirstNameNoFormatting]——恢复绝对君主制"
  cr_carlist_events.15.a.legitimist_absolutist_tt:0 "恢复真正波旁君主制——不分裂、绝对——是唯一前路。我们将全力支持唐·[SCOPE.sCharacter('don_carlos_char').GetFirstNameNoFormatting]对西班牙王位的主张。自由主义势力在西班牙未来无立足之地，我们将以神权恢复秩序。不惜代价，我们将与他并肩重申西班牙的君主权力。"
  cr_carlist_events.15.b.legitimist_absolutist:0 "给予庇护并支持，但谨慎行事"
  cr_carlist_events.15.b.legitimist_absolutist_tt:0 "虽然唐·[SCOPE.sCharacter('don_carlos_char').GetFirstNameNoFormatting]是波旁王位真正继承人，我们必须谨慎。我们将给予他庇护并提供道义支持，但不会公开呼吁其复位。我们的干预必须计算好——过早过多可能激起西班牙与法国的革命势力。"
  cr_carlist_events.15.c.legitimist_absolutist:0 "秘密支持其事业——加强绝对主义运动"
  cr_carlist_events.15.c.legitimist_absolutist_tt:0 "公开上，我们必须小心不激怒西班牙政府。但私下，我们将向唐·[SCOPE.sCharacter('don_carlos_char').GetFirstNameNoFormatting]提供一切支持。通过秘密渠道，我们将送去资源、顾问与资金以加强其主张。我们的目标是恢复西班牙君主制，并扑灭我们两国土地上的革命势力。"
  cr_carlist_events.15.d.legitimist_absolutist:0 "拒绝庇护——唐·[SCOPE.sCharacter('don_carlos_char').GetFirstNameNoFormatting]是失败僭称者"
  cr_carlist_events.15.d.legitimist_absolutist_tt:0 "失败僭称者的时代已过。唐·[SCOPE.sCharacter('don_carlos_char').GetFirstNameNoFormatting]的叛乱从一开始就注定失败，显然其事业永无成功可能。给予他庇护将让我们卷入失败事业。我们不会支持一个只带来不稳之人。让他悄然淡出最好。"

  cr_carlist_events.15.a.bonapartist_absolutist:0 "支持其事业——传统主义联盟"
  cr_carlist_events.15.a.bonapartist_absolutist_tt:0 "支持唐·[SCOPE.sCharacter('don_carlos_char').GetFirstNameNoFormatting]，我们可在西班牙恢复旧君主秩序。虽然封建主义对某些人看似落后，与绝对主义势力的联盟可确保西班牙回归我们倡导的中央集权统治。"
  cr_carlist_events.15.b.bonapartist_absolutist:0 "将他当作棋子——操纵西班牙问题"
  cr_carlist_events.15.b.bonapartist_absolutist_tt:0 "与其援助他，我们可将唐·[SCOPE.sCharacter('don_carlos_char').GetFirstNameNoFormatting]当作政治工具。他在法国的存在可用于动摇西班牙或集结绝对主义派系不满，将我们置于强加伊比利亚半岛愿景的位置。"
  cr_carlist_events.15.c.bonapartist_absolutist:0 "允许他庇护——无需干涉"
  cr_carlist_events.15.c.bonapartist_absolutist_tt:0 "唐·[SCOPE.sCharacter('don_carlos_char').GetFirstNameNoFormatting]是失败王子，我们无意干涉西班牙事务。让他作为法国客人留驻，但我们不会干涉其事业或推动其复位。"
  cr_carlist_events.15.d.bonapartist_absolutist:0 "拒绝他——不受欢迎的过去遗物"
  cr_carlist_events.15.d.bonapartist_absolutist_tt:0 "我们无需一个寻求恢复过时封建制度的旧君主。让唐·[SCOPE.sCharacter('don_carlos_char').GetFirstNameNoFormatting]返回西班牙面对行动后果，或让他找其他国家收留。法国将仍是进步与改革的中心。"

  cr_carlist_events.15.a.republic_tt:0 "让他看看我们的共和国，知道他那一类是逝去时代的遗物。"
  cr_carlist_events.15.a.fallback:0 "他并非对我们威胁；让他留下"
  cr_carlist_events.15.b:0 "我们应支持同道绝对主义者"
  cr_carlist_events.15.c:0 "我们无容身之地给他这种人"
  cr_carlist_events.spain_likely_approves:0 "[SCOPE.sCountry('spain').GetName]很可能#b #green 批准#!#!，关系提升。"
  cr_carlist_events.spain_likely_disapproves:0 "[SCOPE.sCountry('spain').GetName]很可能#b #r 不赞成#!#!，关系下降。"

  #西班牙反应事件 - 流亡
  cr_carlist_events.20.t:0 "[SCOPE.sState('don_carlos_exile_state').GetFarmHubName]的流亡"
  cr_carlist_events.20.t_bourges:0 "布尔日的流亡"
  cr_carlist_events.20.desc_france_orleanist_bourges:0 "随着军队四散、王位希望破灭，僭称者唐·[SCOPE.sCharacter('don_carlos_char').GetFirstName]已逃过边境进入[SCOPE.sCountry('don_carlos_exile_country').GetNameNoFlag]，其表亲[SCOPE.sCountry('don_carlos_exile_country').GetRuler.GetPrimaryRoleTitle][SCOPE.sCountry('don_carlos_exile_country').GetRuler.GetFirstName]给予他庇护。他的东道主警惕外交后果，既不认可其主张，也不公开否认，让他成为自身无关紧要的囚徒。"
  cr_carlist_events.20.desc_france_orleanist_bourges_flavour:0 "在布尔日安静的角落，唐·[SCOPE.sCharacter('don_carlos_char').GetFirstNameNoFormatting]从视野中淡出，成为昔日自我的影子。虽然对某些人仍是象征，奥尔良派已小心与他主张保持距离，让他沉沦于默默无闻。虽然卡洛斯派仍低语其回归，其余西班牙向前迈进，不为失败事业的遥远回音所扰。"

  cr_carlist_events.20.desc_france_orleanist_generic:0 "随着军队四散、王位希望破灭，僭称者唐·[SCOPE.sCharacter('don_carlos_char').GetFirstName]已逃过边境进入[SCOPE.sCountry('don_carlos_exile_country').GetNameNoFlag]，其表亲[SCOPE.sCountry('don_carlos_exile_country').GetRuler.GetPrimaryRoleTitle][SCOPE.sCountry('don_carlos_exile_country').GetRuler.GetFirstName]给予他庇护。然而他并非作为待君主被接待，而是被小心保持距离的客人。他的东道主警惕外交后果，既不认可其主张，也不公开否认，让他成为自身无关紧要的囚徒。"
  cr_carlist_events.20.desc_france_orleanist_generic_flavour:0 "在[SCOPE.sState('don_carlos_exile_state').GetFarmHubName]安静的角落，唐·[SCOPE.sCharacter('don_carlos_char').GetFirstNameNoFormatting]从视野中淡出，成为昔日自我的影子。虽然对某些人仍是象征，奥尔良派已小心与他主张保持距离，让他沉沦于默默无闻。虽然卡洛斯派仍低语其回归，其余西班牙向前迈进，不为失败事业的遥远回音所扰。"

  cr_carlist_events.20.desc_france_legitimist_refuge:0 "失败但未破，唐·[SCOPE.sCharacter('don_carlos_char').GetFirstName]在[SCOPE.sCountry('don_carlos_exile_country').GetNameNoFlag]找到庇护，同类政权[SCOPE.sCountry('don_carlos_exile_country').GetRuler.GetPrimaryRoleTitle][SCOPE.sCountry('don_carlos_exile_country').GetRuler.GetFirstName]给予他庇护。虽然东道主认可共同贵族血统，但选择了中立道路，既不认可其主张，也不积极反对。"
  cr_carlist_events.20.flavour_france_legitimist_refuge:0 "目前，唐·[SCOPE.sCharacter('don_carlos_char').GetFirstNameNoFormatting]流亡中逗留——对[SCOPE.sPoliticalMovement('carlist_movement').GetNameNoIcon]是集结象征，他的存在提醒并非所有人都接受[SCOPE.sCountry('spain').GetRuler.GetPrimaryRoleTitle][SCOPE.sCountry('spain').GetRuler.GetFirstName]的统治。虽然[SCOPE.sCountry('don_carlos_exile_country').GetNameNoFormatting]承诺不介入，我们能真正信任卡洛斯派野心不会在异国重燃吗？"

  cr_carlist_events.20.desc_france_legitimist_bourges_flavour:0 "在布尔日安静的角落，唐·[SCOPE.sCharacter('don_carlos_char').GetFirstNameNoFormatting]从视野中淡出，成为昔日自我的影子。虽然对某些人仍是象征，其他波旁已小心与他主张保持距离，让他沉沦于默默无闻。虽然卡洛斯派仍低语其回归，其余西班牙向前迈进，不为失败事业的遥远回音所扰。"
  cr_carlist_events.20.desc_france_bonapartist_refuge:0 "唐·[SCOPE.sCharacter('don_carlos_char').GetFirstName]，在战败与溃散后，已越过边境进入[SCOPE.sCountry('don_carlos_exile_country').GetNameNoFlag]，寻求[SCOPE.sCountry('don_carlos_exile_country').GetRuler.GetFullName]的庇护。虽然获得了庇护权，但他的处境远非王者待遇。一位波拿巴主义者如今收留了一位波旁觊觎者，但这并非出于亲族情谊——而是一种精明的算计，要让他保持无力且被孤立的状态。"
  cr_carlist_events.20.desc_france_bonapartist_refuge_flavour:0 "他的“庇护”更像一座牢笼，而非避风港。这位觊觎者不再是等待登基的君王，而是一个被噤声的人物，他的行动受到限制，他的言辞被波拿巴派主人小心监视。在[SCOPE.sPoliticalMovement('carlist_movement').GetNameNoFormatting]眼中，他仍是抵抗的象征，但影响力已微乎其微，沦为一个遥远、无实的傀儡，在异国他乡被孤立且无力。他的事业不过是一场失败叛乱的低语记忆，只要波拿巴派监护人确保他的无能，西班牙的内部稳定就不太可能受到这位流亡觊觎者的威胁。"

  cr_carlist_events.20.desc_republic:0 "来自比利牛斯山另一侧的消息称，唐·[SCOPE.sCharacter('don_carlos_char').GetFirstName]——这位曾高举王座与祭坛旗帜之人——如今在[SCOPE.sCountry('don_carlos_exile_country').GetAdjectiveNoFormatting]三色旗下获得了庇护，被[SCOPE.sCountry('don_carlos_exile_country').GetNameNoFlag]接纳。"
  cr_carlist_events.20.desc_republic_flavour_bourgos:0 "虽然这一举动将唐·[SCOPE.sCharacter('don_carlos_char').GetFirstNameNoFormatting]从[ROOT.GetCountry.GetAdjectiveNoFormatting]政治中移除——他更多是象征而非威胁——但在某些乡村与教堂角落，他的逃亡并不被视为终结，而只是暂时的停顿。尽管人已离去，那受伤的、浪漫的、尚未实现的理想，仍存留在那些曾梦想他归来之人的心中。"
  cr_carlist_events.20.desc_republic_flavour_generic:0 "一个因反抗国王而诞生的共和国，如今却收留了一位国王。流亡且战败的唐·[SCOPE.sCharacter('don_carlos_char').GetFirstNameNoFormatting]行走在[SCOPE.sState('don_carlos_exile_state').GetFarmHubName]的街头——一位君主主义遗物，被一个革命国家不情愿地保护着。他的存在是西班牙无法忽视、也难以轻易原谅的矛盾。"

  cr_carlist_events.20.t_britian:0 "雾中王子"
  cr_carlist_events.20.desc_britian_hmgovernment:0 "来自[SCOPE.sState('carlos_arrival_state').GetNameNoFormatting]潮湿港口的消息称，唐·[SCOPE.sCharacter('don_carlos_char').GetFirstName]已获[SCOPE.sCountry('don_carlos_exile_country').GetRuler.GetHerHis|U]陛下政府准许政治庇护。虽然[SCOPE.sCountry('don_carlos_exile_country').GetNameNoFlag]并未正式支持他的王位主张，但此举并非没有后果。尽管标榜中立，收留卡洛斯觊觎者仍赋予他一丝在国内已丧失的合法性。\n\n在宫廷与议会中，意见分歧。一些人视此为英国干涉伊比利亚事务，对[SCOPE.sCountry('spain').GetRuler.GetPrimaryRoleTitle][SCOPE.sCountry('spain').GetRuler.GetFirstName]辛苦赢得的稳定构成无声冒犯；另一些人则认为这只是礼节性举动——[SCOPE.sCountry('don_carlos_exile_country').GetAdjectiveNoFormatting]沉迷于接待落难王座幽魂的陈旧传统。不管怎样，唐·卡洛斯仍然活着——不在西班牙，不在权力中，而是在流亡中，在米字旗下。"

  cr_carlist_events.20.t_australia:0 "南天下的流亡者"
  cr_carlist_events.20.desc_australia:0 "遭到欧洲君主们嫌弃的唐·[SCOPE.sCharacter('don_carlos_char').GetFirstName]虽在[SCOPE.sCountry('don_carlos_exile_country').GetNameNoFlag]寻求庇护，却顽固拒绝放弃王位主张。英国不愿庇护一个对西班牙稳定构成持久威胁的人物，遂将其流放到[SCOPE.sCountry('australia').GetNameNoFlag]——一片如此遥远的土地，他的理想将在广袤的南天之下逐渐消散。"

  cr_carlist_events.20.t_austria:0 "哈布斯堡的避风港"
  cr_carlist_events.20.desc_austria:0 "维也纳已向马德里保证，将严格保持中立，把唐·[SCOPE.sCharacter('don_carlos_char').GetFirstNameNoFormatting]的活动限制起来，防止他利用[SCOPE.sCountry('don_carlos_exile_country').GetAdjectiveNoFormatting]的土地继续推动已失败的事业。\n\n目前，从国外重新点燃卡洛斯起义的威胁看来很小，我们可以专注于巩固自身地位。然而，即便被钳制，这位觊觎者的存在本身，仍是对我们正统性的微妙冒犯。"

  cr_carlist_events.20.t_russia:0 "泰加林中的觊觎者"
  cr_carlist_events.20.desc_russia:0 "[SCOPE.sCountry('don_carlos_exile_country').GetRuler.GetPrimaryRoleTitle][SCOPE.sCountry('don_carlos_exile_country').GetRuler.GetFirstName]下令将唐·[SCOPE.sCharacter('don_carlos_char').GetFirstName]流放到西伯利亚。这位自诩为专制主义保护者的君主，选择将卡洛斯事业埋葬在荒凉的荒野，而不是金笼之中，彻底断绝他重燃叛乱的任何希望。此举鲜明体现了沙皇维持欧洲秩序的务实决心，哪怕代价是牺牲一位同为专制主义宣称者。"

  cr_carlist_events.21.desc_france_orleanist:0 "虽遭失败却未屈服的觊觎者唐·[SCOPE.sCharacter('don_carlos_char').GetFirstName]，意外地得到了堂兄[SCOPE.sCountry('don_carlos_exile_country').GetRuler.GetPrimaryRoleTitle][SCOPE.sCountry('don_carlos_exile_country').GetRuler.GetFirstName]的庇护。虽然没有正式声明，但巴黎并未将他驱逐或软禁，反而给予他相当的自由，让他得以在庇护下集结盟友。"

  cr_carlist_events.21.desc_france_legitimist:0 "唐·[SCOPE.sCharacter('don_carlos_char').GetFirstName]并未被抛弃，他在宗亲的怀抱中找到了庇护。[SCOPE.sCountry('don_carlos_exile_country').GetNameNoFlag]的正统派政府不认为他是一位失败的觊觎者，而是被不公地逐出王位的[ROOT.GetCountry.GetNameNoFormatting]合法国王。在东道主警惕的目光下，他被允许集结盟友，在一个仍然相信国王神授权利的国家的悄然赞助下，重新点燃他的事业。"

  cr_carlist_events.21.t_portugal:0 "援助西班牙的敌人"
  cr_carlist_events.21.desc_portugal:0 "[SCOPE.sCountry('don_carlos_exile_country').GetAdjectiveNoFlag]王室已向唐·[SCOPE.sCharacter('don_carlos_char').GetFirstName]公开下注，不但给予庇护，更正式承认他对[SCOPE.sCountry('spain').GetAdjectiveNoFormatting]王位的主张——这是一场披着兄弟专制主义外衣的挑衅行为。"

  cr_carlist_events.21.t_austria_metternich:0 "梅特涅的赌局"
  cr_carlist_events.21.desc_austria_metternich:0 "尽管没有公开声明，但来自[SCOPE.sCountry('don_carlos_exile_country').GetCapital.GetCityHubName]的细微信号证实了我们的担忧：欧洲秩序的缔造者——梅特涅亲王，正在暗中支持他的事业。此举旨在削弱任何非建立在绝对君主制之上的政权，直接威胁我们的正统性。"

  cr_carlist_events.21.t_russia:0 "专制主义的保护者"
  cr_carlist_events.21.desc_russia:0 "[SCOPE.sCountry('don_carlos_exile_country').GetRuler.GetPrimaryRoleTitle][SCOPE.sCountry('don_carlos_exile_country').GetRuler.GetFirstName]公开拥抱了唐·[SCOPE.sCharacter('don_carlos_char').GetFirstName]的事业。这位自诩为自由主义对立面与国王神权捍卫者的人物，将这位觊觎者变成了神圣同盟的象征，一把对准我们自由派王位的武器。"
  #Fallback if no valid options exit
  cr_carlist_events.22.t:0 "湮灭的王位主张"
  cr_carlist_events.22.desc:0 "唐·[SCOPE.sCharacter('don_carlos_char').GetFirstName]漫长的传奇以一种戏剧性且出人意料的方式画上了句号。载着这位战败觊觎者前往流亡的船只遭遇了一场突如其来的猛烈风暴。尽管船员奋力抢救，船只仍无法抵挡狂暴的海浪。据报，船体迅速断裂并沉没，唐·[SCOPE.sCharacter('don_carlos_char').GetFirstNameNoFormatting]与船上所有人一同葬身海底。\n\n他曾是专制主义与传统的号召，如今他的事业彻底湮灭于波涛之下。他再也不会寻求庇护、密谋复辟，或挑战欧洲的王座。大海对王冠与权利主张漠不关心，它夺走了他，为卡洛斯威胁画上了一个突然而彻底的终点。"
  cr_carlist_events.22.flavour:0 "军队未能做到的事，海浪完成了。在冰冷幽暗的海洋怀抱中，他专制梦想的最后余烬被彻底熄灭。没有流亡宫廷，没有政治博弈——只有浩瀚而沉默的大海。他苦苦追求的王冠如今永远遥不可及，沉没于一个早已抛下他的世界波涛之下。"
  cr_carlist_events.22.a:0 "一场无可辩驳的终结。"
  cr_carlist_events.22.a_tt:0 "唐·[SCOPE.sCharacter('don_carlos_char').GetFirstNameNoFormatting]的死亡彻底消除了关于卡洛斯运动未来的任何疑虑。他的主张现已真正死亡，西班牙可以摆脱他归来的幽灵，继续前行。"
  cr_carlist_events.22.a_tt2:0 "[SCOPE.sPoliticalMovement('carlist_movement').GetName]将被解散。"

  cr_carlist_events.24.t:0 "王家远征"
  cr_carlist_events.24.desc:0 "我们对首都的大胆进军已使[SCOPE.sCountry('cr_christinos').GetAdjectiveNoFlag]的抵抗崩溃，胜利的天平正向我们倾斜。绝望之中，#variable Maria Christinia#!试图挽回残局，向我们提出和平条件：我们的儿子卡洛斯·路易斯与[SCOPE.sCountry('cr_christinos').GetRuler.GetFirstName]联姻，但前提是[SCOPE.sCountry('cr_christinos').GetRuler.GetFirstNameNoFormatting]继续保留[SCOPE.sCountry('cr_christinos').GetRuler.GetPrimaryRoleTitle]之位。这一条件意味着我们必须放弃自己的王位主张，转而支持我们的儿子以及未来的孙子。"
  cr_carlist_events.24.a:0 "我们绝不从胜利边缘抢回失败！"
  cr_carlist_events.24.b:0 "结束无谓的西班牙人流血的明智妥协"

  cr_carlist_events.25.t:0 "旧秩序的胜利"
  cr_carlist_events.25.desc:0 "马德里在合法国王的旗帜下屹立不倒。克里斯蒂诺篡位者四散奔逃，他们的伪女王被废黜，唐·[SCOPE.sCountry('cr_carlists').GetRuler.GetFirstName]凭借法律、血统与上帝的恩典登上了属于他的王位。经过多年的纷争与背叛，西班牙终于恢复了它的自然秩序。\n\n然而胜利也带来了治理的重担。自由派试图以他们虚假的进步之名抹去我们的传统。我们应当对他们展现他们曾拒绝给予我们的仁慈吗？我们应当寻求和解，将误入歧途者重新接纳进怀抱吗？还是应当彻底清除他们的影响，确保外来思想与无神革命永远无法再威胁我们神圣的国度？"
  cr_carlist_events.25.desc_2:0 "卡洛斯旗帜如今骄傲地飘扬在马德里王宫之上，克里斯蒂诺事业已灰飞烟灭。\n\n这场胜利离不开我们[SCOPE.sCulture('cr_basque_culture').GetName]兄弟们的支持。然而，若以为他们是出于我们正义的主张而战，那就太天真了。\n不；他们反抗的是克里斯蒂诺对他们祖传权利与特权的侵犯。\n\n我们该如何回报他们的支持？"
  cr_carlist_events.25.flavour:0 "巴斯克诸省的特权对西班牙民族而言是可憎的，查理对此心知肚明；若他明年成为西班牙国王，他很快就会找到借口侵犯这些特权，甚至彻底废除它们。代议制政府将努力使西班牙提升至巴斯克诸省的水平——而一位视自由之名即为可憎的专制君主，则会竭力将诸省拉低到与其他地区相同的低下水准。——#italic 英国驻毕尔巴鄂外交官#!"
  cr_carlist_events.25.a:0 "西班牙属于上帝、国王与人民。"
  cr_carlist_events.25.a_tt:0 "[SCOPE.sCountry('cr_kingdom_of_navarra').GetName]将以[concept_personal_union]形式留在[SCOPE.sCountry('cr_christinos').GetName]之内，同时保留其独立的法律"
  cr_carlist_events.25.b:0 "只能有一个西班牙。"
  cr_carlist_events.25.b_tt:0 "[SCOPE.sCountry('cr_kingdom_of_navarra').GetName]将被并入[SCOPE.sCountry('cr_christinos').GetName]，[SCOPE.sCulture('cr_basque_culture').GetName]的#variable Fueros#!将被废除"

  cr_carlist_events.30.t:0 "[SCOPE.sCountry('spain').GetAdjectiveNoFormatting]觊觎者"
  cr_carlist_events.30.desc_monarchy_first_visit:0 "波旁的唐·[SCOPE.sCharacter('don_carlos_char').GetFirstName]，卡洛斯派对[SCOPE.sCountry('spain').GetAdjectiveNoFlag]王位的宣称者，已抵达[SCOPE.sState('carlos_arrival_state').GetPortHubName]寻求政治庇护。曾经的专制主义捍卫者，如今以战败流亡者的身份出现，仍拒绝放弃他的主张。\n\n英国长期以来为流亡王室提供庇护，然而收留这样一位人物可能触怒马德里，并重新点燃欧洲旧有的争端。他将被视为无害的遗物，还是危险的象征，将决定他人如何看待我们的中立。"
  cr_carlist_events.30.desc_legitimist_or_orleanist_1_monarchy:0 "在被他的堂兄[SCOPE.sCountry('don_carlos_exile_rejected').GetRuler.GetPrimaryRoleTitle][SCOPE.sCountry('don_carlos_exile_rejected').GetRuler.GetFirstName]拒绝后，唐·[SCOPE.sCharacter('don_carlos_char').GetFirstName]已抵达[ROOT.GetCountry.GetAdjectiveNoFormatting]领土，寻求[ROOT.GetCountry.GetRuler.GetHerHis|U]陛下政府保护下的政治庇护。\n\n在[SCOPE.sState('carlos_arrival_state').GetPortHubName]登陆，这位对[SCOPE.sCountry('spain').GetAdjectiveNoFlag]王位的卡洛斯派宣称者受到应有的礼遇，却带来了一个棘手的问题；与其他流亡者不同，唐·[SCOPE.sCharacter('don_carlos_char').GetFirstNameNoFormatting]拒绝放弃他的主张，坚持认为自己仍是[SCOPE.sCountry('spain').GetNameNoFormatting]的合法国王。他的顽强立场有使我们卷入[SCOPE.sCountry('spain').GetNameNoFormatting]王朝争端的风险，向他提供庇护很可能会得罪[SCOPE.sCountry('spain').GetAdjectiveNoFlag]政府。"
  cr_carlist_events.30.desc_neutral_1_monarchy:0 "一艘载有觊觎者唐·[SCOPE.sCharacter('don_carlos_char').GetFirstName]的船只已抵达[SCOPE.sState('carlos_arrival_state').GetPortHubName]港口。在争夺[SCOPE.sCountry('spain').GetAdjectiveNoFlag]王位的战争失败后，他游走于欧洲各宫廷寻找保护与流亡之地。如今他转向我们，寻求[SCOPE.sCountry('don_carlos_exile_country').GetRuler.GetHerHis|U]陛下政府的庇护。\n\n他的到来带来了一个微妙的困境。与其他流亡者不同，唐·[SCOPE.sCharacter('don_carlos_char').GetFirstNameNoFormatting]拒绝放弃他的主张，坚持认为自己仍是[SCOPE.sCountry('spain').GetNameNoFormatting]的合法国王。给予他庇护有使英国卷入[SCOPE.sCountry('spain').GetNameNoFormatting]王朝争端并损害我们与[SCOPE.sCountry('spain').GetAdjectiveNoFlag]政府关系的风险。"
  cr_carlist_events.30.desc_neutral_1_monarchy2:0 "在被[SCOPE.sCountry('don_carlos_exile_rejected').GetNameNoFlag]拒绝后，唐·[SCOPE.sCharacter('don_carlos_char').GetFirstName]已抵达[SCOPE.sCountry('don_carlos_exile_country').GetAdjectiveNoFormatting]领土，寻求[SCOPE.sCountry('don_carlos_exile_country').GetRuler.GetHerHis|U]陛下政府保护下的政治庇护。在[SCOPE.sState('carlos_arrival_state').GetPortHubName]登陆，这位对[SCOPE.sCountry('spain').GetAdjectiveNoFlag]王位的卡洛斯派宣称者受到应有的礼遇，却带来了一个棘手的问题：\n\n与其他流亡者不同，唐·[SCOPE.sCharacter('don_carlos_char').GetFirstNameNoFormatting]拒绝放弃他的主张，坚持认为自己仍是[SCOPE.sCountry('spain').GetNameNoFormatting]的合法国王。他的顽强立场有使我们卷入[SCOPE.sCountry('spain').GetNameNoFormatting]王朝争端的风险，向他提供庇护很可能会得罪[SCOPE.sCountry('spain').GetAdjectiveNoFlag]政府。"
  cr_carlist_events.30.desc_neutral_republic:0 "唐·[SCOPE.sCharacter('don_carlos_char').GetFirstName]，[SCOPE.sCountry('spain').GetAdjectiveNoFlag]王位的卡洛斯派觊觎者，已在[SCOPE.sState('carlos_arrival_state').GetPortHubName]寻求庇护。虽然他的事业已告失败，但他拒绝放弃头衔。给予他庇护可能被视为偏袒君主主义反动势力，而拒绝则可能损害英国向失败者提供庇护的声誉。"
  cr_carlist_events.30.desc_neutral_1_republic_old:0 "唐·[SCOPE.sCharacter('don_carlos_char').GetFirstName]，[SCOPE.sCountry('spain').GetAdjectiveNoFlag]王位的卡洛斯派宣称者，已抵达普利茅斯港口寻求政治庇护。他已被[SCOPE.sCountry('don_carlos_exile_rejected').GetNameNoFlag]拒绝，盟友所剩无几，希望能在英国找到庇护所。\n\n然而，他拒绝放弃对[SCOPE.sCountry('spain').GetAdjectiveNoFormatting]王冠的主张，这带来了外交上的挑战；给予唐·[SCOPE.sCharacter('don_carlos_char').GetFirstNameNoFormatting]庇护可能被视为支持他的事业，有可能破坏[SCOPE.sCountry('spain').GetNameNoFormatting]脆弱的和平。反之，拒绝庇护则可能疏远英国国内具有君主主义倾向的群体。"
  cr_carlist_events.30.desc_neutral_1_republic:0 "唐·[SCOPE.sCharacter('don_carlos_char').GetFirstName]，[SCOPE.sCountry('spain').GetAdjectiveNoFlag]王位的卡洛斯派觊觎者，已在[SCOPE.sState('carlos_arrival_state').GetPortHubName]寻求庇护。他已被[SCOPE.sCountry('don_carlos_exile_rejected').GetNameNoFlag]拒绝，盟友所剩无几，希望能在英国找到庇护所。虽然他的事业已告失败，但他拒绝放弃头衔。给予他庇护可能被视为偏袒君主主义反动势力，而拒绝则可能损害英国向失败者提供庇护的声誉。"
  cr_carlist_events.30.desc_fallback:0 "波旁的唐·[SCOPE.sCharacter('don_carlos_char').GetFirstName]，[SCOPE.sCountry('spain').GetAdjectiveNoFlag]王位的卡洛斯派宣称者，已抵达[SCOPE.sState('carlos_arrival_state').GetPortHubName]寻求政治庇护。曾经的专制主义捍卫者，如今以战败流亡者的身份出现，仍拒绝放弃他的主张。\n\n英国长期以来为流亡王室提供庇护，然而收留这样一位人物可能触怒马德里，并重新点燃欧洲旧有的争端。他将被视为无害的遗物，还是危险的象征，将决定他人如何看待我们的中立。"
  cr_carlist_events.30.flavour:0 "对一些人而言，他是欧洲旧秩序悲剧性的残余，理应得到安静的尊严。对另一些人而言，他的存在是外交负担，是早已被抛弃的事业与最好留给历史的君主制的尴尬提醒。收留他或许是传统；拥抱他的事业则是另一回事。"
  cr_carlist_events.30.a:0 "驱逐他——让他去别处寻找庇护。"
  cr_carlist_events.30.b:0 "在英国监视下收留他。"
  cr_carlist_events.30.c:0 "将他流放到澳大利亚——远离欧洲政治。"

  cr_carlist_events.31.t:0 "不受欢迎的客人？"
  cr_carlist_events.31.desc_hmgovernment:0 "消息传至[ROOT.GetCountry.GetCapital.GetCityHubName]：唐·[SCOPE.sCharacter('don_carlos_char').GetFirstName]，[SCOPE.sCountry('spain').GetAdjectiveNoFlag]王位的流亡觊觎者，将被重新安置于澳大利亚——奉[SCOPE.sCountry('don_carlos_exile_country').GetRuler.GetHerHis|U]陛下政府之命，被放逐到帝国的边缘。曾经的专制主义反抗者，如今不再是等待登基的君王，而是一件欧洲旧秩序衰落时期的遗物，注定归于寂静的湮没。"
  cr_carlist_events.31.desc_generic:0 "消息传至[ROOT.GetCountry.GetCapital.GetCityHubName]：唐·[SCOPE.sCharacter('don_carlos_char').GetFirstName]，[SCOPE.sCountry('spain').GetAdjectiveNoFlag]觊觎者与昔日反动君主制的斗士，将被重新安置于澳大利亚。曾经在欧洲政治中叱咤风云的人物，如今不再以流亡君主身份到来，而是一个普通人——被剥夺头衔，听从远方当局的命令，那些当局已不再认为他在欧洲大陆有容身之处。"
  cr_carlist_events.31.flavour:0 "在这片罪犯与开拓者的土地上，[SCOPE.sCountry('spain').GetAdjectiveNoFormatting]王冠的觊觎者发现自己与他的事业隔着整个海洋——太远，无法召集支持者；太孤立，无法掀起骚乱。在[ROOT.GetCountry.GetNameNoFormatting]，他的主张不过是一段记忆，在广袤的南天之下逐渐消逝。"
  cr_carlist_events.31.a:0 "让他在殖民地安静定居。"
  cr_carlist_events.31.a_tt:0 "我们将确保唐·[SCOPE.sCharacter('don_carlos_char').GetFirstNameNoFormatting]仅作为客人，而非阴谋者。"
  cr_carlist_events.31.b:0 "像对待其他流亡者一样对待他——他现在只是另一个定居者。"
  cr_carlist_events.31.b_tt:0 "让流亡的唐·[SCOPE.sCharacter('don_carlos_char').GetFirstNameNoFormatting]自由行动——他的事业已失败，在这里他构不成真正威胁。"
  cr_carlist_events.31.c:0 "鼓励他离开——他不是我们该关心的事。"
  cr_carlist_events.31.c_tt:0 "我们不需要流亡的落难国王。让他去别处寻找自己的命运。"

  cr_carlist_events.50.t:0 "神授王权的庇护所"
  cr_carlist_events.50.desc:0 "在[SCOPE.sCountry('spain').GetNameNoFormatting]遭到决定性失败后，唐·[SCOPE.sCharacter('don_carlos_char').GetFirstName]，[SCOPE.sCountry('spain').GetAdjectiveNoFlag]王位的觊觎者，已来到[ROOT.GetCountry.GetCapital.GetCityHubName]寻求我们的支持与保护。\n\n他的请求提出了一个深刻的问题，因为这关乎俄罗斯在欧洲舞台上的根本使命。作为抵御革命自由主义浪潮的坚定壁垒，以及国王神授权利的自封守护者，我们面临抉择：是通过支持一位同为绝对统治捍卫者来重申我们对#variable神圣同盟#!的承诺，还是在日益敌视我们理想的世界中优先选择务实的谨慎。"
  cr_carlist_events.50.flavour:0 "圣彼得堡宏伟的宫殿如今迎来一位体现我们时代核心斗争的访客。唐·卡洛斯，一位被剥夺尘世王座的君主，象征着神圣秩序正遭受革命狂热的围攻。对于宫廷与教会中的许多人而言，他的到来有力地提醒着俄罗斯保卫合法统治的神圣职责，无论它在何处受到威胁。他坚定不移的信仰与毫不妥协的专制主义在这里引起强烈共鸣，与西欧政治变幻莫测的形势形成鲜明对比。"
  cr_carlist_events.50.a:0 "给予坚定不移的支持——为了上帝、沙皇与神圣同盟！"
  cr_carlist_events.50.a_tt:0 "我们将不仅为唐·[SCOPE.sCharacter('don_carlos_char').GetFirstNameNoFormatting]提供庇护，还将给予他全部的道义与物质支持。作为神圣同盟的领导强国，保卫合法君主制与传统秩序、对抗革命浪潮是我们神圣的职责。他的事业是正义的，我们将与他站在一起，不惜一切代价在西班牙恢复真正的信仰与合法统治。这将成为所有反抗自由主义者的灯塔。"
  cr_carlist_events.50.b:0 "将他流放到西伯利亚——给所有觊觎者一个严厉的教训。"
  cr_carlist_events.50.b_tt:0 "虽然我们同情唐·[SCOPE.sCharacter('don_carlos_char').GetFirstNameNoFormatting]为合法统治而进行的斗争，但他的持续叛乱威胁着欧洲更广泛的秩序。为了展示我们对稳定的坚定承诺，并阻止任何进一步的君主冒险行为，我们将把他流放到西伯利亚广袤而无情的荒野。这将成为一个严厉的教训：即便是最狂热的 神授权利捍卫者，也不能被允许破坏欧洲大陆的稳定。"
  cr_carlist_events.50.b_exile:0 "给予庇护，但专注于欧洲稳定。"
  cr_carlist_events.50.b_exile_tt:0 "虽然我们对唐·[SCOPE.sCharacter('don_carlos_char').GetFirstNameNoFormatting]的斗争深表同情，也认同他的原则，但此时直接干预西班牙或许并不明智。我们将给予他庇护并允许他平静居住，以此展示我们对合法统治的承诺，同时优先考虑神圣同盟所设想的全欧洲稳定。目前，我们的支持将保持低调。"
  cr_carlist_events.50.c:0 "拒绝庇护——他的失败削弱了所有君主制。"
  cr_carlist_events.50.c_tt:0 "唐·[SCOPE.sCharacter('don_carlos_char').GetFirstNameNoFormatting]的叛乱已经失败，公开收留他将使我们与一个失败的事业挂钩，有可能鼓舞欧洲各地的革命势力。我们作为君主制捍卫者的职责要求的是力量而非软弱。他必须去别处寻找庇护，因为他的存在只会削弱我们试图为所有合法王冠维护的原则。"

  cr_carlist_events.60.t:0 "唐·卡洛斯与欧洲协调"
  cr_carlist_events.60.desc:0 "即便在和平时期，[SCOPE.sCountry('spain').GetAdjectiveNoFlag]局势仍威胁着欧洲协调的微妙平衡。唐·[SCOPE.sCharacter('don_carlos_char').GetFirstName]逃脱追捕，如今正在欧洲各宫廷游说，寻找家园或赞助者。他的困境为我们提供了影响大陆稳定的机会。\n\n亲王[SCOPE.sCharacter('don_carlos_supporting_politician').GetLastName|U]——这一脆弱和平的缔造者——明白：虽然我们可能希望将唐·[SCOPE.sCharacter('don_carlos_char').GetFirstNameNoFormatting]排除出局以稳定短期局势，但他的专制主义事业与[SCOPE.sCountry('spain').GetRuler.GetPrimaryRoleTitle][SCOPE.sCountry('spain').GetRuler.GetFirstName]的自由派政府形成鲜明对比。支持一方或另一方，或干脆完全置身事外，每一种选择都为[ROOT.GetCountry.GetNameNoFormatting]及欧洲带来不同的风险与回报。"
  cr_carlist_events.60.flavour:0 "[ROOT.GetCountry.GetCapital.GetCityHubName]的沙龙通常是微妙阴谋的舞台，如今却因唐·卡洛斯的到来而充满直接挑战。他本身的存在，就是对毫不妥协的过去的活生生象征，迫使帝国在对传统的承诺与欧洲稳定的迫切需要之间权衡。[SCOPE.sCharacter('don_carlos_supporting_politician').GetLastNameNoFormatting|U]的决定将对旧秩序的未来产生深远影响。"
  cr_carlist_events.60.a:0 "使他中立化——送他去安静的流亡之地。"
  cr_carlist_events.60.a_tt:0 "我们的首要任务是扑灭欧洲任何不稳定的火花。我们将给予唐·[SCOPE.sCharacter('don_carlos_char').GetFirstNameNoFormatting]庇护，但确保他被限制在国内一个安静的、政治上中立的流亡地点，远离任何重新点燃其事业或破坏欧洲协调的机会。"
  cr_carlist_events.60.b:0 "支持唐·卡洛斯——对抗自由主义的壁垒。"
  cr_carlist_events.60.b_tt:0 "由[SCOPE.sCountry('spain').GetRuler.GetPrimaryRoleTitle][SCOPE.sCountry('spain').GetRuler.GetFirstNameNoFormatting]领导的西班牙自由派政权是一股破坏稳定力量。亲王[SCOPE.sCharacter('don_carlos_supporting_politician').GetLastNameNoFormatting|U]认识到，支持唐·[SCOPE.sCharacter('don_carlos_char').GetFirstNameNoFormatting]可为威胁合法君主制的革命潮流提供关键的反制力量。我们将提供谨慎的援助，将他的事业视为长期欧洲稳定的重要支柱。"
  cr_carlist_events.60.c:0 "无视他——他的事业有引发战争的风险。"
  cr_carlist_events.60.c_tt:0 "唐·[SCOPE.sCharacter('don_carlos_char').GetFirstNameNoFormatting]的专制野心已经带来冲突，我们不能让帝国与一个有可能点燃新一轮欧洲战争的事业捆绑在一起。我们对欧洲协调的承诺要求我们把和平置于一切之上。他必须去别处寻找庇护。"

  cr_carlist_events.61.t:0 "哈布斯堡的避风港"
  cr_carlist_events.61.desc:0 "在[SCOPE.sCountry('spain').GetNameNoFormatting]遭到决定性失败后，唐·[SCOPE.sCharacter('don_carlos_char').GetFirstName]，[SCOPE.sCountry('spain').GetAdjectiveNoFlag]王位的觊觎者，已在我们仁慈的怀抱中寻求庇护。他抵达[SCOPE.sState('carlos_arrival_state').GetCityHubName]，这位曾经激情四射的专制主义与传统捍卫者，如今不再以等待登基的君王身份出现，而是一位在欧洲自由主义风暴中寻求慰藉的谦卑客人。\n\n他在我们帝国的存在提出了一个微妙的外交问题。数十年来我们一直努力避免革命与一场毁灭性的新欧洲战争。公开拥抱他会招致动荡，威胁我们精心培育的稳定。然而，承认[SCOPE.sCountry('spain').GetRuler.GetPrimaryRoleTitle][SCOPE.sCountry('spain').GetRuler.GetFirstName]的自由主义难道不会产生同样的后果吗？"
  cr_carlist_events.61.flavour:0 "[ROOT.GetCountry.GetCapital.GetCityHubName]的沙龙习惯于欧洲王朝家族的阴谋，如今因唐·卡洛斯的到来而议论纷纷。他是一个消逝时代的象征，是为旧秩序而战的鲜明提醒。有些人视他为值得尊严对待的高贵宗亲，另一些人则认为他是梅特涅秩序的潜在威胁，这一秩序维持了欧洲的和平。皇帝的决定将不仅体现怜悯，更体现确保权力平衡持续的战略立场。"
  cr_carlist_events.61.a:0 "给予他庇护——保持中立。"
  cr_carlist_events.61.a_tt:0 "我们将为唐·[SCOPE.sCharacter('don_carlos_char').GetFirstNameNoFormatting]提供庇护，履行提供避难之责，但必须确保他的存在不扰乱欧洲和平的微妙平衡。他应安静生活，不得利用我们的土地推进其政治野心或重新点燃西班牙冲突。我们首要关切的是大陆的稳定，而非一个已失败事业的复兴。"
  cr_carlist_events.61.b:0 "支持唐·卡洛斯——自由主义威胁秩序。"
  cr_carlist_events.61.b_tt:0 "由[SCOPE.sCountry('spain').GetRuler.GetPrimaryRoleTitle][SCOPE.sCountry('spain').GetRuler.GetFirstNameNoFormatting]领导的西班牙自由派政权是一股破坏欧洲君主秩序的势力。通过支持唐·[SCOPE.sCharacter('don_carlos_char').GetFirstNameNoFormatting]，我们可以捍卫合法专制主义事业，并借此确保强大、传统君主制所带来的长期稳定。我们将提供谨慎的援助，将他的事业视为对抗革命潮流的重要壁垒。"
  cr_carlist_events.61.c:0 "拒绝庇护——避免任何进一步的不稳定。"
  cr_carlist_events.61.c_tt:0 "唐·[SCOPE.sCharacter('don_carlos_char').GetFirstNameNoFormatting]的专制野心已给西班牙带来多年冲突，我们不能冒险让他的存在进一步破坏欧洲稳定。我们对欧洲协调的承诺要求我们把和平与秩序置于一切之上。他必须去别处、远离欧洲权力中心寻找庇护，让西班牙自行寻找出路。"

  cr_carlist_events.70.t:0 "流亡中的宗亲"
  cr_carlist_events.70.desc:0 "波旁的唐·[SCOPE.sCharacter('don_carlos_char').GetFirstName]，[SCOPE.sCountry('spain').GetAdjectiveNoFlag]王位的战败觊觎者，已抵达[SCOPE.sState('don_carlos_arrival_location').GetPortHubName]寻求庇护。曾经在[SCOPE.sCountry('spain').GetAdjectiveNoFormatting]高举专制复兴旗帜的他，如今并非以胜利者身份到来，而是一位信念失败的逃亡者——在失败中仍不屈服，在原则上毫不动摇。\n\n我国始终忠于上帝、王座与传统，而唐·[SCOPE.sCharacter('don_carlos_char').GetFirstNameNoFormatting]则体现了这些理想最不妥协的诠释。他的到来提出了一个问题：他的价值观是我们自身的反映，还是对不受约束的狂热可能导致何种后果的警示？他的命运——或许也是我们未来的一部分——掌握在我们手中。"
  cr_carlist_events.70.flavour:0 "对宫廷中的许多人而言，唐·[SCOPE.sCharacter('don_carlos_char').GetFirstNameNoFormatting]的困境令人痛心，是君主制遭受围攻的鲜明提醒——一位因忠于原则而非背叛而落难的宗亲。庇护他即是肯定我们共同的血统与对王座与祭坛的承诺。然而他的存在也令人不安：一个在失败中仍不屈服、在信仰上毫不妥协的人，或许与其说是流亡中的兄弟，不如说是一面过于贴近我们自身矛盾的镜子。"
  cr_carlist_events.70.desc_non_absolutist:0 "唐·[SCOPE.sCharacter('don_carlos_char').GetFirstNameNoFormatting]，[SCOPE.sCountry('spain').GetAdjectiveNoFlag]王位的被征服宣称者与昔日专制主义的斗士，已抵达我国寻求庇护。他的失败不仅标志着一场战役的结束，更标志着一个事业的黄昏——那个事业根植于对君主制与神授权利毫不妥协的愿景。\n\n虽然我们信奉君主制的神授合法性，受传统与信仰指引，但我国走了一条不同的道路：一条被改革、法治以及对自由日益尊重的道路。向唐·卡洛斯提供庇护是兄弟般的礼节；但拥抱他的意识形态则是另一回事。他不仅是落难王座的象征，更是专制主义最刚性形式的象征。在我们的王国中是否有容纳这样一位人物的空间——还是他的存在是我们无法承受的负担？"
  cr_carlist_events.70.flavour_no_absolutist:0 "对一些人而言，唐·卡洛斯是一位值得同情与庇护的流亡王子。但对另一些人而言，他是来自更古老、更严苛世界的阴影。他的到来在沙龙与酒馆中都引起不安：他会否激励旧专制秩序的狂热分子？抑或他那在国外已名誉扫地的主张，会否污染我们自身王冠与宪法之间脆弱的平衡？虽然王室为他提供了居所，许多人私下议论，他带来的不仅是战争的记忆，还有披着王室尊严的反动威胁。"
  cr_carlist_events.70.desc_prev_rejected:0 "在被欧洲各宫廷接连拒绝后，唐·[SCOPE.sCharacter('don_carlos_char').GetFirstName]，[SCOPE.sCountry('spain').GetAdjectiveNoFlag]王位的流亡觊觎者，已在我们境内寻求庇护。他抵达[SCOPE.sState('don_carlos_arrival_location').GetPortHubName]——远非他曾经梦想登临的权力殿堂——在我们面前提出了一个艰难的问题。\n\n我国始终忠于上帝、王座与传统，而唐·[SCOPE.sCharacter('don_carlos_char').GetFirstNameNoFormatting]代表了这一信仰的极端形式。这是我们希望遵循的道路吗？还是他的存在标志着对反动执着过紧的警示？"
  cr_carlist_events.70.flavour_prev_rejected:0 "他的事业已耗尽，但其象征意义犹存——提醒我们正航行于专制与改革之间的动荡时代。在我们考虑他的请求时，欧洲的目光正密切注视，我们国内的声音亦然，分裂于对重振力量的希望与对动荡的恐惧之间。"
  cr_carlist_events.70.desc_orleanist_rejected:0 "在被他的堂兄——已与自由主义潮流和解的[SCOPE.sCountry('don_carlos_exile_rejected').GetRuler.GetPrimaryRoleTitle][SCOPE.sCountry('don_carlos_exile_rejected').GetRuler.GetFirstName]——拒绝后，唐·[SCOPE.sCharacter('don_carlos_char').GetFirstName]，[SCOPE.sCountry('spain').GetAdjectiveNoFlag]王位的流亡觊觎者，已在我们境内寻求庇护。他抵达[SCOPE.sState('don_carlos_arrival_location').GetPortHubName]，在我们面前提出了一个艰难的问题。\n\n我国始终忠于上帝、王座与传统，而唐·[SCOPE.sCharacter('don_carlos_char').GetFirstNameNoFormatting]代表了这一信仰的极端形式。这是我们希望遵循的道路吗？还是他的存在标志着对反动执着过紧的警示，尤其当连其他波旁王冠都已向变革之风低头之时？"
  cr_carlist_events.70.flavour_orleanist_rejected:0 "他来到这里，见证了自己的亲族与他所鄙视的势力妥协。在他眼中，[SCOPE.sCountry('don_carlos_exile_rejected').GetRuler.GetFirstNameNoFormatting]的王位是一种背叛，是对威胁整个基督教世界的自由主义浪潮的让步。然而，他曾经作为力量源泉的坚定信念，如今在一个连王冠都必须适应或灭亡的世界里，显得像是一种负担。"
  cr_carlist_events.70.desc_legitimist_absolutist_rejected:0 "在被其波旁宗亲——[SCOPE.sCountry('don_carlos_exile_rejected').GetNameNoFlag]的[SCOPE.sCountry('don_carlos_exile_rejected').GetRuler.GetPrimaryRoleTitle][SCOPE.sCountry('don_carlos_exile_rejected').GetRuler.GetFirstName]——拒绝后，唐·[SCOPE.sCharacter('don_carlos_char').GetFirstName]这位[SCOPE.sCountry('spain').GetAdjectiveNoFlag]王位的战败觊觎者，来到我国寻求庇护。他抵达[SCOPE.sState('don_carlos_arrival_location').GetPortHubName]，所见远非其预想中的绝对主义宫廷，而是向我们提出一个棘手难题。\n\n我国始终忠于上帝、王座与传统，而唐·[SCOPE.sCharacter('don_carlos_char').GetFirstNameNoFormatting]代表了这种信念的极端形式。这是我们愿意遵循的道路吗？抑或他的存在正警示我们，反动之念若执之过甚，终会自绝于世，甚至连其他绝对主义的波旁王冠也宁愿拒绝其事业？"
  cr_carlist_events.70.flavour_legitimist_absolutist_rejected:0 "他来到这里，带着被宗亲斥责的默默耻辱——一个连同为原则捍卫者都认为过于顽固的真正专制主义者。他曾经是传统主义者的灯塔，如今却显得像是一个固执的过时之物，即便在复辟的君主制殿堂中也是如此。他的信念依旧，但他的道路却越来越狭窄。"
  cr_carlist_events.70.a:0 "提供有限的款待并保持距离"
  cr_carlist_events.70.a_tt:0 "虽然我们尊重他的血统与信念，但我们的重点在于平衡的君主制。唐·卡洛斯将被允许获得庇护，但我们会与他保持距离，以避免争议或内部不和。"
  cr_carlist_events.70.b:0 "提供全面庇护与支持"
  cr_carlist_events.70.b_tt:0 "我们将坚定地站在唐·[SCOPE.sCharacter('don_carlos_char').GetFirstNameNoFormatting]一边，拥抱他对神授权利与专制主义的毫不妥协捍卫。他的存在强化了我们对传统君主制的宣称，并表明我们对自由主义侵蚀的抵抗。"
  cr_carlist_events.70.c:0 "我们可以为他祈祷，但无法提供港湾。"
  cr_carlist_events.70.c_tt:0 "我国必须向前看，而非向后看。唐·卡洛斯的顽固态度有将我们拖入无谓冲突并疏远潜在盟友的风险。我们承受不起这样的负担。"
  cr_carlist_events.71.t:0 "事件桥接"

  cr_carlist_events.72.t:0 "王室联姻以求和平"
  cr_carlist_events.72.desc:0 "[SCOPE.sCountry('spain').GetNameNoFlag]王国正在流血：城市焚烧，兄弟刀兵相向，王冠四分五裂——这一切皆源于一支笔的短视之举。费迪南国王在一时糊涂中抛弃了弟弟的正当权利，转而支持他年幼的女儿[SCOPE.sCountry('spain').GetRuler.GetFirstName]，点燃了如今吞噬整个[SCOPE.sCountry('spain').GetNameNoFormatting]的战火。\n\n然而解决之道既优雅又显而易见：对立权利的联姻。若[SCOPE.sCountry('spain').GetRuler.GetPrimaryRoleTitle][SCOPE.sCountry('spain').GetRuler.GetFirstNameNoFormatting]能与所谓觊觎者唐·[SCOPE.sCharacter('don_carlos_char').GetFirstName]之子唐·[SCOPE.sCharacter('carlos_luis_char').GetFirstName]成婚，血脉或许能在政治失败之处重新联结。这一联姻可弥合裂痕、重聚波旁血统，并为饱受痛苦的王国带来和平。若非我们——他们的宗亲与同为君主者——谁又该率先迈出和解的第一步？"
  cr_carlist_events.72.flavour:0 "西班牙内战的烈焰吞噬着国家，不仅威胁伊比利亚半岛，更动摇整个欧洲的微妙平衡。从维也纳的宫廷到巴黎的沙龙，君主与政治家们密切注视着这场混乱，既不安于动荡，又留意着引导其走向的机会。虽然无人希望战火蔓延至西班牙境外，但乱局仍为愿意小心操控结局的手提供了空间——就像我们这样的手。"
  cr_carlist_events.72.a:0 "调停冲突"
  cr_carlist_events.72.a_tt:0 "我们自荐为公正调停者，提议对话以弥合分歧。这是一项投入有限但前景不确定的举措，却是为稳定西班牙而迈出的一步，且不至于过度卷入。"
  cr_carlist_events.72.b:0 "推动王室和解"
  cr_carlist_events.72.b_tt:0 "我们采取更积极的角色，倡导通过王朝联姻统一对立权利。这是一项重大承诺，但有望实现持久和平——并带来更大的影响力。"
  cr_carlist_events.72.c:0 "置身事外"
  cr_carlist_events.72.c_tt:0 "虽然我们为[SCOPE.sCountry('spain').GetNameNoFormatting]的苦难感到痛心，但这场王朝冲突终究是西班牙的内部事务。我们无权干涉如此敏感的事宜，尤其当此事有将我国进一步卷入欧洲纠葛的风险时。西班牙必须自行寻找和平。"

  cr_carlist_events.73.t:0 "王冠重聚？"
  cr_carlist_events.73.desc:0 "来自[SCOPE.sCountry('don_carlos_marriage_proposing_country').GetCapital.GetCityHubName]的提议，既出于亲族之情，亦兼有外交考量。我们在[SCOPE.sCountry('don_carlos_marriage_proposing_country').GetNameNoFlag]的堂兄[SCOPE.sCountry('don_carlos_marriage_proposing_country').GetRuler.GetPrimaryRoleTitle][SCOPE.sCountry('don_carlos_marriage_proposing_country').GetRuler.GetFirstName]，因西班牙的苦难与波旁血脉的纽带而动，建议让我们的儿子唐·[SCOPE.sCharacter('carlos_luis_char').GetFirstName]与年轻的[SCOPE.sCountry('spain').GetRuler.GetPrimaryRoleTitle][SCOPE.sCountry('spain').GetRuler.GetFirstName]联姻，以期息兵弭争、重合分裂的王国。"
  cr_carlist_events.73.flavour:0 "正是已故的西班牙国王费迪南，违背上帝的秩序与古老法律，颠覆了正当继承。我们，唐·卡洛斯，才是合法君主，而我们的儿子——年长、男性、在君主传统中成长——才是自然的继承人。将他与伊莎贝尔联姻或许能愈合伤口，是的，但前提是这种治疗不能玷污它试图拯救的身体。"
  cr_carlist_events.73.a:0 "坚持唐·卡洛斯·路易斯为国王——真正的继承顺序"
  cr_carlist_events.73.a_tt:0 "我们的儿子唐·[SCOPE.sCharacter('carlos_luis_char').GetFirstNameNoFormatting]依据神授与古老法律，是西班牙王位的正当继承人。若此联姻要继续，必须遵循合法继承的原则：他将成为国王，而[SCOPE.sCountry('spain').GetRuler.GetPrimaryRoleTitle][SCOPE.sCountry('spain').GetRuler.GetFirstNameNoFormatting]将成为他的王后。这才是真正尊崇我们为之奋斗的原则的唯一道路。"
  cr_carlist_events.73.b:0 "在共同统治上妥协——共享未来"
  cr_carlist_events.73.b_tt:0 "虽然我们的权利主张是绝对的，但西班牙的苦难要求务实的态度。我们可以同意更平等的安排，或许是[SCOPE.sCountry('spain').GetRuler.GetPrimaryRoleTitle][SCOPE.sCountry('spain').GetRuler.GetFirstNameNoFormatting]与我们的儿子唐·[SCOPE.sCharacter('carlos_luis_char').GetFirstNameNoFormatting]共同执政的联合统治。这将承认双方的权利，并在真正和解的波旁王冠下统一王国，尽管这要求我们在绝对原则上做出一定程度的让步。"
  cr_carlist_events.73.c:0 "接受伊莎贝尔为女王，唐·卡洛斯为摄政——临时安排"
  cr_carlist_events.73.c_tt:0 "为了确保和平并引导西班牙回归正确道路，我们可以接受[SCOPE.sCountry('spain').GetRuler.GetPrimaryRoleTitle][SCOPE.sCountry('spain').GetRuler.GetFirstNameNoFormatting]为女王，而我们的儿子唐·[SCOPE.sCharacter('carlos_luis_char').GetFirstNameNoFormatting]为她的配偶。但关键在于，我们唐·卡洛斯必须被任命为摄政，直到[SCOPE.sCountry('spain').GetRuler.GetHerHis|U]陛下成年。这使我们能够将王国引向传统价值观，远离长期祸害它的自由主义影响，为她未来的统治奠定正确基础。"
  cr_carlist_events.73.d:0 "彻底拒绝提议——绝不与篡位妥协"
  cr_carlist_events.73.d_tt:0 "这项提议看似带来和平，实则是一杯毒酒。它要求我们为我们多年来与之作战的篡位行为背书。绝不能与违背神授权利与古老法律之人妥协。我们将彻底拒绝此提议，继续斗争，直至真正的波旁血统毫无让步、无损尊严地得到恢复。"
  cr_carlist_events.73.tt:0 "若[SCOPE.sCountry('spain').GetName]接受："
  cr_carlist_events.73.tt_2:0 "[SCOPE.sCountry('spain').GetName]将获得事件#variable王冠重聚？#!"
  cr_carlist_events.73.compromise_tt_2:0 "[SCOPE.sCharacter('isabel_char').GetFullName]将成为[ROOT.GetCountry.GetName]的统治者"

  cr_carlist_events.74.t_fallback:0 "王冠重聚？"
  cr_carlist_events.74.lose_tt:0 "#variable你将#r输掉游戏#!#!"

  cr_carlist_events.74.t_carlos_supremacist:0 "卡洛斯派要求屈服"
  cr_carlist_events.74.desc_carlos_supremacist:0 "为西班牙的苦难所动，并盼望息兵，[SCOPE.sCountry('don_carlos_marriage_proposing_country').GetNameNoFlag]的[SCOPE.sCountry('don_carlos_marriage_proposing_country').GetRuler.GetPrimaryRoleTitle][SCOPE.sCountry('don_carlos_marriage_proposing_country').GetRuler.GetFirstName]——摄政#variable 玛丽亚·克里斯蒂娜#!之兄——提议让[SCOPE.sCountry('spain').GetRuler.GetPrimaryRoleTitle][SCOPE.sCountry('spain').GetRuler.GetFirstName]与唐·[SCOPE.sCharacter('carlos_luis_char').GetFirstName]，即唐·[SCOPE.sCharacter('don_carlos_char').GetFirstName]之子联姻，以调和相争的权利，终结战事、弭平国创。\n\n然而唐·[SCOPE.sCharacter('don_carlos_char').GetFirstNameNoFormatting]所答并非和解，而是索求：他坚持要由唐·[SCOPE.sCharacter('carlos_luis_char').GetFirstNameNoFormatting]独掌王权，[SCOPE.sCountry('spain').GetRuler.GetFirstNameNoFormatting]仅为其配偶。所谓和平，不过是以屈服为前提。"
  cr_carlist_events.74.flavour_carlos_supremacist:0 "他们的胆大妄为没有底线。他们口称和平，却要求彻底屈服。为[SCOPE.sCountry('spain').GetRuler.GetHerHis|U]陛下王位所流的鲜血不会白流，我们绝不会向那些试图将我们合法国王从历史上抹去之人投降。"
  cr_carlist_events.74.a_carlist_supremacy:0 "彻底拒绝他们的要求——战争继续！"
  cr_carlist_events.74.a_carlist_supremacy_tt:0 "我们不会与如此侮辱性且不可能的条件谈判。[SCOPE.sCountry('spain').GetRuler.GetPrimaryRoleTitle][SCOPE.sCountry('spain').GetRuler.GetFirstNameNoFormatting]的权利不可侵犯，我们将继续战斗，直至每一个卡洛斯叛军被击败，王国在合法君主之下真正统一。"
  cr_carlist_events.74.b_carlist_supremacy:0 "……为了和平而接受提议。"
  cr_carlist_events.74.b_carlist_supremacy_tt:0 "战争已付出可怕代价。虽然卡洛斯的要求是一种侮辱，但若接受它能结束流血并给国家愈合的机会，我们必须走这条艰难道路。"

  cr_carlist_events.74.t_carlos_compromise:0 "共享的王座？"
  cr_carlist_events.74.desc_compromise:0 "来自[SCOPE.sCountry('don_carlos_marriage_proposing_country').GetNameNoFlag]宫廷的消息传来，我们的堂兄[SCOPE.sCountry('don_carlos_marriage_proposing_country').GetRuler.GetPrimaryRoleTitle][SCOPE.sCountry('don_carlos_marriage_proposing_country').GetRuler.GetFirstName]已在西班牙王冠之间充当调停者。通过他的干预，唐·[SCOPE.sCharacter('don_carlos_char').GetFirstName]同意放弃自身权利——条件是他的儿子唐·[SCOPE.sCharacter('carlos_luis_char').GetFirstName]与女王[SCOPE.sCountry('spain').GetRuler.GetFirstName]成婚，并由两人共同作为主权者统治。"
  cr_carlist_events.74.flavour_compromise:0 "这是一个大胆的姿态，尤其是来自一位长期坚持毫不妥协专制主义的人。不论是出于原则还是务实，这一提议提供了结束战争的可能——不是通过胜利或投降，而是通过和解。现在问题落在我们身上：我们是否愿意共享王座来拯救王国？"
  cr_carlist_events.74.a_carlist_compromise:0 "接受提议——西班牙必须再次完整"
  cr_carlist_events.74.a_carlist_compromise_tt:0 "我们接受女王[SCOPE.sCountry('spain').GetRuler.GetFirstNameNoFormatting]与唐·[SCOPE.sCharacter('carlos_luis_char').GetFirstNameNoFormatting]的联合统治。这一妥协可能结束内战并统一西班牙王冠，尽管意味着分享王权。"
  cr_carlist_events.74.b_carlist_compromise:0 "拒绝——西班牙不需要对立的君主。"
  cr_carlist_events.74.b_carlist_compromise_tt:0 "我们拒绝共享君主制的观念。王冠不可分割，女王[SCOPE.sCountry('spain').GetRuler.GetFirstNameNoFormatting]不会与一位觊觎者的儿子分享它。"

  cr_carlist_events.74.t_carlos_regent:0 "王冠交由卡洛斯照管？"
  cr_carlist_events.74.desc_carlos_regent:0 "卡洛斯阵营提出的新案表面妥协，实则关系重大。在[SCOPE.sCountry('don_carlos_marriage_proposing_country').GetNameNoFlag]的[SCOPE.sCountry('don_carlos_marriage_proposing_country').GetRuler.GetPrimaryRoleTitle][SCOPE.sCountry('don_carlos_marriage_proposing_country').GetRuler.GetFirstName]居中斡旋下，唐·[SCOPE.sCharacter('don_carlos_char').GetFirstName]提议：若任命他为女王[SCOPE.sCountry('spain').GetRuler.GetFirstName]的摄政，在女王成年前代行国政，冲突便可止息。\n\n他将此说成和解之举，以摄政之位换取放弃自身权利；但把西班牙托付给曾起兵反对女王之人，绝非轻率可决。这是通往和平的道路，还是以更缓慢的方式攫取王座？"
  cr_carlist_events.74.flavour_carlos_regent:0 "这个提议像一把镀金的匕首来到我们门前——表面光鲜，底下依旧锋利。将信任交给这样一双手或许能结束战争，也或许会再次重创王国。"
  cr_carlist_events.74.a_carlos_regent:0 "接受。若这能带来和平，就让它实现。"
  cr_carlist_events.74.a_carlos_regent_tt:0 "唐·卡洛斯被任命为摄政。战争或许结束，但他的影响力将风险性地进入西班牙国家核心。"
  cr_carlist_events.74.b_carlos_regent:0 "拒绝。西班牙不会向她的叛军屈膝。"
  cr_carlist_events.74.b_carlos_regent_tt:0 "提议被拒绝。战争继续，但伊莎贝尔的主权保持不受玷污。"

  cr_carlist_events.75.t:0 "马德里的反抗"
  cr_carlist_events.75.desc_rejected_carlos_luis_as_king:0 "马德里宫廷已对联姻提议作出答复——拒绝。让唐·[SCOPE.sCharacter('carlos_luis_char').GetFirstName]迎娶[SCOPE.sCountry('spain').GetRuler.GetPrimaryRoleTitle][SCOPE.sCountry('spain').GetRuler.GetFirstName]并取代她登上王位的建议被毫不客气地否决。并非女王本人——她太年轻，无法作出此类判断——而是那些以她名义治理之人：她的母亲摄政女王玛丽亚·克里斯蒂娜，以及旧秩序的叛教者[SCOPE.sCharacter('mendizabal').GetLastName]。\n\n[SCOPE.sCountry('don_carlos_marriage_proposing_country').GetRuler.GetPrimaryRoleTitle][SCOPE.sCountry('don_carlos_marriage_proposing_country').GetRuler.GetFirstName]的调停本可治愈西班牙的创伤。但这些自封的王国守护者宁选骄傲而非和平，意识形态而非传统。"
  cr_carlist_events.75.flavour_rejected_carlos_luis_as_king:0 "从纳瓦拉崎岖的山丘到安达卢西亚阳光普照的广场，传闻如野火蔓延——和平曾近在咫尺，却再次被骄傲葬送。现在，火焰继续燃烧，不仅因野心，更因侮辱。"
  cr_carlist_events.75.a_rejected_carlos_luis_as_king:0 "他们的拒绝只让我们更加坚定！"
  cr_carlist_events.75.a_rejected_carlos_luis_as_king_tt:0 "就这样吧。若言语被唾弃，我们将用他们选择的语言说话——通过行动、忠诚与武力。"

  cr_carlist_events.75.t_accepted_carlos_luis_as_king:0 "合法性获胜"
  cr_carlist_events.75.desc_accepted_carlos_luis_as_king:0 "马德里已接受让唐·[SCOPE.sCharacter('carlos_luis_char').GetFirstName]与[SCOPE.sCharacter('isabel_char').GetFirstName]成婚，并承认[SCOPE.sCharacter('carlos_luis_char').GetFirstNameNoFormatting]为国王的提议。通过此举，宫廷承认了我们自战争第一枪起就宣称的事实：指引我们之手者并非野心，而是正义。伊莎贝尔派如今让步于任何火枪或宣言都无法否认之事——波旁血统的正当继承通过我们延续。"
  cr_carlist_events.75.flavour_accepted_carlos_luis_as_king:0 "任何人都不应将此误认为妥协。屈膝的不是我们，而是他们从屈膝中站起——将西班牙从篡位错误中拉回，走向再次立足于法律与传统的王座。现在和平或许可能，不是因为我们退让，而是因为正义持久。"
  cr_carlist_events.75.a_accepted_carlos_luis_as_king:0 "让联姻成真——西班牙将再次完整。"
  cr_carlist_events.75.a_accepted_carlos_luis_as_king_tt:0 "卡洛斯·路易斯将迎娶女王[SCOPE.sCharacter('isabel_char').GetFirstNameNoFormatting]并以国王身份统治。卡洛斯主张得到证明，和平在正当继承的旗帜下逼近。"

  cr_carlist_events.75.t_joint_reign_accepted:0 "共享的王冠"
  cr_carlist_events.75.desc_joint_reign_accepted:0 "马德里已同意。我们儿子唐·[SCOPE.sCharacter('carlos_luis_char').GetFirstName]与女王[SCOPE.sCountry('spain').GetRuler.GetFirstName]的婚姻将推进——随之而来的是王座的联合，不是通过征服或投降，而是通过共享主权。我们的儿子将与她并肩统治，不是作为征服者或配偶，而是作为西班牙的平等君主。"
  cr_carlist_events.75.flavour_joint_reign_accepted:0 "让任何人都不再说我们盲目执着于骄傲。虽然我们的权利正当而坚定，我们选择了避免西班牙进一步毁灭的道路。我们并未抛弃原则，而是通过审慎实现了它。战争或许不会以耻辱结束，而以愈合告终。我们祈祷这一统一能持久。"
  cr_carlist_events.75.a_joint_reign_accepted:0 "就这样吧。让西班牙再次完整。"
  cr_carlist_events.75.a_joint_reign_accepted_tt:0 "战争走向解决。唐·卡洛斯·路易斯与女王[SCOPE.sCountry('spain').GetRuler.GetFirstNameNoFormatting]将共同统治。合法性得以保存，和平触手可及。"

  cr_carlist_events.75.t_joint_reign_rejected:0 "被拒绝的橄榄枝"
  cr_carlist_events.75.desc_joint_reign_rejected:0 "马德里已拒绝我们的提议。让[SCOPE.sCountry('spain').GetRuler.GetPrimaryRoleTitle][SCOPE.sCountry('spain').GetRuler.GetFirstName]与我们的儿子唐·[SCOPE.sCharacter('carlos_luis_char').GetFirstName]作为主权者共同统治——这一统一与仁慈之举——已被她的顾问拒绝。摄政女王玛丽亚·克里斯蒂娜被野心与骄傲蒙蔽，唾弃了本可结束这场兄弟相残战争的手。"
  cr_carlist_events.75.flavour_joint_reign_rejected:0 "我们提供了不带耻辱的和平。我们承认她女儿的权利，不是作为篡位，而是作为可与我们权利和解的真相。然而，他们选择了保住权力而非恢复西班牙。让世界看清：延长这场战争的不是我们，而是那些将虚荣置于国家之上、顽固置于秩序之上之人。"
  cr_carlist_events.75.a_joint_reign_rejected:0 "那我们就用剑而非礼仪来解决吧。"
  cr_carlist_events.75.a_joint_reign_rejected_tt:0 "虽然失望，我们重申我们事业的正义。拒绝将成为我们运动的集结号。"

  cr_carlist_events.75.t_regency_rejected:0 "西班牙拒绝"
  cr_carlist_events.75.desc_regency_rejected:0 "我们提供的不是投降，而是和平。以责任与和解之姿，我们提议搁置自身权利，作为[SCOPE.sCountry('spain').GetRuler.GetPrimaryRoleTitle][SCOPE.sCountry('spain').GetRuler.GetFirstName]的摄政在她成年之前治理，以统一而非毁灭来保全王座。"
  cr_carlist_events.75.flavour_regency_rejected:0 "这一提议并非轻率作出。为了和平而放弃正当继承，需要付出许多——骄傲、原则与遗产。然而即便这份出于善意与庄严责任的牺牲，也被弃之不顾。伸出的手无人回应。看来那些自称代表王冠之人宁愿紧抓胜利，也不愿接受和平。"
  cr_carlist_events.75.a_regency_rejected:0 "他们选择了刀剑。那就如是。"
  cr_carlist_events.75.a_regency_rejected_tt:0 "战争继续。"

  cr_carlist_events.75.t_regency_accepted:0 "王冠，受托于人"
  cr_carlist_events.75.desc_regency_accepted:0 "马德里已接受我们所提供的——不是为了野心，而是为了秩序。通过[SCOPE.sCountry('don_carlos_marriage_proposing_country').GetRuler.GetPrimaryRoleTitle][SCOPE.sCountry('don_carlos_marriage_proposing_country').GetRuler.GetFirstName]的明智调停，摄政女王玛丽亚·克里斯蒂娜同意，和平可通过治理而非刀剑赢得。我们将以摄政身份代表幼女王[SCOPE.sCountry('spain').GetRuler.GetFirstName]治理，直至她成年可亲政之时。"
  cr_carlist_events.75.flavour_regency_accepted:0 "任何人都不应将此误认为软弱。这是被智慧淬炼的力量。王座或许仍可愈合，西班牙得以保全。虽然我们的权利依旧正当，但正是在守护王国而非攫取王冠中，我们证明了自己对它的权利。"
  cr_carlist_events.75.a_regency_accepted:0 "那就让我们以守护者而非征服者的身份治理吧。"
  cr_carlist_events.75.a_regency_accepted_tt:0 "唐·卡洛斯被任命为摄政。战争或许结束，卡洛斯派的影响力进入西班牙国家心脏。"

  cr_carlist_events.79.t_carlos_rejects:0 "西班牙的一扇门关闭了"
  cr_carlist_events.79.desc_carlos_rejects:0 "来自唐·[SCOPE.sCharacter('don_carlos_char').GetFirstName]阵营的消息传来；我们提议让唐·[SCOPE.sCharacter('carlos_luis_char').GetFirstName]与[SCOPE.sCharacter('isabel_char').GetPrimaryRoleTitle][SCOPE.sCharacter('isabel_char').GetFirstName]王室联姻的方案被彻底拒绝。唐·[SCOPE.sCharacter('don_carlos_char').GetFirstNameNoFormatting]对其权利主张毫不妥协，将任何妥协视为对神授权利与正当继承的背叛。"
  cr_carlist_events.79.flavour_carlos_rejects:0 "唐·[SCOPE.sCharacter('don_carlos_char').GetFirstNameNoFormatting]的顽固意味着西班牙内战将继续肆虐，将国家榨干，并违抗一切和解尝试。他对绝对权利的顽强坚持，尽管代价是生命与稳定，留下的希望空间微乎其微。"
  cr_carlist_events.79.carlos_rejects_opt:0 "看来和解之路并非他愿意行走的。"
  cr_carlist_events.79.carlos_rejects_opt_tt:0 "唐·[SCOPE.sCharacter('don_carlos_char').GetFirstNameNoFormatting]的不妥协证明他更在意自己的权利而非西班牙的苦难。我们已无能为力。"
  cr_carlist_events.79.b_carlos_rejects:0 "撤回我们的斡旋——我们的努力白费了。"
  cr_carlist_events.79.b_carlos_rejects_tt:0 "我们的调停尝试失败。显然卡洛斯派对和平并无真心，我们不再将外交资本浪费在这个棘手的冲突上。"

  cr_carlist_events.79.t_isabel_rejected_carlos_luis_as_king:0 "婚姻被拒，战争延长"
  cr_carlist_events.79.desc_isabel_rejected_carlos_luis_as_king:0 "我们为西班牙带来和平的努力落空。怀着最佳意图，我们提议让女王[SCOPE.sCharacter('isabel_char').GetFirstName]与唐·[SCOPE.sCharacter('carlos_luis_char').GetFirstName]联姻，希望调和对立权利，结束这场兄弟相残的战争。\n\n然而调停失败了。唐·[SCOPE.sCharacter('don_carlos_char').GetFirstName]坚守原则，要求他的儿子完全加冕为王，女王[SCOPE.sCharacter('isabel_char').GetFirstNameNoFormatting]仅为配偶。摄政女王玛丽亚·克里斯蒂娜无法接受此类条件，将其视为对女儿与生俱来权利的隐形投降。\n\n双方均不让步，和解的机会溜走。我们伸出亲族之手，得到的不是敌意，而是遗憾。和平仍遥不可及。"
  cr_carlist_events.79.flavour_isabel_rejected_carlos_luis_as_king:0 "有时和平并非被拒绝——它只是无法触及。在荣誉与合法性、责任与骄傲之间，鸿沟无法逾越。于是西班牙的大炮将在妥协无法说话之处发言。"
  cr_carlist_events.79.isabel_rejected_carlos_luis_as_king:0 "我们已尽所能。让历史评判。"
  cr_carlist_events.79.isabel_rejected_carlos_luis_as_king_tt:0 "调停失败。我们通过婚姻调和西班牙继承权的尝试告一段落——目前，西班牙的战争必须走完自己的路。"

  cr_carlist_events.79.t_isabel_accepted_carlos_luis_as_king:0 "和平铸就的联合"
  cr_carlist_events.79.desc_isabel_accepted_carlos_luis_as_king:0 "我们为西班牙带来和平的努力结出果实。我们提议让[SCOPE.sCharacter('isabel_char').GetFirstName]与唐·[SCOPE.sCharacter('carlos_luis_char').GetFirstName]联姻，不仅仅是为了个人的结合，更是为了王冠的和解。\n\n通过我们对姐姐——摄政女王玛丽亚·克里斯蒂娜——的影响，马德里接受了让唐·[SCOPE.sCharacter('carlos_luis_char').GetFirstNameNoFormatting]成为[SCOPE.sCharacter('carlos_luis_char').GetPrimaryRoleTitle]、[SCOPE.sCharacter('isabel_char').GetFirstNameNoFormatting]为其配偶的条件。"
  cr_carlist_events.79.flavour_isabel_accepted_carlos_luis_as_king:0 "这是原则与克制孕育的解决之道。武力无法化解之事，外交做到了。若这一联合持久，它或许能将分裂的王国拉回和谐——并在欧洲眼中更紧密地联结我们共同的家族。"
  cr_carlist_events.79.isabel_accepted_carlos_luis_as_king:0 "让世人知晓——和平由波旁之手播下。"
  cr_carlist_events.79.isabel_accepted_carlos_luis_as_king_tt:0 "婚姻已被接受。唐·卡洛斯·路易斯将与女王[SCOPE.sCountry('spain').GetRuler.GetFirstNameNoFormatting]共同统治，统一对立权利，为西班牙带来和平希望。"

  cr_carlist_events.79.t_joint_reign:0 "和平铸就的联合"
  cr_carlist_events.79.desc_joint_reign:0 "我们在西班牙调停和平的努力并未白费。经过长时间商议，[SCOPE.sCountry('spain').GetRuler.GetPrimaryRoleTitle][SCOPE.sCountry('spain').GetRuler.GetFirstName]的宫廷与唐·[SCOPE.sCharacter('don_carlos_char').GetFirstName]均同意我们提出的条件：女王与唐·[SCOPE.sCharacter('carlos_luis_char').GetFirstName]不仅缔结婚约，更共享主权。西班牙的未来如今寄托于他们的共同统治。"
  cr_carlist_events.79.flavour_joint_reign:0 "作为[SCOPE.sCountry('spain').GetRuler.GetFirstNameNoFormatting]的舅舅与唐·[SCOPE.sCharacter('carlos_luis_char').GetFirstNameNoFormatting]的堂兄，我们有责任行动——不仅为了家族，更为了秩序、合法性与基督教世界的和平。若协议维持，它将结束多年的流血，并恢复被对立权利撕裂的王国的统一。目前，我们给予西班牙的不是胜利者，而是一条前进之路。"
  cr_carlist_events.79.a_joint_reign:0 "愿这场婚姻胜过它所终结的战争。"
  cr_carlist_events.79.a_joint_reign_tt:0 "我们的调停成功。西班牙将在共享的波旁王冠下重聚，我们在欧洲的声望提升。"
    #Two Sicilies Response to Isabel rejecting the compromise
  cr_carlist_events.79.t_joint_reign_rejected:0 "王冠依旧分裂"
  cr_carlist_events.79.desc_joint_reign_rejected:0 "我们通过亲族情谊与常识调和西班牙继承权的努力化为泡影。尽管唐·[SCOPE.sCharacter('don_carlos_char').GetFirstName]愿意考虑妥协——让他的儿子唐·[SCOPE.sCharacter('carlos_luis_char').GetFirstName]与[SCOPE.sCountry('spain').GetRuler.GetPrimaryRoleTitle][SCOPE.sCountry('spain').GetRuler.GetFirstName]共同统治——但马德里宫廷在我们亲姐妹摄政女王玛丽亚·克里斯蒂娜的领导下，拒绝了这一提议。"
  cr_carlist_events.79.flavour_joint_reign_rejected:0 "我们不能说这个提议缺乏平衡。它本可免除西班牙进一步的流血，并以相互承认的精神重聚王冠。然而猜疑与骄傲占了上风。不管她的理由是什么，玛丽亚·克里斯蒂娜选择了维护女儿的独裁统治，而不是治愈波旁家族的分裂。至此，我们的调停宣告结束。"
  cr_carlist_events.79.a_joint_reign_rejected:0 "我们已尽所能。让西班牙自己决定道路。"
  cr_carlist_events.79.a_joint_reign_rejected_tt:0 "拒绝令人深感失望。我们失去了一些影响力，但保留了道德高地与波旁团结。"

  cr_carlist_events.79.t_regency_rejected:0 "未能达成协议"
  cr_carlist_events.79.desc_regency_rejected:0 "我们结束[SCOPE.sCountry('spain').GetNameNoFormatting]冲突的努力未能开花结果。通过谨慎调停，我们提出了让唐·[SCOPE.sCharacter('don_carlos_char').GetFirstName]放弃自身权利、仅作为年幼的[SCOPE.sCountry('spain').GetRuler.GetPrimaryRoleTitle][SCOPE.sCountry('spain').GetRuler.GetFirstName]摄政、在她成年之前引导王国的方案。\n\n尽管该提议用意慷慨，最终仍被马德里政府拒绝。不知是出于原则、谨慎还是不信任，摄政女王玛丽亚·克里斯蒂娜及其顾问选择了另一条道路。和解之门曾短暂开启——如今再次关闭。"
  cr_carlist_events.79.flavour_regency_rejected:0 "我们试图以共享责任的姿态而非胜利或屈服来弥合分歧。然而当战争创伤太深时，即便是温和的和平也会动摇。"
  cr_carlist_events.79.a_regency_rejected:0 "让西班牙选择自己的命运。"
  cr_carlist_events.79.a_regency_rejected_tt:0 "提议已被拒绝。两西西里王国暂时退出进一步的调停努力。"

  cr_carlist_events.79.t_regency_accepted:0 "为了和平的摄政"
  cr_carlist_events.79.desc_regency_accepted:0 "我们为西班牙带来和解的努力结出果实。在战争旷日持久、胜负难分之际，唐·[SCOPE.sCharacter('don_carlos_char').GetFirstName]——在我们敦促下——提出以摄政身份为女王[SCOPE.sCountry('spain').GetRuler.GetFirstName]治理，不是违抗她的权利，而是保护它。\n\n令我们满意的是，我们的姐妹摄政女王玛丽亚·克里斯蒂娜已接受此提议。唐·卡洛斯不会戴上王冠，但他将承担其重担。冲突或许让位于稳定，被血腥分裂的波旁家族或许能在摄政与责任中找到共同事业。"
  cr_carlist_events.79.flavour_regency_accepted:0 "这不是一方战胜另一方，而是和平战胜骄傲。我们以宗亲、天主教徒与君主的身份行动——西班牙或许能再次完整。"
  cr_carlist_events.79.a_regency_accepted:0 "愿此摄政修复战争所破坏的一切。"
  cr_carlist_events.79.a_regency_accepted_tt:0 "提议已被接受。两西西里王国在调停中赢得声望，唐·卡洛斯成为摄政，卡洛斯派影响力进入西班牙核心。"

  cr_carlist_events.79.t_fallback:0 "西班牙调停"

  cr_carlist_events.80.t:0 "专制主义事业"
  cr_carlist_events.80.desc:0 "唐·[SCOPE.sCharacter('don_carlos_char').GetFirstName]与[SCOPE.sCountry('spain').GetRuler.GetPrimaryRoleTitle][SCOPE.sCountry('spain').GetRuler.GetFirstName]鏖战多年而终告战败，如今转向[SCOPE.sCountry('don_carlos_exile_country').GetRuler.GetHerHis|U]陛下，乞求援助以恢复其所谓正统王位，并在伊比利亚为传统、信仰与秩序再作一搏。其事业虽已式微，仍是抵制自由主义革命浪潮者的一面旗帜。"
  cr_carlist_events.80.desc_bourbon_rejected:0 "唐·[SCOPE.sCharacter('don_carlos_char').GetFirstName]与[SCOPE.sCountry('spain').GetRuler.GetPrimaryRoleTitle][SCOPE.sCountry('spain').GetRuler.GetFirstName]鏖战多年而终告战败，又遭其堂兄——[SCOPE.sCountry('don_carlos_exile_rejected').GetNameNoFlag]的[SCOPE.sCountry('don_carlos_exile_rejected').GetRuler.GetPrimaryRoleTitle][SCOPE.sCountry('don_carlos_exile_rejected').GetRuler.GetFirstName]——拒绝，如今转向[SCOPE.sCountry('don_carlos_exile_country').GetRuler.GetHerHis|U]陛下，乞求援助以恢复其所谓正统王位，并在伊比利亚为传统、信仰与秩序再作一搏。其事业虽已式微，仍是抵制自由主义革命浪潮者的一面旗帜。"
  cr_carlist_events.80.desc_absolutist_rejected:0 "唐·[SCOPE.sCharacter('don_carlos_char').GetFirstName]与[SCOPE.sCountry('spain').GetRuler.GetPrimaryRoleTitle][SCOPE.sCountry('spain').GetRuler.GetFirstName]鏖战多年而终告战败，又遭[SCOPE.sCountry('don_carlos_exile_rejected').GetNameNoFlag]的[SCOPE.sCountry('don_carlos_exile_rejected').GetRuler.GetPrimaryRoleTitle][SCOPE.sCountry('don_carlos_exile_rejected').GetRuler.GetFirstName]拒绝，如今转向[SCOPE.sCountry('don_carlos_exile_country').GetRuler.GetHerHis|U]陛下，乞求援助以恢复其所谓正统王位，并在伊比利亚为传统、信仰与秩序再作一搏。其事业虽已式微，仍是抵制自由主义革命浪潮者的一面旗帜。"
  cr_carlist_events.80.desc_generic_rejected:0 "唐·[SCOPE.sCharacter('don_carlos_char').GetFirstName]与[SCOPE.sCountry('spain').GetRuler.GetPrimaryRoleTitle][SCOPE.sCountry('spain').GetRuler.GetFirstName]鏖战多年而终告战败，又遭[SCOPE.sCountry('don_carlos_exile_rejected').GetNameNoFormatting]拒绝，如今转向[SCOPE.sCountry('don_carlos_exile_country').GetRuler.GetHerHis|U]陛下，乞求援助以恢复其所谓正统王位，并在伊比利亚为传统、信仰与秩序再作一搏。其事业虽已式微，仍是抵制自由主义革命浪潮者的一面旗帜。"
  cr_carlist_events.80.flavour:0 "他抵达[SCOPE.sCountry('don_carlos_exile_country').GetCapital.GetCityHubName]将我们置于微妙境地。虽然我们受信念与信仰约束，但公开支持有再次将我们卷入[SCOPE.sCountry('spain').GetAdjectiveNoFormatting]动荡的风险。欧洲列强可能将干预视为危险的冒险行为，而国内，我们自身复辟的伤疤仍新。许多人仍向往宪政——我们刚刚将这个幽灵逐出海岸。"
  cr_carlist_events.80.a:0 "支持他——他的事业是正义的。"
  cr_carlist_events.80.a_tt:0 "我们将收留并支持唐·[SCOPE.sCharacter('don_carlos_char').GetFirstNameNoFormatting]，直到他准备好重新夺回王冠。"
  cr_carlist_events.80.b:0 "给予他庇护并默许他集结支持。"
  cr_carlist_events.80.b_tt:0 "我们不会公开支持，但会默许。"
  cr_carlist_events.80.c:0 "驱逐他——风险太大。"

  cr_carlist_events.20.t_portugal_exile:0 "边境上的阴影"
  cr_carlist_events.20.desc_portugal_exile:0 "唐·[SCOPE.sCharacter('don_carlos_char').GetFirstName]已越过边境在[SCOPE.sCountry('don_carlos_exile_country').GetNameNoFlag]避难，被接纳为[SCOPE.sCountry('don_carlos_exile_country').GetRuler.GetPrimaryRoleTitle][SCOPE.sCountry('don_carlos_exile_country').GetRuler.GetFirstName]的贵宾，而非流亡国王。虽然[SCOPE.sCountry('don_carlos_exile_country').GetCapital.GetCityHubName]并未正式承认他对[SCOPE.sCountry('spain').GetAdjectiveNoFlag]王位的主张，但也未加以谴责。这种刻意的模棱两可并未逃过马德里的注意。"
  cr_carlist_events.20.flavour_portugal_exile:0 "虽然没有军队行进，也没有声明发表，但唐·[SCOPE.sCharacter('don_carlos_char').GetFirstNameNoFormatting]在[SCOPE.sCountry('don_carlos_exile_country').GetCapital.GetCityHubName]的存在仍引起不安。它赋予[SCOPE.sPoliticalMovement('carlist_movement').GetNameNoIcon]一丝危险的合法性低语。[SCOPE.sCountry('don_carlos_exile_country').GetNameNoFormatting]是在等待时机、两面下注，还是在暗中鼓励我们境内的动荡？在马德里的沙龙与埃斯特雷马杜拉的军营中，人们的目光都带着怀疑转向西方。"
  cr_carlist_events.81.a:0 "我们必须保持警惕。"
  cr_carlist_events.20.c:0 "反过来支持[SCOPE.sCountry('don_carlos_exile_country').GetNameNoFormatting]的自由派。"
  cr_carlist_events.20.c_tt:0 "虽然[SCOPE.sCountry('don_carlos_exile_country').GetRuler.GetPrimaryRoleTitle][SCOPE.sCountry('don_carlos_exile_country').GetRuler.GetFirstNameNoFormatting]成功将专制主义恢复到[SCOPE.sCountry('don_carlos_exile_country').GetName]，但许多人仍向往他所镇压的宪政。在我们的支持下，他们的梦想或许能实现。"

  cr_carlist_events.90.t:0 "旧世界的灰烬"
  cr_carlist_events.90.desc_1:0 "经过多年激烈冲突，[SCOPE.sCountry('spain').GetNameNoFlag]满目疮痍，出人意料的是，唐·[SCOPE.sCharacter('don_carlos_char').GetFirstName]——西班牙王位的觊觎者——已抵达[SCOPE.sState('carlos_arrival_state').GetPortHubName]。他恢复西班牙专制统治的事业已彻底破碎。战败且幻灭的他放弃了权利主张，寻求在[SCOPE.sState('carlos_arrival_state').GetCityHubName]安静度过余生。\n\n对于一个曾为恢复国王神授权利而战的人，在一个因拒绝君主制而建立的共和国寻求庇护，颇具讽刺意味。他的到来标志着旧秩序的象征性崩溃，最终向被革命重塑的世界投降。在美国共和国的心脏，专制主义的遗产被安葬。"
  cr_carlist_events.90.desc:0 "在多年苦苦追求[SCOPE.sCountry('spain').GetAdjectiveNoFlag]王冠与回归专制统治的冲突后，一位意想不到的人物在[SCOPE.sState('carlos_arrival_state').GetPortHubName]下船：唐·[SCOPE.sCharacter('don_carlos_char').GetFirstName]，曾经欧洲君主主义反动派的旗手，如今在一个建立于人民主权之上的土地寻求庇护。\n\n被失败击垮、对战争幻灭的唐·[SCOPE.sCharacter('don_carlos_char').GetFirstNameNoFormatting]正式放弃王位主张。他到来不是为了召集流亡者或密谋复辟，而是为了消失。在[SCOPE.sState('carlos_arrival_state').GetCityHubName]，他不寻求宫廷，只求一处安静家园——一位昔日国王置身于公民之中，成为被时代抛弃理念的纪念碑。"
  cr_carlist_events.90.desc_no_republic:0 "在多年苦苦追求[SCOPE.sCountry('spain').GetAdjectiveNoFlag]王冠与回归专制统治的冲突后，一位意想不到的人物在[SCOPE.sState('carlos_arrival_state').GetPortHubName]下船：唐·[SCOPE.sCharacter('don_carlos_char').GetFirstName]，曾经欧洲君主主义反动派的旗手。\n\n被失败击垮、对战争幻灭的唐·[SCOPE.sCharacter('don_carlos_char').GetFirstNameNoFormatting]正式放弃王位主张。他到来不是为了召集流亡者或密谋复辟，而是为了消失。在[SCOPE.sState('carlos_arrival_state').GetCityHubName]，他不寻求宫廷，只求一处安静家园——一位昔日国王置身于公民之中，成为被时代抛弃理念的纪念碑。"
  cr_carlist_events.90.flavour:0 "有人视他为悲剧性的警示故事。有人视他为欧洲崩塌旧秩序的遗物。但对大多数美国人而言，他不过又一位移民，在一个过去不必定义未来的土地上寻求平静。"
  cr_carlist_events.90.a:0 "以普通公民身份欢迎他。"
  cr_carlist_events.90.a_tt:0 "这片土地向所有寻求和平之人提供庇护，无论他们曾戴何种王冠。"
  cr_carlist_events.90.b:0 "将他的陨落展示为共和主义的胜利。"
  cr_carlist_events.90.b_tt:0 "这就是国王的终结——被历史加冕又被历史抛弃。"
  cr_carlist_events.90.c:0 "拒绝他入境。"
  cr_carlist_events.90.c_tt:0 "我们对废弃的王冠毫无用处。"

  cr_carlist_events.20.t_USA_exile:0 "一位觊觎者的终结"
  cr_carlist_events.20.desc_USA_exile:0 "来自[SCOPE.sState('carlos_arrival_state').GetNameNoFormatting]海岸的意外消息传到我们耳中：唐·[SCOPE.sCharacter('don_carlos_char').GetFirstName]，曾经的反动旗手，已逃往[SCOPE.sCountry('don_carlos_exile_country').GetNameNoFlag]。他在[SCOPE.sState('carlos_arrival_state').GetCityHubName]定居，正式放弃对[SCOPE.sCountry('spain').GetAdjectiveNoFlag]王位的一切主张。不再是觊觎者，他寻求的不是复辟，而是安静的湮没，埋葬于一个因反抗君主制而生的共和国之中。\n\n虽然[SCOPE.sPoliticalMovement('carlist_movement').GetNameNoIcon]如今可能群龙无首，但这一最终退位是否彻底熄灭火焰仍有待观察。许多人仍聚集在旧秩序之下。"
  cr_carlist_events.20.desc_USA_exile_1:0 "大西洋彼岸的消息证实，唐·[SCOPE.sCharacter('don_carlos_char').GetFirstName]——曾经[SCOPE.sPoliticalMovement('carlist_movement').GetNameNoIcon]反动派的旗手——已在[SCOPE.sState('carlos_arrival_state').GetPortHubName]下船，放弃王位主张，并表示有意在美国以平民身份度过余生。\n\n多年来，他的理念吸引狂热分子，煽动起义，动摇我们的政治秩序。如今，这位准国王悄然隐退，不是轰轰烈烈，而是悄无声息——他的野心被距离与辞意淹没。\n\n虽然[SCOPE.sPoliticalMovement('carlist_movement').GetNameNoIcon]中一些人视此为背叛，另一些人哀悼失去的机会，但此次流亡标志着一个决定性转折：卡洛斯战争的象征性终结，以及国家愈合的机会。"
  cr_carlist_events.20.desc_USA_exile_2:0 "大西洋彼岸传来消息：唐·[SCOPE.sCharacter('don_carlos_char').GetFirstName]，曾经的反动与专制主义旗手，已在美国寻求庇护。但他并非以流亡君主或等待登基的领袖身份出现。相反，他宣布结束对王位的主张，并打算在[SCOPE.sState('carlos_arrival_state').GetName]平静定居，远离欧洲古老的王朝争斗。\n\n对[ROOT.GetCountry.GetNameNoFormatting]的许多人而言，这一消息带来平静的宽慰。卡洛斯事业虽未死亡，但失去了最显眼的象征。然而对另一些人——尤其是[SCOPE.sPoliticalMovement('carlist_movement').GetNameNoIcon]中的人——这是耻辱一刻，是他们曾称为国王之人最终的背叛。\n\n他的放弃或许暂时冷却内乱之火，但也留下真空：一个没有领袖的运动，以及一个可能消逝——或被继承的遗产。"
  cr_carlist_events.91.a:0 "让他拥有他的湮没吧。"
  cr_carlist_events.91.a_tt:0 "他在我们历史中的篇章不是以胜利或殉道结束，而是沉默。"
  cr_carlist_events.91.b:0 "最后一页翻过。"
  cr_carlist_events.91.b_tt:0 "他在我们历史中的篇章不是以胜利或殉道结束，而是沉默。"
  cr_carlist_events.91.c:0 "即便流亡，他对某些人仍是殉道者。"
  cr_carlist_events.91.c_tt:0 "他在我们历史中的篇章不是以胜利或殉道结束，而是沉默。"

  cr_slavery_events.10.t: "双岛传奇"
  cr_slavery_events.10.desc: "随着奴隶制在[SCOPE.sCountry('slave_emancipator').GetNameNoFlag]最近被废除，[SCOPE.sState('slavery_state').GetName]出现了一个奇特局面。自1648年以来与[SCOPE.sCountry('slave_emancipator').GetAdjectiveNoFormatting]共管的#variable圣马丁岛#!如今一半自由、一半奴隶。根据[SCOPE.sCountry('slave_emancipator').GetAdjectiveNoFormatting]法律，任何奴隶一旦越过边界即获解放。\n\n这一分界对我们的殖民地造成越来越大的压力。奴隶开始大批越境，导致种植园失去劳动力，当地权威受到侵蚀。此事现在需要回应：加强边界巡逻、废除奴隶制以保住劳动力，还是向法国呼吁遣返逃亡者。"
  cr_slavery_events.10.f: "因条约而分裂的岛屿如今因法律而分裂。曾经地图上的一条线，如今决定一个人的命运。"
  cr_slavery_events.10.a: "加强边界巡逻。"
  cr_slavery_events.10.b: "在[SCOPE.sState('slavery_state').GetNameNoFormatting]废除奴隶制。"
  cr_slaves_freed_in_state_tt: "[SCOPE.sState('slavery_state').GetName]的所有[GetPopType('slaves').GetName]将被解放。"
  cr_slavery_events.10.c: "向法国呼吁合作。"
  cr_slavery_events.10.c_tt1: "这将消耗我们在[SCOPE.sCountry('slave_emancipator').GetName]的[concept_obligation]，但可防止任何[GetPopType('slaves').GetName]离开[SCOPE.sState('slavery_state').GetName]。"
  cr_slavery_events.10.c_tt2: "视[SCOPE.sCountry('slave_emancipator').GetAdjective]的回应而定，要么没有[GetPopType('slaves').GetName]离开，要么一半[GetPopType('slaves').GetName]将离开[SCOPE.sState('slavery_state').GetName]。"

  cr_slavery_events.11.t: "双岛传奇"
  cr_slavery_events.11.desc: "我们废除奴隶制的行动开始在国界之外产生回响。在#variable圣马丁#!岛——自1648年以来与[SCOPE.sCountry('slave_country').GetAdjectiveNoFlag]共管的[SCOPE.sState('slavery_state').GetStateRegion.GetName]中的岛屿——奴役与自由的分界已无法遏制。\n\n仅几公里与一条任意界线将奴隶与自由人分开，奴隶稳步越界到我们这一侧，在这里[SCOPE.sCountry('slave_emancipator').GetAdjectiveNoFormatting]法律保证解放。无法阻止这一安静的出逃——也不愿维持一个因我们的榜样而变得不可行的制度——[SCOPE.sCountry('slave_country').GetAdjectiveNoFormatting]被迫在其一半岛屿上废除奴隶制。"
  cr_slavery_events.11.f: "自由有穿越边境的方式，即便法律没有。"
  cr_slavery_events.11.a: "让全世界知道我们的伟大！"
  cr_slavery_events.11.a_tt: "少量[GetPopType('slaves').GetName]从[SCOPE.sState('slavery_state').GetName]移至[SCOPE.sState('emancipated_state').GetName]并获得解放。"
  cr_slavery_events.11.b: "让我国人民知道我们的伟大！"

  cr_slavery_events.12.t: "双岛传奇"
  cr_slavery_events.12.desc: "在我们废除奴隶制之后，#variable圣马丁#!的特殊性质——自1648年以来我们与[SCOPE.sCountry('slave_country').GetAdjectiveNoFlag]共管的[SCOPE.sState('emancipated_state').GetStateRegion.GetName]中的岛屿——引发了意想不到的争端。只隔几公里与一条任意界线的奴役与自由之间，奴隶悄然从[SCOPE.sCountry('slave_country').GetAdjectiveNoFormatting]一侧逃往我们这一侧，在这里[SCOPE.sCountry('slave_emancipator').GetAdjectiveNoFormatting]法律保证解放。\n\n[SCOPE.sCountry('slave_country').GetAdjectiveNoFormatting]——仍固守过时的奴隶制度——援引我们先前给予他们的义务，要求归还所有逃亡奴隶。"
  cr_slavery_events.12.f: "岛屿虽小，分隔它的法律却不小。"
  cr_slavery_events.12.a: "唉！我们无能为力！"
  cr_slavery_events.12.a_tt: "所有从[SCOPE.sState('slavery_state').GetName]越界进入[SCOPE.sState('emancipated_state').GetName]的[GetPopType('slaves').GetName]将被送回[SCOPE.sCountry('slave_country').GetName]。"

  cr_slavery_events.13.desc: "我们废除奴隶制动摇了[SCOPE.sState('emancipated_state').GetStateRegion.GetName]的旧安排。在#variable圣马丁#!岛——自1648年以来与[SCOPE.sCountry('slave_country').GetAdjectiveNoFlag]共管的岛屿——奴隶大批越过内部边界，被[SCOPE.sCountry('slave_emancipator').GetAdjectiveNoFormatting]法律承诺的自由所吸引。\n\n如今[SCOPE.sCountry('slave_country').GetAdjectiveNoFlag]要求归还他们，以便在其一侧岛屿保留奴隶制度。此事现在由我们决定：是毫无例外地维护我们的法律，还是与邻国寻求妥协。"
  cr_slavery_events.13.f: "自由一旦成为法律，便不能因条约或便利而被撤销。"
  cr_slavery_events.13.a: "自由既已授予，便不可谈判。"
  cr_slavery_events.13.a_tt: "[SCOPE.sCountry('slave_emancipator').GetNameNoFormatting]不会遣返那些根据其法律获得自由之人。"
  cr_slavery_events.13.b: "遣返逃亡者。"
  cr_slavery_events.13.b_tt: "没有[GetPopType('slaves').GetName]从[SCOPE.sState('slavery_state').GetName]移至[SCOPE.sState('emancipated_state').GetName]。也没有任何人获得解放。"

  cr_slavery_events.20.t: "埃利西亚奴隶的命运"
  cr_slavery_events.20.desc: "一艘悬挂[SCOPE.sCountry('slave_trading_country').GetAdjectiveNoFlag]旗帜、名为#variable L'Elizia#!的奴隶船被我们的巡逻队拦截，其人类货物获得解放。然而，他们的解放立即提出了一个问题：如何处理这些被解放的奴隶。\n\n一些人认为应将他们送往现有殖民地，在自由条件下利用他们的劳动。另一些人主张将他们安置在非洲本身，这更符合法国的长远利益，加强我们在海岸的存在，并强化我们在源头打击奴隶贸易的承诺。"
  cr_slavery_events.20.f: "解放不以摆脱枷锁结束；它始于自由能在何处生根的问题。"
  cr_slavery_events.20.a: "为被解放奴隶专门建立一个新殖民地。"
  cr_slavery_events.20.b: "将他们安置在我们位于[SCOPE.sState('existing_african_colony').GetName]的属地。"
  cr_slavery_events.20.c: "将他们重新安置在[SCOPE.sState('caribbean_colony').GetName]。"
  cr_slavery_events.20.d: "将他们送往[SCOPE.sState('guyana_colony').GetName]。"
