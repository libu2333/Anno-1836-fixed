l_english:
ZEXU_FLAVOR_TEXT: "Reborn in the Ottoman Empire, saving the Ottoman Sultan and being granted the title of Grand Duke of Dobruja, what will be the fate of the Principality of Zexu? Will it become independent amidst the struggle for supremacy among the great powers, or will it embark on a different future?"
JIBEI_FLAVOR_TEXT: "What will be the future of the Tianzhi Republic? As a time traveler, Lin Tianzhi recounts a fantastical history, a moving and inspiring story of a brilliant new life��let's buy Alaska and build a new nation!!"
DAMING_FLAVOR_TEXT: "Reborn in 1836, the Ming Dynasty didn't fall, but Zhu Shigen established himself in Burma. The Qing Dynasty has already entered the Central Plains. What is the future of the Ming Dynasty? Will it expel the Tartars and restore China, or will it remain a remote and isolated nation?"