 je_cr_confederation:"阿根廷邦联"
 je_cr_confederation_reason:"1831 年，《联邦公约》正式签署标志着阿根廷邦联就此诞生。然而，[ROOT.GetCountry.GetOverlord.GetNameNoFlag]省的强人凭借其雄厚的军事与经济实力，牢牢掌控着邦联的实际权力，使得这份公约所确立的联邦体制名存实亡。如今，我们正站在命运的十字路口，面临着两个截然不同的选择：要么坐以待毙，眼睁睁看着[ROOT.GetCountry.GetOverlord.GetNameNoFlag]一步步蚕食、吞并我们的土地与主权；要么奋起反抗，从其手中夺走邦联的领导权，重塑属于我们的联邦秩序。"
 # 瑞士邦联：实际上各省地位完全平等，但由于游戏机制只能设定伯尔尼为绝对领导。
 je_cr_swi_confederation:"瑞士邦联"
 je_cr_swi_confederation_reason:"拿破仑战争的战火席卷欧洲，也彻底重塑了瑞士的命运：在短暂存在的所谓“赫尔维蒂共和国”覆灭之后，瑞士终于迎来了一个永久和平的新时代。1815 年签署的《联邦盟约》，赋予了各州高度的自治权与极大的政治权力——当然，在实际运作中，总会有少数实力突出的州凭借其影响力，隐隐凌驾于其他各州之上。如今，[ROOT.GetCountry.GetOverlord.GetName]怀揣着重塑集权、打破当前各州自治平衡的野心，企图将所有联邦各州纳入其直接控制之下。我们唯一的出路，便是全力以赴追赶[ROOT.GetCountry.GetOverlord.GetName]的步伐，直至实现超越——然后，堂堂正正地成为邦联新的领导者，创造属于我们的新秩序。"
 je_cr_confederation_leader:"统一邦联"
 je_cr_confederation_leader_reason:"尽管名义上各州地位平等、享有自治权，邦联始终未能形成足以统一全国的共同意志。如今我方已有整合各地资源与力量的实力；时机既至，必须结束各州各自为政的局面，确立统合全境的领导权，缔造真正统一而强大的民族国家。"
 je_cr_swiconfederation_leader:"统一邦联"
 je_cr_swiconfederation_leader_reason:"尽管名义上各州地位平等、享有自治权，邦联始终未能形成足以统一全国的共同意志。如今我方已有整合各地资源与力量的实力；时机既至，必须结束各州各自为政的局面，确立统合全境的领导权，缔造真正统一而强大的民族国家。"
 cr_consolidated_member:"整合邦联"
 cr_federation_leader:"邦联领导者"
 je_cr_takeover:"攫取领导权"
 je_cr_takeover_desc:"经过长期的发展与积累，我们的军事、经济与政治实力已然成型，已经拥有了与[ROOT.GetCountry.GetOverlord.GetNameNoFormatting]同台竞争、分庭抗礼的资本：现在，整个邦联理应属于我们，是时候向议会提出动议，将领导权牢牢掌握在手中了。"
 je_cr_annex_members:"整合邦联"
 je_cr_annex_members_desc:"吞并一个下辖的省份以展示邦联领导者的威信。"
 cr_federation.1.t:"邦联领导权被攫取！"
 cr_federation.1.d:"联邦议会消息：邦联的领导权现在已经正式归属[ROOT.GetCountry.GetOverlord.GetName]。议会代表在公开声明中称，议会经过全体表决一致认为，该省的实力与影响力，远胜于[ROOT.GetCountry.GetName]，更能够代表整个邦联的利益与未来。"
 cr_federation.1.f:"[ROOT.GetCountry.GetNameNoFormatting]的大街上充满了涌动的人群——有的支持议会，有的叫嚣独立……两拨人马甚至大打出手……[ROOT.GetCountry.GetRuler.GetLastName]省长宣布进入紧急状态……空气中弥漫着不安与不甘。"
 cr_federation.1.a:"真是个坏消息。"
 cr_federation.1.b:"脱离了邦联我们也能存在！"
 cr_federation.2.t:"邦联领导者要求合邦！"
 cr_federation.2.d:"[ROOT.GetCountry.GetOverlord.GetNameNoFlag]省的代表亲自到访，向我们明确宣称，我们有义务、也必须“成为[ROOT.GetCountry.GetOverlord.GetNameNoFormatting]省的一部分”，实现邦联的统一。"
 cr_federation.2.f:"代表的语气带着不容置喙的傲慢，仿佛我们的主权与自治权从未存在过。国境线上，[ROOT.GetCountry.GetOverlord.GetNameNoFlag]省的军队正悄然集结，明眼人都清楚，这并非善意的提议，而是赤裸裸的胁迫与吞并。"
 cr_federation.2.a:"我们别无选择。"
 cr_federation.2.b:"奋起抗争。"
 cr_federation.3.t:"与 [SCOPE.sCountry('consolidated_member').GetName] 合邦"
 cr_federation.3.d:"[ROOT.GetCountry.GetRuler.GetLastName] 省长经过深思熟虑，已正式决定与[SCOPE.sCountry('consolidated_member').GetName]合邦，并第一时间将这一历史性决定通知了联邦议会，等待议会的最终确认。"
 cr_federation.3.f:"广场上响起了阵阵欢呼，民众挥舞着我省的旗帜，见证着这一历史性的时刻。[ROOT.GetCountry.GetRuler.GetLastName]省长站在议会台阶上，目光坚定地向民众宣告：这一步，是邦联走向统一的光荣一步，是我们共同迈向强大的开始。"
 cr_federation.3.a:"光荣的一步。"
 cr_is_arg_member:"[ROOT.GetCountry.GetName] 不是邦联成员"
 cr_is_swi_member:"[ROOT.GetCountry.GetName] 不是邦联成员"
 cr_own_argentina_states:"[ROOT.GetCountry.GetName] 拥有所有阿根廷地区，并且没有其他邦联成员附属"
 cr_confederation_leader:"[ROOT.GetCountry.GetName] 不是邦联领导者，或 [ROOT.GetCountry.GetName] 是他国附属"
