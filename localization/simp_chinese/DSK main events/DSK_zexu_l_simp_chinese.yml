je_dsk_zexu_technology: "科技共享，共同进步"
je_dsk_zexu_technology_reason: "泽许欧亚合众国在整个欧洲范围内推行教育改革。建立统一的教育体系，在学校中教授泽许帝国的历史、文化、语言和价值观。培养新一代具有泽许帝国认同感的欧洲公民，通过教育来消除不同地区之间的文化隔阂，实现思想上的统一，为欧洲的长期稳定奠定思想基础。"
