 ### 事件描述 ###
 cr_europe_events.1.t:0 "科学之声"
 cr_europe_events.1.d2:0 "#bold #variable [SCOPE.sState('sound_of_science_state').GetFarmHubName]-[SCOPE.sState('sound_of_science_state').GetCityHubName]#!#! 铁路上进行了一场别出心裁的实验，用来检验关于恒星运动的理论。"
 cr_europe_events.1.d:0 "[SCOPE.sState('sound_of_science_state').GetCityHubName]大学的教授们证实了#variable 克里斯蒂安·多普勒#!提出的理论：当声源、光源或观察者处于运动状态时，人们听到的声音频率或看到的光线频率就会发生变化。"
 cr_europe_events.1.f:0 "一列飞驰的火车、一支吹得震天响的铜号，还有十多名听觉敏锐的观察者，在#bold #variable [SCOPE.sState('sound_of_science_state').GetFarmHubName]-[SCOPE.sState('sound_of_science_state').GetCityHubName]#!#! 铁路上共同完成了这场实验。实验要检验的，正是多普勒关于恒星运动的理论：如果波的频率确实会随物体的速度改变，那么火车驶过时，铜号发出的尖锐高音就应该明显降低。\n\n这些观察者能够分辨八分之一音高的差别，因此被专门选中。他们认真记录火车呼啸而过时听到的声音。三天后，数据整理完毕……结果很明确：音调确实下降了！"
 cr_europe_events.1.a:0 "观察与实验是知识的基础。"
 cr_europe_events.1.b:0 "人们无法预知一个新真理会以多么意想不到的方式找到用武之地。"

 cr_europe_events.5.t:0 "英国夫人"
 cr_europe_events.5.desc:0 "黎巴嫩群山中住着一位隐居的英国夫人。她既是冒险家和考古学家，也是难民、弃儿与罪犯们的庇护者和主人。如今，她深陷债务，当地放债人要求我们出面，逼她偿还欠款。"
 cr_europe_events.5.desc_2:0 "黎巴嫩群山中住着一位隐居的英国夫人。她打着英国国旗提供保护，吸引了许多难民、弃儿和罪犯，并逐渐成了他们的主人。\n\n但她不断冒险也开始反噬自己：她曾远征惩罚阿拉维派，又在阿什凯隆进行失败的考古发掘，欠下的债务远远超过偿还能力。\n\n现在，当地的放债人和有权势的人要求我们出面，想办法逼她还清欠款。"
 cr_europe_events.5.f:0 "说到我的债务，情况并不是你想的那样：我每年要付的并非百分之二十五，而是百分之五十，甚至百分之九十五。有一次，我的损失还要更大。他们在这里按二十八皮阿斯特的金币给我算出四十五皮阿斯特的价值；我花钱时只按二十八算，到了贝鲁特还债，却要按四十五计算……你自己算算看吧！——#italic 赫丝特夫人致其私人医生的信#!"
 cr_europe_events.5.a:0 "提醒放债人们，#italic 高利贷（riba）#! 是 #italic 哈拉姆（禁忌）#! 的……"
 cr_europe_events.5.a_tt:0 "#italic 《穆斯林圣训实录》（1598）记载，贾比尔说：真主的使者诅咒收取高利贷的人、支付高利贷的人、记录高利贷的人，以及为高利贷作证的两人，并说：他们都一样。#!"
 cr_europe_events.5.b:0 "或许我们可以请英国人替我们出面干预"
 cr_europe_events.5.b_tt:0 "#italic 根据投降条约，所有居住在黎凡特的英国臣民完全受其本国政府管辖，所有诉讼均提交其领事法庭，由领事裁决。严格来说，根据英国法律，我们无权裁决此类事务，正如我们无权强迫本国臣民出庭英国领事一样。#!"
 cr_europe_events.5.c:0 "就没有人能帮我们除掉这个不安分的女人吗？"
 cr_europe_events.5.c_tt:0 "#italic 她非常擅长讽刺，而且常常讽刺得令人害怕。她的许多信件都写满尖刻的批评。她有数不清的怪癖，还喜欢用各种古怪的方式考验人和动物；当然，她也经常因此被人和动物骗过，付出代价。#!"
 cr_europe_events.5.d:0 "为了友谊，我们应当替她清偿债务"
 cr_europe_events.5.d_tt:0 "在大多数话题上，她不仅神智清醒，而且见多识广、极其精明。她拥有非凡的谈话天赋，对她愿意示好的人极具魅力。"

 cr_europe_events.6.t:0 "沙漠女王"
 cr_europe_events.6.desc:0 "赫丝特·斯坦霍普夫人是尊贵的#variable 小威廉·皮特#!的侄女。她在黎凡特的种种冒险，已经让[ROOT.GetCountry.GetRuler.GetHerHis|U]陛下政府颇为尴尬。\n\n赫丝特夫人长期缺钱，她的[SCOPE.sCountry('LadyHestersLiege').GetAdjectiveNoFlag]债主于是向[SCOPE.sCountry('LadyHestersLiege').GetRuler.GetPrimaryRoleTitle]求助，要求她偿还一笔数额不小的债务。根据投降条约，[SCOPE.sCountry('LadyHestersLiege').GetRuler.GetSheHe]已将此事交给我们驻[SCOPE.sState('LadyHestersHome').GetCityHubName]的领事裁决。"
 cr_europe_events.6.desc_2:0 "多年以前，#bold #variable 赫丝特·斯坦霍普夫人#!#!——#bold #variable 小威廉·皮特#!#!的侄女——离开英国，赴黎凡特追寻命运，抑或只是躲避上流社会的闲言碎语。\n\n她长期拮据，其种种行止已使[ROOT.GetCountry.GetRuler.GetHerHis|U]陛下政府颇为难堪；赫丝特夫人的[SCOPE.sCountry('LadyHestersLiege').GetAdjectiveNoFlag]债主遂向[SCOPE.sCountry('LadyHestersLiege').GetRuler.GetPrimaryRoleTitle]陈请，要求清偿其数额可观的债务。依照投降条约，[SCOPE.sCountry('LadyHestersLiege').GetRuler.GetSheHe]已将此案交由我方驻[SCOPE.sState('LadyHestersHome').GetCityHubName]领事裁断。"
 cr_europe_events.6.f:0 "在马耳他，人们告诉她会成为犹太人的救世主；在君士坦丁堡，她直视苏丹；在开罗，她与阿里帕夏平起平坐；在大马士革，她不戴面纱，骑马入城。帕尔米拉人称她为#italic 梅莱基#!，意思是“女王”；在黎巴嫩，她又结交了神秘的德鲁兹人。法国上校遇害后，阿拉维派曾因她的报复付出惨重代价；可战争来临时，她又为所有向她求助的人提供庇护。如今，她在朱恩自称一位半疯的女先知，隐居在城堡里，从不越过高墙，只有夜晚才与人交谈。"
 cr_europe_events.6.a:0 "为了她已故舅舅的情分，我们来支付"
 cr_europe_events.6.a_tt:0 "#italic 她在阿拉伯部落以及所有遭受易卜拉欣军队蹂躏、或为奥斯曼帝国摇摇欲坠而叹息的人中影响巨大。她比任何人都更有能力确保英国获得那些国家的好感，而当——这一天必将很快到来——我们必须为奥斯曼的独立与俄国对抗时，这些善意对我们的利益至关重要。#! ——威廉·内皮尔爵士"
 cr_europe_events.6.b:0 "不幸的是，夫人得自己面对"
 cr_europe_events.6.b_tt:0 "#italic 这些债务中有许多是因为愚蠢的原因欠下的——例如她给了希伯伦的拉比利维7000皮阿斯特，只因他陪她彻夜长谈弥赛亚等等。#! ——沃尔夫医生致帕默斯顿勋爵的报告"

 cr_europe_events.7.t:0 "英国夫人"
 cr_europe_events.7.desc:0 "[SCOPE.sState('LadyHestersHome').GetCityHubName]的英国领事已明确表示，[SCOPE.sCountry('LadyHesterMotherland').GetRuler.GetHerHis|U]陛下政府拒绝代#variable 赫丝特·斯坦霍普夫人#!清偿债务。\n\n事实上，他已否认一切[SCOPE.sCountry('LadyHesterMotherland').GetAdjectiveNoFlag]方面的介入，将此事完全交由我方处置。"
 cr_europe_events.7.f:0 "终于拿到那封信时，赫丝特夫人以为所有麻烦都结束了。她从未怀疑答案会是什么：不用再等待，不用再忍受希望落空的痛苦，也不用再面对债务和催债人。她以为胜利与解脱终于到来，属于她的遗产马上就会到手。她激动得几乎喘不过气，医生甚至担心她会因此中风。可是打开信后，她看到的并不是期待中的弗朗西斯爵士回信，而是一封完全不同的信。她在毫无准备的情况下，遭受了致命的打击。"

 cr_europe_events.8.t:0 "英国夫人"
 cr_europe_events.8.desc:0 "[SCOPE.sState('LadyHestersHome').GetCityHubName]的英国领事已明确表示，[SCOPE.sCountry('LadyHesterMotherland').GetRuler.GetHerHis|U]陛下政府将代#variable 赫丝特·斯坦霍普夫人#!清偿债务。"
 cr_europe_events.8.f:0 "如果X说的是真的，而我近一万皮阿斯特的债务即将有人替我偿还，那么我就可以继续进行那些高尚而富有哲理的探索，埋头研究深奥的抽象问题。虽然我的体力已经大不如前，不能再像过去那样日夜工作，但我仍需要泥瓦匠、木匠、耕作者、园丁、马夫、医生等人来帮忙。我的年收入需要四千皮阿斯特，像你这样的人还要另给一千；此外还需要五千现金，用于食物、建筑、牲畜和日常周转，好让我重新开始。——#italic 赫丝特夫人致其私人医生的信#!"
 cr_europe_events.8.a:0 "我们可以认为此事已了结"

