dsk_zexu.19.t: "多瑙河梦，领土扩张"
dsk_zexu.19.d: "借着[SCOPE.sCountry('aus_want_annex_hun_scope').GetName]的内乱，[SCOPE.sCountry('hun_never_die_scope').GetName]独立党，[SCOPE.sCountry('aus_want_annex_hun_scope').GetName]发动吞并[SCOPE.sCountry('hun_never_die_scope').GetName]的战争"
dsk_zexu.19.f: "起初，这是一种民族自决提案，直到，这场革命变成了一场独立战争，其最终目的是把匈牙利从奥地利分裂出来，推翻君主制并宣布成立共和国。\n这些法国革命带来的激进的思想遭到欧洲大多数君主制的强烈反对"
dsk_zexu.19.a: "匈牙利地区属于我们"
dsk_zexu.19.b: "还是别掺和这个烂摊子了"




