 #西班牙
 je_cr_carlist_war_carlists:"上帝、国家与富埃罗斯"
 je_cr_carlist_war_carlists_reason:"继承法与君主制本身一样古老。长子继承；无子则由兄弟继位。自古如此，由上帝命定、传统神圣化。依据这些神圣准则，唐·[SCOPE.sCountry('cr_carlists').GetRuler.GetFirstName]陛下是西班牙唯一合法的[SCOPE.sCountry('cr_carlists').GetRuler.GetPrimaryRoleTitle]。\n\n然而，在这动荡时代，这一古老习俗被无情践踏。野心勃勃的#variable 玛丽亚·克里斯蒂娜#!王后操纵已故[SCOPE.sCountry('cr_carlists').GetRuler.GetPrimaryRoleTitle]#variable 费迪南#!的遗嘱，将女儿[SCOPE.sCountry('cr_christinos').GetRuler.GetFirstName]推上王位，公然违背维系我们国家的法律。这一背叛将西班牙拖入混乱，兄弟相残、社会撕裂。\n\n这远非继承之争，而是对西班牙本身的攻击。\n\n[SCOPE.gsInterestGroup('cr_spanish_liberals').GetNameNoIcon]为追逐权力，不惜对王国根基发动战争。数百年来指引西班牙的圣[SCOPE.gsInterestGroup('cr_spanish_catholic_church').GetNameNoIcon]如今被掠夺与亵渎。#italic 没收教会财产#!——那卑劣的盗窃——剥夺了信徒的庇护所，让穷人无救济、寡妇无慈善、村庄无牧者。[SCOPE.gsInterestGroup('cr_spanish_liberals').GetNameNoFormatting]声称带来自由，却带来无神论，以虚假进步之名掠夺西班牙的灵魂。\n\n他们的背叛不止于教会。六百多年来，王冠一直是#variable 富埃罗斯#!的守护者——我们[SCOPE.sCulture('cr_basque_culture').GetName]与[SCOPE.sCulture('cr_catalan_culture').GetName]子民的神圣自由。这些远早于卡斯蒂利亚的古老权利，如今被斥为现代化的障碍。[SCOPE.gsInterestGroup('cr_spanish_liberals').GetNameNoFormatting]欲将其废除，将西班牙骄傲的省份贬为马德里暴政的臣属。一个不维护人民法律的[SCOPE.sCountry('cr_carlists').GetRuler.GetPrimaryRoleTitle|l]是什么？伪装的暴君。\n\n但一切尚未无望。真正的[SCOPE.sCountry('cr_carlists').GetRuler.GetPrimaryRoleTitle]仍屹立不倒。只有唐·[SCOPE.sCountry('cr_carlists').GetRuler.GetFirstNameNoFormatting]能恢复被窃之物——我们的信仰、法律与王国。对抗[SCOPE.gsInterestGroup('cr_spanish_liberals').GetNameNoFormatting]的虚假承诺，我们高举上帝、[SCOPE.sCountry('cr_carlists').GetRuler.GetPrimaryRoleTitle]与富埃罗斯的旗帜。西班牙绝不会落入传统之敌手中。我们拿起武器，不是为野心，而是为永恒秩序。我们不为自身而战，而是为子孙、祭坛与先父之墓。\n\n让叛徒颤抖。我们为西班牙而进军！"
 cr_defeat_the_christinos:"我们已击败[SCOPE.sCountry('cr_christinos').GetAdjective]篡位者，建立合法统治。"

 je_cr_carlist_war_christinos:"女王、国家与进步"
 je_cr_carlist_war_christinos_reason:"西班牙站在十字路口。两条道路摆在我们面前——一条通向统一、稳定与进步，另一条将我们拖回封建、教权暴政与无尽战争。抉择显而易见：[SCOPE.sCountry('cr_christinos').GetRuler.GetPrimaryRoleTitle][SCOPE.sCountry('cr_christinos').GetRuler.GetFirstName]是合法君主，由其父[SCOPE.sCountry('cr_carlists').GetRuler.GetPrimaryRoleTitle]#variable 费迪南#!依据国法宣布。然而[SCOPE.sCountry('cr_carlists').GetAdjectiveNoFlag]固守过时的继承观念，宁愿让西班牙血流成河，也不愿接受自己[SCOPE.sCountry('cr_carlists').GetRuler.GetPrimaryRoleTitle]的意愿。\n\n让我们说清楚：唐·[SCOPE.sCountry('cr_carlists').GetRuler.GetFirstName]毫无权利，只有武力。他从未是继承人。已故[SCOPE.sCountry('cr_carlists').GetRuler.GetPrimaryRoleTitle|l]神志清醒时废除萨利克法，并以#variable 国事诏书#!确认女儿继位。[SCOPE.sCountry('cr_carlists').GetAdjectiveNoFormatting]称之为背叛，但还有比拒绝[SCOPE.sCountry('cr_carlists').GetRuler.GetPrimaryRoleTitle|l]本人意愿更大的叛国吗？捍卫王冠的不是唐·卡洛斯，而是[SCOPE.sCountry('cr_christinos').GetRuler.GetPrimaryRoleTitle][SCOPE.sCountry('cr_christinos').GetRuler.GetFirstNameNoFormatting]及其忠诚臣民。[SCOPE.sCountry('cr_carlists').GetAdjectiveNoFormatting]事业不过是披着虚假虔诚的叛乱，是军阀与狂热分子的运动，他们宁愿撕裂西班牙也不愿让它前进。\n\n他们许诺的未来是什么？回到僧侣与地方领主统治的时代，让富埃罗斯与封建特权凌驾于国家之上。长久以来，分裂的法律割裂西班牙，将对省份的忠诚置于对王冠之上。[SCOPE.sCountry('cr_carlists').GetAdjectiveNoFormatting]声称捍卫传统，他们真正捍卫的是一个破碎、落后的西班牙，王冠沦为过时习俗的囚徒。若西班牙要生存，必须统一，由单一公正法律治理，每位西班牙人在法律面前平等。\n\n他们为[SCOPE.gsInterestGroup('cr_spanish_catholic_church').GetNameNoIcon]辩护，但真实目的是什么？不是保护信仰，而是保住教士不受约束的权力，他们囤积巨额土地，而普通西班牙人却在贫困中劳作。#variable 没收教会财产#!不是攻击信仰，而是恢复正义——西班牙的财富应服务人民，而非少数特权者。教会将继续存在，但必须明白自己的位置。\n\n让[SCOPE.sCountry('cr_carlists').GetAdjectiveNoFormatting]为过去哭泣——我们向未来进军。为[SCOPE.sCountry('cr_christinos').GetRuler.GetPrimaryRoleTitle][SCOPE.sCountry('cr_christinos').GetRuler.GetFirstNameNoFormatting]，为西班牙，为进步！"
 cr_defeat_the_carlists:"我们已击败[SCOPE.sCountry('cr_carlists').GetAdjective]叛乱。"

