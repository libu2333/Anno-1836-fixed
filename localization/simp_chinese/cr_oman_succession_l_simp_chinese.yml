l_simp_chinese:
 dyn_c_oman_and_zanzibar_sultanate:0 "阿曼和桑给巴尔苏丹国"
 dyn_c_oman_and_zanzibar_sultanate_adj:0 "阿曼-桑给巴尔"

 je_splitting_oman:0 "布赛义德继承危机"
 je_splitting_oman_reason:0 "自赛义德·本·苏尔坦于1834年将宫廷迁往桑给巴尔以来，他的领地便隔着印度洋两岸而治。其子[ROOT.GetCountry.GetHeir.GetFullName]与马吉德·本·赛义德，正分别在马斯喀特与桑给巴尔结纳党羽。若能在苏丹辞世前使一方宫廷压倒另一方，布赛义德王朝或可保全其统一；否则，大海终将把这份遗产一分为二。"
 cr_oman_succession_bar_name:0 "布赛义德继承危机"
 cr_oman_succession_bar_desc:0 "苏韦尼派：#v [GetPlayer.MakeScope.ScriptValue('cr_oman_suwaini_faction_display')|0]#!"
 cr_oman_succession_bar_second_desc:0 "马吉德派：#v [GetPlayer.MakeScope.ScriptValue('cr_oman_majid_faction_display')|0]#!"
 cr_oman_succession_drift_tt:0 "两座宫廷之间的力量消长"
 cr_oman_succession_settled_header:0 "满足下列任一条件，继承危机将告解决："
 cr_oman_suwaini_victory_tt:0 "#bold 苏韦尼派#!达到#bold 100#!"
 cr_oman_majid_victory_tt:0 "#bold 马吉德派#!达到#bold 100#!"
 cr_oman_succession_outcome_header:0 "布赛义德继承危机已告解决"
 cr_oman_sultan_death_header:0 "满足下列条件，领地将告分裂："
 cr_oman_said_death_tt:0 "苏丹赛义德·本·苏尔坦逝世"
 cr_oman_realm_divides_header:0 "阿曼领地分裂"

 cr_oman.1.t:0 "两座宫廷，一位苏丹"
 cr_oman.1.d:0 "苏丹的宫廷如今驻于桑给巴尔，马斯喀特却仍是阿拉伯领地的枢纽。苏韦尼王子深受阿曼名流信赖；年少的马吉德王子则由桑给巴尔的商人与官吏簇拥。赛义德苏丹必须维持两座日益各行其是的宫廷之间的和平。"
 cr_oman.1.f:0 "大海既能相连，也能相隔；从桑给巴尔到马斯喀特，终究路途迢遥。"
 cr_oman.1.a:0 "布赛义德家族必须维持完整。"

 cr_oman.2.t:0 "苏韦尼的定局"
 cr_oman.2.d:0 "阿曼名流终于压倒了桑给巴尔宫廷的野心。苏韦尼的支持者使马斯喀特重新成为无可置疑的施政中心，苏丹国的首都也迁回阿曼。布赛义德领地仍然统一，却不再由一座孤悬海外、以阿拉伯为附庸的宫廷统治。"
 cr_oman.2.f:0 "从马斯喀特出发，苏丹既能望见大海，也不会忘却阿曼。"
 cr_oman.2.a:0 "阿拉伯腹地仍为根本。"

 cr_oman.3.t:0 "马吉德的定局"
 cr_oman.3.d:0 "桑给巴尔的商人、官吏与航海利益集团取得了胜利。马吉德的宫廷获得了苏丹国的信任，布赛义德领地继续维持统一，而政府的目光则投向西印度洋。"
 cr_oman.3.f:0 "桑给巴尔不再是遥远的属地；它已成为统治整个领地的宫廷所在。"
 cr_oman.3.a:0 "季风承载着我们的命运。"

 cr_oman.4.t:0 "马斯喀特的请愿"
 cr_oman.4.d:0 "马斯喀特的名流请求赛义德苏丹恢复领地的旧有均衡。他们称颂苏韦尼熟悉阿曼部族，并警告一座岛上的宫廷无法驾驭内陆。桑给巴尔使者则反驳说，苏丹国的财富如今正由非洲海岸汇聚而来。"
 cr_oman.4.f:0 "统治两岸的君主，须倾听两种风送来的请愿。"
 cr_oman.4.a:0 "让苏韦尼代言阿曼。"
 cr_oman.4.b:0 "桑给巴尔的利益不可忽视。"
 cr_oman.4.c:0 "以金钱换取一时妥协。"

 cr_oman.5.t:0 "桑给巴尔关税"
 cr_oman.5.d:0 "桑给巴尔的关税收入已成为苏丹国国库的重要支柱。马吉德的拥护者要求让岛上的商人在管理中拥有更大话语权；苏韦尼的支持者则坚持，这笔收入属于整个领地，而非一座港口。"
 cr_oman.5.f:0 "每一袋丁香、每一支象牙经过关署时，都携带着一场政治争论。"
 cr_oman.5.a:0 "将关税交由马吉德的人马经管。"
 cr_oman.5.b:0 "把更多收入汇往马斯喀特。"
 cr_oman.5.c:0 "将收益收归苏丹国库。"

 cr_oman.6.t:0 "舰队驻泊何处？"
 cr_oman.6.d:0 "海军将领请求苏丹决定舰队的驻泊地。桑给巴尔拥有深水锚地，且接近非洲贸易；马斯喀特则更靠近阿拉伯腹地，易于固守。两座宫廷都将自己的主张说成战略问题，却都未能掩饰这背后的权力之争。"
 cr_oman.6.f:0 "舰队不仅是船只，更是供养它的宫廷所能伸及的权力。"
 cr_oman.6.a:0 "将舰队驻泊桑给巴尔。"
 cr_oman.6.b:0 "把舰队召回马斯喀特。"
 cr_oman.6.c:0 "将舰队分驻两岸。"

 cr_oman.7.t:0 "维齐尔会议"
 cr_oman.7.d:0 "苏丹的重臣已分裂为彼此竞争的圈子。一派主张更加倚重苏韦尼背后的阿曼名流；另一派则认为，桑给巴尔的商人与官吏对整个领地不可或缺。还有一条道路，是维护苏丹个人权威，但代价是同时疏远两派。"
 cr_oman.7.f:0 "在宫廷中，沉默常被当作赞同，而赞同又常被视为软弱。"
 cr_oman.7.a:0 "擢升阿曼出身的顾问。"
 cr_oman.7.b:0 "加强桑给巴尔大臣的权力。"
 cr_oman.7.c:0 "遣散两派使者。"

 cr_oman.8.t:0 "丁香商队"
 cr_oman.8.d:0 "一支满载丁香、象牙与进口纺织品的船队自桑给巴尔抵达。马吉德的拥护者请求将利润投入非洲港口；苏韦尼的人马则要求把财富送往阿曼，那里仍需供养部族与堡垒。"
 cr_oman.8.f:0 "海上的财富抵达阿曼之前，早已在两岸之间作出了取舍。"
 cr_oman.8.a:0 "投资桑给巴尔的转口贸易。"
 cr_oman.8.b:0 "将利润运往阿曼。"
 cr_oman.8.c:0 "将收入归于王室。"

cr_oman.9.t:0 "蒙巴萨的任命"
 cr_oman.9.d:0 "蒙巴萨的理事职位出缺。马斯喀特名流主张，新任官员须向阿拉伯宫廷负责；桑给巴尔商人则认为，唯有熟悉海岸贸易与当地人情者，方能治理此地。苏丹可以将此职托付给任一派系，亦可自费维持王室的直接监督。"
 cr_oman.9.f:0 "在斯瓦希里海岸，一项任命从不只是一项任命。"
 cr_oman.9.a:0 "令总督向马斯喀特负责。"
 cr_oman.9.b:0 "准许桑给巴尔推举总督。"
 cr_oman.9.c:0 "不惜财力，保留王室监察官。"

 cr_oman.10.t:0 "内陆来书"
 cr_oman.10.d:0 "内陆送来的书信，陈述着关税、部族义务与地方官吏操守的种种怨言。苏韦尼的拥护者称，唯有熟悉阿曼情形的王子能够作答；马吉德的近臣则劝告，海岸宫廷不可将每一件事务都让与内陆。另有一策，是遣出苏丹自己的使者，只是国库须为此负担开销。"
 cr_oman.10.f:0 "一封越过沙漠的书信，所携者从不止于印信。"
 cr_oman.10.a:0 "命苏韦尼的人马答复请愿。"
 cr_oman.10.b:0 "由桑给巴尔宫廷作答。"
 cr_oman.10.c:0 "遣出苏丹亲信使者。"

 cr_oman.11.t:0 "季风中的文书"
 cr_oman.11.d:0 "季风延误了马斯喀特与桑给巴尔之间的船只。命令迟至，账目残缺，两座宫廷各自指责对方扣留了所需之物。马吉德的拥护者要求扩大桑给巴尔的便宜行事之权；苏韦尼的人马则坚持，阿拉伯诸省不可事事等待海上的消息。苏丹也可另筹专使传递文书，只是代价不菲。"
 cr_oman.11.f:0 "风向一转，权威也须在海上等待。"
 cr_oman.11.a:0 "扩大桑给巴尔的便宜行事之权。"
 cr_oman.11.b:0 "令马斯喀特不待回音自行处置。"
 cr_oman.11.c:0 "出资建立王室专使网络。"
