 ig_jibei_officials:0 "Tianzhi Democratic Party"
 ig_jibei_officials_desc:0 "Lin Tianzhi's newly established Democratic Party stands to the left of the Republican Party on economic matters."
 ig_jibei:0 "Tianzhi Confucian Patriarch"
 ig_jibei_desc:0 "Lin Tianzhi's new religion prizes the cultivation of health and longevity, and venerates the Jade Emperor as the ruler of the mortal world."
 je_depend_jibei:0 "Developing Alaska"
 je_depend_jibei_reason:0 "Three years ago, [ROOT.GetCountry.GetRuler.GetFullName], a visitor from another world well versed in history, crossed the North Pacific and established a new overseas Chinese state in Tianzhi."
 je_depend_jibei_goal:0 "Complete the development of Alaska"
 usfp_manifest_destiny.10.t:0 "The Legend of Gold Mountain"
 usfp_manifest_destiny.10.d:0 "News of gold discovered in [SCOPE.sState('california_scope').GetName] has reached [SCOPE.sCountry('china_scope').GetName]. Drawn by tales of the riches of Gold Mountain, thousands of [SCOPE.sCulture('han_scope').GetName] migrants are preparing to cross the ocean."
 usfp_manifest_destiny.10.f:0 "As the name of Gold Mountain spreads, the tides carry the hopes of countless people."
 usfp_manifest_destiny.10.a:0 "The gold rush cannot be stopped."
 usfp_manifest_destiny.10.b:0 "We need no more gold seekers."
 usfp_manifest_destiny.10.a.t:0 "Whatever policy the [SCOPE.sCountry('china_scope').GetAdjective] government adopts, more than thirty thousand [SCOPE.sCulture('han_scope').GetName] laborers will arrive in [SCOPE.sState('california_scope').GetName] over the coming years."
 tz_flavor.2.t:0 "Developing Alaska"
 tz_flavor.2.d2:0 "Alaska's reclamation works have succeeded, increasing the land available for cultivation in the state."
 tz_flavor.2.d:0 "With the last stretch of wilderness brought under cultivation, Alaska's settlement project is finally complete."
 tz_flavor.2.f:0 "One should cherish great ambitions."
 tz_flavor.2.a:0 "Alaska holds great promise."
 tz_flavor.1.b:0 "Build our strength to revive China in the years to come."
 jibei_development_complete:0 "Vigorous Industrial Development"
 tz_flavor.1.c:0 "Retain the monarchy to preserve authority."
 tz_flavor.1.t:0 "Tianzhi's Otherworldly Visitor"
 tz_flavor.1.d:0 "Several years ago, our family crossed the Pacific to this bitterly cold frontier, seeking only to change our fate."
 tz_flavor.1.f:0 "After landing in Alaska, [ROOT.GetCountry.GetRuler.GetFullName] reached an agreement with the Russian Empire to purchase the territory for six hundred thousand taels of silver. An independent country was thus proclaimed."
 tz_flavor.1.a:0 "Settle Alaska and lay the foundations of our state."
 tz_flavor.1.z:0 "Find a place between Britain and America."
 tz_flavor.4.t:0 "Our Allies"
 tz_flavor.4.d:0 "Our democratic endeavor has succeeded and attracted attention even across the ocean. We can ally with like-minded countries to defend what we have achieved."
 tz_flavor.4.f:0 "This is a historic undertaking. [SCOPE.GetRootScope.GetCountry.GetName] will begin a new chapter."
 tz_flavor.4.a:0 "Ally with Great Britain."
 tz_flavor.4.b:0 "Ally with the United States of America."
 tz_flavor.4.c:0 "The republic should first put its own house in order."
 tz_flavor.5.t:0 "Founding of the Tianzhi Republic"
 tz_flavor.5.d:0 "We have escaped the influence of our former overlord and will become an important North American power alongside the United States."
 tz_flavor.5.f:0 "Change has come, and a new era begins."
 tz_flavor.5.a:0 "Long live [SCOPE.GetRootScope.GetCountry.GetName]!"
 tz_flavor.6.t:0 "The Tianzhi Empire"
 tz_flavor.6.a:0 "[SCOPE.GetRootScope.GetCountry.GetName] should build roads, bridges, and ports to launch a major program of infrastructure development."
 tz_flavor.6.b:0 "After sustained efforts, Tianzhi's economy is beginning to recover. Employment and incomes are rising, and livelihoods are improving. We must still protect the environment and its ecosystems to secure lasting prosperity."
 tz_flavor.6.c:0 "In rebuilding the country, [ROOT.GetCountry.GetRuler.GetFullName] has taken measures to overcome geographical and resource constraints."
 tz_flavor.6.d:0 "[ROOT.GetCountry.GetRuler.GetFullName] draws on our position near the Arctic Circle to develop fishing, mining, and trade, making the most of Tianzhi's frontier advantages."
 tz_flavor.6.e:0 "[ROOT.GetCountry.GetRuler.GetFullName] enforces strict resource management to ensure responsible mining and sustainable fisheries, introducing advanced mining and fisheries practices to reduce environmental damage."
 tz_flavor.6.f:0 "[ROOT.GetCountry.GetRuler.GetFullName] invests in roads, railways, and ports to ease the movement of people and goods, while expanding energy supplies to strengthen the foundations of Tianzhi's development."
 tz_flavor.6.g:0 "[ROOT.GetCountry.GetRuler.GetFullName] seeks foreign technology and capital, cultivating good relations with America and Britain to develop cross-border resources together."
 tz_flavor.6.h:0 "[ROOT.GetCountry.GetRuler.GetFullName] establishes education funds, recruits specialists, and founds research institutions to promote technological innovation and industrial advancement."
 je_be_alaska:0 "A New Name; a New Flag"
 je_be_alaska_reason:0 "We stand at the northwestern tip of North America, bordering Canada and facing the Arctic Ocean, Bering Sea, and North Pacific. With America so close, why not consider building a union together?"
 je_usa_union:0 "A Tianzhi-American Union"
 je_usa_union_reason:0 "A Tianzhi-American union would set a precedent. [SCOPE.sCountry('usa_scope').GetName] and [SCOPE.GetRootScope.GetCountry.GetName] could embark together on the path to federation."
 tz_flavor.8.t:0 "The Tianzhi-American Federation"
 tz_flavor.8.d:0 "Union with America is an epoch-making achievement. The North American continent now enters the republic's new political horizon."
 tz_flavor.8.f:0 "A new era begins. We may move the capital from the frontier to New York, a more suitable center for government and development."
 tz_flavor.8.a:0 "May the friendship between [SCOPE.GetRootScope.GetCountry.GetName] and the United States of America endure!"
 tz_flavor.9.t:0 "[SCOPE.sCountry('usa_scope').GetName] Buys the West Coast"
 tz_flavor.9.d:0 "[SCOPE.sCountry('usa_scope').GetName] is now our neighbor and proposes to purchase the West Coast for a substantial sum."
 tz_flavor.9.f:0 "Good relations with [SCOPE.sCountry('usa_scope').GetName] are one of our established national policies."
 tz_flavor.9.a:0 "North America is vast. Cede the West Coast."
 tz_flavor.9.b:0 "I have other plans."
 je_canada_union:0 "Tianzhi-America-Canada"
 je_canada_union_reason:0 "Following our union with America, the world's foremost power, [SCOPE.sCountry('gbr_scope').GetName], still holds Canada's northeastern corner. We should persuade them to give us Newfoundland and complete the effective unification of North America."
 tz_flavor.10.t:0 "[SCOPE.sCountry('gbr_scope').GetName] Offers Newfoundland"
 tz_flavor.10.d:0 "[SCOPE.sCountry('gbr_scope').GetName] is now our neighbor. Years of friendship and our rising international standing have prompted them to offer us Newfoundland."
 tz_flavor.10.f:0 "Good relations with [SCOPE.sCountry('gbr_scope').GetName] are one of our established national policies. We shall now look farther afield."
 tz_flavor.10.a:0 "The moment to unite North America has come."
 buy_west_sea_land:0 "Purchase the West Coast"
 buy_west_sea_land_desc:0 "To promote America's prosperity, we should purchase the West Coast."
 buy_west_sea_land1:0 "Sell the West Coast"
 buy_west_sea_land1_desc:0 "After negotiating with Britain and acquiring most of the former Canadian territories, the American government has offered to buy the West Coast. Should we accept?"
 modifier_buy_west_sea_land:0 "Purchase of the West Coast"
 modifier_buy_west_sea_land1:0 "Sale of the West Coast"
 indian_union:0 "Proclamation of Union"
 indian_union_desc:0 "Invite like-minded countries to join our federation."
