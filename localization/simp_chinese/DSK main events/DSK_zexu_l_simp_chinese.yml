annex_whole_russia_button_desc: "与俄罗斯多年的边境争端终于让我们有理由发动吞并沙俄的战争"

je_dsk_help_china: "助力中华，民国新生"
je_dsk_help_china_reason: "在征服俄罗斯帝国后，泽许帝国将目光投向了遥远的东方。此时的中国正处于革命的关键时期，林泽许深知中国革命对于世界格局的重要性。于是，他决定伸出援手，派遣军事顾问团前往中国，为革命者提供专业的军事指导和战略建议。同时，泽许帝国还向中国革命者提供了大量的物资援助，包括武器、弹药和医疗用品等。在泽许帝国的帮助下，中国革命者克服重重困难，最终成功建立了中华民国。这一善举不仅增进了泽许帝国与中国的友好关系，也在国际上赢得了广泛赞誉。"
je_dsk_help_china_goal: "当进度条被填满后，一场席卷全[concept_china]的[concept_revolution]将会开启"


dsk_zexu.20.t: "吞并俄罗斯"
dsk_zexu.20.d: "吞并俄罗斯"
dsk_zexu.20.f: "泽许帝国集结了精锐的军队，凭借先进的武器装备、卓越的军事指挥和顽强的战斗意志，向俄罗斯帝国发起全面进攻。战争过程异常激烈，双方在广袤的土地上展开了殊死搏斗。然而，泽许帝国军队凭借着高效的战略战术和强大的后勤保障，逐渐占据上风。经过数年艰苦卓绝的征战，泽许帝国终于成功吞并整个俄罗斯帝国，将其广袤的领土纳入自己的版图，进一步扩大了帝国的势力范围。"
dsk_zexu.20.a: "[SCOPE.GetRootScope.GetCountry.GetName]万岁"

