je_dsk_annex_Scandinavia: "北欧攻略，冰原称雄"
je_dsk_annex_Scandinavia_reason: "泽许欧亚合众国将目光投向北欧地区。这里冰天雪地，但有着丰富的渔业资源和重要的战略位置。泽许帝国组建了适应极地气候作战的特殊部队，他们乘坐特制的破冰船和雪橇，向丹麦、挪威、瑞典和芬兰进发。通过一系列巧妙的外交手段分化各国联盟，再配合军事打击，逐步征服北欧诸国，将北欧纳入合众国的版图，进一步扩大了在欧洲北部的影响力。"

no_Scandinavia_anymore_tt: "#o 瑞典#!，#o 芬兰#!，#o 挪威#!，#o 丹麦#!已被我们吞并！"
no_russia_anymore_tt: "[SCOPE.sCountry('rus_scope').GetName]已被我们吞并！"


dsk_zexu.21.t: "民国创立"
dsk_zexu.21.d: "民国创立"
dsk_zexu.21.f: "在泽许帝国的帮助下，中国革命者克服重重困难，最终成功建立了中华民国。这一善举不仅增进了泽许帝国与中国的友好关系，也在国际上赢得了广泛赞誉。"
dsk_zexu.21.a: "[SCOPE.GetRootScope.GetCountry.GetName]万岁"

dsk_zexu.22.t: "征服北欧"
dsk_zexu.22.d: "征服北欧"
dsk_zexu.22.f: "在征服北欧的同时，泽许帝国开始对东欧地区进行深度整合。在已经吞并俄罗斯帝国的基础上，建立起统一的东欧行政体系，改善当地基础设施，发展教育和医疗事业，提高人民生活水平。并且在东欧地区大力推广泽许帝国的文化和价值观，促进不同民族间的融合，确保东欧地区成为泽许欧亚合众国稳定的根基，为进一步西进奠定坚实的基础。"
dsk_zexu.22.a: "[SCOPE.GetRootScope.GetCountry.GetName]万岁"

