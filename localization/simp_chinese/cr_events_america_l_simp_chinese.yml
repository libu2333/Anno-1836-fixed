 #随机风味文本
 cr_american_events.1.t:0 "全国步枪协会"
 cr_american_events.1.desc_won:0 "对我们在与[SCOPE.sCountry('recent_opponent_scope').GetName]的近期战争中士兵表现出的糟糕射击技能感到震惊，全国各地的退伍军人开始创立步枪协会。这些协会在集体责任感和提升军事准备的决心驱动下诞生，旨在应对武装部队迫切需要的更好训练与射击熟练度。"
 cr_american_events.1.desc_ongoing:0 "对我们在与[SCOPE.sCountry('recent_opponent_scope').GetName]的近期战争中士兵表现出的糟糕射击技能感到震惊，全国各地的退伍军人开始创立步枪协会。这些协会在集体责任感和提升军事准备的决心驱动下诞生，旨在应对武装部队迫切需要的更好训练与射击熟练度。"
 cr_american_events.1.desc_lost:0 "在最近对[SCOPE.sCountry('recent_opponent_scope').GetName)的战争失败后，退伍军人们在[SCOPE.sState('nra_founding_state').GetCityHubName]兵工厂集会，由[SCOPE.sCharacter('nra_founding_general').GetLastName]将军领导，怀着单一目的：提升士兵射击能力，防止未来再蒙羞辱。这一集会标志着全国步枪协会的诞生，源于共同决心确保国家军事准备，避免战场上的进一步挫败。"
 cr_american_events.1.desc_lost_2:0 "最近冲突的退伍军人，因败于[SCOPE.sCountry('recent_opponent_scope').GetName]而深受打击，在[SCOPE.sState('nra_founding_state').GetCityHubName]兵工厂集会，由[SCOPE.sCharacter('nra_founding_general').GetLastName]将军领导，怀着单一目的：提升士兵射击能力，确保此类耻辱性失败永不再现。"
 cr_american_events.1.f:0 "当普通人手中能握有如此非凡的工具——象征人类尊严与自由的全部——这五个字便向我们所有人发出不可抗拒的召唤，我们因此集结。"
 cr_american_events.1.a:0 "从我冰冷、死去的手中拿走！"
 cr_american_events.1.a_tt:0 "[SCOPE.gsInterestGroup('the_national_rifle_association_scope').GetName]将被重命名为#variable 全国步枪协会#! "
 cr_american_events.1.b:0 "希望他们不要成为自由的敌人。"

 cr_american_events.10.t:0 "来自霍尔堡的提议"
 cr_american_events.10.desc:0 "来自蛇河上游的消息：美国商人纳撒尼尔·怀斯希望出售他的霍尔堡。该堡垒原本为陆路移民与毛皮猎人提供补给，却难以抵挡我们哥伦比亚部门带来的竞争。\n\n怀斯现在提出将堡垒、库存与剩余货物转交给公司。收购霍尔堡将确保移民路线上一个关键据点，加强我们在内陆的贸易，并阻止美国进一步侵入该地区。"
 cr_american_events.10.flavour:0 "他们的冒险失败了，就像所有其他人一样，在公司纪律面前不堪一击。让我们拿走他们守不住的东西。"
 cr_american_events.10.a:0 "购买霍尔堡及其库存。"
 cr_american_events.10.a_tt:0 "我们将获得[SCOPE.sProvince('fort_hall_scope').GetStateRegion.GetName]中#bold 霍尔堡#! 省的所有权，以及通往它的路线。"
 cr_american_events.10.b:0 "拒绝——我们的利益在别处。"
 notification_cr_hbc_acquires_fort_hall_name:0 "[SCOPE.sCountry('hbc_scope').GetName]加强对[SCOPE.sCountry('oregon_scope').GetName]的控制。"
 notification_cr_hbc_acquires_fort_hall_desc:0 "[SCOPE.sCountry('hbc_scope').GetName]已收购位于[SCOPE.sState('fort_hall_region_scope').GetStateRegion.GetName]的霍尔堡，击败了此前美国业主在上蛇河贸易中的地位。随着该据点落入公司之手，公司进一步巩固了在[SCOPE.sCountry('oregon_scope').GetName]争议边疆的存在。"

 #印第安人迁移
 cr_indian_removal.1.t:0 "多克斯维尔条约"  # 原注：庞托托克溪条约
 cr_indian_removal.1.desc:0 "一项从[SCOPE.sCountry('choctaw_nation').GetAdjectiveNoFlag]手中获得合适土地的条约即将完成，看来在多年拖延后，[SCOPE.sCountry('chickasaw_nation').GetAdjectiveNoFlag]终于准备向西迁移了。\n\n唯一剩下的争议点是我们同意为他们在密西西比失去的土地支付的财政补偿。而这笔账单正在累积……"
 cr_indian_removal.1.desc_2:0 "[SCOPE.sCountry('chickasaw_nation').GetAdjectiveNoFlag]谈判的迁移条约证明是最宽松的条约之一，允许他们在迁移前自行寻找密西西比河以西的合适土地，同时享有联邦对[SCOPE.sState('state_of_mississippi').GetName]州及个人占地者的保护。\n\n然而这种宽容导致了一拖再拖，因为[SCOPE.sCountry('chickasaw_nation').GetAdjectiveNoFormatting]不断争取更多让步。但现在他们终于找到了合适的土地，正准备迁移。唯一争议仍是我们在密西西比失去土地的财政补偿。这笔账单正在累积……"
 cr_indian_removal.1.f:0 "通过与白人融合，你们的民族特性将丧失；你们将消失，被遗忘。\n — #italic 安德鲁·杰克逊总统对[SCOPE.sCountry('chickasaw_nation').GetAdjectiveNoFormatting]民族的讲话#! "
 cr_indian_removal.1.a:0 "现在支付"
 cr_indian_removal.1.b:0 "#italic 最终#! 支付"
 cr_indian_removal.1.b_tt:0 "未来我们可能会被催促结算这笔债务"
 cr_indian_removal.1.c:0 "暂时搁置"
 cr_indian_removal.1.c_tt:0 "我们将在大约#variable 6个月#! 后重新考虑此事"
 cr_indian_removal.1.tt:0 "[SCOPE.sCountry('chickasaw_nation').GetAdjectiveNoFlag]迁移开始"

 cr_indian_removal.3.t:0 "一笔到期债务"
 cr_indian_removal.3.desc_1:0 "三十多年前，庞托托克溪条约使[SCOPE.sCountry('chickasaw_nation').GetAdjectiveNoFlag]民族同意从[SCOPE.sState('state_of_mississippi').GetName]的祖先土地迁往密西西比河以西的新领土。该协议包括对失去土地的巨额财政补偿承诺。然而至今，这笔承诺的补偿仍未支付，给国家诚信蒙上阴影。[SCOPE.gsInterestGroup('agitating_ig').GetName]开始倡导解决这笔长期债务，以恢复荣誉并纠正过去的不公。"
 cr_indian_removal.3.desc_2:0 "三十多年前，庞托托克溪条约使#variable 奇卡索#! 民族同意从[SCOPE.sState('state_of_mississippi').GetName]的祖先土地迁往密西西比河以西的新领土。该协议包括对失去土地的巨额财政补偿承诺。然而至今，这笔承诺的补偿仍未支付，给国家诚信蒙上阴影。[SCOPE.gsInterestGroup('agitating_ig').GetName]开始倡导解决这笔长期债务，以恢复荣誉并纠正过去的不公。"
 cr_indian_removal.3.desc_3:0 "三十多年前，#variable 奇卡索#! 同意离开父辈的土地，迁往密西西比河以西的新土地。该协议承诺为他们在[SCOPE.sState('state_of_mississippi').GetName]的土地支付巨额补偿。然而至今这笔补偿从未支付，成为我们国家荣誉上的污点，[SCOPE.gsInterestGroup('agitating_ig').GetName]希望通过最终结算这笔债务来抹去它。"
 cr_indian_removal.3.f:0 "奇卡索民族发现自己目前处境受压，被迫服从所在州的法律。由于不了解白人的法律，他们无法理解或遵守。与其屈从这种大恶，他们宁愿在西部寻找家园，在那里按照自己的法律生活与治理。他们相信，只要有资金购买合适家园，他们就能为自己找到一处适合需求与状况的地方，因此决定出售家园，寻找新居。\n — #italic 庞托托克溪条约序言#! "
 cr_indian_removal.3.a:0 "每笔债务都必须兑现"
 cr_indian_removal.3.b:0 "有些债务比其他债务更值得兑现"

 cr_indian_removal.5.t:0 "入侵者！"
 cr_indian_removal.5.desc:0 "虽然根据#variable 卡塞塔条约#! 鼓励[SCOPE.sCountry('creek_nation').GetNameNoFlag]从[SCOPE.sState('state_of_alabama').GetName]迁出，但一些#italic 热情#! 的阿拉巴马人似乎等不及，已经开始在这片#variable “新阿拉巴马”#! 定居。\n\n所有人都清楚，这是恐吓、剥削与赤裸裸欺诈的结果，但迄今为止——无论是州政府还是联邦政府——无人出手制止。"
 cr_indian_removal.5.desc_2:0 "虽然根据#variable 卡塞塔条约#! 鼓励[SCOPE.sCountry('creek_nation').GetNameNoFlag]从[SCOPE.sState('state_of_alabama').GetName]迁出，但一些#italic 热情#! 的阿拉巴马人似乎等不及，已经开始在这片#variable “新阿拉巴马”#! 定居。\n\n所有人都清楚，这一过程是恐吓、剥削与赤裸裸欺诈的结果，但迄今为止——无论是州政府还是联邦政府——无人出手制止。"
 cr_indian_removal.5.desc_1:0 "通过卡塞塔条约，[SCOPE.sCountry('creek_nation').GetNameNoFlag]让出了[SCOPE.sState('state_of_alabama').GetName]的土地，并被#italic 鼓励#! 迁往密西西比河以西。在此之前，我们承诺防止对其领土的定居。然而现在，一些#italic 热情#! 的阿拉巴马人等不及，已经开始在这片“新阿拉巴马”定居。所有人都清楚，这一过程是恐吓、剥削与赤裸裸欺诈的结果，但迄今为止——无论是州政府还是联邦政府——无人出手制止。\n\n现在，有传言称[SCOPE.sCountry('creek_nation').GetNameNoFormatting]正在组织并武装自己……"
 cr_indian_removal.5.f_1:0 "这片土地属于红人；若我拥有这个民族曾经拥有的战士数量，我不会让一个白人留在我的土地上。我会把他们全部消灭。我可以对你说这些，因为你能理解我：你是一个人；但我不会对你的族人说。他们会叫嚷我是野蛮人，要取我性命。他们无法理解一个热爱自己国家的人的感情。\n—#italic 酋长尼马特拉对州长杜瓦尔的话#! "
 cr_indian_removal.5.f_2:0 "生命之主即将到来，将埋葬邪灵之子（白人与堕落的印第安人）。这样，整个土地才能重新完整，归于拒绝白人方式、仅从土地取所需的美德印第安人。\n — #italic 腾斯夸塔瓦的预言（1810年）#! "
 cr_indian_removal.5.a:0 "我们必须尊重与印第安人的条约"
 cr_indian_removal.5.a_tt:0 "我们将强行驱逐入侵者离开[SCOPE.sCountry('creek_nation').GetNameNoFlag]领土。"
 cr_indian_removal.5.b:0 "迁移无论如何都是必然的"
 cr_indian_removal.5.b_tt:0 "我们不会干预，定居将继续。"
 cr_indian_removal.5.b_tt2:0 "#variable 400#!  名[SCOPE.sCulture('dixie_culture').GetName]人口将定居在[SCOPE.sCountry('creek_nation').GetNameNoFlag]领土。"

 cr_indian_removal.6.t:0 "罗阿诺克大屠杀！"
 cr_indian_removal.6.desc:0 "[SCOPE.sCountry('creek_nation').GetNameNoFlag]的一群战士发动残酷袭击，入侵[SCOPE.sState('state_of_georgia').GetName]，摧毁了罗阿诺克镇。他们无情攻击守卫者，留下毁灭与死亡，然后转向附近农场与定居者家庭。甚至妇女与儿童也未能幸免，暴露了他们的野蛮程度。"
 cr_indian_removal.6.desc_2:0 "一群掠夺的[SCOPE.sCountry('creek_nation').GetNameNoFlag]战士越过边界进入[SCOPE.sState('state_of_georgia').GetName]，屠杀了罗阿诺克镇。\n\n他们焚烧、剥头皮、杀害守卫者，随后转向附近农庄与定居者家庭。看来连妇女与儿童也未能逃脱[SCOPE.sCountry('creek_nation').GetNameNoFormatting]的野蛮。"
 cr_indian_removal.6.desc_3:0 "恐慌正在[SCOPE.sState('state_of_alabama').GetName]与[SCOPE.sState('state_of_georgia').GetName]民众中蔓延……数周来[SCOPE.sCountry('creek_nation').GetNameNoFlag]的战团一直在恐吓新阿拉巴马的白人定居者，但现在他们突然越过查塔胡奇河进入佐治亚，焚烧罗阿诺克镇，剥头皮并活活烧死守卫者。\n\n随着[SCOPE.sCountry('creek_nation').GetNameNoFlag]继续他们的野蛮行径，人们匆忙筑起防御工事保护众多难民，州民兵正在动员。战争爆发已为时不远……"
 cr_indian_removal.6.f:0 "他们夺走了我们的国家，我们的先祖在坟墓中斥责我们是奴隶与懦夫。哦，穆斯科吉人！我母亲的兄弟！拂去你们眼睑上的奴隶之眠，为复仇与你们的家园而战。\n — #italic 特库姆塞对穆斯科吉人的演讲#! "
 cr_indian_removal.6.a:0 "要是我们早能预见这一切就好了……！"
 cr_indian_removal.6.a_tt:0 "看来对[SCOPE.sCountry('creek_nation').GetNameNoFormatting]的违约与持续侵占终于达到了沸点。"
 cr_indian_removal.6.b:0 "最终干预"
 cr_indian_removal.6.b_tt:0 "我们将观望结果"

 cr_indian_removal.7.t:0 "克里克迁移"
 cr_indian_removal.7.desc:0 "随着军队横扫[SCOPE.sState('state_of_alabama').GetName]，捕获叛乱与非叛乱的克里克领袖，[SCOPE.sCountry('creek_nation').GetNameNoFlag]人民的强制迁移已开始。他们被枷锁束缚、心灰意冷，向西踏上旅程，离开祖先的神圣土地。"
 cr_indian_removal.7.desc_2:0 "随着军队横扫[SCOPE.sState('state_of_alabama').GetName]，叛乱与非叛乱的[SCOPE.sCountry('creek_nation').GetNameNoFlag]领袖被捕并戴上镣铐，第一批[SCOPE.sCountry('creek_nation').GetNameNoFormatting]已开始向西之旅，远离祖先的骸骨。"
 cr_indian_removal.7.f:0 "现在纵观全局，美国政府如何安抚一个伟大民族——放下尊严，动用数千士兵、所有伟人与强大将军、所有军政力量，只为在荒野追逐一只颤抖的小兔，剥其皮，再送往西部炙热沙漠烧烤。哦，多么高贵！多么宽宏！多么尚武的成就！多么伟大的征服！多么丰厚的战利品！多么配得上美国的荣耀与伟大！\n — #italic 丹尼尔·萨宾·布特里克牧师#! "
 cr_indian_removal.7.a:0 "他们的同胞很快将加入他们……"
 cr_indian_removal.7.a_tt:0 "[SCOPE.sCountry('creek_nation').GetNameNoFormatting]迁移开始"

 cr_indian_removal.10.t:0 "新埃科塔条约"
 cr_indian_removal.10.desc:0 "多年来，[SCOPE.sState('state_of_georgia').GetName]州通过合法与非法手段致力于将[SCOPE.sCountry('cherokee_nation').GetNameNoFlag]从其领土迁出。这项工作的顶点现已提交参议院：一项正式条约，让[SCOPE.sCountry('cherokee_nation').GetNameNoFormatting]迁往密西西比河以西，只待参议院签署。\n\n然而该条约的通过远非板上钉钉。\n\n出人意料的是，[SCOPE.sCountry('cherokee_nation').GetNameNoFormatting]的首席酋长[SCOPE.sCountry('cherokee_nation').GetRuler.GetFullName] [SCOPE.sCountry('cherokee_nation').GetRuler.GetHerselfHimself]强烈谴责该条约，声称签署者仅代表少数人。这引发了公众与参议院对他们事业的强烈支持。\n\n现在，随着投票进入最后时刻，一切将取决于最后一票……"
 cr_indian_removal.10.f:0 "我们知道，有些人认为迁往密西西比河以西对我们有利。我们不这么想。我们的人民普遍不这么想……没有一个成年人认为迁徙是最好的选择……我们希望留在父辈的土地上。我们拥有完美而原始的权利，不受干扰或骚扰地居住。我们的条约与美国法律保障我们的居住权与特权，保护我们免受入侵者侵害。我们唯一的要求是履行这些条约，执行这些法律。\n — #italic 首席酋长罗斯#! "
 cr_indian_removal.10.a:0 "赞成"
 cr_indian_removal.10.a_tt:0 "[SCOPE.sCountry('cherokee_nation').GetName]将在迁移开始前获得 #variable 2年#!  的宽限"
 cr_indian_removal.10.a_tt_2:0 "请愿书中列举的冤情纯属想象；该条约是以公开、公平、荣誉的方式谈判达成的。"
 cr_indian_removal.10.b:0 "反对"
 cr_indian_removal.10.b_tt:0 "[SCOPE.sCountry('cherokee_nation').GetName]的迁移现被暂停"

 cr_indian_removal.11.t:0 "犯下大恶"
 cr_indian_removal.11.desc:0 "随着[SCOPE.sCountry('cherokee_nation').GetNameNoFlag]迁移的临近，受过教育的[SCOPE.sCulture('yankee_culture').GetName]民众中弥漫着明显的不安，他们坚决反对驱逐这些最高贵的印第安人。\n\n这一情绪在[SCOPE.sCharacter('i_am_emerson').GetFullName]致[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle|l] [ROOT.GetCountry.GetRuler.GetLastName]的公开信中得到表达，他认为[SCOPE.sCountry('cherokee_nation').GetNameNoFormatting]已超越昔日的野蛮状态，拥抱了[ROOT.GetCountry.GetAdjectiveNoFormatting]文明，因此理应在国家中拥有正当位置。"
 cr_indian_removal.11.desc_2:0 "随着[SCOPE.sCountry('cherokee_nation').GetNameNoFlag]从祖先家园迁移的日期临近，受过教育的——[SCOPE.sCulture('yankee_culture').GetName]——民众中弥漫着日益增长的不安，他们反对驱逐这些最高贵的印第安人。\n\n这一情绪或许最好体现在[SCOPE.sCharacter('i_am_emerson').GetFullName]发表的公开信中，该信致[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle|l] [ROOT.GetCountry.GetRuler.GetLastName]，其中[SCOPE.sCharacter('i_am_emerson').GetLastNameNoFormatting]认为[SCOPE.sCountry('cherokee_nation').GetNameNoFormatting]已抛弃野蛮方式，正接近我们[ROOT.GetCountry.GetAdjectiveNoFormatting]的文明水平。"
 cr_indian_removal.11.f:0 "即使在我们遥远的州，也传来了关于他们价值与文明的好消息。我们欣喜地得知他们在社会艺术上的进步。我们读过他们的报纸。我们在学校与大学见过他们中的一些人。与广大美国人民一样，我们怀着同情见证这些红人努力将自己的种族从永恒低劣的命运中拯救出来，并在部落中借用并驯化高加索种族的艺术与习俗。\n — #italic 拉尔夫·瓦尔多·爱默生#! "
 cr_indian_removal.11.a:0 "啊是的，当然……我的马在赛场上表现如何？"
 cr_indian_removal.11.option_a_tt:0 "[SCOPE.sCharacter('i_am_emerson').GetFullName]将发起[concept_political_movement]以推行[GetLawType('law_no_colonial_affairs').GetName]"
 cr_indian_removal.11.b:0 "我认为这是最受欢迎的情绪"
 cr_indian_removal.11.b_tt:0 "[SCOPE.sCharacter('i_am_emerson').GetFullName]将在我们的支持下发起[concept_political_movement]以推行[GetLawType('law_no_colonial_affairs').GetName]"
 cr_indian_removal.11.c:0 "审查员来救援"
 cr_indian_removal.11.c_tt:0 "此选项因我们的[GetLawGroup('lawgroup_free_speech').GetName]法律而可用"
 cr_indian_removal.11.d:0 "最不受欢迎的情绪"
 cr_indian_removal.11.d_tt:0 "此选项因我们[concept_leader]或政府中[concept_interest_group]的[concept_ideology]而可用"
 cr_indian_removal.11.option_b_c_tt:0 "[SCOPE.sCharacter('i_am_emerson').GetFullName]将被移除，且他不会发起[concept_political_movement]以推行[GetLawType('law_no_colonial_affairs').GetName]"

 cr_indian_removal.12.t:0 "约翰·罗斯的抗议请愿书"
 cr_indian_removal.12.d:0 "[SCOPE.sCountry('cherokee_nation').GetNameNoFlag]的酋长[SCOPE.sCountry('cherokee_nation').GetRuler.GetFullName]再次返回[SCOPE.sCountry('cr_removing_country').GetCapital.GetCityHubName]。这一次，他带来了一份请愿书，要求国会废除#variable 新埃科塔条约#!  ，该条约迫使[SCOPE.sCountry('cherokee_nation').GetNameNoFormatting]民族迁往密西西比河以西。\n\n他的请愿书签名人数几乎与东部切罗基全部人口相当。"
 cr_indian_removal.12.f:0 "“根据该条约的规定，我们被剥夺了自由的一切属性。我们的财产可能在我们眼前被掠夺；暴力可能施加在我们身上，甚至我们的生命可能被夺走，却无人理会我们的申诉。我们被剥夺了国家身份；我们被剥夺了选举权。我们被剥夺了人类家庭的成员资格！”"
 cr_indian_removal.12.a:0 "条约就是条约。我们不能撤销已签署的内容。"
 cr_indian_removal.12.a_tt:0 "[SCOPE.sCountry('cherokee_nation').GetNameNoFormatting]迁移将按计划进行"
 cr_indian_removal.12.b:0 "我们的良知迫使我们废除迁移条约。"
 cr_indian_removal.12.b_tt:0 "我们将需要与[SCOPE.sCountry('cherokee_nation').GetName]重新谈判新的迁移条约"

 cr_indian_removal.15.t:0 "切罗基迁移"
 cr_indian_removal.15.desc:0 "随着#variable 新埃科塔条约#!  授予的宽限期到期，[SCOPE.sCountry('cherokee_nation').GetNameNoFlag]必须开始向西迁徙。\n无论他们准备得多么不足。"
 cr_indian_removal.15.f:0 "切罗基人！\n美国总统已派遣我率领强大军队，根据1836年条约，命令你们服从，加入已在密西西比河彼岸安居乐业的同胞。不幸的是，给予你们的两年的准备时间已白白流逝，你们既未跟随，也未做任何准备。现在，或在本庄严声明到达你们遥远定居点之时，迁移必须匆忙开始，但我希望不会失序。我无权再延长宽限，以纠正你们犯下的错误。五月的满月已开始亏缺，在下一次满月消逝之前，这些州中的每一位切罗基男人、女人和儿童都必须动身，前往遥远的西部加入他们的兄弟。\n — #italic 斯科特少将#! "
 cr_indian_removal.15.f_2:0 "那片笼罩我故土的阴云与威胁的风暴，似乎已蓄势待发，即将爆发。在这可怕的危机中，我们只能将命运交托给那位‘驾驭风暴、乘风而行’的主宰。\n — #italic 致孟菲斯询问报的信#! "
 cr_indian_removal.15.a:0 "快走吧"
 cr_indian_removal.15.a_tt:0 "[SCOPE.sCountry('cherokee_nation').GetName]迁移将正式开始"

 cr_indian_removal.20.t:0 "戴德大屠杀"
 cr_indian_removal.20.desc:0 "来自[SCOPE.sState('state_of_florida').GetName]的可怕消息：一支100人的军队纵队遭到[SCOPE.sCharacter('miconapy').GetLastName]伏击，几乎全军覆没！\n\n与此同时，我们负责监督[SCOPE.sCountry('seminole_nation').GetNameNoFlag]迁移的特派员被[SCOPE.sCharacter('osceola').GetLastName]杀害！"
 cr_indian_removal.20.f_1:0 "白人休想让我变黑。我要让白人血流成河，染红大地……然后在阳光与雨水中让他变黑……秃鹫将啄食他的肉。\n—#variable 奥塞奥拉#! "
 cr_indian_removal.20.f_2:0 "政府是错的，这正是印第安人顽强抵抗的主要原因，他们英勇捍卫家园，反对我们强行执行欺诈性条约。原住民用尽一切手段避免战争，却被政府的暴政逼入战火。\n—#variable 伊桑·艾伦·希区柯克少校#! "
 cr_indian_removal.20.a:0 "开战！天杀的！"
 cr_indian_removal.20.a_tt:0 "与[SCOPE.sCountry('seminole_nation').GetName]开战"
 cr_indian_removal.20.b:0 "或许我们本该更策略一些？"
 cr_indian_removal.20.b_tt:0 "我们将不再强行推进[SCOPE.sCountry('seminole_nation').GetNameNoFormatting]的迁移"

 cr_indian_removal.21.t:0 "命运攸关的会面"
 cr_indian_removal.21.desc:0 "在我们的军事战役无情压力下，[SCOPE.sCountry('seminole_nation').GetNameNoFlag]领袖[SCOPE.sCharacter('micanopy_scope').GetLastName]酋长打着白旗接近[SCOPE.sCharacter('florida_general').GetLastName]将军，表示愿意谈判和平条约。认识到长期抵抗已无可能，[SCOPE.sCharacter('micanopy_scope').GetLastNameNoFormatting]表达了愿意带领自己及其族人迁往西部的意愿。"
 cr_indian_removal.21.desc_2:0 "随着[SCOPE.sCountry('seminole_nation').GetNameNoFlag]在我们武力打击下动摇，并看到进一步抵抗的徒劳，酋长[SCOPE.sCharacter('micanopy_scope').GetLastName]已向[SCOPE.sCharacter('florida_general').GetLastName]将军表示愿意签署和平条约，并带领其族人向西迁移。"
 cr_indian_removal.21.f_1:0 "只有消灭他们，国家才能摆脱他们。\n—#italic 托马斯·杰瑟普将军论塞米诺尔人#! "
 cr_indian_removal.21.a:0 "抓住他，把这事了结"
 cr_indian_removal.21.a_tt:0 "[SCOPE.sCharacter('micanopy_scope').GetLastName]不再是[SCOPE.sCountry('seminole_nation').GetName]的领袖"
 cr_indian_removal.21.a_tt_2:0 "我们在[SCOPE.sState('state_of_florida').GetName]夺取部分土地"
 cr_indian_removal.21.b:0 "真诚接受他的投降"
 cr_indian_removal.21.b_tt_1:0 "[SCOPE.sCountry('seminole_nation').GetNameNoFormatting]抵抗将减弱，但持续时间更长"

 cr_indian_removal.29.t:0 "[SCOPE.sCountry('seminole_nation').GetNameNoFormatting]的命运"
 cr_indian_removal.29.desc:0 "随着与[SCOPE.sCountry('seminole_nation').GetNameNoFlag]的战争逐渐结束，无谓的流血画上句号，是时候决定如何对待佛罗里达剩余的[SCOPE.sCulture('muskogean_people').GetName]了。"
 cr_indian_removal.29.f_1:0 "若你们……拒绝迁移，我已指示指挥官以武力将你们迁走。\n—#italic 安德鲁·杰克逊总统对塞米诺尔人的讲话#! "
 cr_indian_removal.29.a:0 "目标始终是彻底迁移"
 cr_indian_removal.29.a_tt:0 "[SCOPE.sCountry('seminole_nation').GetName]将被迁往西部"
 cr_indian_removal.29.b:0 "削弱后，少数残余构不成威胁"
 cr_indian_removal.29.b_tt:0 "[SCOPE.sCountry('seminole_nation').GetName]的大多数将被迁往西部，但一小部分人口将留在[SCOPE.sState('state_of_florida').GetName]"
 cr_indian_removal.29.complete_tt:0 "这将完成#variable [SCOPE.sCountry('seminole_nation').GetName]迁移#! 目标"

 cr_indian_removal.30.t:0 "占地者！"
 cr_indian_removal.30.desc:0 "不愿等待[SCOPE.sCountry('cr_intruded_country').GetNameNoFormatting]迁移开始、他们在[SCOPE.sState('cr_squatter_state').GetName]的土地向定居开放，各路有心人已开始擅自进入印第安土地，插标圈地。"
 cr_indian_removal.30.f:0 "为什么这些印第安人能独占这么多土地？你看到这片黏土了吗？想象一下我们能种什么；想象一下我们能在这里建什么！可印第安人却让土地荒废。"
 cr_indian_removal.30.f_2:0 "我们还能怎么办？家乡几乎找不到足够养活自己的土地——更别说养家糊口——好地全被[SCOPE.gsInterestGroup('planters').GetNameNoIcon]占了。可这里，在这片新[SCOPE.sState('cr_squatter_state').GetNameNoFormatting]，土地既多又肥沃。在这里能开创未来。"
 cr_indian_removal.30.f_3:0 "切罗基人也遭到擅自进入他们土地的白人民众的恐吓与殴打。有一次，布特里克看到三个醉酒白人追赶一群切罗基人靠近他家。那群暴徒殴打了一个名叫扬·土耳其的切罗基人。扬·土耳其反击一人后与同伴逃跑，暴徒追赶。白人‘骑马全力追赶，咒骂着要杀死其中一个印第安人’时被布特里克发现。切罗基人逃进布特里克的‘门前院子’。布特里克拒绝让追捕者进入；最终，他的一位熟人劝走了暴徒。"
 cr_indian_removal.30.f_4:0 "我五岁时，正在前院玩耍，突然来了一辆马车，陌生人命令所有人上车。他们让我把玩具扔在泥土里，马车开走时，一个白人男孩——新家的儿子——已经在玩我的玩具。\n—#italic 一位乔克托长老#! "
 cr_indian_removal.30.a_tt:0 "我们将强行驱逐入侵者离开[SCOPE.sCountry('cr_intruded_country').GetNameNoFlag]领土。"
 cr_indian_removal.30.b:0 "[SCOPE.sCountry('cr_intruded_country').GetNameNoFormatting]迁移无论如何都是必然的"

 cr_indian_removal.31.t:0 "报纸剪报"
 cr_indian_removal.31.desc:0 "[SCOPE.sState('newspaper_state').GetCityHubName]论坛报与[SCOPE.sState('newspaper_state').GetFarmHubName]公报正在展开激烈争论，主题是[SCOPE.sCountry('cr_noble_savages').GetNameNoFlag]是否真正算得上文明。"
 cr_indian_removal.31.desc_2:0 "[SCOPE.sState('newspaper_state').GetCityHubName]一家报纸巧妙列举了[SCOPE.sCountry('cr_noble_savages').GetNameNoFlag]在农业、教育与政府方面的成就，嘲笑了南方关于他们野蛮的说法。"
 cr_indian_removal.31.desc_3:0 "[SCOPE.sState('newspaper_state').GetName]一家报纸发表了对我们印第安迁移政策的猛烈抨击。"
 cr_indian_removal.31.desc_4:0 "[SCOPE.sState('newspaper_state').GetCityHubName]日报在一系列广为流传的文章中承诺支持印第安迁移，认为这是唯一在[SCOPE.sCulture('dixie_culture').GetName]投机者、占地者与传教士持续侵蚀下保护[SCOPE.sCountry('cr_noble_savages').GetNameNoFlag]生活方式的途径。"
 cr_indian_removal.31.f:0 "[SCOPE.sState('newspaper_state').GetFarmHubName]公报指责[SCOPE.sCountry('cr_noble_savages').GetNameNoFormatting]缺乏农业成就，认为他们如同儿童，受原始情感与欲望驱使，无法从事复杂任务。[SCOPE.sState('newspaper_state').GetCityHubName]论坛报则嘲笑此说，指出他们的孩子广泛进入教会学校、基督教被普遍接受。"
 cr_indian_removal.31.f_2:0 "[SCOPE.sCountry('cr_noble_savages').GetNameNoFormatting]如今拥有8万头家畜、750台织机、2500台纺车、3000把犁、10座锯木厂、31座磨坊、62间铁匠铺、8台轧棉机、10所学校、9条收费公路与20条公共道路。他们拥有印刷机、周报与国家学院。真是野蛮人啊！"
 cr_indian_removal.31.f_3:0 "随着[SCOPE.sState('landgrab_state').GetNameNoFormatting]州进行自巴比伦流亡以来最大的土地掠夺，现在是每一个基督徒、慈善家与爱国者在美国竭尽全力拯救受迫害、无力自保的人民免于毁灭的时候了。\n—#italic [SCOPE.sState('newspaper_state').GetCityHubName]日报#! "
 cr_indian_removal.31.f_4:0 "若我们不通过将他们迁往密西西比河以东的专属领土来拯救他们，很快密西西比河两岸都不会再有[SCOPE.sCountry('cr_noble_savages').GetNameNoFormatting]了。\n—#italic 传教先驱报#! "
 cr_indian_removal.31.f_5:0 "若对原住民殖民地行使家长式权威，并确立与执行公正的交往原则，我们或许能看到他们状况的改善，这是我们长久以来徒劳期盼的。\n—#italic 密歇根州长刘易斯·卡斯#! "
 cr_indian_removal.31.a:0 "迁移是白人的罪过"
 cr_indian_removal.31.b:0 "[SCOPE.sCountry('cr_noble_savages').GetNameNoFormatting]迁移无论如何都是必然的"
 cr_indian_removal.31.c:0 "只要报纸卖得好，谁在乎"
 cr_indian_removal.31.c_tt:0 "此选项因[SCOPE.gsInterestGroup('industrialists').GetName]在政府中而可用"

 cr_indian_removal.33.t:0 "大学辩论"
 cr_indian_removal.33.desc:0 "[SCOPE.sState('university_state').GetCityHubName]大学的辩论社团最近只关注一件事：印第安迁移。\n\n双方人数相当、口才与说服力不相上下，辩论似乎将取决于最后的总结陈词……"
 cr_indian_removal.33.desc_2:0 "印第安迁移问题已成为[SCOPE.sState('university_state').GetCityHubName]州立大学毕业辩论的焦点。\n\n双方你来我往同样雄辩而有说服力，最终胜出的论点是……"
 cr_indian_removal.33.f:0 "迁移侵犯了印第安人神圣而不可剥夺的权利，也违背了我们国家的誓言与荣誉，在美国品格上留下时间无法抹去的污点。世人的指责之指将从臭名昭著的瓜分波兰转向美国……"
 cr_indian_removal.33.f_2:0 "印第安人被教导蔑视死亡，一生视死如归。印第安人极少自杀，不是因为坟墓不能提供庇护，而是因为耐心与坚韧是战士的首要职责，只有懦夫才会屈服于痛苦或不幸……他也学会蔑视劳动，成为战士与猎人，将任何其他职业视为耻辱，把日常生活的所有职责留给妇女。他是个严厉而不屈的宿命论者。无论好坏，他都以平静接受。若不幸压顶而无法抵抗，他可以死去，而且毫无怨言地死去。\n—#italic 密歇根州长刘易斯·卡斯#! "
 cr_indian_removal.33.f_3:0 "卢梭及其学派弟子以病态的想象与不安的理性，或许说服自己相信文明生活不如野蛮生活；但放眼我们国家的森林，看那些在林中游荡的可怜生灵，就会明白他们承受了多少我们免受的苦难。很难想象人类任何一支会比他们更缺乏远见、更不节俭享受、更不勤劳获取、更记仇、更难以控制激情、更少指导原则、更少约束义务、更少知识来改善与教导自己。\n—#italic 密歇根州长刘易斯·卡斯#! "
 cr_indian_removal.33.f_4:0 "虽然征服墨西哥与秘鲁半文明帝国的行为是明显的篡夺与残暴不义，但在北美建立法国与英国殖民地完全合法；殖民者并未违背自然法原则，将原住民限制在更狭窄的范围内。\n—#italic 詹姆斯·肯特《美国法释义》#! "
 cr_indian_removal.33.a:0 "……让每一位爱国者以诚实的愤怒发声！"
 cr_indian_removal.33.b:0 "……让新闻的道德力量集结起来对抗这一可耻而毁灭性的政策！"
 cr_indian_removal.33.c:0 "……#italic 再等一小会儿#! ，他们就会被赶出我们的掌控！"

 cr_indian_removal.34.t:0 "[SCOPE.sState('female_missionary_state').GetCityHubName]传教妇女会"
 cr_indian_removal.34.desc:0 "受社会强加的严格性别规范限制，[SCOPE.sState('female_missionary_state').GetName]的女性在慈善捐助与教派报纸中找到了抱负的出口，这些报纸平等宣传她们与男性的成就。"
 cr_indian_removal.34.desc_2:0 "受社会性别规范束缚，[SCOPE.sState('female_missionary_state').GetName]的女性在慈善捐助与教派报纸中找到了抱负的出口，她们的成就与男性并列闪耀。"
 cr_indian_removal.34.desc_sub_1:0 "\n\n受保护[SCOPE.sCountry('female_missionary_target').GetNameNoFlag]生活方式、免遭迁移的愿望驱动，这些女性承担起赞助学校与传教活动的重任，旨在扩展基督教文明的影响，在逆境中提供希望之光。"
 cr_indian_removal.34.desc_sub_2:0 "\n\n近几个月，她们组织慈善募捐，收集食物、布料、文具、书籍与资金，专用于教育[SCOPE.sCountry('female_missionary_target').GetNameNoFlag]青年，怀着热忱希望将美国文明的好处带给需要之人。"
 cr_indian_removal.34.desc_sub_3:0 "\n\n这些女性违抗社会规范，反驳南方关于野蛮的说法，在突出[SCOPE.sCountry('female_missionary_target').GetNameNoFlag]社会进步中找到使命。"
 cr_indian_removal.34.desc_sub_3_2:0 "\n\n[SCOPE.sState('female_missionary_state').GetCityHubName]妇女会对[SCOPE.sCountry('female_missionary_target').GetNameNoFlag]的社会进步特别关注；通过刊登表格反驳南方野蛮论调，例如列出[SCOPE.sCountry('female_missionary_target').GetNameNoFormatting]的学校与学生数量、广泛农业与商业活动。"
 cr_indian_removal.34.f:0 "“我们的工资是谁付的？”天真的记者问。\n“信不信由你，几乎一半捐款来自女性……”编辑透露。\n“女性？”如今消息更灵通的记者回应，“女性付我们的工资？！”\n“看来是的，”编辑确认，语气中仍带一丝惊奇。"
 cr_indian_removal.34.f_2:0 "白人与印第安部落交往的历史在我们祖先与国家品格上留下了许多污点。"
 cr_indian_removal.34.a:0 "她们真是高尚"
 cr_indian_removal.34.b:0 "她们就不能把注意力转向我们自己的人民吗？"
 cr_indian_removal.34.c:0 "感谢上帝她们没问那些棘手问题"
 cr_indian_removal.34.c_tt:0 "一位#variable 女权主义#! 女性煽动者将在[SCOPE.sCountry('cr_removing_country').GetNameNoFlag]出现"
 cr_indian_removal.34.d:0 "建议她们找一个更#italic 合适#! 的职业"
 cr_indian_removal.34.d_tt:0 "此选项因我们限制性的#variable 言论自由#! 法律而可用"

 cr_indian_removal.35.t:0 "土地专利"
 cr_indian_removal.35.desc:0 "当[SCOPE.sCountry('choctaw_nation').GetNameNoFlag]同意向西迁移时，条约包含一项条款：希望留下的人可在[SCOPE.sState('state_of_mississippi').GetName]居住，五年后将获得所占土地的专利。\n\n五年期限已过，远超当初登记人数的[SCOPE.sCountry('choctaw_nation').GetNameNoFormatting]现纷纷提出此类权利主张。"
 cr_indian_removal.35.f:0 "我理解华盛顿希望登记的[SCOPE.sCountry('choctaw_nation').GetNameNoFormatting]越少越好。\n—#italic 迁移特派员#! "
 cr_indian_removal.35.a:0 "若不在登记簿上，就没有权利"
 cr_indian_removal.35.a_tt:0 "留在[SCOPE.sState('state_of_mississippi').GetNameNoFormatting]的[SCOPE.sCountry('choctaw_nation').GetNameNoFormatting]将被迁往西部"
 cr_indian_removal.35.b:0 "清理这烂摊子会相当头疼"

 cr_indian_removal.36.t:0 "缺失的页面"
 cr_indian_removal.36.desc:0 "在我们试图理清[SCOPE.sCountry('choctaw_nation').GetNameNoFlag]留在[SCOPE.sState('state_of_mississippi').GetName]应得的土地专利乱局时，发现土地登记册多页缺失，或许暗示着某种阴暗勾当。"
 cr_indian_removal.36.f:0 "第321页，全是[SCOPE.sCulture('dixie_culture').GetNameNoFormatting]。\n第322页，也全是[SCOPE.sCulture('dixie_culture').GetNameNoFormatting]。\n第323页，三位[SCOPE.sCountry('choctaw_nation').GetNameNoFormatting]，其余[SCOPE.sCulture('dixie_culture').GetNameNoFormatting]。\n第324页，缺失。\n第325页，缺失。\n第326页，又全是[SCOPE.sCulture('dixie_culture').GetNameNoFormatting]。"
 cr_indian_removal.36.a:0 "官僚体系已被渗透？"
 cr_indian_removal.36.b:0 "这种事时有发生"

 cr_indian_removal.37.t:0 "[SCOPE.sCountry('choctaw_nation').GetNameNoFormatting]土地凭证"
 cr_indian_removal.37.desc:0 "在我们处理[SCOPE.sCountry('choctaw_nation').GetNameNoFlag]土地专利分配时，发现承诺的土地大多已被他人定居。为避免驱逐这些定居者，提出以凭证替代：让[SCOPE.sCountry('choctaw_nation').GetNameNoFormatting]用凭证在别处换取土地。\n然而，有人推动凭证仅在他们跨越密西西比河后才生效，实际上将他们逐出[SCOPE.sState('state_of_mississippi').GetName]。"
 cr_indian_removal.37.desc_2:0 "在我们试图解决[SCOPE.sCountry('choctaw_nation').GetNameNoFlag]土地专利时，发现几乎所有承诺土地早已被他人购买并占据。\n为防止这些定居者被剥夺土地，提出以凭证替代：让[SCOPE.sCountry('choctaw_nation').GetNameNoFormatting]用凭证在别处换取土地。\n\n一些更具创业精神的人建议凭证仅在他们跨越密西西比河后才可交易。"
 cr_indian_removal.37.f:0 "乔克托凭证的墨迹玷污纸页，见证了我们祖先土地的持续侵蚀与空洞条约的背叛。这所谓的补偿象征只是嘲弄我们的困境，以空洞姿态换取我们家园无可替代的丧失。我们不是乞求施舍的乞丐，而是比记忆更古老的遗产守护者，理应得到尊重与承认。"
 cr_indian_removal.37.a:0 "那是合法的[SCOPE.sCountry('choctaw_nation').GetNameNoFormatting]土地"
 cr_indian_removal.37.a_tt:0 "我们将驱逐[SCOPE.sCulture('dixie_culture').GetNameNoFormatting]占地者离开[SCOPE.sCountry('choctaw_nation').GetNameNoFormatting]土地"
 cr_indian_removal.37.b:0 "我们将发行密西西比河#variable 以东#! 的土地凭证"
 cr_indian_removal.37.c:0 "我们将发行密西西比河#variable 以西#! 的土地凭证"

 cr_indian_removal.40.t:0 "论印第安政策的失败"
 cr_indian_removal.40.desc:0 "在[SCOPE.sState('frontier_state').GetCityHubName]，一篇全面支持印第安迁移的文章问世，认为这是保护原住民生存的唯一手段。"
 cr_indian_removal.40.desc_sub:0 "\n\n在审视过去文明化与保护印第安社群的种种尝试后，作者得出沉重结论：在文明无情推进面前，迁移是唯一可行出路。"
 cr_indian_removal.40.desc_2:0 "[SCOPE.sState('frontier_state').GetName]的[SCOPE.sState('frontier_state').GetCityHubName]发表了一篇广泛支持印第安迁移的长文。"
 cr_indian_removal.40.desc_sub_2:0 "\n\n在仔细考量所有为文明化与保存印第安人所做的努力及其失败后，作者清醒得出结论：迁移是文明推进下保存印第安人存在的唯一途径。"
 cr_indian_removal.40.desc_3:0 "[SCOPE.sState('frontier_state').GetName]发表长文支持印第安迁移，指出所有保存与改善印第安人的尝试均告失败；即使与文明人接触两世纪，也未改善处境、引入最基本的生活技艺，最终得出清醒结论：迁移是保存他们存在的唯一方式"
 cr_indian_removal.40.f_1:0 "许多人在我们的教育机构接受精心教导，希望他们能习得道德原则与勤劳习惯，并以身作则激励同胞走上更好道路。传教站在各部落建立，热忱虔诚之人慷慨投身教导农业与机械技艺以及道德与宗教原则……不幸的是，它们也成为失败与无果努力的纪念碑。哪个部落因这些金钱、劳动与关怀的投入而文明化了？——我一个也不知道。\n—#italic 密歇根州长刘易斯·卡斯#! "
 cr_indian_removal.40.f_2:0 "当文明之光照耀他们时，为何他们对光芒视而不见？饥饿或赤身裸体时，为何他们忽视或拖延那些能获取食物与衣物的技艺？\n—#italic 密歇根州长刘易斯·卡斯#! "
 cr_indian_removal.40.f_3:0 "他们满足于现状；不仅满足，还以死命抓住自己的制度。这种从小灌输、成年强化、老年滋养的情感，使他们对劝说或责难充耳不闻。自由漫游森林、追逐猎物、攻击敌人、余生懒散度日、有食暴食、无食忍耐、随时准备赴死；这些是印第安人的主要职业。\n—#italic 密歇根州长刘易斯·卡斯#! "
 cr_indian_removal.40.a:0 "真是一位智者"
 cr_indian_removal.40.b:0 "最适合#italic 边疆生活#! 的情绪"

 cr_indian_removal.41.t:0 "印第安改善协会"
 cr_indian_removal.41.desc:0 "在印第安迁移必要性的争论中，[SCOPE.sState('indian_society_state').GetName]的倡导者热情捍卫此事业，认为这是保护原住民未来的唯一手段。\n\n他们支持向西迁移的理念，向任何选择西迁的印第安人提供支持与协助，相信这是保存其文化与福祉的最佳希望。"
 cr_indian_removal.41.desc_2:0 "随着印第安迁移必要性争论激烈进行，来自[SCOPE.sState('indian_society_state').GetName]的几位支持者联合推广此理念，承诺协助任何希望西迁的印第安人。"
 cr_indian_removal.41.f_1:0 "我需要停下来证明，在部落处于我们州内的情况下，彻底重塑印第安性格、将其改造成文明形态是多么不切实际吗？哪里有任何一个部落完成这种转变的例子？我一个也不知道。但我知道许多例子，即便付出最不懈的努力，印第安人也……消失了。\n—#italic 托马斯·L·麦肯尼上校#! "
 cr_indian_removal.41.f_2:0 "好人之间对如何保存与改善印第安人的看法存在分歧是自然的。我们知道有好人反对印第安人迁移。我们尊重他们及其动机。他们寻求拯救与文明化这些人。我们宣称目标相同，仅在方式上不同。\n—#italic 托马斯·L·麦肯尼上校#! "
 cr_indian_removal.41.f_3:0 "我们相信，若印第安人不迁移、不逃离他们自身固有的、过去已证明极具破坏性的原因，#italic 他们将灭亡#! 。尽管我们基于亲身调查得出的结论，我们或许会怀疑自己，但经验证实了它们。唉！正是经验的告诫胜过一切，敦促我们用一切荣誉手段说服这些不幸之人接受向他们提出的政策。\n—#italic 托马斯·L·麦肯尼上校#! "
 cr_indian_removal.41.f_4:0 "有些人认为印第安人反对迁移，并打算使用武力强迫他们离开。关于我们州内大多数印第安人的意愿，我们可以负责任地说，他们渴望迁移。目前的激动情绪很大程度上是由那些希望印第安人留在原地的人的反对引起的。\n—#italic 托马斯·L·麦肯尼上校#! "
 cr_indian_removal.41.a:0 "他们用心良苦"
 cr_indian_removal.41.b:0 "不错的#italic 本地#! 倡议"
 cr_indian_removal.41.b_tt:0 "此选项因我们限制性的#variable 言论自由#! 法律而可用"
 
 # O what a year this has been! O what a sweeping wind has gone over, and carried its thousands to the grave; while thousands have been tortured and scarcely survive, and the whole nation, comparatively thrown out of house and home during this dreary winter. And why? ...For what crime then was this whole nation doomed to perpetual death? -#italic Rev. Daniel Sabin Butrick#! 
 # a number of Georgia citizens near New Echota took sixteen Cherokees and drove them to the fort and then requested permission of General Scott to take them out and whip them, though in this they were not gratified -#italic Rev. Daniel Sabin Butrick#!  The citizens of Georgia pressured Scott to move with even more expediency.
 #Incredibly, neither Gibson nor the Secretary of War had thought to provide a physician, or even medicine. Armstrong wrote: "I have as yet employed no physician: to-day an Indian broke his leg, and we will of course have to leave him. We have no medicine but what belongs to private individuals: it is now too late to hear from the department, but I consider it very necessary that we should have medical aid: where there are two thousand Indians, with the wagoners, and those attached to the emigration, at least a physician could have been employed. -#italic William Armstrang#! , removal agent
 # "The dark cloud and threatening storm, which, for some time past, have been gathering over my native land, seem now to be full charged and on the eve of exploding. In this awful crisis, we can but resign our destiny into the hands of Him who directs the storm and rides upon the whirlwind. -#italic Letter to the Memphis Enquirer#! "

 

 cr_indian_removal.49.t:0 "离别的回响"
 cr_indian_removal.49.desc:0 "随着[SCOPE.sCountry('target_of_removal').GetNameNoFlag]从[SCOPE.sState('removed_from_state').GetName]的迁移接近完成，他们曾经生机勃勃的社区如今回荡着离别的寂静，祖先家园默默见证着这场强制流离的篇章。"
 cr_indian_removal.49.t_2:0 "漫长的西行之路"
 cr_indian_removal.49.desc_2:0 "[SCOPE.sState('removed_from_state').GetName]最后的[SCOPE.sCountry('target_of_removal').GetNameNoFlag]已开始漫长的西行之旅，留下空旷的土地供[SCOPE.sCountry('cr_removing_country').GetAdjectiveNoFormatting]定居。"
 cr_indian_removal.49.f:0 "我看到无助的切罗基人被逮捕，从家中拖走，用刺刀逼进围栏。在细雨的寒意中，我看到他们像牛羊一样被装进马车，向西出发……我们遭遇了可怕的雨夹雪与冰冻气温，从那天起直到这场命运之旅结束，切罗基人的苦难令人心碎。流放者的足迹是一条死亡之路。他们只能睡在马车里或地上，没有火取暖。我知道一夜之间有多达二十二人因肺炎死去，只因虐待、寒冷与暴露……\n—#italic 约翰·G·伯内特列兵#! "
 cr_indian_removal.49.f_2:0 "切罗基人几乎全被囚禁。他们被从家中拖走，关进全国各地的堡垒与军营。尤其在佐治亚，他们普遍遭受最无情与侮辱性的对待。许多人甚至没时间带走任何东西，只穿着身上的衣服。\n—#italic 埃文·琼斯牧师#! "
 cr_indian_removal.49.f_3:0 "印第安人带着家人同行；他们身后跟着伤员与病患、新生儿与垂死老人。他们既无帐篷也无马车，只有武器与少量食物。我看到他们登上渡舟，跨越浩瀚大河，这一庄严景象永不会从我记忆中消逝。人群中没有哭喊，没有啜泣：一片寂静。他们的苦难由来已久，他们知道这些苦难无可挽回。印第安人全部登上运送他们的船，但他们的狗留在岸边。一旦这些动物察觉主人终于离开岸边，它们发出凄厉嚎叫，一起跃入冰冷的密西西比河水，追随船只游去。\n—#italic 阿历克西·德·托克维尔，《美国的民主》#! "
 cr_indian_removal.49.f_4:0 "难以想象这些强制移民带来的苦难程度。他们已精疲力竭、人口锐减，而他们前往的新土地已被其他部落占据，这些部落以嫉妒的敌意迎接他们。饥饿在身后追赶，战争在前方等待，苦难从四面八方包围他们。\n—#italic 阿历克西·德·托克维尔，《美国的民主》#! "
 cr_indian_removal.49.f_5:0 "在田间劳作的男人被逮捕，刺刀逼进围栏。妇女被士兵从家中拖走，她们听不懂士兵的语言。儿童常被与父母分开，用天空作毯、大地作枕赶进围栏。老人与病弱者常被刺刀催促加快脚步赶往围栏。\n—#italic 约翰·G·伯内特列兵#! "
 cr_indian_removal.49.f_6:0 "正午，一切准备就绪开始迁移。马车队沿穿过茂密森林的道路排成一列，每辆马车周围聚着人群……就在此刻，远处传来低沉的雷声——几乎正西方，一团黑暗螺旋云从地平线升起，发出低语，我几乎以为那是上天为我可怜不幸同胞的冤屈发出的神圣愤怒之声……雷声渐远，似乎在远处沉寂。\n—#italic 威廉·肖里·库迪#! "
 cr_indian_removal.49.f_7:0 "哦，这是多么可怕的一年！多么猛烈的风暴席卷而来，将数千人带进坟墓；数千人受尽折磨，勉强存活，整个民族在凄惨的冬日几乎被逐出家园与住所。为什么？……究竟犯下何罪，整个民族被判处永恒的死亡？\n—#italic 丹尼尔·萨宾·布特里克牧师#! "
 cr_indian_removal.49.f_8:0 "我从未见过如此非凡的景象……这支庞大的印第安迁徙队伍，数千人，伴随政府马车队与众多马匹……男人身着完整印第安服饰，头裹艳丽头巾如阿拉伯人般骑马飞驰，许多人拥有我见过最英俊的面容与身姿……年轻女子面容异常温和柔美，衣着与举止格外端庄。"
 cr_indian_removal.49.f_9:0 "你们的父亲已为你们所有人准备了一片足够大的土地，他建议你们迁往那里。在那里，你们的白人兄弟不会再打扰你们：他们对土地无权，你们与子孙后代可永远安居乐业，只要青草生长、河水奔流，享有和平与富足。那将永远属于你们。\n—#italic 安德鲁·杰克逊总统#! "

 cr_indian_removal.49.desc_creek_defeated:0 "在失败的叛乱与随后领袖被捕后，剩余的[SCOPE.sCountry('target_of_removal').GetNameNoFlag]已告别[SCOPE.sState('state_of_alabama').GetName]，标志着他们的迁移完成。\n\n他们背负历史重担，前往西部开创未知的新未来，留下先祖遗骨，踏入茫茫前路。"

 cr_indian_removal.49.a:0 "这是一条泪水之路"
 cr_indian_removal.49.a_tt:0 "[SCOPE.sState('indian_removal_state').GetStateRegion.GetName]的[SCOPE.sCountry('target_of_removal').GetName]已被迁往西部"

 cr_indian_removal.50.t:0 "[SCOPE.sState('swampy_state').GetName]的道路与沼泽"
 cr_indian_removal.50.desc:0 "[SCOPE.sState('swampy_state').GetName]茂密的沼泽曾被视为迅捷交通的不可逾越屏障，如今见证了一场壮观迁徙：数百名[SCOPE.sCountry('target_of_removal').GetNameNoFlag]印第安人涉过浑浊水域，悲怆地证明了印第安迁移的剧变。"
 cr_indian_removal.50.desc_e:0 "[SCOPE.sState('swampy_state').GetName]的沼泽长期被视为迅捷交通的不可逾越障碍，但如今数千印第安人毫无阻碍地穿越其中，这一说法正受到挑战。"
 cr_indian_removal.50.desc_2:0 "[SCOPE.sState('swampy_state').GetName]的道路长期困扰所有旅人，但数千印第安人沿路迁移导致道路严重损毁，几乎无法通行。"
 cr_indian_removal.50.f:0 "若一群印第安人（男女老少）带着约200匹小马能在两三天内穿越密西西比沼泽，我们看不出有何正当理由不能定期运送邮件。\n—#italic 致阿肯色公报的信#! "
 cr_indian_removal.50.a:0 "系统中某处存在渎职与管理失当"
 cr_indian_removal.50.a_tt:0 "该修正将持续15年，或直到“改善基础设施”法令生效至少6个月。"

 cr_indian_removal.51.t:0 "散兵游勇"
 cr_indian_removal.51.desc:0 "在我们努力将[SCOPE.sCountry('target_of_removal').GetNameNoFlag]从[SCOPE.sState('cr_cleared_state').GetName]迁出时，许多印第安人逃入荒野，建立远离我们掌控的新社区。"
 cr_indian_removal.51.desc_2:0 "在我们努力清除[SCOPE.sCountry('target_of_removal').GetNameNoFlag]并将其迁往西部时，许多印第安人从网中溜走。\n\n他们逃入荒野，如今在那里建立新的[SCOPE.sCountry('target_of_removal').GetNameNoFormatting]社区，远离我们掌控。"
 cr_indian_removal.51.f:0 "经过三周最艰苦疲惫的任务，四处搜山、步行探查任何有印第安人传闻的地点，我们仍未能发现一人。他们持续的警觉、对地形的完美了解以及营地间快速传递情报的能力，使所有捕获尝试彻底失败。\n—#italic 陆军军官#! "
 cr_indian_removal.51.f_2:0 "我俘虏了425人，或许450人。我想等到我收拾完这些被我拆散的家庭剩余成员，我能管理的数量就到极限了……他们一有机会就逃跑……还需要几天收集他们的少量财物，因为我们在山中抓到他们，无法同时带走他们的财产。\n—#italic 威廉·德里克上尉#! "
 cr_indian_removal.51.f_3:0 "当部队开始集结时，他与家人躲藏起来……失去生计，被迫以树汁与根茎维生……他族人中几乎所有孩子都死了，近百人中只剩约两个孩子。\n—#italic 迪卡吉斯卡，一位切罗基人#! "
 cr_indian_removal.51.a:0 "动用军队将他们驱出"
 cr_indian_removal.51.a_tt:0 "没有[SCOPE.sCountry('target_of_removal').GetNameNoFormatting]能逃脱抓捕，迁移结束时[SCOPE.sState('cr_cleared_state').GetName]将无一人留下"
 cr_indian_removal.51.b:0 "少数散兵游勇无关紧要"
 cr_indian_removal.51.b_tt:0 "部分[SCOPE.sCountry('target_of_removal').GetNameNoFormatting]将逃脱抓捕，并在[SCOPE.sState('cr_cleared_state').GetName]定居"

 cr_indian_removal.52.t:0 "本土同情者"
 cr_indian_removal.52.desc:0 "[SCOPE.sState('indian_removal_state').GetName]的部分公民开始庇护并暗中支持留下的[SCOPE.sCountry('target_of_removal').GetNameNoFlag]，极大阻碍我们将最后这些散兵迁往西部的努力。"
 cr_indian_removal.52.a:0 "逮捕这些同情者"
 cr_indian_removal.52.b:0 "在我们努力将[culture]从[STATE]迁往新土地时"

 cr_indian_removal.53.t:0 "执意留下"
 cr_indian_removal.53.desc:0 "部分[SCOPE.sCountry('target_of_removal').GetNameNoFlag]"
 cr_indian_removal.53.f:0 "驱赶他们时，一队士兵前后押送，两侧各一排士兵，手持所有常见的致命武器；据说士兵常用赶猪的语言，用刺刀驱赶他们前进。我听说一人目睹孩子受虐，拾起石头砸向士兵。\n—#italic 丹尼尔·萨宾·布特里克牧师#! "
 cr_indian_removal.53.f_2:0 "我听说一人既不能说也不能听，被士兵突袭带走。因耳聋，他听不到士兵命令；出于恐惧开始逃跑，当场被枪杀。\n—#italic 丹尼尔·萨宾·布特里克牧师#! "
 cr_indian_removal.53.f_3:0 "我们还得知，最后一批人在罗斯登陆点过河时，一名妇女正值分娩之痛，她尽可能站立行走，然后倒在河岸。一名士兵上前，用刺刀刺她，加上其他痛苦，她很快死亡。\n—#italic 丹尼尔·萨宾·布特里克牧师#! "
 cr_indian_removal.53.f_4:0 "我参加过内战，见识过成千上万人被枪杀屠戮，但切罗基迁移是我所知最残酷的工作。\n—#italic 一位邦联士兵#! "

 cr_indian_removal.54.t:0 "[SCOPE.sCountry('target_of_removal').GetNameNoFormatting]轻骑兵"
 cr_indian_removal.54.desc:0 "向西迁移过程中强加在[SCOPE.sCountry('target_of_removal').GetNameNoFlag]身上的种种苦难，正有演变成无序混乱的风险。只有他们自己的治安力量在阻止这一切。"
 cr_indian_removal.54.f:0 "昨晚有两三个切罗基人醉醺醺地进来——用可怕的方式咒骂，其中一人像恶魔般狂怒，但很快被切罗基轻骑兵抓住并捆绑。"
 cr_indian_removal.54.f_2:0 "今天一些切罗基人在白人家里喝酒，轻骑兵前去制止，醉汉们跳上马逃跑。轻骑兵追赶，其中一人从马上跃下，抓起枪立刻开火，显然意图杀死一名轻骑兵；虽然子弹只穿过了他马的前腿。轻骑兵抓住他，带到泰勒先生的帐篷。\n—#italic 丹尼尔·萨宾·布特里克牧师#! "

 cr_indian_removal.55.t:0 "不再前进一步"
 cr_indian_removal.55.desc:0 "一支[SCOPE.sCountry('target_of_removal').GetNameNoFlag]印第安人队伍已跨越密西西比河进入[SCOPE.sState('state_of_arkansas').GetName]，坚决拒绝继续西进。他们坚称抵达阿肯色已履行迁移条约义务，不能被强迫再迁更远。"
 cr_indian_removal.55.desc_2:0 "一支[SCOPE.sCountry('target_of_removal').GetNameNoFlag]印第安人队伍已进入[SCOPE.sState('state_of_arkansas').GetName]，声称不能被强迫再前进；他们已按照迁移条约抵达密西西比河以西。"
 cr_indian_removal.55.f:0 "尽管我们的政府对他们苛刻不公，但允许他们在州内过冬、掠夺民众及其财产仍不公平。我认为康韦州长应下令召集志愿兵追赶他们后方，驱逐他们——让他们离开本州，返回家园。\n—#italic 致阿肯色公报的信#! "
 cr_indian_removal.55.a:0 "召集民兵，驱赶他们继续前进"
 cr_indian_removal.55.a_tt:0 "[SCOPE.sState('indian_removal_state').GetName]的[SCOPE.sCountry('target_of_removal').GetNameNoFlag]将被迫继续迁往俄克拉荷马"
 cr_indian_removal.55.b:0 "密西西比河以西就是密西西比河以西"
 cr_indian_removal.55.b_tt:0 "[SCOPE.sState('indian_removal_state').GetName]的[SCOPE.sCountry('target_of_removal').GetNameNoFlag]将被允许在[SCOPE.sState('state_of_arkansas').GetName]定居"

 cr_indian_removal.56.t:0 "霍乱袭击迁徙之路！"
 cr_indian_removal.56.desc:0 "霍乱袭击了西迁路上的[SCOPE.sCountry('target_of_removal').GetNameNoFlag]队伍，在他们中造成巨大破坏！"
 cr_indian_removal.56.f:0 "不管是什么病，最可能的原因是印第安人在蒸汽船上过度拥挤，以及饮食从新鲜肉类与玉米突然变为咸猪肉与小麦面粉，而且可能半生不熟。\n—#italic 阿肯色公报#! "
 cr_indian_removal.56.f_2:0 "从河上传来的每一条消息都令人痛苦。蒸汽船似乎成了疾病的储存库。\n—#italic 致阿肯色公报的信#! "
 cr_indian_removal.56.f_3:0 "然而迁移特派员N.史密斯像尼禄般残酷，强迫他们登船，进入毒气，匆忙送往黑暗与死亡阴影之地，在那里他们将生病而死。\n—#italic 丹尼尔·萨宾·布特里克牧师#! "
 cr_indian_removal.56.f_4:0 "但哦，那瘟疫：霍乱！这‘民族之灾’将如何对待可怜的印第安部落，只有上帝知道。它无疑将把成千上万人扫进坟墓……毁灭天使之剑在新移民中执行死刑……\n—#italic 洛林·S·威廉斯牧师#! "
 cr_indian_removal.56.a:0 "我们只能祈祷最好的结果"
 cr_indian_removal.56.b:0 "我们难道不能帮助他们？"
 cr_indian_removal.56.b_tt:0 "此选项因我们对$institution_health_system$ [concept_institution]的投资而可用"
 cr_indian_removal.56.c:0 "将这场灾难公之于众，为我所用"
 cr_indian_removal.56.c_tt:0 "我们将在政治舞台上利用[SCOPE.sCountry('target_of_removal').GetNameNoFlag]的苦难为我们谋利"
 cr_indian_removal.56.c_tt_2:0 "此选项因我们推动或存在运动以推行$institution_health_system$ [concept_law]而可用"

 cr_indian_removal.57.t:0 "蒸汽船灾难！"
 cr_indian_removal.57.desc:0 "一艘载着[SCOPE.sCountry('target_of_removal').GetNameNoFlag]队伍跨越密西西比河的蒸汽船与其他轮船相撞！\n严重超载；预计数百人在这场灾难中丧生。"
 cr_indian_removal.57.f_1:0 "我已无土地。我被赶离家园，沿着红水向上，让我们一起走，一起死吧，总有一天我们会在河岸相聚。\n—#italic 幸存者之歌#! "
 cr_indian_removal.57.f_2:0 "启航时曾试图征得他们同意登船，但无人答应。特派员随即划线穿过营地，士兵冲入，将这些注定受害者赶进那些令人作呕的疾病与死亡容器。目击者称这一痛苦场面令人心碎至极。\n—#italic 埃文·琼斯牧师#! "
 cr_indian_removal.57.f_3:0 "一艘满载人类、毫无控制与秩序的船只，令人作呕的景象：排泄物从船舱到甲板各处肆意流淌，这会让任何人对运输条件多加宽容。\n—#italic W. S. 科尔克霍恩，迁移特派员#! "
 cr_indian_removal.57.a:0 "悲伤的一天"
 cr_indian_removal.57.b:0 "愤怒的一天"

 cr_indian_removal.58.t:0 "自由企业的好处"
 cr_indian_removal.58.t_2:0 "关于印第安迁移的规章"
 cr_indian_removal.58.desc:0 "将[SCOPE.sCountry('target_of_removal').GetNameNoFlag]迁出始终是一项代价高昂且复杂的任务。为加速进程，我们征召了一支私人供应商大军，为西行提供所有必需品与运输。\n\n然而，沿途传来死亡与短缺报告，似乎并非所有供应商认真履行职责，他们揣着政府补贴，让[SCOPE.sCountry('target_of_removal').GetNameNoFormatting]自生自灭。"
 cr_indian_removal.58.f:0 "在这种情况下驱赶他们，再强迫他们挤进炎热季节里肮脏超载的船只，在小石城这个最易生病的地点上岸，等待其他交通工具沿阿肯色河上行200英里，这只是以最昂贵、最痛苦的方式置这些可怜人于死地。\n—#italic 丹尼尔·萨宾·布特里克牧师#! "
 cr_indian_removal.58.f_2:0 "为增加投机利润的贪婪驱使，首先租用腐朽、老旧、不适航的船只，因为这类船便宜；然后为进一步扩大利润，将印第安人如此密集地塞进这些破船，似乎丝毫不顾他们的安全、舒适甚至体面。甲板与船舱拥挤得令人作呕，保持着不适合人类的状态。\n—#italic 新奥尔良真实美国人报#! "
 cr_indian_removal.58.a:0 "一点贪污总是难免的"
 cr_indian_removal.58.a_tt:0 "我希望这些指示并非真的意味着我将从我完全不了解其诚信或资质的人中挑选特派员，让他们在我的直接控制之外履行职责，并对美国负责忠实执行任务。\n—#italic 威廉·克拉克，印第安事务总监#! "
 cr_indian_removal.58.b:0 "他们是我们国家的污点"
 cr_indian_removal.58.b_tt:0 "所有这些罪恶，他说，都是管理不善的结果。被任命的人通常无能或不忠。政府本应任命有智慧、坚定与荣誉的人，他们会忠实履行对美国与印第安人的义务。相反，却派人出去为自己谋财、压迫印第安人。\n—#italic 参议员约翰·卡尔霍恩#! "

 cr_indian_removal.59.t:0 "管理迁移"
 cr_indian_removal.59.desc:0 "1832年乔克托迁移暴露了巨大的行政缺陷，模糊的命令、权限与责任范围导致迁移过程#italic 远非令人钦佩#! 的结果。"
 cr_indian_removal.59.f:0 "布朗上尉对仅仅来自河对岸的援助建议表现出极大不满……\n—#italic W.S. 科尔克霍恩，迁移特派员#! "

 cr_indian_removal.60.t:0 "变质的口粮！"
 cr_indian_removal.60.desc:0 "承诺在他们准备西行、放弃农场时提供支持，如今[SCOPE.sState('removed_from_state').GetName]的[SCOPE.sCountry('target_of_removal').GetNameNoFlag]面临饥饿，因为供给他们的食物口粮彻底变质。"
 cr_indian_removal.60.desc_2:0 "承诺在他们西迁、抛下农场与狩猎地时提供支持，如今[SCOPE.sCountry('target_of_removal').GetNameNoFlag]面临饥饿，因为维持生计的食物口粮完全变质。"
 cr_indian_removal.60.f:0 "我在这里与[SCOPE.sCountry('target_of_removal').GetNameNoFormatting]一起挨饿，全因承包商的严重失职；我们的处境何时好转我很难说，因为失败接连不断，没完没了……我开始觉得我们只能饿死或放弃这片土地。\n—#italic 派驻[SCOPE.sCountry('target_of_removal').GetNameNoFormatting]的政府特派员#! "
 cr_indian_removal.60.f_2:0 "[SCOPE.sCountry('target_of_removal').GetNameNoFormatting]的处境需要立即行动以免他们饿死；我亲眼见到他们的痛苦……这里既无牛也无猪……没有玉米或牛肉，他们会饿死。\n—#italic 派驻[SCOPE.sCountry('target_of_removal').GetNameNoFormatting]的政府特派员#! "
 cr_indian_removal.60.f_3:0 "我看到宝贵的面粉与玉米被任其腐烂，这些食物本可用来喂养在迁移路上挨饿的人……\n—#italic 派驻[SCOPE.sCountry('target_of_removal').GetNameNoFormatting]的政府特派员#! "
 cr_indian_removal.60.a:0 "我们必须做点什么"
 cr_indian_removal.60.b:0 "肯定有哪个大佬从中发财了……"
 cr_indian_removal.60.c:0 "将这场灾难公之于众，为我所用"
 cr_indian_removal.60.c_tt:0 "我们将在政治舞台上利用[SCOPE.sCountry('target_of_removal').GetNameNoFlag]的苦难为我们谋利"

 cr_indian_removal.61.t:0 "[Culture]玫瑰"
 cr_indian_removal.61.desc:0 "当[Culture]前往西部新土地时，他们身后留下一路盛开的玫瑰，绵延至目所能及之处。"
 cr_indian_removal.61.f:0 "我看到了女人们的悲伤，我能帮助她们为孩子们保留力量。告诉女人们回头看她们泪水落地的地方。\n—#italic 部落长老#! "

 cr_indian_removal.65.t:0 "新的北方邻居"
 cr_indian_removal.65.desc:0 "随着[SCOPE.sCountry('cr_removing_country').GetName]加速推行印第安迁移政策，数千[SCOPE.sCountry('target_of_removal').GetNameNoFlag]印第安人定居在我们北部边疆，这在北部边境当地民众中引起极大恐慌，他们担心数千敌对印第安人可能做出什么，需要作出回应。"
 cr_indian_removal.65.desc_2:0 "[SCOPE.sCountry('cr_removing_country').GetAdjectiveNoFlag]将印第安人迁往密西西比河以西印第安领地的政策，在北部边境当地民众中引发相当大的恐慌，他们担心数千敌对印第安人可能做出什么。"
 cr_indian_removal.65.f:0 "若密西西比河以东的印第安人已足够强大，让公民生活在恐惧中——在一个防御手段充足的国家——得克萨斯与墨西哥西部各州的公民当然有理由担忧所有不时被送往他们边境的印第安部落的敌对行为。\n—#italic 得克萨斯电讯报#! "
 cr_indian_removal.65.a:0 "我们期望[SCOPE.sCountry('cr_removing_country').GetAdjectiveNoFormatting]人管好他们"
 cr_indian_removal.65.b:0 "我们或许该加强边防"  # 有正规军
 cr_indian_removal.65.c:0 "这不过是民兵能处理的"  # 有民兵
 cr_indian_removal.65.d:0 "得克萨斯游骑兵来救援"  # 有民兵且为得克萨斯

 cr_indian_removal.70.t:0 "不完整的和解"
 cr_indian_removal.70.desc:0 "随着近期政治风向转变，南方#variable 文明五部落#! 的未来略显光明，但仅限于那些迁移尚未开始、或因偶然或境遇逃脱针对他们的罗网之人。"
 cr_indian_removal.70.desc_sub_1:0 "\n\n对于"
 cr_indian_removal.70.desc_1:0 "[SCOPE.sCountry('cr_removed_country_no_1').GetNameNoFlag]"
 cr_indian_removal.70.desc_2:0 "[SCOPE.sCountry('cr_removed_country_no_1').GetNameNoFlag]与[SCOPE.sCountry('cr_removed_country_no_2').GetNameNoFlag]"
 cr_indian_removal.70.desc_3:0 "[SCOPE.sCountry('cr_removed_country_no_1').GetNameNoFlag]、[SCOPE.sCountry('cr_removed_country_no_2').GetNameNoFlag]与[SCOPE.sCountry('cr_removed_country_no_3').GetNameNoFlag]"
 cr_indian_removal.70.desc_4:0 "[SCOPE.sCountry('cr_removed_country_no_1').GetNameNoFlag]、[SCOPE.sCountry('cr_removed_country_no_2').GetNameNoFlag]、[SCOPE.sCountry('cr_removed_country_no_3').GetNameNoFlag]与[SCOPE.sCountry('cr_removed_country_no_4').GetNameNoFlag]"
 cr_indian_removal.70.desc_5:0 "[SCOPE.sCountry('cr_removed_country_no_1').GetNameNoFlag]、[SCOPE.sCountry('cr_removed_country_no_2').GetNameNoFlag]、[SCOPE.sCountry('cr_removed_country_no_3').GetNameNoFlag]、[SCOPE.sCountry('cr_removed_country_no_4').GetNameNoFlag]与[SCOPE.sCountry('cr_removed_country_no_5').GetNameNoFlag]"
 cr_indian_removal.70.desc_sub_2:0 "这些变化来得太晚，他们已成为迁移的牺牲品，不再称祖先土地为家园。"
 cr_indian_removal.70.f:0 "……我们的村庄呈现出截然不同的面貌。印第安人全走了；看到这些可怜人离开出生之地与父辈坟墓令人忧伤。他们脸上印着深深的悲哀。\n—#italic 一位年轻目击者#! "
 cr_indian_removal.70.a:0 "既成事实已无法改变"
 cr_indian_removal.70.b:0 "或许我们可以做些小小弥补？"
 cr_indian_removal.70.b_tt:0 "所有[SCOPE.sCulture('muskogean_people').GetName]、[SCOPE.sCulture('cherokee_people').GetName]与[SCOPE.sCulture('chickasaw_people').GetName][concept_pop]获得#g 2%#! 忠诚度"
 cr_indian_removal.70.c:0 "正义只能通过废除迁移法案来实现"
 cr_indian_removal.70.c_tt:0 "被迁往密西西比河以西的各民族将在[SCOPE.sState('state_of_alabama').GetNameNoFormatting]、[SCOPE.sState('state_of_georgia').GetNameNoFormatting]、[SCOPE.sState('state_of_tennessee').GetNameNoFormatting]、[SCOPE.sState('state_of_north_carolina').GetNameNoFormatting]与[SCOPE.sState('state_of_mississippi').GetNameNoFormatting]恢复祖先土地。"
 cr_indian_removal.70.c_tt_2:0 "所有[SCOPE.sCulture('muskogean_people').GetName]、[SCOPE.sCulture('cherokee_people').GetName]与[SCOPE.sCulture('chickasaw_people').GetName][concept_pop]获得#g 20%#! 忠诚度"

