dsk_zexu.27.d: "征服伊比利亚"
dsk_zexu.27.f: "泽许帝国对西班牙和葡萄牙的统治进一步深化。将伊比利亚半岛的资源进行全面整合，包括矿业、农业和渔业等。建立统一的经济发展规划，改善当地的交通和通信设施，促进伊比利亚半岛内部的贸易往来。同时，在军事上加强对伊比利亚半岛的防御建设，使其成为泽许欧亚合众国在欧洲西南角的坚固堡垒。"
dsk_zexu.27.a: "[SCOPE.GetRootScope.GetCountry.GetName]万岁"


