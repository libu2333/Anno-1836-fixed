 added_decision_chuang_guandong:"闯关东"
 added_decision_chuang_guandong_desc:"随着内地人地矛盾日益尖锐，以及以沙皇俄国为首的列强对北部边疆的侵扰，全面开放东北、鼓励内地居民出关垦殖已势在必行。毫无疑问，这将带来前所未有的移民浪潮并巩固边疆，但朝廷中的保守势力仍在尽可能拖延这一法令的实施。"

 added_decision_chuang_guandong_2:"开发外东北"
 added_decision_chuang_guandong_2_desc:"开垦黑龙江以北的广袤土地。这一次，我们不会、也不能再失去这片土地。"

