tz_flavor.11.t:0 "国庆日"
 tz_flavor.11.d:0 "统一北美后，[SCOPE.sCountry('gbr_scope').GetName]迎来了首个国庆日。"
 tz_flavor.11.f:0 "今日，[SCOPE.sCountry('gbr_scope').GetName]诞生，举国欢庆。升旗礼、议政会与夜间庆典相继举行；人们相信，只要同心协力，新国家终将走向繁荣。"
 tz_flavor.11.a:0 "共庆立国之日。"
je_national_day:0 "国庆日"
 je_national_day_reason:0 "举行首个国庆日可为[SCOPE.sCountry('gbr_scope').GetName]带来大量效忠派，并增强陆军。"
all_alaska:0 "所有国土将会增加[SCOPE.GetRootScope.GetCountry.GetName]主流文化"
national_day:0 "国庆日"
je_healthy_up:0 "国民医疗"
je_healthy_up_reason:0 "最后一项决议涉及医疗保健，要求政府增加投入，提高医保覆盖率，提升医疗服务质量，并推出新医疗保健政策，让更多人享受优质医疗服务"
je_yi_min:0 "渴望之国"
 je_yi_min_reason:0 "天智美利坚合众国虽初创不久，经济振兴与社会改革已略见成效。为充实国力、推进建设，政府应扩大移民来源，吸引更多人口前来定居。"
je_education_up:0 "国民教育"
je_education_up_reason:0 "第二项决议聚焦教育，要求政府加大投入，提升教师待遇，改善学校设施，推行新教育政策，让更多人享有优质教育。"
tz_flavor.12.t:0 "国民教育的提高"
tz_flavor.13.t:0 "国民健康的提高"
tz_flavor.14.t:0 "移民潮"
tz_flavor.15:0 "保护没有被灭国的兰芳"
modifier_education_up:0 "国民教育的提高"
modifier_healthy_up:0 "国民健康的提高"
modifier_yi_min_up:0 "移民潮"
 tz_flavor.12.d:0 "教育使国民获得知识与技艺，提升其谋生能力与社会竞争力。"
 tz_flavor.12.f:0 "教育培养技术人才，支撑经济发展，并助长创新与产业升级。"
 tz_flavor.12.a:0 "教育增进对不同文化、宗教与价值观的理解，巩固社会信任与秩序。"
 tz_flavor.12.g:0 "高素质国民使国家更具国际竞争力，也有助于引进资本、技术与人才。"
 tz_flavor.13.d:0 "改善国民健康可减少疾病与困苦，提升生活质量。"
 tz_flavor.13.f:0 "更好的医疗条件与健康生活方式，可使人民安享更长久的人生。"
 tz_flavor.13.a:0 "健全的公共卫生有助于减轻家庭负担，维护社会安定。"
 tz_flavor.13.e:0 "倡导合理膳食、适量运动与节制烟酒，有助于养成良好生活习惯，并推动社会的长远发展。"
 tz_flavor.14.d:0 "[SCOPE.sCountry('gbr_scope').GetName]推出吸引技术人才的政策，预计将有许多专业人士与熟练工人迁入，并为经济发展出力。"
 tz_flavor.14.f:0 "为促进经济与就业，[SCOPE.sCountry('gbr_scope').GetName]正吸引外国投资者与移民前来经营、定居，并带来资本与技艺。"
 tz_flavor.14.a:0 "教育体系日渐完备，也将吸引更多学生前来求学、工作与定居。"

