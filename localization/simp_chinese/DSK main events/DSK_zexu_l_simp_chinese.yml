dsk_zexu.13.t: "国家改革成功"
dsk_zexu.13.d: "随着法律与政府机构完成整顿，改革终见成效。"
dsk_zexu.13.f: "国家发展渐入正轨，铁路与公共交通遍及各地；我们已走在许多国家之前。"
dsk_zexu.13.a: "国家改革成功"


dsk_zexu.14.t: "海外殖民帝国"
dsk_zexu.14.d: "列强竞逐海外，我们亦须参与其中，以求资源与影响力。"
dsk_zexu.14.f: "英、法、美、德、荷皆有海外据点；我们不能永远落于人后。"
dsk_zexu.14.a: "投身殖民事业，扩展欧洲影响。"

dsk_zexu.15.t: "多瑙河领地王冠"
dsk_zexu.15.d: "[SCOPE.GetRootScope.GetCountry.GetName]的扩张之路"
dsk_zexu.15.f: "奥地利帝国内乱迭起，我们遂得机会将多瑙河地区纳入[SCOPE.GetRootScope.GetCountry.GetName]版图；但反对势力仍图离间、分裂国家，绝不可掉以轻心。"
dsk_zexu.15.a: "奥地利的衰亡已成定局。"

dsk_zexu.16.t: "乌克兰领地王冠"
dsk_zexu.16.d: "[ROOT.GetCountry.GetRuler.GetFullName]击败俄罗斯后，乌克兰的前途已掌握在我们手中。"
dsk_zexu.16.f: "俄罗斯既败，我们可同乌克兰人共建联邦；亦可将眼界投向更广阔的欧洲，谋求一个前所未有的统一秩序。"
dsk_zexu.16.a: "以欧洲统一为国家目标。"

