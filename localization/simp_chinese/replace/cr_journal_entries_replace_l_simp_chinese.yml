 #原住民迁移 / 印第安人迁移法案
 je_indian_removal: "印第安人迁移法案"
 je_indian_removal_reason: "面对南方#variable 文明五部落#!的土地持续遭到定居者侵占——即[SCOPE.sCountry('cherokee_nation').GetNameNoFlag]、[SCOPE.sCountry('chickasaw_nation').GetNameNoFlag]、[SCOPE.sCountry('choctaw_nation').GetNameNoFlag]、[SCOPE.sCountry('creek_nation').GetNameNoFlag]以及[SCOPE.sCountry('seminole_nation').GetNameNoFlag]——政府已实施《印第安人迁移法案》。\n\n虽然北方原住民群体大多已消失，但这些南方部落仍然保持着顽强的生命力，却也日益暴露在“进步”无情推进的威胁之下。该法案的解决方案是强制这些部落向西迁移，跨越密西西比河。\n\n这项强制撤离旨在给他们一个机会，让他们在密西西比河以西的领土上，在自治条件下尽可能保留自身的生活方式、文化习俗与传统，不再持续遭受定居者的侵蚀；与此同时，也保障了美国定居扩张与繁荣的持续推进。"
 je_indian_removal_resolve_the_chain: "结束当前的迁移进程：可以选择停止行动，或彻底完成迁移。"
 je_indian_removal_end_0: "#variable 文明五部落#!将被强行驱离其祖先土地，过程中将付出巨大的生命代价。"
 je_indian_removal_end_1: "密西西比河以东的原有领土将被吞并并向定居者开放。"
 je_indian_removal_end_2: "每成功完成一次迁移，受影响州的可用耕地数量将增加。"
 je_indian_removal_end_3: "此外，[SCOPE.sState('state_of_georgia').GetName]将获得数量有限的#variable 金矿田#!，而[SCOPE.sState('state_of_alabama').GetName]将获得少量#variable 铜矿藏#!"

 je_seminole_war_containment_policy: "遏制政策"
 je_seminole_war_containment_policy_desc: "我们可以将针对塞米诺尔战争的政策调整为遏制塞米诺尔人。这将降低开支，同时提高定居者的安全。"
 je_seminole_war_containment_policy_tt: "这将降低塞米诺尔人发动袭击的概率。"
 je_seminole_war_forward_policy: "前进政策"
 je_seminole_war_forward_policy_desc: "我们可以将针对塞米诺尔战争的政策调整为积极主动、武力根除，将他们以武力逐出佛罗里达。"
 je_seminole_war_forward_policy_tt: "军队将定期派出小队进入沼泽，试图寻找塞米诺尔人的作战队伍与定居点。这些行动可能带来#g正面#!或#r负面#!的结果。"
 je_seminole_war_diplomatic_policy: "外交政策"
 je_seminole_war_diplomatic_policy_desc: "我们可以将针对塞米诺尔战争的政策调整为外交手段，试图劝说塞米诺尔人走出藏身之处并离开。"
 je_seminole_war_diplomatic_policy_tt: "将偶尔出现与塞米诺尔人进行外交接触的机会，通常带有#g正面#!的结果。"

 je_seminole_war_policy_cooldown: "我们距离上次更改政策还不到#variable 1年#!"
 je_seminole_war_policy_already_active: "该政策目前已经生效。"

