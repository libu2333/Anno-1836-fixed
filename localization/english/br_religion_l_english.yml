orthodox_decision_desc: "@warning! This decision changes your state religion and greatly angers the majority of your people."
revive_khazer_khanate_decision: "Rebuilding the Khazarian Khanate"
revive_khazer_khanate_decision_desc: "According to historical sources, Jews from the Islamic world and the Roman Empire migrated to Khazar to escape religious persecution under Heraclius, Justinian II, Leo III, and Romanus I. Simon Schama argues that in the aftermath of these persecutions, Jewish communities in the Balkans and Crimea, especially in Pentecostal Greece, migrated to the more religiously tolerant Khazar to join the Armenian Jewish community there. He argues that the Cairo kotelniel fragments make it clear that Judaizing reforms took root throughout the Khazar population. The pattern of conversion was that of an elite class first adopting the new religion followed by mass adoption by the general population, which often resisted forced conversion. An important condition for mass conversion was a settled, urbanized state, with churches, synagogues, and mosques providing religious centers in cities, as opposed to the free nomadic lifestyle of the open steppes. "
sunni_decision: "Embracing Sunnis"
sunni_decision_desc: "The faith of Islam has spread across our lands, with the majority of our people converted."
zoroastrianism_decision: "Rekindling the flame of Ahura Mazda"
zoroastrianism_decision_desc: "For centuries, our homeland was known for the ancient teachings of Zoroaster. Now that the sword no longer holds our tongues, perhaps it is time to break free from the Arabs and Jahansuzi and reconnect with our roots."
norse_decision: "Return to Norse Faith"
norse_decision_desc: "Perhaps it is time to return to our ancient roots and embrace the Norse faith."
baltic_decision: "Return to Baltic Faith"
baltic_decision_desc: "Perhaps it is time to return to our ancient roots and embrace the Baltic faith. "
slavic_decision: "Return to the Slavic Faith"
slavic_decision_desc: "Perhaps it is time to return to our ancient roots and embrace the Slavic Faith."
tengri_decision: "Return to the Tengri Faith"
tengri_decision_desc: "Perhaps it is time to return to our ancient roots and embrace the Tengri Faith."
acknowledge_roman_orthodox_supremacy: "Acknowledge the Supremacy of the Ecumenical Patriarch of Constantinople"
acknowledge_roman_orthodox_supremacy_desc: "We gain a lot of leverage with the Roman Empire if we acknowledge the supremacy of the Ecumenical Patriarch of Constantinople over our faithful, but it comes at a price."
declare_patriarch_independence: "Declare Patriarchal Independence"
declare_patriarch_independence_desc: "Declare our Patriarch and Church independent of that of the Patriarchate of Constantinople. "
pentarchy.1.t: "Reconstruction of the Five Patriarchates"
pentarchy.1.d: "The unification of the great seats of Eastern Christianity under Basilius of Constantinople was a momentous historical event. It marked the re-emergence of the Roman Crown in a region that had long been alienated from its central authority. This development had far-reaching consequences not only in the political sphere, but also in cultural and religious affairs. Constantinople's revival as the center of Eastern Christianity facilitated a renewal of its role as a center of culture and learning, fueling a revival of Roman art, literature, and philosophy. This historical milestone represents a pivotal step in the modern history of the Roman Empire and Eastern Christianity, reaffirming the Empire's enduring legacy. "
pentarchy.1.f: "With the heartland of Eastern Christianity now under our control, religious and social leaders are calling for the unification of the Imperial institutions with the Patriarchate. This historic development marks an important moment in our history, as it reflects the desire to reconcile the spiritual and political aspects of the Roman Empire"
pentarchy.1.a: "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] rules in the name of God. "
pentarchy.1.b: "The Patriarch will lead the faithful. "
