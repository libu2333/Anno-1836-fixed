 #墨西哥
 je_cr_reorganise_mexico: "分裂的国家"
 je_cr_reorganise_mexico_reason: "在共和国成立之初，墨西哥在两种对立的治理愿景间分裂。[SCOPE.sPoliticalMovement('centralist_movement').GetName]寻求从首都统一指挥的国家，而[SCOPE.sPoliticalMovement('federalist_movement').GetName]坚持1824年宪法下的省份自治。独立以来，这两种理念的斗争定义了国家政治，塑造了联盟、叛乱与政府。\n\n在此争斗中，国家权威仍脆弱。内地省份不满暗流涌动；边疆地区敌对袭击与匪患持续。每一次政府更迭都带来改革的承诺——以及新一轮混乱的风险。"
 je_cr_reorganise_mexico_complete_tt: "联邦问题将明确倾向于中央集权国家。"
