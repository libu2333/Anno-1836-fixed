l_simp_chinese:
 # 国家介绍文本
 NET_FLAVOR_TEXT:0 "荷兰在拿破仑战争后背负沉重债务，并与其比利时诸省及其天主教人口维系着一段并不愉快的联合。如今，在威廉国王试图强行统一国家、导致比利时诸省分离六年之后，荷兰能否接受这一损失，转而将目光投向未来——或许是殖民地——还是会试图再次在比利时重建自身的地位？"

 DEI_FLAVOR_TEXT:0 "数百年来，肥沃的土地、异域的货物以及当地人民的辛勤劳作，使东印度群岛成为有志进取的欧洲人——尤其是荷兰人——追逐财富的乐土。如今，荷兰仍在比利时分离与沉重债务的打击中挣扎，东印度群岛能否挺身而出，为宗主国提供急需的经济命脉？"

 TUA_FLAVOR_TEXT:0 "在阿尔及利亚以南、沙漠深处，图阿特的绿洲掌控着横跨撒哈拉的商路。它们的孤立曾使其免于外来统治，但这样的局面还能持续多久？"

 CHC_FLAVOR_TEXT:0 "1828年，达吉斯坦与车臣的数位穆斯林伊玛目号召发动“加扎瓦特”——一场针对自《古利斯坦条约》后统治该地区的俄国的圣战。他们宣布建立独立的高加索伊玛目国，自此与追随者展开游击式分离战争。面对强大的俄国，他们还能坚持多久？"

 PNI_FLAVOR_TEXT:0 "独立之后，巴西潘帕斯草原的高乔人感到被排除在国家政治进程之外，并对损害南方利益的经济政策心怀不满。1835年，这些紧张情绪爆发为分离主义叛乱，宣布成立南里奥格兰德共和国。然而，这个新生国家究竟能维持多久，无人知晓。"

 LIB_FLAVOR_TEXT:0 "19世纪20年代初，一些美国“殖民协会”在非洲胡椒海岸建立据点，并鼓励获得自由的美国奴隶迁居于此。1822年，其中数个殖民地联合宣布成立新国家利比里亚，意图成为黑暗大陆上的自由堡垒，以及非裔美国人的永久家园。它能否兑现为获释奴隶提供新家园的承诺？"

 AHG_FLAVOR_TEXT:0 "在撒哈拉中部崎岖的石质高原之上，阿哈加尔群山巍然耸立——一片风、石与寂静之地。在古老的干涸河谷与火山山峰之间，图阿雷格的凯尔·阿哈加尔部族掌控着沙漠商路，他们的骆驼在苏丹与马格里布之间运输盐、黄金与奴隶。名义上臣属于遥远的统治者，但他们只向自己的阿门诺卡尔效忠。在新世纪风云变幻的沙海之中，他们的力量、荣誉与商路的兴衰，能否保护他们免受外敌侵扰？"

 AIR_FLAVOR_TEXT:0 "在撒哈拉腹地，艾尔山地如石与沙构成的巨岩群，从无尽沙海中拔地而起。自其山谷出发，凯尔·艾尔的图阿雷格人掌控着的黎波里、卡诺与廷巴克图之间的商路——守护、征税，也劫掠着沙漠贸易的命脉。然而他们的统治并不稳固：敌对氏族争夺权力，商路前景未明，沿海扩张的帝国将阴影投向北方。艾尔能否继续作为中部撒哈拉的守门者，抑或其古老的骄傲将被沙漠之风卷走？"

 FTR_FLAVOR_TEXT:0 "沿塞内加尔河肥沃河岸而立，富塔托罗长期以来都是学术、信仰与繁荣的摇篮。在这里，托罗德贝教士推翻旧王权，建立了以伊斯兰法统治城乡的政体，稻米、黍与高粱的收成为学者与战士提供养分。然而这个共和国脆弱不安——敌对的马拉布特、野心勃勃的氏族与外来商人不断撼动其统一。随着法国势力沿河上溯、旧日忠诚动摇，富塔托罗能否守护其富饶土地与学术传统，还是会被帝国浪潮吞没？"

 TBI_FLAVOR_TEXT:0 "提贝斯提群山如同沙海中的孤岛，自撒哈拉之中拔地而起，是这片沙漠最后的真正堡垒之一。在黑色山峰与隐秘河谷之间，泰达氏族依循自己的法则生活——他们既是战士、牧民，也是劫掠者，熟知费赞与博尔努之间的每一条山道与水井。他们的孤立使其免于苏丹与军队的统治，却也使其贫困而分裂。当沙漠与沿海的强权日益壮大，提贝斯提勇武的人民能否继续主宰群山，还是会被卷入更广阔世界的纷争？"

 TRZ_FLAVOR_TEXT:0 "在撒哈拉沙丘与塞内加尔河泛滥平原之间，特拉尔扎的沙漠埃米尔统治着商路与海岸贸易。从他们的帐篷出发，哈拉廷贵族向商人、战士以及南方黑人王国征收贡赋，在摩尔传统与法国野心之间寻求平衡。然而商业既带来财富，也带来危险，旧有秩序在沿海新兴势力的压力下摇摆不定。特拉尔扎的埃米尔们能否守住沙漠与河流之间的统治，还是会被帝国浪潮所吞噬？"

