 je_cr_numbered_treaties: "编号条约"
 je_cr_numbered_treaties_reason: "随着鲁珀特地并入[ROOT.GetCountry.GetNameNoFlag]，管理这片广袤地区的任务令人生畏。该地区人口极为稀少，现有人口绝大多数为印第安人，除向#variable 哈德逊湾公司#!提供毛皮外贡献甚微。\n\n然而，这片土地潜力巨大，拥有丰富的木材、矿藏与极度肥沃的土壤。为开发潜力并鼓励定居，必须从印第安居民手中获得土地转让。根据#variable 1763年皇家宣言#!，他们持有土地原住民权利，未经同意不得定居。因此，谈判编号条约是我们解锁这片广袤领土经济与农业繁荣、将其融入国家肌理的关键一步。"
 je_cr_numbered_treaties_reason_old: "随着鲁珀特地并入[ROOT.GetCountry.GetNameNoFlag]，管理这片广袤地区的任务令人生畏。该地区人口极为稀少，现有人口绝大多数为印第安人，除向#variable 哈德逊湾公司#!提供毛皮外贡献甚微。\n\n若要将这片广袤土地转为生产用途——我们完全可以，因为它富含木材、矿藏与特别肥沃的土地——必须诱导人们定居。然而在此之前，我们需说服已居住在那里的印第安人将土地转让给我们。根据#variable 1763年皇家宣言#!，他们持有土地原住民权利，未经同意任何人不得定居。"

