cr_carlist_events.20.desc_france_legitimist_generic_flavour:0 "唐·[SCOPE.sCharacter('don_carlos_char').GetFirstNameNoFormatting]隐居于[SCOPE.sState('don_carlos_exile_state').GetFarmHubName]，其主张已为大多数波旁宗亲所疏远，只在卡洛斯派低语中残存。"
cr_carlist_events.20.desc_britian_hmgovernment_old:0 "唐·[SCOPE.sCharacter('don_carlos_char').GetFirstName]获[SCOPE.sCountry('don_carlos_exile_country').GetNameNoFlag]庇护，流亡至[SCOPE.sState('carlos_arrival_state').GetPortHubName]。对西班牙而言，他的战争已成旧事，只余记忆与传说。"
cr_carlist_events.20.desc_britian_generic:0 "唐·[SCOPE.sCharacter('don_carlos_char').GetFirstName]获[SCOPE.sCountry('don_carlos_exile_country').GetNameNoFlag]收容；此举虽未公开支持其王位主张，却仍令卡洛斯派觊觎者保有一丝体面。"
cr_carlist_events.20.desc_britain_flavour:0 "英国庇护下的流亡宫廷，或会成为重提旧日主张的舞台。"
cr_carlist_events.20.desc_neutral:0 "兵败的唐·[SCOPE.sCharacter('don_carlos_char').GetFirstName]逃往[SCOPE.sCountry('don_carlos_exile_country').GetNameNoFlag]，被安置在[SCOPE.sState('don_carlos_exile_state').GetFarmHubName]，不得返回[SCOPE.sCountry('spain').GetNameNoFormatting]。"
cr_carlist_events.20.flavour:0 "流亡者仍为[SCOPE.sPoliticalMovement('carlist_movement').GetNameNoIcon]留存希望，但其影响已受严密约束。"
cr_carlist_events.20.flavour_australia:0 "在遥远南方，唐·[SCOPE.sCharacter('don_carlos_char').GetFirstNameNoFormatting]与其王位主张一同淡出世人记忆。"
cr_carlist_events.20.desc_two_sicilies:0 "唐·[SCOPE.sCharacter('don_carlos_char').GetFirstName]获准居于卡塞塔；波旁宗亲承认其血统，却不许他染指政治。"
cr_carlist_events.20.flavour_two_sicilies:0 "克制的款待维系了亲族情分，也令卡洛斯派的希望日渐衰微。"
cr_carlist_events.20.flavour_austria:0 "哈布斯堡收容唐·[SCOPE.sCharacter('don_carlos_char').GetFirstNameNoFormatting]，却将这名象征精心置于笼中。"
cr_carlist_events.20.t_austria_metternich:0 "觊觎者已被钳制"
cr_carlist_events.20.desc_austria_metternich:0 "[SCOPE.sCountry('don_carlos_exile_country').GetNameNoFlag]准许唐·[SCOPE.sCharacter('don_carlos_char').GetFirstName]避难，但命其严守政治中立，以免流亡地再成卡洛斯派鼓动的舞台。"
cr_carlist_events.20.flavour_austria_metternich:0 "维也纳的老狐狸落下一子；没有外国助力，卡洛斯派火种终将熄灭。"
cr_carlist_events.20.flavour_russia:0 "卡洛斯派复归的低语跨越大陆，终于被西伯利亚的冰雪吞没。"
cr_carlist_events.20.desc_russia_exile:0 "俄国将唐·[SCOPE.sCharacter('don_carlos_char').GetFirstName]视为外交负担，决定把他放逐到帝国遥远的一隅。"
cr_carlist_events.20.flavour_russia_exile:0 "帝国的广袤令其声音归于沉寂；西班牙暂可转而内顾。"
cr_carlist_events.20.a:0 "摆脱他，我们求之不得。"
cr_carlist_events.20.b:0 "至少眼下，他已鞭长莫及。"
cr_carlist_events.21.flavour_france_orleanist:0 "唐·卡洛斯得以在流亡地自由活动，便足以令西班牙王朝合法性问题继续悬而未决。"
cr_carlist_events.21.flavour_france_orleanist_2:0 "法国宫廷以唐·卡洛斯为工具，悄然将影响力投向伊比利亚。"
cr_carlist_events.21.flavour_france_legitimist:0 "巴黎的报纸、沙龙与外交圈正将其描绘为正统君权的旗帜。"
cr_carlist_events.21.desc_france_legitimist_undermine_legitimacy:0 "唐·[SCOPE.sCharacter('don_carlos_char').GetFirstName]在[SCOPE.sCountry('don_carlos_exile_country').GetNameNoFlag]得到的已不止避难所，而是一座用以攻击我方合法性的流亡王座。"
cr_carlist_events.21.flavour_france_legitimist_undermine_legitimacy:0 "唐·[SCOPE.sCharacter('don_carlos_char').GetFirstNameNoFormatting]在流亡宫廷中被尊为陛下，将我方胜利化作未解之问。"
cr_carlist_events.21.flavour_portugal:0 "邻国君主制的支持令[SCOPE.sPoliticalMovement('carlist_movement').GetNameNoIcon]再度蠢动。"
cr_carlist_events.21.desc_france_bonapartist_legitimacy_undermined:0 "波拿巴政权收容波旁觊觎者，是对欧洲旧王朝精心计算的公开冒犯。"
cr_carlist_events.21.desc_france_bonapartist_legitimacy_undermined_flavour:0 "唐·[SCOPE.sCharacter('don_carlos_char').GetNameNoFormatting]的事业无望，却仍可成为波拿巴派手中的政治工具。"
cr_carlist_events.21.desc_two_sicilies:0 "唐·[SCOPE.sCharacter('don_carlos_char').GetFirstName]在[SCOPE.sCountry('don_carlos_exile_country').GetCapital.GetCityHubName]获流亡君主之礼，其事业得到波旁宗亲支持。"
cr_carlist_events.21.flavour_two_sicilies:0 "此举绝非中立；它为[SCOPE.sPoliticalMovement('carlist_movement').GetNameNoIcon]提供了合法性与海外立足点。"
cr_carlist_events.21.flavour_austria_metternich:0 "默许唐·卡洛斯的流亡事业，是对欧洲脆弱和平的一场危险豪赌。"
cr_carlist_events.21.t_austria:0 "哈布斯堡的背书"
cr_carlist_events.21.desc_austria:0 "[SCOPE.sCountry('don_carlos_exile_country').GetNameNoFlag]虽未正式表态，却以礼遇唐·[SCOPE.sCharacter('don_carlos_char').GetFirstName]，默许其维系卡洛斯派事业。"
cr_carlist_events.21.flavour_austria:0 "哈布斯堡之鹰的阴影投向比利牛斯，战败的觊觎者在外交沙龙中重获生机。"
cr_carlist_events.21.flavour_russia:0 "沙皇亲手煽旺卡洛斯派火种；由外国支持滋养的新冲突阴影正逼近。"
