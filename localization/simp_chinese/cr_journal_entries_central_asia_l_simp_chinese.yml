l_simp_chinese:
 #原住民迁移
 je_cr_kyrgyz_tribes:1 "北方吉尔吉斯人"
 je_cr_kyrgyz_tribes_reason:0 "吉尔吉斯人是我们[ROOT.GetCountry.GetGovernment.GetName]的支柱，在各级行政机构中都承担着重要职责。然而，他们并非铁板一块：阿赖与费尔干纳的南方吉尔吉斯人已经接受我们的统治；天山一带的北方吉尔吉斯人却依旧坚持自己的生活方式，对我们的政令少有回应。对我们而言，这并非小事，因为通往乌鲁木齐以及更远处中国腹地的商路，正穿过天山、沿着伊塞克湖延伸。\n\n保护商队并不容易。一个氏族刚刚被压服，另一个氏族便已准备起事。若不是我们善于利用各部之间的矛盾，恐怕连表面上的控制都难以维持。但这种控制必须时刻警惕：我们始终要提防有人将各个氏族联合起来，把矛头转向我们。"
