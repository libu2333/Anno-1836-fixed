 je_reformista_rebellion:"Reformist Uprising"
 je_reformista_rebellion_reason:0 "Since the War of Independence, although the country has nominally established a republic, reality is far from stable. The system implemented by the civilian government has not brought order; instead, it has weakened the unifying forces of the nation. Local powers have carved out their own domains, central authority is shaken, and the army that once secured independence for the country has been excluded from decision-making.\n\nThose of us who have experienced war know all too well that a nation's survival depends on discipline and the ability to execute, rather than idealistic words on paper and powerless decrees. The hesitation and division of the current regime are gradually leading the country toward chaos and decline.\n\nTherefore, we have no other choice. We must reintegrate state power, restore order, and place those with real ability and experience in positions of leadership. Only then can the nation avoid collapse and march toward true stability and prosperity."
 reformista.1.t:0 "Reformist Victory"
 reformista.1.d:0 "The old civilian regime has collapsed, and its authority is rapidly disintegrating across the country. From Milan in the north to the Gulf of Venezuela on the coast, the nation's order is once again falling into the hands of disciplined and experienced soldiers. The forces that were once neglected and marginalized have now become the new core supporting the state.\n\nUnease and speculation still permeate the streets, but the military has established firm control over the situation. The order and authority we advocate can finally be implemented throughout the entire nation."
 reformista.1.f:0 "The morning in Caracas is awakened by the orderly sound of military boots. Crowds gather on both sides of the streets — some cheering, others watching in silence. Soldiers talk loudly, celebrating the victory of “restoring order,” while newspaper boys run through the streets waving the newly published *Venezuelan Military Gazette*.\n\nThe air is filled with the joy of victory mixed with lingering tension — everything feels as though it has only just begun, rather than ended."
 reformista.1.a:"Long live Venezuela!"
 je_reformista_win:"Reformists Achieve Victory"
 je_consolidated_peru:"All three provinces in the Peru region are now under our rule."
 not_consolidated_peru:"The war has ended, but Bolivian forces still remain."
 je_salaverry_peru:"The End of Salaverry"
 je_salaverry_peru_reason:"In 1835, in order to rescue Peru from Bolivian control, [ROOT.GetCountry.GetRuler.GetLastName] launched a coup, attempting to end foreign domination. However, things did not go as planned — although we once successfully recaptured Lima, under a Bolivian military counteroffensive we were forced to retreat south. Today, of our once vast occupied territories, only Arequipa remains. Can we still reverse the situation and restore Peru’s independence?"
 salaverry.1.t:"Peru Reunified"
 salaverry.1.d:"After a long and arduous struggle, we have accomplished what seemed impossible. Peru is once again united under a single flag — a symbol of freedom, independence, and unity. Although voices of opposition still exist, our rule has gradually stabilized."
 salaverry.1.f:"*Santa Cruz Issues Statement — Bolivia Angrily Condemns*\n\n*[ROOT.GetCountry.GetRuler.GetFullName] Sworn in as President of Peru*\n\n*Former Governor of Northern Peru Publicly Supports Unification*\n\n……"
 salaverry.1.a:"Long live a united Peru!"
 salaverry.1.b:"The name of [ROOT.GetCountry.GetRuler.GetFullName] will be engraved in our history."
 salaverry.2.t:"Unfinished Unification"
 salaverry.2.d:"We won the war, yet failed to achieve true unification. Bolivia still controls parts of Peruvian territory. A fragile peace cannot conceal the reality of division."
 salaverry.2.a:"We are still Peru — even if not yet fully unified."
 salaverry.2.b:"Wait for the right moment."
