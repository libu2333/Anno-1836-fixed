 modifier_yi_min_up:0 "A Wave of Immigration"
 tz_flavor.12.d:0 "Education gives citizens knowledge and skills, improving their ability to earn a living and compete in society."
 tz_flavor.12.f:0 "Education trains skilled workers, supports economic development, and encourages innovation and industrial advancement."
 tz_flavor.12.a:0 "Education fosters understanding of different cultures, religions, and values, strengthening social trust and order."
 tz_flavor.12.g:0 "A well-educated population makes the country more competitive internationally and helps attract capital, technology, and talent."
 tz_flavor.13.d:0 "Improving public health reduces illness and hardship and raises the quality of life."
 tz_flavor.13.f:0 "Better medical care and healthier lifestyles allow the people to enjoy longer lives."
 tz_flavor.13.a:0 "Sound public health eases the burden on families and preserves social stability."
 tz_flavor.13.e:0 "Promoting balanced diets, moderate exercise, and restraint in smoking and drinking helps establish healthy habits and supports society's long-term development."
 tz_flavor.14.d:0 "[SCOPE.sCountry('gbr_scope').GetName] has introduced policies to attract skilled workers. Many professionals and skilled laborers are expected to settle here and contribute to economic development."
 tz_flavor.14.f:0 "To promote economic growth and employment, [SCOPE.sCountry('gbr_scope').GetName] is attracting foreign investors and immigrants to establish businesses and settle, bringing capital and expertise."
 tz_flavor.14.a:0 "An increasingly developed education system will also attract more students to study, work, and settle here."
