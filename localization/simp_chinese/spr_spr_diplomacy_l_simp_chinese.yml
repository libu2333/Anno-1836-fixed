l_simp_chinese:
  # ================================
  # Porfiriato
  # ================================
inicio_porfiriato.1.t: "诺里亚计划"
inicio_porfiriato.1.d: "波菲里奥·迪亚斯将军发表声明反对总统连任，指责他背叛了改革时期和外国干预时期为之奋斗的民主原则。在军队和反对派同情者的支持下，迪亚斯在‘诺里亚计划’的旗帜下号召人民武装起来。\n\n墨西哥正处于叛乱的边缘。"
 inicio_porfiriato.1.f: "国家处境堪忧：连任威胁着法统延续，人民迫切需要自由与法治。若我们的武器必须说话，就让它们为正义而鸣。\n\n——波菲里奥·迪亚斯，《诺里亚计划》，1871年"
 inicio_porfiriato.1.a: "迪亚兹进军首都并夺取权力"
 inicio_porfiriato_takeover_tt: "波菲里奥·迪亚斯成为墨西哥‘总统’。"
 inicio_porfiriato.1.b: "政府镇压叛乱"
 inicio_porfiriato_failure_tt: "起义被镇压，政府巩固了权力。"

 inicio_porfiriato.2.t: "一位前途无量的年轻军官"
inicio_porfiriato.2.d: "墨西哥正处于历史的关键时刻。战争的创伤尚且未愈，一位名叫波菲里奥·迪亚兹的年轻军官却开始崭露头角。他作为一名纪律严明、秉持自由主义理想的领导者，在战场和政坛都声名鹊起。随着迪亚兹声名鹊起，他的政治忠诚将对国家的未来至关重要。他会服务于军队的利益，还是拥抱工业进步？"
inicio_porfiriato.2.d2: "在经历了多年的动荡之后，国家正处于重建和重塑时期。在这一转型时期，一位名叫波菲里奥·迪亚兹的年轻军官开始引起军界和政界的关注。他以严明的纪律和对自由主义理想的执着而闻名，正在成为国家未来的希望之星。"
 inicio_porfiriato.2.f: "除非政府改弦更张，否则国家无从自救。\n\n——波菲里奥·迪亚斯"
  inicio_porfiriato.2.a: "任命波菲里奥·迪亚斯为严明的将军"
  porfirio_general_fa_tt: "波菲里奥·迪亚斯将以将军身份加入军队，增强军方势力，并可能在日后助长激进思潮。"
  inicio_porfiriato.2.b: "任命波菲里奥·迪亚斯为进步派将军"
  porfirio_general_induscial_tt: "波菲里奥·迪亚斯出任将军后将推动工业化；此举可能促进国内生产，但也会在日后增加激进派。"

 inicio_porfiriato.3.t: "图斯特佩克计划"
inicio_porfiriato.3.d: "由于反对总统连任，波菲里奥·迪亚兹被边缘化于军政圈之外，但他并没有闲着。在国内流放期间，他起草了一份新的宣言：《图斯特佩克计划》。这份文件不仅谴责连任，还呼吁武装起义，以恢复共和原则。一些人认为他是一个渴望权力的叛乱者；另一些人则认为他是新时代的先驱。"
inicio_porfiriato.3.f: "‘有效选举权，反对连任’是迪亚兹追随者的战斗口号。最初的个人异议如今有可能演变成一场全国性运动。"
inicio_porfiriato.3.b: "够了！这将是迪亚兹最后的叛乱"
 inicio_porfiriato_final_failure_tt: "波菲里奥·迪亚兹被处决。"

 inicio_porfiriato.4.t: "秩序的力量"
 inicio_porfiriato.4.d: "波菲里奥·迪亚斯在武装部队的决定性支持下上台。他的崛起是在战斗中锻造出来的，现在，在他指挥下的国家中，他必须确定他统治的本质。加强秩序、服从和军事纪律可以确保在不确定时期的持久稳定。"
  inicio_porfiriato.4.f: "治理国家，不仅要让铁路四通八达，也要让大炮不必终日轰鸣。\n\n——波菲里奥·迪亚斯"
inicio_porfiriato.4.a: "我们必须加强秩序和军事纪律"
porfiriato_militar_tt: "迪亚兹将武装部队作为政府支柱，尽管这一战略的成果仍需数年时间才能实现。"

inicio_porfiriato.5.t: "一个前进的国家"
inicio_porfiriato.5.d: "波菲里奥·迪亚兹掌权后，设想建立一个现代化的国家，不仅要纪律严明，还要沿着进步的轨道团结起来。为了确保稳定，他提议发展工业、吸引外商投资，并扩大基础设施建设，以连接国家，并为国家注入活力。在他的领导下，墨西哥有望成为一个由劳动力、技术和效率驱动的区域强国。"
 inicio_porfiriato.5.f: "治理国家，不仅要让铁路四通八达，也要让大炮不必终日轰鸣。\n\n——波菲里奥·迪亚斯"
inicio_porfiriato.5.a: "现在是进步和工业化的时候了"
porfiriato_industrial_tt: "迪亚兹将经济发展视为其权力的基础，尽管这一战略的成果需要数年时间才能实现。"

inicio_porfiriato.6.t: "波菲里奥·迪亚斯巩固政权"
inicio_porfiriato.6.d: "波菲里奥·迪亚斯就任总统已经五年了。他的愿景在国家机器中根深蒂固，开创了一个稳定的新时代——尽管并非没有威权主义——这将决定国家的未来走向。"
inicio_porfiriato.6.f: "秩序与进步一直是我的座右铭。"
inicio_porfiriato.6.a: "波菲里奥时代真正开始了"
porfiriato_consolidato_tt: "在迪亚斯的领导下，国家将永久享受奖金。"

inicio_porfiriato.7.t: "波尔菲里亚之梦破灭"
inicio_porfiriato.7.d: "波菲里奥·迪亚斯未能将自己确立为国家无可争议的领袖。内部派别、社会压力和缺乏支持已经侵蚀了他的地位，无法修复。"
 inicio_porfiriato.7.f: "少些政治，多些行政。\n\n——波菲里奥·迪亚斯"
inicio_porfiriato.7.a: "我们回到不确定性"
porfiriato_no_consolidato_tt: "波尔菲里亚政权未能巩固。"

inicio_porfiriato.8.t: "波菲里奥·迪亚斯之死"
 inicio_porfiriato.8.d: "随着波菲里奥·迪亚斯逝世，一个以秩序、进步与争议为标志的时代告终；其遗产仍将在后世引发论争。"
 inicio_porfiriato.8.f: "在波菲里亚托的和平中，这个国家如梦中少女般沉睡。"
 inicio_porfiriato.8.a: "波菲里亚托时代已经结束"
 porfiriato_muerto_tt: "波菲里亚托的影响已从该国及其利益集团中消除。"

# ==================================
# Liberalizaion
# ====================================
liberalizcion_inicial.1.t: "贝尼托·胡亚雷斯的呼唤"
liberalizcion_inicial.1.d: "自由主义者开始反抗圣·安娜的独裁统治，旨在建立一个更自由、更公正的共和国。最初的改革重点是保障投票权。"
 liberalizcion_inicial.1.f: "权利与正义的事业，迟早必将获胜。\n\n——贝尼托·胡亚雷斯"
 liberalizcion_inicial.1.a: "胡亚雷斯将成为墨西哥的灯塔"
 benito_ig_tt: "胡亚雷斯在政坛的地位不断上升，自由派知识分子的力量亦获提振。"

 liberalizcion_inicial.2.t: "墨西哥自由化"
 liberalizcion_inicial.2.d: "胡亚雷斯已成为墨西哥政府首脑，掌握总统职权。他的崛起标志着墨西哥历史的转折，自由主义运动终于获得影响国策的机会。"
 liberalizcion_inicial.2.f: "尊重他人的权利，无论对个人还是国家，都是和平的体现。\n\n——贝尼托·胡亚雷斯"
 liberalizcion_inicial.2.a: "胡亚雷斯就任领导职务"
 lib_ini_alc_tt: "胡亚雷斯巩固了自由主义改革及其政治影响力。"

liberalizcion_inicial.3.t: "独裁统治依然存在"
liberalizcion_inicial.3.d: "尽管自由派做出了努力，但圣安娜仍然掌权。抵抗阻碍了改革，自由派的影响力暂时受到削弱。"
liberalizcion_inicial.3.f: "当局虽多方阻挠，改革的精神仍未熄灭。\n— 匿名人士"
liberalizcion_initial.3.a: "威权统治仍在继续。"
dic_ini_per_tt: "自由派知识分子失去影响力，国家强化了其威权立场。"

liberalizcion_inicial.4.t: "自由化失败"
liberalizcion_inicial.4.d: "自由化改革未能在墨西哥扎根，墨西哥仍然处于传统、社会和政治结构之下。对许多墨西哥人来说，胡亚雷斯政策带来的潜在好处仍将是一个梦想。"
 liberalizcion_inicial.4.f: "思考之人何时才能比杀人之人更受尊敬？\n\n——梅尔乔·奥坎波"
liberalizcion_inicial.4.a: "自由化努力失败"
lib_i_fall_tot_tt: "自由主义影响力崩塌，国家继续处于保守和威权主义的控制之下。"

liberalizcion_initial.5.t: "部分自由化"
liberalizcion_inicial.5.d: "一些自由化措施已经出台，但改革尚未完成。虽然胡亚雷斯愿景的某些方面正在发挥作用，但国家的全面转型从未发生。"
 liberalizcion_inicial.5.f: "我们应以对话相互理解，而非彼此残杀。\n\n——梅尔乔·奥坎波"
liberalizcion_initial.5.a: "部分改革取得成功"
lib_i_fall_par_tt: "一些自由主义的影响仍然存在，部分改革带来了一些改善，但该国仍然受到传统势力的制约。"

 # ================================
 # Monarquia
 # ================================
monarquia_mexicana.1.t: "王位的命运"
monarquia_mexicana.1.d: "墨西哥面临决定性时刻。君主的选择将决定王室的稳定性和合法性。我们应该迎接一个新的王朝，还是恢复伊图尔维德王朝的血统？"
 monarquia_mexicana.1.f: "唯有强有力的君主政府，才能给予墨西哥所迫切需要的统一与和平。\n\n——胡安·内波穆塞诺·阿尔蒙特"
monarquia_mexicana.1.a: "宣布新的王朝"
monarquia_mexicana.1.b: "恢复伊图尔维德王朝"
emperador_lider_tt: "现任领导人在墨西哥建立了一个新的王朝。"
emperador_Iturbide_tt: "阿古斯丁·赫罗尼莫·德·伊图尔维德被宣布为墨西哥皇帝。"

monarquia_mexicana.2.t: "欧洲贷款"
monarquia_mexicana.2.d: "墨西哥面临经济短缺，欧洲债权人提供了‘慷慨’的贷款。这些资金将暂时缓解财政困境，但最终偿还贷款将需要付出沉重的代价。"
 monarquia_mexicana.2.f: "向外国借债，便是抵押祖国的自由。\n\n——卢卡斯·阿拉曼"
monarquia_mexicana.2.a: "接受贷款"
monarquia_mexicana.2.b: "拒绝他们的提议"
pedir_prestamos_tt: "我们每周将获得5000英镑的收入，但未来墨西哥必须支付700万英镑，甚至可能考虑将王位授予外国王子以摆脱债务。"
no_pedir_prestamos_tt: "我们避免外债，但面临经济停滞的风险。"

monarquia_mexicana.3.t: "债务到期了"
monarquia_mexicana.3.d: "曾经支撑墨西哥的慷慨贷款已经到期。债权人现在要求偿还巨额欠款，并提出了一个妥协方案：推举一位欧洲君主登基。"
 monarquia_mexicana.3.f: "我们来自多洛雷斯，是伊达尔戈的后裔；我们生来便要如先辈一般，为一切解放的象征而战。我们也将如他一般，为这神圣事业而战，直至消逝于世。\n\n——伊格纳西奥·拉米雷斯"
monarquia_mexicana.3.a: "全额偿还债务"
monarquia_mexicana.3.b: "接受外国君主"
pagar_deuda_tt: "我们偿还了贷款，损失了很大一部分国库。"
acuerdo_monarquia_tt: "哈布斯堡王朝的马克西米利安抵达墨西哥，宣称继承王位。"

monarquia_mexicana.4.t: "继承权问题"
monarquia_mexicana.4.d: "马克西米利安坐上了墨西哥的王位，但他的年事已高，且没有子女，这使得君主制的未来充满不确定性。宫廷中流传着各种传言：帝国会通过他的兄弟与奥地利捆绑在一起吗？还是马克西米利安会通过将王位托付给本土继承人来赢得墨西哥人的心？"
 monarquia_mexicana.4.f: "我希望从今以后，印第安人与非印第安人之间不再有任何区别；人人皆为墨西哥人。\n\n——哈布斯堡的马克西米利安"
monarquia_mexicana.4.a: "卡尔·路德维希将成为继承人"
monarquia_mexicana.4.b: "伊图尔维德家族将继承王位"
heredero_austriaco_tt: "奥地利的卡尔·路德维希被宣布为墨西哥王位继承人。"
heredero_mexicano_tt: "阿古斯丁·赫罗尼莫的血脉将延续，成为墨西哥的未来。"

monarquia_mexicana.5.t: "墨西哥君主制的终结"
monarquia_mexicana.5.d: "墨西哥君主制的梦想再次破灭。王权被抛弃，国家走向新的政府形式。"
 monarquia_mexicana.5.f: "墨西哥不能接受任何非源于人民主权的政府形式。\n\n——塞巴斯蒂安·莱尔多·德·特哈达"
monarquia_mexicana.5.a: "一个新共和国诞生"
fin_mon_tt: "君主制崩溃，为新的政治秩序腾出空间。"

  # ================================
  # Mexico-America
  # ================================
guer_mex_amer.1.t: "美墨战争"
guer_mex_amer.1.d: "美国已向我们宣战，威胁到我们的主权和领土完整。墨西哥必须做出决定：我们是独自面对这一挑战，还是寻求欧洲强大盟友的援助？"
guer_mex_amer.1.f: "可怜的墨西哥！离上帝如此之远，却又如此接近美国。\n\n— 内梅西奥·加西亚·纳兰霍"
guer_mex_amer.1.a: "我们将孤军奋战！"
guer_mex_amer.1.b: "向法国和英国寻求帮助"
sin_ayuda_tt: "墨西哥将在没有外援的情况下抵抗美国，增强民族自豪感。"
pedir_ayuda_tt: "墨西哥将请求法国和英国的支持，以换取经济上的让步，并与欧洲列强结盟。"
treaty_mexico_france_defense_investment: "韦拉克鲁斯特许权"
treaty_mexico_britain_defense_investment: "韦拉克鲁斯特许权"
toma_de_poder: "夺取政权"
toma_de_poder_desc: "新政府已通过武力夺取政权，但其合法性受到质疑，社会开始两极分化"

paro_golpe_estado: "政变企图受挫"
paro_golpe_estado_desc: "各机构抵制了政变企图。尽管权威被削弱，但政府的合法性却有所增强"

porfiriato_militar: "波菲里亚托家族的军事巩固"
porfiriato_militar_desc: "迪亚兹政权在武装部队的支持下巩固了权力。由于强加的秩序，国家效率提高，稳定性增强"

legado_porfiriato_militar: "波菲里亚托家族的遗产"
 legado_porfiriato_militar_desc: "即使政权垮台，迪亚斯统治下形成的军事结构与秩序仍持续影响国家；纪律、中央集权与对稳定的追求，依旧构成国家认同的一部分。"

porfiriato_industrial: "波菲里亚托家族的工业巩固"
 porfiriato_industrial_desc: "波菲里亚托政权致力于经济发展与物质进步。工业化成为国家新的动力，尽管并非人人都能平等受益。"

legado_porfiriato_industrial: "波菲里亚托家族的遗产"
 legado_porfiriato_industrial_desc: "波菲里亚托时代推动的工业势头仍在塑造国家经济方向。政权虽已结束，基础设施建设、外资联系与现代化进程却仍在延续。"

porfiriato_ig: "波菲里亚托家族青睐的利益集团"
 porfiriato_ig_desc: "受迪亚斯政权扶植，该利益集团在体制内获得了前所未有的影响力与地位。"

muerte_porfirio: "波菲里奥·迪亚兹之死"
 muerte_porfirio_desc: "波菲里奥·迪亚斯之死震动全国。政权的合法性开始动摇，社会也对国家的政治前途产生分歧。"

benito_ig_buff: "贝尼托·胡亚雷斯的影响"
 benito_ig_buff_desc: "得益于胡亚雷斯的自由主义思想，知识分子获得了政治影响力；他们日益增长的力量将影响全国的公共辩论与政策方向。"

reforma_incial: "初步自由主义改革"
 reforma_incial_desc: "政府开始施行自由主义改革。改革将循序渐进，后续法令能否成功取决于这些变革的驾驭方式。"

nacion_estado_medio: "民族国家正在形成"
nacion_estado_medio_desc: "墨西哥正开始在文化上统一，并扩大教育。早期的改革促进了创新，并为现代墨西哥国家奠定了基础。"

nacion_estado_grande: "巩固的民族国家"
nacion_estado_grande_desc: "墨西哥正朝着一个完全统一的现代化国家迈进。教育、创新和文化融合得到加强，塑造了更强大的民族认同。"

dictadura_ini_perpetua: "独裁统治依然存在"
dictadura_ini_perpetua_desc: "权威强加，创新放缓。政府巩固，军队获得授权，但政治反对派和激进运动却随之增长。"

liberalizacion_fallida: "自由化失败"
liberalizacion_fallida_desc: "实施自由化改革的尝试失败了。自由派利益集团被边缘化。"

liberalizacion_parcial: "部分自由化"
liberalizacion_parcial_desc: "一些改革措施已获实施，但自由化目标仅部分实现。利益集团的影响力有所减弱。"

estado_crisitano_tradicional: "传统的基督教国家"
estado_crisitano_tradicional_desc: "该国严重依赖宗教影响力来维护合法性和权威。社会和政治生活依然保守，教会得到大力支持。"

estado_crisitano_progresista: "进步的基督教国家"
estado_crisitano_progresista_desc: "国家在宗教影响力与现代化之间取得平衡。权威和合法性通过宗教得到加强。"


nuevo_linaje: "新王朝"
nuevo_linaje_desc: "墨西哥建立了新的王室。墨西哥民众需要时间来接受他们为合法统治者。"

monarca_legitimo: "正统君主"
monarca_legitimo_desc: "一位来自墨西哥王室血统的君主登基，巩固了国家内部的合法性，并加强了与传统机构的联系。"

prestamo_extranjero: "外国贷款"
prestamo_extranjero_desc: "墨西哥寻求欧洲融资，获得了直接的资源，但将其未来与外国债权人捆绑在一起。"

heredero_mex: "墨西哥继承人"
heredero_mex_desc: "本土继承人加强了国家合法性，并提供了根植于当地传统的连续性。"

heredero_aus: "奥地利继承人"
heredero_aus_desc: "奥地利继承人将外国势力带入君主制，引发忠诚度问题，并引发政治紧张局势。"

colonizacion: "北方殖民扩张"
colonizacion_desc: "努力的方向是扩大北方殖民边界，加速殖民活动，并扩大国家对新领土的控制。"

national_pride: "民族自豪感"
national_pride_desc: "国家团结一致，捍卫主权，武装部队体现了人民的决心。"
je_group_porfiriato: "波菲里奥·迪亚斯"
je_porfiriato_buff: "波菲里奥家族的巩固"
je_porfiriato_buff_reason: "随着波菲里奥·迪亚斯的崛起，国家准备巩固其新的政治和经济方向"

je_group_mexlibi: "墨西哥自由主义"
je_mexlibi_revayu: "阿尤特拉计划"
je_mexlibi_revayu_reason: "圣安娜的独裁统治已经耗尽了国家的精力。一个广泛的自由派联盟试图推翻他，建立一个拥有自由选举的宪政政府。"

je_mexlibi_buff_medium: "初步改革"
je_mexlibi_buff_medium_reason: "自由派计划实施初步改革，以促进公共教育、限制神职人员的特权并加强公民权利。致力于这些改革，迈向一个更加教育程度更高、融合程度更高的国家。"

je_mexlibi_buff_grande: "巩固自由派机构"
je_mexlibi_buff_grande_reason: "为了巩固自由派机构，必须完成深入改革：推广世俗教育，削弱教会在政治和经济方面的影响力，并加强民族认同。成功实施改革将使墨西哥走向一个现代化、统一的国家。"

je_group_monarquiamex: "墨西哥君主制"
je_group_monarquiamex_tiempodeuda: "欧洲债务承诺"
je_group_monarquiamex_tiempodeuda_reason: "墨西哥已获得欧洲贷款，确保资源稳定流入以维持自身发展。然而，每一笔借款都背负着阴影——偿还之日终将到来，数百万美元的债务将不堪重负，而且外国势力可能要求墨西哥做出超出其财富范围的让步。"

#je_group_monarquiamex_finmonarq: "墨西哥君主制的命运"
#je_group_monarquiamex_finmonarq_reason: "墨西哥君主制正处于十字路口。无论是政治变革还是外部压力，君主制本身都面临威胁。一旦君主制垮台，国家历史将开启新的篇章，而新的篇章将由他人的意志而非皇帝来决定。"
mexicanize_north_decision: "墨西哥化北方"
mexicanize_north_decision_desc: "我们将巩固对北方领土的控制，确保墨西哥身份认同凌驾于本土和外来文化之上，即使这会在当地社区激起激进分子。"
mexicanize_north_decision_tooltip: "北方领土将成为墨西哥人的家园，其人口将开始接受我们的文化和宗教，最终10%的人口将立即融入。"

mexicanize_south_decision: "墨西哥化中美洲"
mexicanize_south_decision_desc: "现在是时候让中美洲人民重新团结在一个民族认同之下：墨西哥认同。他们的命运是成为我们祖国的一部分，无论他们是否愿意。"
mexicanize_south_decision_tooltip: "中美洲领土将成为墨西哥人的家园，其人口将开始接受我们的文化，最终10%的人口将立即融入。"

mexicanize_caribean_decision: "加勒比地区的墨西哥化"
mexicanize_caribean_decision_desc: "加勒比地区的古巴裔和非裔社区必须融入墨西哥民族。虽然他们的一些传统可以保留，但首要任务是巩固共同的墨西哥身份，即使这会引发民众的抵制。"
mexicanize_caribean_decision_tooltip: "加勒比地区将成为墨西哥人的家园，其人口将开始接受我们的文化，最终10%的人口将立即融入。"

mexicanize_philippines_decision: "让菲律宾墨西哥化"
mexicanize_philippines_decision_desc: "尽管远隔太平洋，菲律宾长期以来与我们有着历史和信仰的联系。通过宣布菲律宾成为我们祖国的一部分，我们重申了墨西哥作为太平洋强国的传统，即使此举会引发群岛人民的强烈反抗。"
mexicanize_philippines_decision_tooltip: "菲律宾领土将成为墨西哥的家园，其人口将开始接受我们的文化，最终10%的人口将立即融入墨西哥。"

mexicanize_mexico_decision: "巩固墨西哥身份认同"
mexicanize_mexico_decision_desc: "为了加强民族团结，我们必须消除墨西哥腹地的旧有种族和文化隔阂。只有共同的墨西哥身份认同才能确保国家的稳定和进步，即使这意味着要对抗这些文化。"
mexicanize_mexico_decision_tooltip: "墨西哥中部原住民家园将被移除，巩固墨西哥身份作为国家基石的地位。"

buy_gbr_colonies_decision: "购买英属中美洲殖民地"
buy_gbr_colonies_decision_desc: "通过外交和资金，我们可以与英国谈判，获得其在中美洲的殖民地，从而扩大墨西哥的领土。"
buy_gbr_colonies_decision_tooltip: "墨西哥将以金钱换取英国在中美洲的殖民地。"

southern_claims_decision: "重申对中美洲的主权"
southern_claims_decision_desc: "中美洲在墨西哥独立后曾是墨西哥的一部分。尽管长期分离，但我们的命运要求我们恢复合法的影响力，并保护墨西哥在南方的利益。"
south_claims_decision_tooltip: "墨西哥获得了对中美洲国家的主权，但这种野心可能会引发国内骚乱，并在国外引发外交紧张。"

caribean_claims_decision: "在加勒比地区主张主权"
caribean_claims_decision_desc: "古巴、波多黎各和伊斯帕尼奥拉岛是西班牙殖民帝国在新大陆的最后残余。墨西哥曾在西班牙王室的统治下与这些岛屿紧密相连，现在可以宣布其领导加勒比地区的权利，并在新的命运下保护这些岛屿上的人民。"
caribean_claims_decision_tooltip: "墨西哥获得了对加勒比海岛屿的主权。西班牙可能将此视为威胁，导致外交关系紧张。"

philippine_claims_decision: "恢复对菲律宾的主权要求"
philippine_claims_decision_desc: "独立前，墨西哥和菲律宾通过马尼拉大帆船和新西班牙总督辖区，在西班牙王室的统治下紧密相连。随着西班牙的衰落和我们影响力的增强，我们可以恢复这些古老的纽带，并再次将墨西哥的势力扩展到太平洋彼岸。"
philippine_claims_decision_tooltip: "墨西哥获得了对菲律宾群岛的主权要求。西班牙可能会将此视为威胁，导致外交关系紧张。"

 ZEXU_FLAVOR_TEXT: "一名异世来客在奥斯曼宫廷中救下苏丹，受封多布罗加大公。泽许公国将于列强角逐间自立，还是走向另一条命运？"
 JIBEI_FLAVOR_TEXT: "异世来客林天智购得阿拉斯加，欲在北太平洋彼岸建立华人新国。天智共和国的前途，正待亲手开创。"
 DAMING_FLAVOR_TEXT: "大明遗裔朱世根立足勃固，而清廷已据中原。新大明将北伐复国，还是偏安海外？"
